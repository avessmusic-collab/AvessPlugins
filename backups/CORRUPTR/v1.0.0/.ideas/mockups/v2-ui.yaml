# v2 UI Design Specification
# Generated: 2026-09-01
# Plugin: CORRUPTR
#
# STRUCTURE: single continuous scrolling page (no tabs). window.height below
# represents TOTAL SCROLLABLE CONTENT height, not the visible viewport.
# The plugin window is fixed at viewport_height (visible area); content
# scrolls internally beyond that. All layout-validation.md hard rules
# (bounds containment, no overlap, minimum control sizes, minimum spacing)
# are enforced against the full content height below, per ui-design-agent
# instructions for scrolling pages.
#
# v2 CHANGE SUMMARY (user feedback: "make it like tha image ive sent you" —
# a literal, close visual match to the "ELYSIUM" reference screenshot, not
# just structural inspiration). Same 8 sections, same scroll order, same 67
# parameter bindings as v1 — this version is a pure re-skin:
#   - Hero sections (Distortion Graph, Performance Macros) now use a LIGHT
#     gradient panel (near-white -> pale blue-gray), matching ELYSIUM's
#     light hero body under its dark top bar (v1 already did this; v2
#     lightens/tunes the gradient to be closer to the reference and adds a
#     3-tier text hierarchy: pale-gray small labels, medium-gray bold
#     display titles, near-black value readouts).
#   - Top bar gains numbered page-indicator pills (1 2 3 4, ELYSIUM-literal
#     decorative quick-nav) between the search field and wordmark.
#   - All 8 nodes in the Distortion Graph and all 4 hero macro panels
#     (Damage/Crush/Glitch/Chaos) now render as glassy, gradient-washed,
#     drop-shadowed pseudo-3D "iso-icons" (wedge/cylinder/cuboid faces)
#     instead of flat tilted gradient chips.
#   - Every knob in the mockup (all types) now renders as a thin ring track
#     + filled value arc + thin radial pointer line, replacing the v1
#     chunky skeuomorphic ball-knob, per the reference's minimal/technical
#     knob language. Rotation/lighting-fixed mechanics (Rule 8/9) unchanged.
#   - The 4 macro hero panels gain a small all-caps technical label above
#     the icon and a mono value readout below it (in addition to the
#     existing bold macro name + knob value), mirroring ELYSIUM's
#     label/icon/value/title/knob panel composition. NOTE: reference panels
#     also show 2 small flanking knobs per panel (e.g. AMP/SPREAD/VARI) —
#     those are intentionally NOT added here because they have no bound
#     parameter in parameter-spec-draft.md and adding them would violate
#     "same 67 controls" from the v2 brief; each macro panel keeps its
#     single existing hero knob only.
#   - Dark accent cards (Glitch Engine / Filter & EQ / Feedback + Delay)
#     keep their v1 dot+title+subtitle+chevron header pattern (already
#     ELYSIUM-literal) with refined mini-graphs: Glitch Engine now renders
#     an envelope-style curve with node dots (was a bar chart), Filter & EQ
#     gains grid lines + dB/Hz axis labels, Feedback + Delay keeps its loop
#     diagram with a cleaner stroke.
#   - No control positions, sizes, parameter bindings, or section
#     boundaries changed from v1 — this is a presentation-layer restyle
#     only. Window/scroll dimensions unchanged.

window:
  width: 1200
  height: 2220          # total scrollable content height
  viewport_height: 800  # visible plugin frame height (JUCE setSize)
  resizable: false
  scrollable: true       # internal vertical scroll beyond viewport_height

colors:
  # Top bar (near-black, ELYSIUM-literal: diagonal pinstripe + wide-tracked wordmark)
  topBarBackground: "#18181b"
  topBarStripeAccent: "#28282c"
  topBarBorder: "#000000"
  topBarText: "#f5f5f7"
  topBarTextMuted: "#86868c"

  # Light gradient panels (ELYSIUM-literal: near-white -> pale blue-gray hero body)
  panelGradientStart: "#fbfcfe"
  panelGradientEnd: "#d9e1ee"
  panelShadow: "rgba(15, 20, 35, 0.14)"
  panelInnerShadow: "rgba(255, 255, 255, 0.8)"
  panelText: "#1c1e24"
  panelTextMuted: "#6b7280"
  panelDivider: "rgba(15, 20, 35, 0.10)"

  # New v2 3-tier text hierarchy for hero panels (ELYSIUM-literal)
  panelLabel: "#9aa1af"    # small all-caps technical labels (e.g. "INTENSITY")
  panelTitle: "#454a56"    # large bold display titles (e.g. "DAMAGE")
  panelValue: "#1c1e24"    # near-black mono value readouts (e.g. "0 %")

  # Dark accent cards (glitch engine / filter+eq / feedback+delay)
  cardBackground: "#141417"
  cardBackgroundAlt: "#1a1b1f"
  cardBorder: "#26272c"
  cardText: "#eceef1"
  cardTextMuted: "#75777f"

  # Distortion-specific accent gradients (macro hero panels / node icons)
  # Unchanged from v1 - CORRUPTR's own established distortion/glitch brand
  # identity, applied through the new v2 glassy iso-icon + ring-knob
  # rendering style rather than re-hued to ELYSIUM's literal palette.
  accentDamageStart: "#ff4d4d"
  accentDamageEnd: "#ff8a3d"
  accentCrushStart: "#a855f7"
  accentCrushEnd: "#ec4899"
  accentGlitchStart: "#06b6d4"
  accentGlitchEnd: "#22d3ee"
  accentChaosStart: "#a3e635"
  accentChaosEnd: "#facc15"

  # Card dot indicators
  dotGlitchEngine: "#22d3ee"
  dotFilterEQ: "#a855f7"
  dotFeedbackDelay: "#ff8a3d"

  # Performance pad colors
  perfKill: "#ff4d4d"
  perfGlitch: "#22d3ee"
  perfDestroy: "#ff8a3d"
  perfFreeze: "#60a5fa"
  perfReverse: "#a855f7"
  perfStutter: "#ec4899"
  perfChaos: "#facc15"

  # Preset color-tag dots (top bar, decorative, ELYSIUM-literal rainbow row)
  presetTagColors: ["#ec4899", "#d946ef", "#a855f7", "#6366f1", "#22d3ee", "#22c55e", "#eab308", "#f97316"]

typography:
  header: "'Space Grotesk', 'Inter', system-ui, sans-serif"
  body: "'Inter', system-ui, sans-serif"
  mono: "'JetBrains Mono', 'Courier New', monospace"
  size:
    wordmark: "20px"
    sectionTitle: "26px"
    macroTitle: "19px"
    cardTitle: "12px"
    label: "10px"
    value: "13px"
    small: "10px"
  notes:
    - "Wordmark letter-spacing increased to ~14px (0.35em+) to match ELYSIUM's very wide tracking."
    - "Macro panel labels use panelLabel color at 2px letter-spacing, uppercase; macro titles use panelTitle color, bold, 2.5px letter-spacing."

layout:
  type: custom
  scroll_direction: vertical
  sections:
    - id: top_bar
      y: 0
      height: 64
      description: "Sticky near-black top bar: wordmark (wide tracking), preset search/browser, numbered page-indicator pills (NEW v2, decorative), save/random/undo/redo/A-B, quality mode, meters, preset tag dots"
    - id: distortion_graph
      y: 94
      height: 378
      description: "Hero section - signature visual identity, light gradient panel. Modular routing graph: INPUT -> SATURATION -> WAVESHAPER -> FILTER -> BITCRUSH -> GLITCH -> PITCH -> OUTPUT, with per-node compact controls, bypass toggles, animated modulation link lines, and glassy iso-icon nodes (NEW v2 rendering style)"
    - id: xy_pad_macros
      y: 502
      height: 340
      description: "Large XY performance pad (X=Damage, Y=Glitch, glide/inertia) + 4 hero macro knobs: DAMAGE, CRUSH, GLITCH, CHAOS, each rendered as an ELYSIUM-literal label/iso-icon/value-readout/title/knob panel with hairline dividers (NEW v2 composition)"
    - id: accent_cards
      y: 872
      height: 300
      description: "3 dark accent cards: GLITCH ENGINE, FILTER & EQ, FEEDBACK + DELAY - dot+title+subtitle+chevron header, refined mini-graphs (envelope curve w/ node dots, freq-response w/ grid+axis labels, feedback loop diagram)"
    - id: sequencer
      y: 1202
      height: 192
      description: "Host-synced 16-step rhythmic sequencer with rate selector and pattern control buttons"
    - id: mod_matrix
      y: 1424
      height: 320
      description: "4 LFO mini-panels + compact source x destination modulation matrix grid"
    - id: performance_macros
      y: 1774
      height: 230
      description: "7 performance trigger pads + 4 remaining macro knobs: RHYTHM, MOVEMENT, WIDTH, MIX"
    - id: output
      y: 2034
      height: 150
      description: "Output limiter style, input/output gain, master mix, final meters"

# ---------------------------------------------------------------------------
# CONTROLS (all bindable/interactive elements - parameter-bound or UI action)
# UNCHANGED FROM v1: same 67 controls, same ids, same parameter bindings,
# same positions/sizes. v2 is a presentation-layer restyle only (see header
# comment above) - control geometry below is the validated source of record;
# the v2 test HTML achieves the ELYSIUM-literal visual composition through
# CSS flow layout (flexbox) rather than pixel-identical absolute positioning
# to these coordinates, consistent with how v1's HTML was also built.
# All positions in pixels from top-left (0,0) of the full scrollable content.
# id = snake_case control identifier (HTML element id / mockup identity)
# parameter = camelCase APVTS parameter id (matches parameter-spec-draft.md
#             where one exists; flagged "NEW" where it does not yet exist)
# action = non-parameter UI action (host-side / preset-browser chrome)
# ---------------------------------------------------------------------------
controls:

  # ===== TOP BAR (y 0-64) =====
  - id: preset_search
    type: combo
    label: "Search"
    action: search_presets
    position: { x: 20, y: 16 }
    size: { width: 200, height: 32 }
    note: "Preset browser search/filter field, not an APVTS parameter"

  - id: save_button
    type: button
    label: "Save"
    action: save_preset
    position: { x: 460, y: 16 }
    size: { width: 70, height: 32 }

  - id: random_button
    type: button
    label: "Random"
    action: randomize_all
    position: { x: 540, y: 16 }
    size: { width: 70, height: 32 }

  - id: undo_button
    type: button
    label: "Undo"
    action: undo
    position: { x: 620, y: 16 }
    size: { width: 60, height: 32 }

  - id: redo_button
    type: button
    label: "Redo"
    action: redo
    position: { x: 690, y: 16 }
    size: { width: 60, height: 32 }

  - id: ab_toggle
    type: toggle
    label: "A/B"
    parameter: abCompareState
    parameter_type: bool
    default: false
    position: { x: 760, y: 16 }
    size: { width: 60, height: 32 }
    note: "UI-only A/B compare state, not host-automatable"

  - id: quality_mode
    type: combo
    label: "Quality"
    parameter: qualityMode
    parameter_type: choice
    choices: ["ECO", "NORMAL", "HIGH", "EXTREME", "AUTO"]
    default: "NORMAL"
    position: { x: 840, y: 16 }
    size: { width: 110, height: 32 }

  # ===== DISTORTION GRAPH (y 94-472) — hero signal-flow visualization =====
  # Node icons (INPUT / SATURATION / WAVESHAPER / FILTER / BITCRUSH / GLITCH
  # / PITCH / OUTPUT) and connecting modulation-link lines are decorative,
  # see special_elements.distortion_graph_nodes below. Interactive controls:

  - id: node_algorithm_select
    type: combo
    label: "Algorithm"
    parameter: distortionAlgorithm
    parameter_type: choice
    choices: ["Saturation", "Soft Clip", "Hard Clip", "Tube", "Diode", "Fuzz", "Digital Distortion", "Bitcrusher", "Sample Rate Reducer", "Wavefolder", "Ring-Mod", "Foldback"]
    default: "Saturation"
    position: { x: 156, y: 380 }
    size: { width: 160, height: 26 }
    note: "Compact algorithm selector docked under SATURATION node"

  - id: node_drive
    type: knob
    label: "Drive"
    parameter: drive
    range: [0.0, 40.0]
    unit: "dB"
    default: 6.0
    decimals: 1
    position: { x: 208, y: 312 }
    size: { width: 55, height: 55 }
    note: "Compact overview knob on SATURATION node"

  - id: node_fold
    type: knob
    label: "Fold"
    parameter: fold
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 354, y: 312 }
    size: { width: 55, height: 55 }
    note: "Compact overview knob on WAVEFOLDER node"

  - id: node_filter_cutoff
    type: knob
    label: "Cutoff"
    parameter: filterCutoff
    range: [20.0, 20000.0]
    unit: "Hz"
    default: 20000.0
    decimals: 0
    skew: 0.3
    position: { x: 500, y: 312 }
    size: { width: 55, height: 55 }
    note: "Mirrors filter_cutoff in FILTER & EQ card - same parameter, compact overview control"

  - id: node_bit_depth
    type: knob
    label: "Bits"
    parameter: bitDepth
    range: [1.0, 16.0]
    unit: "bit"
    default: 16.0
    decimals: 0
    position: { x: 645, y: 312 }
    size: { width: 55, height: 55 }
    note: "Compact overview knob on BITCRUSH node"

  - id: node_glitch_probability
    type: knob
    label: "Prob"
    parameter: glitchProbability
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 791, y: 312 }
    size: { width: 55, height: 55 }
    note: "Mirrors glitch_probability in GLITCH ENGINE card - same parameter, compact overview control"

  - id: node_bypass_saturation
    type: toggle
    label: "Bypass"
    parameter: graphBypassSaturation
    parameter_type: bool
    default: false
    position: { x: 186, y: 420 }
    size: { width: 44, height: 24 }
    note: "NEW - module bypass not yet in parameter-spec-draft.md, reconcile in Stage 0/1"

  - id: node_bypass_waveshaper
    type: toggle
    label: "Bypass"
    parameter: graphBypassWaveshaper
    parameter_type: bool
    default: false
    position: { x: 332, y: 420 }
    size: { width: 44, height: 24 }
    note: "NEW - module bypass not yet in parameter-spec-draft.md, reconcile in Stage 0/1"

  - id: node_bypass_filter
    type: toggle
    label: "Bypass"
    parameter: graphBypassFilter
    parameter_type: bool
    default: false
    position: { x: 478, y: 420 }
    size: { width: 44, height: 24 }
    note: "NEW - module bypass not yet in parameter-spec-draft.md, reconcile in Stage 0/1"

  - id: node_bypass_bitcrush
    type: toggle
    label: "Bypass"
    parameter: graphBypassBitcrush
    parameter_type: bool
    default: false
    position: { x: 623, y: 420 }
    size: { width: 44, height: 24 }
    note: "NEW - module bypass not yet in parameter-spec-draft.md, reconcile in Stage 0/1"

  - id: node_bypass_glitch
    type: toggle
    label: "Bypass"
    parameter: graphBypassGlitch
    parameter_type: bool
    default: false
    position: { x: 769, y: 420 }
    size: { width: 44, height: 24 }
    note: "NEW - module bypass not yet in parameter-spec-draft.md, reconcile in Stage 0/1"

  # PITCH node intentionally has no bound control - Pitch/Frequency FX is
  # POST-MVP per architecture.md. Node rendered as a visual "coming soon"
  # placeholder (see special_elements) to preserve the full aspirational
  # routing graph requested for CORRUPTR's visual identity.

  # ===== XY PAD + 4 MACRO KNOBS (y 502-842) =====

  - id: xy_pad
    type: xy-pad
    label: "XY Performance Pad"
    parameter: xyPadX_xyPadY
    position: { x: 30, y: 542 }
    size: { width: 340, height: 300 }
    note: "Binds xyPadX (horizontal, default macroDamage) and xyPadY (vertical, default macroGlitch). Glide/inertia via xyPadSmoothing (80ms default)."

  - id: macro_damage
    type: knob
    label: "Damage"
    parameter: macroDamage
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 443, y: 642 }
