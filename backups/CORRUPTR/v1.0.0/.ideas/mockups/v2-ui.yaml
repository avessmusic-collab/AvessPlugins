  - id: macro_glitch
    type: knob
    label: "Glitch"
    parameter: macroGlitch
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 833, y: 642 }
    size: { width: 90, height: 90 }
    style: hero

  - id: macro_chaos
    type: knob
    label: "Chaos"
    parameter: macroChaos
    range: [0.0, 100.0]
    unit: "%"
    default: 0.0
    decimals: 0
    position: { x: 1028, y: 642 }
    size: { width: 90, height: 90 }
    style: hero

  # ===== 3 DARK ACCENT CARDS (y 872-1172) =====

  # -- Card 1: GLITCH ENGINE (x 30-396) --
  - id: glitch_mode
    type: combo
    label: "Mode"
    parameter: glitchMode
    parameter_type: choice
    choices: ["Off", "Stutter", "Repeat", "Reverse", "Buffer Repeat", "Freeze", "Slice", "Random Slice", "Micro Loop", "Granular Repeat", "Tape Stop", "Tape Start", "Retrigger", "Silence", "Noise Burst", "Bitcrush Burst", "Pitch Jump", "Random Repeat"]
    default: "Off"
    position: { x: 46, y: 1006 }
    size: { width: 140, height: 28 }

  - id: glitch_buffer_length
    type: combo
