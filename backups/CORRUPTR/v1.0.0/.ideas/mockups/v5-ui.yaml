notes:
  - "All 67 control ids/parameters/actions are identical to v2-ui.yaml (same parameter names, ranges, choices, defaults). Position, size, and (for node_drive, feedback_amount, input_gain, output_gain, glitch_buffer_length, micro_delay_time) visual control TYPE were redesigned from scratch for the v4 monochrome modular channel-strip style - this is a presentation-layer + module-regrouping restyle, not a parameter contract change."
  - "v1/v2/v3's near-black pinstriped top bar, light gradient hero panels, glassy pseudo-3D iso-icons, and dark accent cards are entirely scrapped per explicit user instruction to match the new uploaded reference image. Nothing from those versions' color palette or icon language is reused."
  - "The v2 'overview + detail' dual-parameter-binding pattern (same parameter bound to two different controls) is preserved but re-purposed as 'base control (always visible) + ADV-revealed fine-adjust mirror (same module)': filterCutoff via filter_cutoff_detail/node_filter_cutoff, glitchProbability via glitch_probability_detail/node_glitch_probability."
  - "5 module-bypass toggles (graphBypassSaturation/Waveshaper/Filter/Bitcrush/Glitch) are still NEW - not yet in parameter-spec-draft.md, reconcile in Stage 0/1, same as flagged in v1/v2/v3."
  - "microDelayTime is still NEW - not yet in parameter-spec-draft.md, reconcile in Stage 0/1, same as flagged in v1/v2/v3."
  - "Controls automatically generate parameter bindings via WebSliderRelay (knob/slider/xy-pad), WebToggleButtonRelay (toggle), WebComboBoxRelay (combo). Buttons/toggles with an 'action' field (not 'parameter') are UI-only and communicate via native function calls, not parameter relays."
  - "Special elements (module_chrome_icons, static tiles, ADV pills, mini graph, step grid, mod matrix grid, meters) are visual/decorative and may need custom C++/Canvas implementation in Stage 3; ADV pills are functionally interactive (show/hide) in the test HTML via JS class toggling even though marked layer:decorative (not parameter-bound)."
  - "Two v2 decorative output-section level meters (output_input_meter/output_output_meter) were dropped in v4 - consolidated into the top-bar meters only, reducing visual clutter to match the reference's minimal top-bar-only metering approach. v2's page_indicator_pills and rainbow preset_tag_dots were also dropped/de-hued - v4 has no page-nav pills and preset_tag_dots is now monochrome."
  - "v5 adds 2 new controls (sequencer_enable, mod_matrix_enable), bringing the total from 67 to 69. Both are NEW - not yet in parameter-spec-draft.md, reconcile in Stage 0/1, same as the 5 existing node_bypass_* toggles and microDelayTime. Unlike those bypass toggles (true = bypassed, default false), the two v5 enable toggles use true = module on / default true, and additionally drive a visual dim state (opacity ~0.4) on the rest of their card when switched off - implemented in the test HTML by extending the same bindPowerButtons() mechanism, not a separate parameter-relay pattern. To make room without moving any pre-existing control, the sequencer and mod_matrix section start-y values were pulled up into pre-existing whitespace (1072->1050 and 1300->1280 respectively); each section's end-y, and every one of the other 67 controls' position/size, is byte-for-byte identical to v4."

