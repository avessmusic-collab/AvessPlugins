# v5 UI Design Specification
# Generated: 2026-09-02
# Plugin: CORRUPTR
#
# v5 CHANGE SUMMARY — "v4 + sequencer/mod-matrix power toggles (69 bindings)".
# This is a small, surgical iteration on v4-ui.yaml (see that file for the
# full monochrome modular channel-strip redesign rationale, color palette,
# and typography spec - all unchanged here). The ONLY change in v5:
# SEQUENCER and MOD MATRIX previously had no power/enable toggle, unlike
# Distortion/Bitcrush/Glitch/Filter & EQ, which all have a bound bypass
# toggle in their icon-button row. v5 adds one enable toggle per module,
# rendered identically to the existing power-icon toggles (render:
# power-icon, 24x24, .icon-btn.power-btn HTML class, same SVG glyph),
# placed in a minimal new icon-button row next to each card's title.
#
# IMPORTANT SEMANTIC DIFFERENCE: sequencer_enable/mod_matrix_enable are
# ENABLE toggles (true = module ON, default true) - the OPPOSITE semantic
# of the existing node_bypass_* toggles (true = bypassed, default false).
# Both reuse the same visual power-icon language and the same
# bindPowerButtons() message-posting mechanism; the enable toggles
# additionally dim the rest of their card (opacity ~0.4 on a wrapping
# .card-body, pointer-events unchanged) when switched off.
#
# All other structure, controls, positions, sizes, and styling are
# UNCHANGED from v4. Binding count: 67 -> 69.
#
# STRUCTURE: single continuous scrolling page (no tabs), matching v1-v4's
# precedent. window.height is TOTAL SCROLLABLE CONTENT height; the plugin
# window is fixed at viewport_height (visible area) and content scrolls
# internally. All layout-validation.md hard rules (bounds containment, no
# overlap, minimum control sizes, minimum spacing) are enforced against the
# full content height below.
#
# MODULE MAP (unchanged from v4):
#   MAIN CHANNEL-STRIP UNIT (one raised white bar, y 94-604):
#     DISTORTION | BITCRUSH | GLITCH | CENTER MASTER | FILTER & EQ | FEEDBACK+DELAY
#   SECOND UNIT (one raised white bar, y 644-1032):
#     MACROS | PERFORMANCE | XY PAD
#   SEQUENCER strip (y 1050-1260 - was 1072-1260 in v4; start moved up 22px
#     into pre-existing whitespace below the second unit to make room for
#     the new enable icon. End position, and every existing control's
#     position/size, is unchanged.)
#   MOD MATRIX strip (y 1280-1610 - was 1300-1610 in v4; same treatment.)
# Each processing module follows the reference's per-module anatomy:
#   1) icon-button row (power/bypass, menu, undo — decorative except the
#      power icon, which IS the module's bound bypass toggle where one
#      exists among the controls)
#   2) near-black icon tile w/ white glow-icon, chevrons either side (only
#      on modules bound to a real choice/algorithm parameter), bold caps
#      label, dot-count row (choice count)
#   3) module controls (thin-ring knobs / dashed-tick faders w/ pill dB
#      readout / dashed horizontal sliders w/ numeric readout)
#   4) "ADV" caps label + pill toggle (only on modules that actually have
#      an advanced/secondary control to reveal — Distortion, Glitch,
#      Filter & EQ, Macros; Bitcrush/Feedback+Delay/Performance have no
#      spare control to reveal so their ADV pill is omitted; Center
#      Master has no ADV pill at all, matching the reference exactly)
#
# Overview+detail dual-binding pairs from v2 (same parameter bound twice —
# an established, intentional pattern per v2's own notes) are now used as
# BASE control + ADV-revealed "fine" control within the SAME module:
#   filterCutoff:      filter_cutoff_detail (base knob) + node_filter_cutoff (ADV fine knob)
#   glitchProbability:  glitch_probability_detail (base knob) + node_glitch_probability (ADV fine knob)

window:
  width: 1200
  height: 1650          # total scrollable content height
  viewport_height: 800  # visible plugin frame height (JUCE setSize)
  resizable: false
  scrollable: true       # internal vertical scroll beyond viewport_height

colors:
  # Page background (light neutral gray, outside the raised white units)
  pageBackground: "#e4e4e7"

  # Raised white/near-white module-unit surface (soft-UI / skeuomorphic-lite)
  unitSurfaceStart: "#ffffff"
  unitSurfaceEnd: "#f2f2f4"
  unitShadowOuter: "rgba(20, 20, 24, 0.16)"
  unitShadowInsetLight: "rgba(255, 255, 255, 0.9)"
  unitBorder: "rgba(0, 0, 0, 0.06)"
  moduleDivider: "rgba(0, 0, 0, 0.08)"

  # Near-black icon tile (album-art-style mode/algorithm display)
  tileBackground: "#151517"
  tileBackgroundGlow: "rgba(255, 255, 255, 0.14)"
  tileIcon: "#ffffff"
  tileLabel: "#ffffff"
  tileDotActive: "#ffffff"
  tileDotInactive: "#55555a"
  tileChevron: "#8e8e93"

  # Text hierarchy on white module surfaces
  textPrimary: "#1c1c1e"
  textSecondary: "#8e8e93"
  textTertiary: "#c7c7cc"
  readoutPillBg: "#ececee"
  readoutPillText: "#1c1c1e"

  # Controls (near-monochrome — thin ring knobs, dashed-tick faders)
  knobTrack: "rgba(0, 0, 0, 0.12)"
  knobFill: "#1c1c1e"
  knobPointer: "#1c1c1e"
  faderTrack: "rgba(0, 0, 0, 0.10)"
  faderTick: "rgba(0, 0, 0, 0.18)"
  faderThumb: "#1c1c1e"
  toggleTrackOff: "#d1d1d6"
  toggleTrackOn: "#1c1c1e"
  toggleThumb: "#ffffff"
  advPillTrackOff: "#e2e2e5"
  advPillTrackOn: "#1c1c1e"

  # The SOLE color accent in the entire UI — thin plotted curve inside the
  # Filter & EQ frequency-response graph. Nothing else in the interface
  # carries hue.
  accentGraphLine: "#3a6df0"
  graphCardBg: "#f7f7f8"
  graphGrid: "rgba(0, 0, 0, 0.08)"
  graphAxisText: "#a1a1a6"

  # Performance trigger buttons (still monochrome — state shown via fill,
  # not color, consistent with the reference's near-grayscale palette)
  perfButtonOff: "#f2f2f4"
  perfButtonOn: "#1c1c1e"
  perfButtonTextOff: "#1c1c1e"
  perfButtonTextOn: "#ffffff"

typography:
  header: "'Inter', -apple-system, 'Segoe UI', sans-serif"
  body: "'Inter', -apple-system, 'Segoe UI', sans-serif"
  mono: "'SF Mono', 'JetBrains Mono', 'Courier New', monospace"
  size:
    wordmark: "17px"
    tileLabel: "12px"
    label: "9px"
    value: "11px"
    readoutPill: "10px"
    small: "9px"
  notes:
    - "Tile labels: bold, uppercase, ~2px letter-spacing, white on near-black tile."
    - "Module control labels: uppercase, ~1px letter-spacing, textSecondary, 9-10px — deliberately small/technical per reference."
    - "Pill dB/value readouts: mono font, textPrimary, inside a pale rounded pill (readoutPillBg), positioned above the fader thumb."
    - "No decorative display fonts anywhere — the reference's minimalism comes from restraint, not typographic flourish."

layout:
  type: custom
  scroll_direction: vertical
  sections:
    - id: top_bar
      y: 0
      height: 64
      description: "Minimal light-surface top bar (same monochrome material as the modules below, not a separate dark bar): wordmark, preset search, save/random/undo/redo, A/B, quality mode combo, input/output meters, small monochrome preset-tag dots."
    - id: main_channel_strip
      y: 94
      height: 510
      description: "One continuous raised white rounded-rect unit containing 6 vertical modules divided by hairline separators: DISTORTION, BITCRUSH, GLITCH, CENTER MASTER (no icon tile - big LEVEL knob + IN/OUT faders + LIMITER combo), FILTER & EQ, FEEDBACK+DELAY. Each flanking module follows the reference's icon-buttons/icon-tile/controls/ADV anatomy."
    - id: macros_performance_xy
      y: 644
      height: 388
      description: "Second raised white unit: MACROS module (4 base knobs, ADV reveals 4 more), PERFORMANCE module (7 square trigger buttons in a 4+3 grid), and a wide XY Performance Pad module with subtle grid background and circular glide handle."
    - id: sequencer
      y: 1050
      height: 210
      description: "Full-width monochrome card: NEW in v5 - power/enable icon-button row (sequencer_enable) next to the card title, dims the rest of the card when off. Rate/steps combos, 6 pattern-action buttons, 16-step visual grid with tempo-synced playhead unchanged from v4."
    - id: mod_matrix
      y: 1280
      height: 330
      description: "Full-width monochrome card: NEW in v5 - power/enable icon-button row (mod_matrix_enable) next to the card title, dims the rest of the card when off. 4 LFO mini-panels (rate knob + shape combo + sync toggle) above a compact source x destination modulation matrix grid, unchanged from v4."

# ---------------------------------------------------------------------------
# CONTROLS — all 67 ids/parameters/actions identical to v2-ui.yaml. Position,
# size, and (where noted) visual "type" have been redesigned for the v4
# monochrome channel-strip module language. "module" = which v4 module this
# control lives in (metadata for HTML generation, not a schema requirement).
# ---------------------------------------------------------------------------
controls:

  # ===== TOP BAR (y 0-64) =====
  - id: preset_search
    type: combo
    label: "Search"
    action: search_presets
    module: top_bar
    position: { x: 20, y: 16 }
    size: { width: 200, height: 32 }
    note: "Preset browser search/filter field, not an APVTS parameter"

  - id: save_button
    type: button
    label: "Save"
    action: save_preset
    module: top_bar
    position: { x: 460, y: 16 }
    size: { width: 70, height: 32 }

  - id: random_button
    type: button
    label: "Random"
    action: randomize_all
    module: top_bar
    position: { x: 540, y: 16 }
    size: { width: 70, height: 32 }

  - id: undo_button
    type: button
    label: "Undo"
    action: undo
    module: top_bar
    position: { x: 620, y: 16 }
    size: { width: 60, height: 32 }

  - id: redo_button
    type: button
    label: "Redo"
    action: redo
    module: top_bar
    position: { x: 690, y: 16 }
    size: { width: 60, height: 32 }

  - id: ab_toggle
    type: toggle
    label: "A/B"
    parameter: abCompareState
    parameter_type: bool
    default: false
    module: top_bar
    position: { x: 760, y: 16 }
    size: { width: 60, height: 32 }
    note: "UI-only A/B compare state, not host-automatable"

  - id: quality_mode
