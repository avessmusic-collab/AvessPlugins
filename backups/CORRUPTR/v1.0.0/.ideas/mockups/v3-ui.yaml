notes:
  - All positions in pixels from top-left (0,0) of the total scrollable content area (window.height = 2240px), not the visible viewport (viewport_height = 800px).
  - Parameter IDs (camelCase) match plugins/CORRUPTR/.ideas/parameter-spec-draft.md exactly where a parameter already exists there.
  - Controls marked "NEW" in their note field are not yet in parameter-spec-draft.md and should be reconciled during Stage 0/1 planning: graphBypassSaturation, graphBypassWaveshaper, graphBypassFilter, graphBypassBitcrush, graphBypassGlitch, microDelayTime. Identical list to v2 - no new "NEW" items introduced in v3.
  - glitchProbability and filterCutoff are each bound by TWO controls simultaneously (node_glitch_probability as a segmented-meter slider + glitch_probability_detail as a knob; node_filter_cutoff as a segmented-meter slider + filter_cutoff_detail as a knob) - unchanged from v2, just relocated from "graph overview + separate accent card" into "one disc module's meter + knob".
  - The Distortion Graph's 8-stage node sequence is now purely decorative (special_elements.distortion_graph_strip) - no interactive controls remain on it in v3; all 6 controls that were graph-node overview controls in v2 (node_algorithm_select, node_drive, node_fold, node_bit_depth, node_glitch_probability, node_filter_cutoff) plus its 5 bypass toggles now live inside their respective disc module. This is a module-grouping/grid-arrangement change only, not a functional redesign - see header comment.
  - Controls automatically generate parameter bindings via WebSliderRelay (knob/slider/xy-pad), WebToggleButtonRelay (toggle), WebComboBoxRelay (combo). Buttons/toggles with an "action" field (not "parameter") are UI-only and communicate via native function calls, not parameter relays.
  - Special elements (disc bezel/label/title/divider patterns, distortion_graph_strip, step_grid, mod_matrix_grid, meters, column_dividers) are visual/data-driven and may need custom C++/OpenGL or Canvas implementation in Stage 3. They are NOT subject to the controls-list bounds/overlap/min-size validation (consistent with v1/v2 precedent).
  - "v3 is a complete visual-direction restyle per explicit user feedback rejecting v2's ELYSIUM-inspired light-hero-panel language and providing a new reference ('FUSION 002' by Prototype Audio - warm-gray grained body, near-black top bar, circular turntable disc modules with colored platter gradients, segmented meters, thin-ring knobs) with an explicit instruction to pack the UI densely with minimal empty space. All 67 controls and their parameter bindings are identical to v2 (2 controls changed `type` from knob to slider as a pure styling change, documented above); only position, size, and module grouping changed."
