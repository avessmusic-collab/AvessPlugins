      - id: digital
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "digital"
        position: { x: 516, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 4 }
      - id: noise
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "noise"
        position: { x: 632, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 5 }
      - id: output
        type: bare-numeric-readout
        display_variant: recessed-chip
        parameter: "output"
        description: "Lower deck, large readout chip at x790-950, vertically centered in the deck (~y370) — well clear of the bottom-right panel corner and the test-harness-only debug monitor. Box-model audit: true rendered height ~80px (see box_model_audit below) vs. this nominal 90px box — already safe, no reposition needed."
        position: { x: 790, y: 325 }
        size: { width: 160, height: 90 }
        zone: lower_deck_right
    box_model_audit:
      trigger: >
        User review found the lower-deck macro grid's row 2 (delay/reverb/
        distortion/digital/noise) rendering with labels at/clipped by the
        panel's bottom edge, ~60px lower than the validator's nominal
        84px-tall box predicted. Root cause: the validator was checking a
        nominal design box (position + size fields), not the TRUE rendered
        height of the actual DOM element (knob cap + margin + label text
        line, per the real CSS), which for these small knobs turned out
        different from the assumed 84px. Audited every Advanced-page
        element's real CSS box model instead of guessing.
      methodology: >
        For each element type, computed true rendered height as:
        knob-cap-height (explicit CSS width/height, exact) + label
        margin-top (explicit CSS, exact) + label line-box height
        (font-size * conservative 1.4 line-height multiplier, since no
        explicit line-height is set and this can't be measured in-browser
        in this environment — no node/browser automation available, so a
        deliberately conservative overestimate was used rather than
        risking another under-estimate).
      grid_knobs:
        cap_height_px: 56          # 3.5rem, explicit CSS on .knob3
        label_margin_top_px: 4.8   # 0.3rem, explicit CSS on .knob3-label-small
        label_font_size_px: 8      # 0.5rem
        label_line_height_estimate_px: 11.2   # 8 * 1.4 conservative multiplier
        true_rendered_height_px: 72           # 56 + 4.8 + 11.2, rounded
        previous_nominal_height_px: 84        # was WRONG — overstated by 12px in the OTHER direction, which is why row2 still clipped: the real problem was the absolute `top` values (330/440) leaving too little margin to the panel bottom once the true (if smaller) box is placed that low, combined with row2's `top:440` computed against a nominal box that didn't match the actual rendered stack — corrected by both fixing the height AND moving the rows up.
        new_positions: "row 1 y=320 (was 330), row 2 y=415 (was 440)"
        row1_seam_clearance_px: 20    # 320 - 300 (seam datum), matches coordinator's "~20px clearance" requirement exactly
        row2_true_bottom_margin_px: 73  # 560 - (415 + 72), comfortably clears the coordinator's 30px-minimum rule
        row_gutter_px: 23             # 415 - (320 + 72)
      output_chip:
        true_rendered_height_estimate_px: 80   # padding(8) + value-line(~33 at 1.8rem font) + chevrons block(~16) + label margin(4.8) + label line(~11) + bottom padding(7.2)
        nominal_height_px: 90
        verdict: "safe — nominal already exceeds true rendered height, no change needed"
      vertical_labels:
        note: >
          Rotated text (writing-mode: vertical-rl); true content extent
          along the reading axis estimated per label at ~12px effective
          per-character advance (font-size 0.62rem=9.92px + letter-spacing
