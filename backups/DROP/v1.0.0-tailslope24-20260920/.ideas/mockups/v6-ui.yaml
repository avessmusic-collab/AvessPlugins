notes:
  - "v6 SUMMARY: three changes on top of v5, everything else (two-page layout, all 19 param bindings, the dark bx_pulsar-derived language, the full 3D depth system) reused verbatim. (1) Fixed a knob value-arc concentricity bug affecting every knob (see knob_arc_fix above for root cause, fix, and verification numbers proving zero offset at every knob size and every window scale). (2) Replaced the wireframe-loop orb with a genuine liquid blob soft-body physics simulation (see liquid_blob_physics above). (3) Tuned text-label/text-label-dim/accent/accent-glow for better legibility and a touch more accent vibrancy — same palette identity, adjusted values (see colors above)."
  - "Layout re-validated at base 1000x560 for BOTH pages using v5's validated geometry table verbatim (no position/size changes were needed — the liquid blob renders inside the identical #orbWrap container, same x400,y96,200x200 box as the old orb): zero bounds violations, zero overlaps, zero spacing violations under 10px on both Main and Advanced (one documented intentional grouping carried over unchanged: phaseChip<->orb, 8px). Every rendered HTML position was additionally cross-checked programmatically against this table and matched exactly, confirming the v6 code changes (CSS/JS only) did not drift any control's geometry."
  - "Layout validated per-page (two independent flat control lists, base 1000x560): MAIN — zero bounds violations, zero overlaps, zero spacing violations under 10px except one documented intentional grouping (phaseChip <-> orb, 8px, same precedent as v1-v4) — UNCHANGED across all three Advanced-page fix passes. ADVANCED — re-validated after the THIRD pass (this one, the box-model correction): zero bounds violations, zero overlaps, zero spacing violations under 10px, AND zero violations of the coordinator's 30px-from-bottom-edge rule, this time checked against TRUE rendered element heights rather than nominal design boxes (see box_model_audit for methodology and computed values) — macro grid row 2's true bottom now sits 73px above the panel bottom (pass 2 was technically passing the validator at a 36px margin, but against a nominal 84px box that didn't match the real rendered content, which is why it still clipped visually)."
  - "ADVANCED-page fix history, pass 1: the original ship of v5 clustered triggerMode/tension/chaos/curve/impact_mirror at the top (y70-254) and crammed 10 macros + Impact + Output against the bottom edge (y400-520), leaving a ~250px dead middle band. Fixed by redistributing into 3 STACKED rows — this made the page better but still failed review: a ~150px dead band remained (y290-440), the single 10-knob row still read as cramped/too-low, and Output was still too close to the bottom-right corner (and the test-harness-only debug monitor)."
  - "ADVANCED-page fix history, pass 2: restructured per the coordinator's explicit final geometry, replacing the 3-stacked-row model with an UPPER RECESSED WELL (y70-300) read as two balanced COLUMNS instead of stacked rows — left column (x40-266): triggerMode pill (y80) + Tension/Chaos chips (y150); right column (x620-920): the tension-curve display WIDENED to 300x140 (was 200x110, it earns the space as the well's hero element); and Impact deliberately placed in the CENTER GAP (x470-600, y100-250) between the two columns so the well has no dead middle, per the coordinator's explicit suggestion — plus Impact was enlarged again (130x150). The LOWER RAISED DECK (y300-540) now holds the 10 macros as a true 2x5 GRID (56px caps, was one row of 42-48px caps) centered horizontally at x430 exactly matching the requested target, plus a large Output readout chip (160x90, was 110x70) at x790-950 vertically centered in the deck (~y370) — nowhere near the bottom-right corner. This pass placed the grid rows at y330/y440 against a NOMINAL 84px-tall box per knob — pass 3 found that nominal height didn't match the true rendered content and corrected both the height and the row y-positions."
  - "ADVANCED-page fix history, pass 3 (current, box-model correction): user review of pass 2 found the macro grid's row 2 labels rendering clipped at/near the panel's bottom edge, ~60px lower than the validator predicted — because the validator was checking pass 2's nominal 84px-tall box, not the DOM element's true rendered height. Audited the real CSS box model for every Advanced element (see box_model_audit block above the special_elements section for full methodology and per-element numbers). Grid knobs' true height is 72px (56px cap + 4.8px label margin + ~11.2px conservative label-line estimate) — the rows were then moved to y=320 (was 330) and y=415 (was 440) using this corrected height, giving row 1 exactly the requested ~20px clearance from the seam datum (y300) and row 2 a true 73px margin from the panel bottom (comfortably over the coordinator's 30px minimum). Output and the vertical labels were audited too and found already safe (their nominal boxes already exceed true rendered content) — no changes needed there."
  - "Impact arc-visibility bug: diagnosed and fixed. The arc math itself (buildKnobArc()/render() in the JS) is identical for every knob and was confirmed to match the reference image's own convention (re-examined: the reference's FEEDBACK knob at its default value of 50 also shows an arc spanning only the bottom-left-to-top range, i.e. the same 'left-half' shape at 50% — this is not unique to Impact and not a math error). The actual bug was CSS: .knob3-arc .arc-track (the always-visible background channel/track behind the blue value-fill) was rgba(255,255,255,0.08) — nearly invisible against the dark knob face. At default/partial values (e.g. Impact's 50%, unlike the macros which default to 100% and so show a visually-complete fill regardless), the unfilled remainder of the ring simply wasn't rendering, making the arc read as an incomplete/broken/asymmetric shape rather than a full recessed channel half-highlighted in blue. Fixed by raising the track to rgba(255,255,255,0.22) — clearly visible as a full 270-degree ring at every knob size, still subtle/recessed per the depth system. This is a global CSS fix (affects every knob, not just Impact) and was the correct place to fix it since the arc math itself was already correct and reference-accurate."
  - "Total: still exactly 19 APVTS parameters, same IDs as v1-v4 — trigger, buildLength, style, intensity, tension, chaos, impact, filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise, dryWet, output. Split across two pages: MAIN carries trigger, buildLength, style, intensity, dryWet (5). ADVANCED carries tension, chaos, impact, filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise, output (14). 5+14=19."
  - "triggerMode and page_nav are both non-APVTS UI state (parameter: null), matching architecture.md's documented non-parameter-state category — both still emit messages on change."
  - "Module macros default to 100% (unchanged, per architecture.md Resolved Open Questions)."
  - "v1, v2, v3, and v4 remain completely untouched on disk as design history. Within v5 itself, the MAIN page is also unchanged across all three Advanced-page fix passes — only the ADVANCED page's geometry, the removal of impact_mirror, the global arc-track CSS fix, and (this pass) the macro-grid box-model correction were touched, per the coordinator's explicit instruction not to touch Main."
  - "v6 note: v1 through v5 (all yaml + test-html pairs) remain completely untouched on disk as design history — confirmed via unchanged file timestamps before and after this iteration. v6 only ADDS two new files (v6-ui.yaml, v6-ui-test.html); no existing file was modified."
