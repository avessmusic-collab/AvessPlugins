        display_variant: dark-rim-lit-small-3d
        parameter: "filter"
        position: { x: 168, y: 320 }
        size: { width: 60, height: 72 }   # TRUE rendered height, see box_model_audit below (was nominal 84, incorrectly taller than actual content)
        zone: lower_deck_grid
        grid: { row: 1, col: 1 }
      - id: width
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "width"
        position: { x: 284, y: 320 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 1, col: 2 }
      - id: pitch
