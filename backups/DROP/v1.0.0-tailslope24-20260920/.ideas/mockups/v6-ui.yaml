        display_variant: dark-rim-lit-small-3d
        parameter: "pitch"
        position: { x: 400, y: 320 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 1, col: 3 }
      - id: gate
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
