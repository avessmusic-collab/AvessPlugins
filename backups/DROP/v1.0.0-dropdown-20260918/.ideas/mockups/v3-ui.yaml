  - id: impact
    type: rotary-knob
    display_variant: dark-rim-lit-hero
    label: "IMPACT"
    parameter: "impact"
    range: [0.0, 100.0]
    unit: "%"
    default: 50.0
    decimals: 0
    description: "Reference FEEDBACK-style hero knob position: largest knob on the panel, heaviest blue arc/glow."
    position: { x: 822, y: 440 }
    size: { width: 76, height: 96 }

  - id: output
    type: bare-numeric-readout
    label: "OUTPUT"
    parameter: "output"
    range: [-60.0, 12.0]
    unit: "dB"
    default: 0.0
    decimals: 1
    description: "Reference's '449 Hz / 20.0k Hz' large-numeral-with-chevrons idiom, applied to Output gain."
    position: { x: 908, y: 460 }
    size: { width: 70, height: 56 }

notes:
  - "v3 supersedes v1/v2's two-page Swiss layout entirely, per explicit user direction — single zoned page modeled on the reference screenshot's visual language, DROP's own 19 parameters mapped onto that idiom."
  - "Total: 19 APVTS parameters, IDs unchanged from v1/v2 — trigger, buildLength, style, intensity, tension, chaos, impact, filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise, dryWet, output."
  - "triggerMode (MANUAL/MIDI/AUTO) is non-APVTS UI state (parameter: null), matching architecture.md's documented non-parameter state category (trigger mode is explicitly listed there as ValueTree state, not APVTS) — it still emits a message on change for host-side wiring."
  - "No Brainworx/bx_pulsar branding reproduced anywhere: wordmark is 'd r o p', maker mark is 'AVESS'."
  - "Layout validated at base 1000x560 via a custom bounds/overlap/spacing checker (single flat control list, since v3 is one page): zero bounds violations, zero overlaps, zero spacing violations under the 10px minimum (the tightest legitimate gap, between adjacent module-macro knobs, sits exactly at 10px), all edges >=15px from the window boundary. Decorative-only elements (vertical rotated labels, the orb's glow bleed, knob arc rings) may render a few px beyond their nominal box, same allowance documented in v2 — this does not change any declared position/size."
  - "Module macros (filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise) default to 100% per architecture.md Resolved Open Questions, unchanged from v1/v2."
  - "Impact was moved from an earlier upper-right 'bare readout' draft placement to the lower-right hero-knob slot, and Output was made the bare-readout-with-chevrons control instead, to avoid representing any single parameter with two redundant widgets and to match the reference's actual idiom split: knobs for 'performance' controls (Intensity, Dry/Wet, the 10 macros, Impact), bare draggable numerals for 'shape/utility' controls (Tension, Chaos, Output) — mirroring the reference's own knobs-vs-bare-numbers split (Delay/Feedback/Mix/etc. are knobs; Mod Rate/Mod Amt/Diffusion/filter frequencies are bare numbers)."
