# v7 UI Design Specification
# Plugin: DROP
# Generated: 2026-09-14
# v7 = v6 PLUS two fixes requested after user feedback ("impact knob is out
# of center. make the knobs to be 3 dimentional"): (1) audited every
# candidate cause of the Impact-knob misalignment and fixed the real one
# (the knob's wrap box was not horizontally centered in the zone between
# the Tension/Chaos column and the tension-curve box — see
# knob_centering_audit below for the full audit, before/after numbers, and
# confirmation that cap-vs-arc concentricity, fixed in v6, was NOT the
# cause here); (2) rebuilt the knob cap material to read as genuinely
# dimensional — a visible outer side-wall/rim plus an inset domed top face
# with a strong single-light-source vertical gradient, a soft elliptical
# sheen, an inner bevel ring, and stronger contact+ambient shadows — see
# knob_3d_material below. Everything else (liquid blob physics, arc
# concentricity fix, color tuning, layout/geometry, all 19 parameter
# bindings, the two-page structure) is reused VERBATIM from v6 — see
# v6-ui.yaml for that full spec; this file restates the complete
# control/geometry table (with the one Impact position change) for
# standalone readability. v1-v6 remain on disk, untouched, as design
# history.

window:
  width: 1000
  height: 560
  resizable: true
  min_width: 800
  min_height: 450
  max_width: 1400
  max_height: 790
  scaling_model: "root-em-resize-observer"
  base_root_font_size_px: 16

colors:
  # v6 CHANGE 3: tuned for legibility/richness — same charcoal + electric-
  # blue palette IDENTITY, values adjusted, not the concept.
  upper_zone_bg: "#17181B"                    # unchanged
  lower_zone_bg: "#202226"                    # unchanged
  lower_zone_top_highlight: "#2A2C31"         # unchanged
  text_primary: "#E9EAED"                     # unchanged (already high contrast)
  text_label: "#9DA0A8"                       # was #8B8D93 — lighter, dim grays were too dim per user feedback
  text_label_dim: "#6E7076"                   # was #5C5E63 — lighter
  accent: "#3B9BFF"                           # was #4A9EFF — a touch more saturated/vibrant blue
  accent_dim: "#2F6BAF"                       # was #2E5C8F — matches the richer accent
  accent_glow: "rgba(59,155,255,0.65)"        # was rgba(74,158,255,0.55) — stronger glow to match
  page_backdrop: "#D7D9DC"                    # test-HTML-only floating-panel backdrop, unchanged
  numeral_pop: "knob3-value numerals gained a subtle text-shadow (0 1px 2px rgba(0,0,0,0.6), 0 0 10px rgba(255,255,255,0.06)) and font-weight 400->500 so they read with more presence against the dark cap, without turning into neon text"

typography: "unchanged from v3/v4"
motion: "unchanged from v3/v4 — critically-damped spring integrator for continuous orb motion, cubic-bezier(0.34,1.56,0.64,1) for discrete UI feedback"

# ---------------------------------------------------------------------------
# CHANGE 1 — 3D DEPTH SYSTEM (new in v5)
# ---------------------------------------------------------------------------
depth_system:
  philosophy: >
    Single consistent light source from above. Every element is either
    RAISED (knobs, the DROP button, the lower "deck") or RECESSED (the
    upper "well", the tension-curve display, step-circles, the progress
    strip track, the bare-readout number chips, the orb's chamber) —
    never ambiguous. Depth communicated entirely through shadow/highlight
    physics (contact + ambient shadow pairs, inset shadows, rim
    highlights) — no fake perspective, no skeuomorphic ornamentation, text
    stays perfectly flat/legible.
  raised_elements:
    knobs:
      superseded_in_v7: "the v5/v6 single-layer radial-gradient cap description below is SUPERSEDED by knob_3d_material (see that section for the current two-layer outer-rim + inset-domed-face system) — kept here only as history of what v5/v6 shipped."
      cap_gradient_v5_v6_history: "multi-stop radial-gradient(circle at 34% 23%, #3a3d44 0%, #2c2e33 25%, #212226 55%, #17181b 85%, #0f1012 100%) — simulates a domed cap lit from above (user feedback in v7: 'still read as flat shaded circles')"
      rim_highlight_v5_v6_history: "radial-gradient(ellipse 60% 30% at 50% 9%, rgba(255,255,255,0.17), transparent 70%) layered as a second background — crisp bright catch-line along the top rim"
      texture_v5_v6_history: "repeating-linear-gradient brushed texture at ~2% opacity, third background layer — kept extremely subtle, reads as matte, not noisy"
      shadow: "v7: 0 2px 3px rgba(0,0,0,0.55) [tight contact shadow] + 0 14px 30px rgba(0,0,0,0.48) [wide soft ambient shadow] + inset 0 1px 0 rgba(255,255,255,0.12) [rim] + inset 0 -2px 3px rgba(0,0,0,0.4) [outer rim internal shade] — strengthened slightly from v5/v6 for a more physically substantial puck read"
    drop_button:
      idle: "thick raised pill — same contact+ambient shadow pairing as knobs, plus inset top rim highlight for a rounded-edge read"
      pressed: "shadow collapses to a tight, low-opacity contact shadow only (ambient shadow removed); transform: translateY(2px) scale(0.97) — a genuine physical depression, not just a scale bounce"
  recessed_elements:
    upper_zone: "recessed well — a dark linear-gradient overlay (opacity 0.35 -> 0 over the top ~50px) sits just below the header, reading as a shadow cast into the recess by the panel's own top bezel"
    tension_curve_display: "inset 0 2px 4px rgba(0,0,0,0.5) + inset 0 -1px 0 rgba(255,255,255,0.03), unchanged dark fill from v4"
    step_circles: "flipped from v4's raised-chip look to a true recessed well: radial-gradient(circle at 50% 40%, #16171a, #0e0f11) fill + inset 0 3px 6px rgba(0,0,0,0.7); the active state's blue glow now reads as LED light spilling out of the well (inset blue glow + outer glow combined) rather than a raised highlight"
    progress_strip: "wrapped in a thin recessed track (dark fill + inset shadow) instead of a bare stroked rect"
    bare_readout_chips: "Tension/Chaos/Output/Impact-mirror numerals now sit inside a small recessed panel (dark fill + inset shadow + rounded corners), not bare floating text — padding added via box-sizing:border-box so the control's already-validated outer bounding box is unchanged"
    orb_chamber: "a dark radial-gradient well (#0c0d0f center -> transparent) plus inset shadow sits behind the orb (stronger shadow at the top interior edge, faint highlight at the bottom — consistent with the top-down light source), reading as a recessed glass chamber the orb floats inside"
  panel_seam_emboss: >
    The curved notch boundary between zones now renders as two offset
    strokes instead of one: a dark crease (rgba(0,0,0,0.5), drawn first)
    and a light catch-line 1.5px below it (rgba(255,255,255,0.20), drawn
    second) — a real emboss read, not a flat divider line.

# ---------------------------------------------------------------------------
# CHANGE 2 — TWO PAGES (restored, per explicit user direction)
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# v6 CHANGE 1 — KNOB VALUE-ARC CONCENTRICITY FIX
# ---------------------------------------------------------------------------
knob_arc_fix:
  bug_report: >
    User: "blue arches around knobs are all out of place" — every knob's
    blue value arc rendered offset up-and-left of its cap, visible clearly
    on Main's large Intensity/Dry-Wet knobs and more subtly on the
    macro grid.
  root_cause: >
    .knob3-arc (the arc SVG overlay) was an absolutely-positioned <svg>
    with `inset: -10%` and NO explicit width/height attributes or CSS
    width/height. An <svg> used this way is a CSS "replaced element" —
    per the CSS2.1 absolutely-positioned-replaced-element algorithm,
    when width/height compute to 'auto' (which happens here, since only
    the four inset offsets were specified, not width/height directly),
    browsers fall back to the element's intrinsic size / viewBox-derived
    aspect ratio rather than reliably "stretching" to fill the inset box
    the way a normal (non-replaced) element would. This is a well-known,
    historically UA-inconsistent CSS corner case — exactly why the arc
    read as "offset" rather than a clean, predictable transform error.
  fix: >
    Replaced the inset-based sizing with explicit percentage width/height
    (120% each — no longer 'auto', so the replaced-element special case
    no longer applies) plus transform-based centering: `top:50%; left:50%;
    transform: translate(-50%,-50%)`. This technique has zero UA
    ambiguity and is scale-invariant by construction (percentages and
    transform-percentages both resolve against/relative-to the same
    element's own box at every root-em scale factor). Also added explicit
    width="100%" height="100%" SVG attributes at element-creation time in
    JS as a belt-and-suspenders redundancy.
  verification_proof: >
    Algebraic proof that arc-center == cap-center for every knob size W
    (all knob caps are square, W x W, explicit inline CSS):
      top:50% -> arc box top-left.y (pre-transform) = 0.5W
      left:50% -> arc box top-left.x (pre-transform) = 0.5W
      width:120%/height:120% -> arc box size = 1.2W x 1.2W (resolves
        cleanly against the W x W containing block — non-auto, no
        replaced-element ambiguity)
      transform: translate(-50%,-50%) shifts by -50% of the ARC's OWN
        box size (1.2W), i.e. -0.6W in x and y
      final arc box top-left = (0.5W-0.6W, 0.5W-0.6W) = (-0.1W, -0.1W)
      final arc box center = (-0.1W+0.6W, -0.1W+0.6W) = (0.5W, 0.5W)
      cap center (by definition) = (0.5W, 0.5W)
      => offset = (0, 0) for every W, at every scale.
  verification_numbers:
    - { knob: "Intensity (Main)",        cap_px: 200, arc_box_px: 240.0, cap_center: [100.0, 100.0], arc_center: [100.0, 100.0], offset_px: [0.0, 0.0] }
    - { knob: "Dry/Wet (Main)",          cap_px: 200, arc_box_px: 240.0, cap_center: [100.0, 100.0], arc_center: [100.0, 100.0], offset_px: [0.0, 0.0] }
    - { knob: "Impact (Advanced)",       cap_px: 112, arc_box_px: 134.4, cap_center: [56.0, 56.0],   arc_center: [56.0, 56.0],   offset_px: [0.0, 0.0] }
    - { knob: "Macro knobs x10 (Advanced)", cap_px: 56, arc_box_px: 67.2, cap_center: [28.0, 28.0],  arc_center: [28.0, 28.0],   offset_px: [0.0, 0.0] }
    - { scale_check: "root-em ResizeObserver scale factor", tested: [0.75, 1.0, 1.5], result: "offset_px: [0.0, 0.0] at every scale — holds by construction, not just at base size" }

# ---------------------------------------------------------------------------
# v6 CHANGE 2 — LIQUID BLOB SOFT-BODY PHYSICS (replaces the wireframe orb)
# ---------------------------------------------------------------------------
liquid_blob_physics:
  summary: >
    28 surface points arranged around the blob's center, each point
    independently spring-anchored to a shared radius target AND coupled
    to its two immediate neighbors via a discrete Laplacian term — this
    coupling is what makes a poke at one point ripple around the entire
    membrane instead of just wobbling that one point in isolation. This
    is the key structural difference from the v3-v5 wireframe loops
    (which had no point-to-point coupling at all).
  point_count: 28
  base_radius_px: 56
  per_point_spring: { stiffness: 70, damping: 9 }
  neighbor_coupling_strength: 20
  idle_sloshing: "two rotating low-order sine harmonics (order 1 and 2) biasing each point's target radius by angle — reads as a slow, continuous slosh rather than a static resting shape"
  audio_level_pokes: "periodic randomized impulses applied to a small angular neighborhood (cosine falloff, +/-4 points), frequency interval 220ms (high agitation) to 900ms (idle) and magnitude both scale with the current agitation spring value — simulates audio-reactive surface disturbance without executing any real DSP"
  volume_conservation: "soft/approximate: each frame, the average point radius is nudged 2.5% of the way back toward the target base radius — keeps overall size roughly constant over time without erasing the local squash-one-side/bulge-the-other asymmetry a real poke produces (a rigorous incompressible-fluid solve was judged unnecessary for a UI mockup)"
  phase_behavior:
    idle: "agitation target 0.15 (gentle continuous life, not static), radius target 1.0x"
    building: "agitation ramps 0.15 -> ~0.9 with progress * (intensity-weighted), radius grows slightly to 1.10x, internal color mix ramps with progress * tension"
    peak: "agitation 1.0 (max), radius 1.12x, color mix 0.9"
    vacuum: "radius target collapses to 0.22x (tight droplet); agitation is INCREASED (0.5->0.85) rather than reduced, specifically to produce visible high-frequency trembling on the tiny droplet rather than a calm shrink"
    impact: "one-shot edge-triggered event on phase entry: (a) spawns 6 satellite droplets with randomized outward velocity + upward bias, (b) applies 6 strong random pokes directly to the main body's surface points (a genuine asymmetric 'splash', not just a smooth radius-spring overshoot), (c) radius spring target spikes to up to 2.1x with a loose/overshooting spring so the body itself visibly bursts outward before settling"
    recovery: "agitation and radius decay back to idle levels via the same spring damping — no special-cased 'settle' logic needed, natural spring physics handles it"
  satellite_droplets:
    max_count: 6
    physics: "initial outward velocity + slight upward bias, gravity 130px/s^2, velocity drag ~1.4%/frame, radius/opacity fade via a life timer"
    merge_behavior: "a droplet deactivates (opacity->0, 'merges' back into the body) once its distance from center falls below 90% of the current body radius, OR its life timer expires — whichever comes first"
    rendering: "6 pre-created SVG <circle> elements, reused every splash (opacity toggled, not created/destroyed) to keep the frame loop allocation-free"
  rendering_layers:
    internal_glow_gradient: "3-stop radial gradient fill (blobGrad), all 3 stops tint from a cool blue toward the accent as the tension-driven color-mix value rises — reads as light glowing from inside the liquid"
    rim_stroke: "1.5px crisp stroke around the same path, also tints toward the accent with tension — a defined edge on top of the soft gradient fill"
    specular_highlight: "a small blurred white ellipse positioned by sampling the ACTUAL current point radius at a fixed light-source angle (-0.85 rad, upper-left) via linear interpolation between the two nearest surface points — this makes the highlight visibly ride the bulging/squashing surface rather than sitting in a fixed spot, satisfying the 'tracks deformation' requirement"
    grounding_shadow: "a blurred dark ellipse beneath the blob, radius and opacity both breathe with the blob's current radiusMul/agitation"
    outer_halo: "a separate soft blurred glow ellipse (blobGlow) behind the body, opacity scales with both color-mix (tension) and agitation, for an ambient 'light source inside the liquid' read distinct from the sharper rim stroke"
  performance: "single requestAnimationFrame loop shared with the rest of the UI (phase chip, progress strip, curve redraw); ~28-point path rebuild + a handful of trivial per-point arithmetic operations per frame, well within budget for a UI mockup — no physics library, no WebGL, no offscreen canvas"

# ---------------------------------------------------------------------------
# v7 CHANGE 1 — IMPACT KNOB CENTERING AUDIT
# ---------------------------------------------------------------------------
knob_centering_audit:
  bug_report: 'User (verbatim): "impact knob is out of center."'
  candidates_investigated:
    - candidate: "(a) Cap not vertically centered inside its arc ring — arc centers on the WRAP (which also contains the label) instead of on the cap itself, so the cap rides high/low within the ring."
      verdict: "NOT A BUG in this implementation — re-audited and confirmed. .knob3-arc is appended as a child of .knob3 (the cap div itself), NOT .knob3-wrap, and its CSS (top:50%;left:50%;width:120%;height:120%;transform:translate(-50%,-50%), fixed in v6) resolves entirely against .knob3's own box. The label lives in a sibling <span> outside .knob3, so it cannot affect the arc's centering. Re-ran the v6 algebraic proof for all 4 knob tiers (200px/112px/56px caps) — offset is still (0,0) at every size. This was thoroughly fixed in v6 and remains correct; it was not the cause of the v7 report."
      offset_px: [0.0, 0.0]
    - candidate: "(b) Knob not horizontally centered within its column/gap between the Tension/Chaos chips and the tension-curve box."
      verdict: "CONFIRMED REAL BUG — this was the actual cause. See before/after below."
    - candidate: "(c) The IMPACT % label not centered under the cap."
      verdict: "NOT AN INDEPENDENT BUG — the label is centered via text-align:center on .knob3-wrap, resolving against the SAME wrap width the cap's margin:0 auto centering also resolves against, so label and cap always share one center by construction. Once (b) is fixed (the wrap itself is correctly placed), the label is automatically correctly centered under the cap too — confirmed, no separate fix needed."
  root_cause_b: >
    Impact's wrap box was placed at x=470 (width 130, box-center 535px).
    The true midpoint of the gap between the left column (Tension/Chaos,
    ending at x=266) and the right column (tension-curve box, starting at
    x=620) is (266+620)/2 = 443px. 535 - 443 = 92px — the knob sat visibly
    crowded toward the curve side rather than centered in the gap, which
    is exactly what the user perceived as "out of center."
  fix_pass1: "Moved the wrap's left edge from x=470 to x=378 (box-center now exactly 443px, the midpoint of the two neighboring columns, box unchanged at 130x150)."
  fix_pass1_before_after:
    before: { wrap_left_px: 470, box_center_px: 535, gap_to_left_column_px: 204, gap_to_right_column_px: 20, symmetric: false }
    after:  { wrap_left_px: 378, box_center_px: 443, gap_to_left_column_px: 112, gap_to_right_column_px: 112, symmetric: true }
  fix_pass2_user_clarification: >
    User (verbatim, after seeing pass 1): "impact is still not in the
    center cnter it with the groove you ve made in the line of the ui" —
    clarifying that the intended centering anchor is the SEAM NOTCH's
    dip (the "groove" in the zone-divider line), not the midpoint between
    the neighboring columns. Pass 1's x=443 was the wrong reference point
    entirely, not just a wrong number.
  notch_center_verification: >
    Computed the notch's true dip center algebraically from the seam SVG
    path (M0,300 L370,300 C430,300 435,344 500,344 C565,344 570,300
    630,300 L1000,300): the point (500,344) is a shared ON-CURVE endpoint
    of both cubic bezier segments (not merely a control point), and the
    two segments are exactly mirror-symmetric around it — left span
    370->500 = 130px, right span 500->630 = 130px; control-point offsets
    60px/65px from each curve's start, mirrored exactly (630-570=60,
    630-565=65). This proves the notch's deepest/center point is exactly
    x=500, not assumed.
  main_page_center_axis_audit: >
    Confirmed every Main-page element already shares this exact x=500
    center: orbWrap (left 400, width 200, center 500), style-nav (left
    390, width 220, center 500), trigger-btn/DROP (left 380, width 240,
    center 500), progressStrip (left 400, width 200, center 500),
    phaseChip (left 420, width 160, center 500) — all OK, confirming
    x=500 is genuinely the UI's shared center axis across both pages, not
    an Advanced-page-only concern.
  fix_pass2_before_after:
    before: { wrap_left_px: 378, box_center_px: 443, offset_from_notch_px: 57 }
    after:  { wrap_left_px: 435, box_center_px: 500, offset_from_notch_px: 0 }
  final_gaps: { gap_to_left_column_px: 169, gap_to_right_column_px: 55, symmetric: false, note: "intentionally asymmetric — x=500 is not the columns' midpoint, it is the UI's actual shared center axis (the notch/orb/style-selector/DROP-button column); confirmed via the layout validator that this produces zero overlaps (55px and 169px gaps both comfortably exceed the 10px minimum)" }
  verification: "cap-center == notch-dip-center == every Main-page element's center, all exactly x=500 — computed and confirmed via the layout validator, not just asserted."

# ---------------------------------------------------------------------------
# v7 CHANGE 2 — TRULY 3D KNOB MATERIAL
# ---------------------------------------------------------------------------
knob_3d_material:
  bug_report: 'User (verbatim): "make the knobs to be 3 dimentional." Prior v5/v6 caps used a single radial-gradient background layer — read as a flat shaded circle rather than a physical object, despite the shadow/highlight tokens already present.'
  reference_check: "Re-examined plugins/DROP/.ideas/mockups/v3-reference.png specifically for knob material: its knobs (DELAY, MIX, FEEDBACK, AMOUNT, etc.) show a distinct darker OUTER ring/body with a lighter, subtly domed INNER face, a strong vertical light gradient (lighter top, fading to near-black bottom), and a thin bright catch-line right at the top rim edge — unmistakably a two-layer physical puck, not a single flat gradient."
  structure: "Two CSS layers instead of one, applied identically to every knob tier via percentage-based sizing (scales proportionally at 200px/112px/56px alike, no per-size overrides needed):"
  outer_layer_knob3:
    role: "the visible cylindrical side-wall/rim band — the 'height' of the physical puck"
    background: "radial-gradient(circle at 50% 30%, #303236 0%, #16171a 72%)"
    shadow: "var(--knob-contact-shadow) [tight, 0 2px 3px rgba(0,0,0,0.55)] + var(--knob-ambient-shadow) [wide, 0 14px 30px rgba(0,0,0,0.48)] + var(--knob-rim) [inset top highlight] + var(--knob-internal-shade) [inset bottom shade]"
  inset_layer_knob3_before:
    role: "the domed TOP FACE — a ::before pseudo-element inset 9% inside the outer rim (percentage inset, so the rim band's width scales proportionally at every cap size)"
    background_layers_top_to_bottom_paint_order:
      - "radial-gradient(ellipse 56% 24% at 50% 17%, rgba(255,255,255,0.30) 0%, transparent 68%) — the soft elliptical sheen near the top, deliberately blurred/soft via a wide ellipse + gradual falloff rather than a hard specular dot"
      - "repeating-linear-gradient brushed texture, unchanged from v5/v6 (~2.5% opacity)"
      - "linear-gradient(180deg, #4c4f56 0%, #35373c 28%, #202226 60%, #0d0e10 100%) — the strong single-top-light-source VERTICAL gradient (replaces the old radial 'spotlight' gradient, which read as flat because its falloff was circular/directionless rather than reading as a light source from above)"
    bevel_shadow: "inset 0 1px 1px rgba(255,255,255,0.22) [inner highlight where the face meets the rim] + inset 0 -2px 4px rgba(0,0,0,0.55) [inner shadow at the same boundary] — together these read as a real beveled edge, not a flat painted circle"
  numeral: "unchanged — .knob3-value remains an absolutely-positioned, flex-centered overlay on top of both layers (paints after ::before in DOM/paint order), still reads as engraved-centered"
  arc_unaffected: "confirmed the ::before face layer does not change .knob3's own box size (it's an inset overlay, not a layout participant), so the v6 arc-concentricity fix is completely unaffected by this change — re-verified the (0,0) offset proof still holds"
  scale_proportionality: "every measurement in both layers is a percentage (inset 9%, gradient stop percentages, ellipse size percentages) — the identical CSS rule produces a proportionally-scaled identical effect at 200px (Intensity/Dry-Wet), 112px (Impact), and 56px (macro knobs) alike, and continues to scale correctly with the root-em ResizeObserver window-scaling factor, with no per-size CSS overrides required"

page_navigation:
  style: "reference-style 2-segment sliding pill (same mechanism as v3/v4's 3-way trigger-mode pill, generalized to 2 segments), spring-overshoot indicator transition"
  choices: ["MAIN", "ADVANCED"]
  position: { x: 400, y: 16, width: 200, height: 28 }   # sits in the shared header row (y0-56), centered
  parameter: null   # view-state only, matches architecture.md's non-parameter UI-state category
  shared_chrome: "Both pages render the identical header, panel background (upper/lower zone gradients + embossed seam), and vignette — only the content-layer's children swap, so switching pages feels like navigating one physical device, not loading a different skin."

pages:
  - id: main
    label: "MAIN"
    description: >
      The showcase page: orb centerpiece (dense crisp loops, v4 fix #1),
      phase LED module (v4 fix #3), the STYLE chevron selector sitting in
      the seam notch, the big DROP trigger + progress strip, Build Length
      step-circles (kept here since the page has ample room without the
      Advanced-only controls — stays uncluttered per the user's
      allowance), and exactly two large showcase-grade 3D knobs,
      INTENSITY and DRY/WET, flanking the orb left/right.
    controls:
      - id: buildLength
        type: combo-box
        display_variant: recessed-glow-step-circles
        parameter: "buildLength"
        position: { x: 40, y: 112 }
        size: { width: 252, height: 58 }
      - id: intensity
        type: rotary-knob
        display_variant: dark-rim-lit-hero-3d
        parameter: "intensity"
        range: [0.0, 100.0]
        default: 50.0
        description: "Large showcase knob, ~200px cap, flanks the orb on the left."
        position: { x: 66, y: 200 }
        size: { width: 220, height: 300 }
      - id: dryWet
        type: rotary-knob
        display_variant: dark-rim-lit-hero-3d
        parameter: "dryWet"
        range: [0.0, 100.0]
        default: 100.0
        description: "Mirrors Intensity on the right of the orb."
        position: { x: 714, y: 200 }
        size: { width: 220, height: 300 }
      - id: style
        type: combo-box
        display_variant: chevron-nav
        parameter: "style"
        position: { x: 390, y: 306 }
        size: { width: 220, height: 36 }
      - id: trigger
        type: button
        display_variant: raised-glow-pill-3d
        parameter: "trigger"
        parameter_type: bool
        momentary: true
        position: { x: 380, y: 352 }
        size: { width: 240, height: 54 }
    special_elements:
      - id: liquid_blob
        type: audio-reactive-liquid-blob-physics
        description: >
          v6 CHANGE 2 — REPLACES the v3-v5 wireframe-loop orb entirely.
          A genuine soft-body liquid simulation: 28 surface points, each
          on its own critically-damped spring anchored to a shared radius
          target, coupled to its two immediate neighbors via a discrete
          Laplacian term so a disturbance at one point ripples around the
          whole membrane (not N independent wobbling circles). See
          liquid_blob_physics below for full parameters. Same position/
          size as the old orb — floats in the identical recessed glass
          chamber (#orbWrap::before, CSS, byte-identical to v5).
        position: { x: 400, y: 96 }
        size: { width: 200, height: 200 }
        renamed_from: liquid_orb   # v3-v5 id, kept here for traceability
      - id: phase_readout
        type: readout
        description: "Identical to v4 fix #3 (LED-dot status pill)."
        position: { x: 420, y: 70 }
        size: { width: 160, height: 18 }
      - id: progress_strip
        type: phase-progress-strip
