          inset styling all unchanged in behavior, just rendered into the
          larger viewBox (0 0 300 140 instead of 0 0 200 110).
        position: { x: 620, y: 80 }
        size: { width: 300, height: 140 }
    vertical_labels:
      - { id: shapeLabel,   text: "SHAPE",   position: { x: 16,  y: 70,  width: 10, height: 180 } }
      - { id: filtersLabel, text: "FILTERS", position: { x: 974, y: 70,  width: 10, height: 220 } }
