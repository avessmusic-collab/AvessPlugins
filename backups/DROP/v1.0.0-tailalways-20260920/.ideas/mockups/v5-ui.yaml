# v5 UI Design Specification
# Plugin: DROP
# Generated: 2026-09-13
# v5 = v4 (reference-matched dark aesthetic + orb-density fix + enriched
# tension-curve fix + anchored phase-label fix) PLUS two further requests
# made after the user reviewed the v3->v4 direction and said it "seems
# nice": (1) genuine 3D depth throughout (raised knobs/buttons, recessed
# wells, an embossed panel seam, a light source from above), and (2) the
# two-page structure is back (Main / Advanced), navigated via a
# reference-style sliding pill in the header. v1-v4 remain on disk,
# untouched, as design history.

window:
  width: 1000
  height: 560
  resizable: true
  min_width: 800
  min_height: 450
  max_width: 1400
  max_height: 790
  scaling_model: "root-em-resize-observer"
  base_root_font_size_px: 16

colors:
  upper_zone_bg: "#17181B"
  lower_zone_bg: "#202226"
  lower_zone_top_highlight: "#2A2C31"
  text_primary: "#E9EAED"
  text_label: "#8B8D93"
  text_label_dim: "#5C5E63"
  accent: "#4A9EFF"        # single accent, unchanged
  accent_dim: "#2E5C8F"
  accent_glow: "rgba(74,158,255,0.55)"
  page_backdrop: "#D7D9DC"  # test-HTML-only floating-panel backdrop

typography: "unchanged from v3/v4"
motion: "unchanged from v3/v4 — critically-damped spring integrator for continuous orb motion, cubic-bezier(0.34,1.56,0.64,1) for discrete UI feedback"

# ---------------------------------------------------------------------------
# CHANGE 1 — 3D DEPTH SYSTEM (new in v5)
# ---------------------------------------------------------------------------
depth_system:
  philosophy: >
    Single consistent light source from above. Every element is either
    RAISED (knobs, the DROP button, the lower "deck") or RECESSED (the
    upper "well", the tension-curve display, step-circles, the progress
    strip track, the bare-readout number chips, the orb's chamber) —
    never ambiguous. Depth communicated entirely through shadow/highlight
    physics (contact + ambient shadow pairs, inset shadows, rim
    highlights) — no fake perspective, no skeuomorphic ornamentation, text
    stays perfectly flat/legible.
  raised_elements:
    knobs:
      cap_gradient: "multi-stop radial-gradient(circle at 34% 23%, #3a3d44 0%, #2c2e33 25%, #212226 55%, #17181b 85%, #0f1012 100%) — simulates a domed cap lit from above"
      rim_highlight: "radial-gradient(ellipse 60% 30% at 50% 9%, rgba(255,255,255,0.17), transparent 70%) layered as a second background — crisp bright catch-line along the top rim"
      texture: "repeating-linear-gradient brushed texture at ~2% opacity, third background layer — kept extremely subtle, reads as matte, not noisy"
      shadow: "0 2px 2px rgba(0,0,0,0.5) [tight contact shadow] + 0 12px 26px rgba(0,0,0,0.42) [wide soft ambient shadow] + inset 0 1px 0 rgba(255,255,255,0.10) [rim] + inset 0 -3px 5px rgba(0,0,0,0.45) [internal bottom shade for dome curvature]"
    drop_button:
      idle: "thick raised pill — same contact+ambient shadow pairing as knobs, plus inset top rim highlight for a rounded-edge read"
      pressed: "shadow collapses to a tight, low-opacity contact shadow only (ambient shadow removed); transform: translateY(2px) scale(0.97) — a genuine physical depression, not just a scale bounce"
  recessed_elements:
    upper_zone: "recessed well — a dark linear-gradient overlay (opacity 0.35 -> 0 over the top ~50px) sits just below the header, reading as a shadow cast into the recess by the panel's own top bezel"
    tension_curve_display: "inset 0 2px 4px rgba(0,0,0,0.5) + inset 0 -1px 0 rgba(255,255,255,0.03), unchanged dark fill from v4"
    step_circles: "flipped from v4's raised-chip look to a true recessed well: radial-gradient(circle at 50% 40%, #16171a, #0e0f11) fill + inset 0 3px 6px rgba(0,0,0,0.7); the active state's blue glow now reads as LED light spilling out of the well (inset blue glow + outer glow combined) rather than a raised highlight"
    progress_strip: "wrapped in a thin recessed track (dark fill + inset shadow) instead of a bare stroked rect"
    bare_readout_chips: "Tension/Chaos/Output/Impact-mirror numerals now sit inside a small recessed panel (dark fill + inset shadow + rounded corners), not bare floating text — padding added via box-sizing:border-box so the control's already-validated outer bounding box is unchanged"
    orb_chamber: "a dark radial-gradient well (#0c0d0f center -> transparent) plus inset shadow sits behind the orb (stronger shadow at the top interior edge, faint highlight at the bottom — consistent with the top-down light source), reading as a recessed glass chamber the orb floats inside"
  panel_seam_emboss: >
    The curved notch boundary between zones now renders as two offset
    strokes instead of one: a dark crease (rgba(0,0,0,0.5), drawn first)
    and a light catch-line 1.5px below it (rgba(255,255,255,0.20), drawn
    second) — a real emboss read, not a flat divider line.

# ---------------------------------------------------------------------------
# CHANGE 2 — TWO PAGES (restored, per explicit user direction)
# ---------------------------------------------------------------------------
page_navigation:
  style: "reference-style 2-segment sliding pill (same mechanism as v3/v4's 3-way trigger-mode pill, generalized to 2 segments), spring-overshoot indicator transition"
  choices: ["MAIN", "ADVANCED"]
  position: { x: 400, y: 16, width: 200, height: 28 }   # sits in the shared header row (y0-56), centered
  parameter: null   # view-state only, matches architecture.md's non-parameter UI-state category
  shared_chrome: "Both pages render the identical header, panel background (upper/lower zone gradients + embossed seam), and vignette — only the content-layer's children swap, so switching pages feels like navigating one physical device, not loading a different skin."

pages:
  - id: main
    label: "MAIN"
    description: >
      The showcase page: orb centerpiece (dense crisp loops, v4 fix #1),
      phase LED module (v4 fix #3), the STYLE chevron selector sitting in
      the seam notch, the big DROP trigger + progress strip, Build Length
      step-circles (kept here since the page has ample room without the
      Advanced-only controls — stays uncluttered per the user's
      allowance), and exactly two large showcase-grade 3D knobs,
      INTENSITY and DRY/WET, flanking the orb left/right.
    controls:
      - id: buildLength
        type: combo-box
        display_variant: recessed-glow-step-circles
        parameter: "buildLength"
        position: { x: 40, y: 112 }
        size: { width: 252, height: 58 }
      - id: intensity
        type: rotary-knob
        display_variant: dark-rim-lit-hero-3d
        parameter: "intensity"
        range: [0.0, 100.0]
        default: 50.0
        description: "Large showcase knob, ~200px cap, flanks the orb on the left."
        position: { x: 66, y: 200 }
        size: { width: 220, height: 300 }
      - id: dryWet
        type: rotary-knob
        display_variant: dark-rim-lit-hero-3d
        parameter: "dryWet"
        range: [0.0, 100.0]
        default: 100.0
        description: "Mirrors Intensity on the right of the orb."
        position: { x: 714, y: 200 }
        size: { width: 220, height: 300 }
      - id: style
        type: combo-box
        display_variant: chevron-nav
        parameter: "style"
        position: { x: 390, y: 306 }
        size: { width: 220, height: 36 }
      - id: trigger
        type: button
        display_variant: raised-glow-pill-3d
        parameter: "trigger"
        parameter_type: bool
        momentary: true
        position: { x: 380, y: 352 }
        size: { width: 240, height: 54 }
    special_elements:
      - id: liquid_orb
        type: audio-reactive-wireframe-orb
        description: "Identical rendering to v4 fix #1 (8 crisp+glow loop layers, golden-angle spread, constant density except Vacuum), now floating in a recessed glass chamber per the v5 depth system."
        position: { x: 400, y: 96 }
        size: { width: 200, height: 200 }
      - id: phase_readout
        type: readout
        description: "Identical to v4 fix #3 (LED-dot status pill)."
        position: { x: 420, y: 70 }
        size: { width: 160, height: 18 }
      - id: progress_strip
        type: phase-progress-strip
        display_variant: recessed-track
        position: { x: 400, y: 416 }
        size: { width: 200, height: 10 }
    vertical_labels:
      - { id: buildLabel, text: "BUILD", position: { x: 16, y: 90, width: 10, height: 160 } }
      - { id: mixLabel, text: "MIX", position: { x: 974, y: 90, width: 10, height: 160 } }

  - id: advanced
    label: "ADVANCED"
    description: >
      Everything else, in the same reference language. Rebalanced TWICE
      after user review: pass 1 spread content into 3 stacked rows (fixed
      the original top-heavy/bottom-cramped layout); pass 2 (this one)
      restructured into the coordinator's explicit final geometry — an
      upper recessed well read as two balanced columns (not a 3-row
      stack), and a true 2x5 grid for the module bank instead of one
      cramped row of 10.
    controls:
      - id: triggerMode
        type: segmented-toggle
        display_variant: pill-3way
        parameter: null   # non-APVTS UI state, still emits a message
        description: "Upper well, left column, top."
        position: { x: 40, y: 80 }
        size: { width: 248, height: 32 }
        zone: upper_well_left
      - id: tension
        type: bare-numeric-readout
        display_variant: recessed-chip
        parameter: "tension"
        description: "Upper well, left column, below the pill."
        position: { x: 40, y: 150 }
        size: { width: 108, height: 56 }
        zone: upper_well_left
      - id: chaos
        type: bare-numeric-readout
        display_variant: recessed-chip
        parameter: "chaos"
        description: "Upper well, left column, beside Tension."
        position: { x: 158, y: 150 }
        size: { width: 108, height: 56 }
        zone: upper_well_left
      - id: impact
        type: rotary-knob
        display_variant: dark-rim-lit-hero-3d
        parameter: "impact"
        description: >
          Upper well, CENTER GAP — deliberately bridges the space between
          the left column (x40-266) and the right column (x620-920) so
          the well reads as balanced with no dead middle, per the
          coordinator's explicit instruction ("move Impact into the
          center gap"). Enlarged again (130x150, was 120x150) and its
          value-arc visibility bug fixed (see notes below).
        position: { x: 470, y: 100 }
        size: { width: 130, height: 150 }
        zone: upper_well_center
      - id: filter
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "filter"
        position: { x: 168, y: 320 }
        size: { width: 60, height: 72 }   # TRUE rendered height, see box_model_audit below (was nominal 84, incorrectly taller than actual content)
        zone: lower_deck_grid
        grid: { row: 1, col: 1 }
      - id: width
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "width"
        position: { x: 284, y: 320 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 1, col: 2 }
      - id: pitch
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "pitch"
        position: { x: 400, y: 320 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 1, col: 3 }
      - id: gate
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "gate"
        position: { x: 516, y: 320 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 1, col: 4 }
      - id: stutter
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "stutter"
        position: { x: 632, y: 320 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 1, col: 5 }
      - id: delay
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "delay"
        position: { x: 168, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 1 }
      - id: reverb
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "reverb"
        position: { x: 284, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 2 }
      - id: distortion
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "distortion"
        position: { x: 400, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 3 }
      - id: digital
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "digital"
        position: { x: 516, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 4 }
      - id: noise
        type: rotary-knob
        display_variant: dark-rim-lit-small-3d
        parameter: "noise"
        position: { x: 632, y: 415 }
        size: { width: 60, height: 72 }
        zone: lower_deck_grid
        grid: { row: 2, col: 5 }
      - id: output
        type: bare-numeric-readout
        display_variant: recessed-chip
        parameter: "output"
        description: "Lower deck, large readout chip at x790-950, vertically centered in the deck (~y370) — well clear of the bottom-right panel corner and the test-harness-only debug monitor. Box-model audit: true rendered height ~80px (see box_model_audit below) vs. this nominal 90px box — already safe, no reposition needed."
        position: { x: 790, y: 325 }
        size: { width: 160, height: 90 }
        zone: lower_deck_right
    box_model_audit:
      trigger: >
        User review found the lower-deck macro grid's row 2 (delay/reverb/
        distortion/digital/noise) rendering with labels at/clipped by the
        panel's bottom edge, ~60px lower than the validator's nominal
        84px-tall box predicted. Root cause: the validator was checking a
        nominal design box (position + size fields), not the TRUE rendered
        height of the actual DOM element (knob cap + margin + label text
        line, per the real CSS), which for these small knobs turned out
        different from the assumed 84px. Audited every Advanced-page
        element's real CSS box model instead of guessing.
      methodology: >
        For each element type, computed true rendered height as:
        knob-cap-height (explicit CSS width/height, exact) + label
        margin-top (explicit CSS, exact) + label line-box height
        (font-size * conservative 1.4 line-height multiplier, since no
        explicit line-height is set and this can't be measured in-browser
        in this environment — no node/browser automation available, so a
        deliberately conservative overestimate was used rather than
        risking another under-estimate).
      grid_knobs:
        cap_height_px: 56          # 3.5rem, explicit CSS on .knob3
        label_margin_top_px: 4.8   # 0.3rem, explicit CSS on .knob3-label-small
        label_font_size_px: 8      # 0.5rem
        label_line_height_estimate_px: 11.2   # 8 * 1.4 conservative multiplier
        true_rendered_height_px: 72           # 56 + 4.8 + 11.2, rounded
        previous_nominal_height_px: 84        # was WRONG — overstated by 12px in the OTHER direction, which is why row2 still clipped: the real problem was the absolute `top` values (330/440) leaving too little margin to the panel bottom once the true (if smaller) box is placed that low, combined with row2's `top:440` computed against a nominal box that didn't match the actual rendered stack — corrected by both fixing the height AND moving the rows up.
        new_positions: "row 1 y=320 (was 330), row 2 y=415 (was 440)"
        row1_seam_clearance_px: 20    # 320 - 300 (seam datum), matches coordinator's "~20px clearance" requirement exactly
        row2_true_bottom_margin_px: 73  # 560 - (415 + 72), comfortably clears the coordinator's 30px-minimum rule
        row_gutter_px: 23             # 415 - (320 + 72)
      output_chip:
        true_rendered_height_estimate_px: 80   # padding(8) + value-line(~33 at 1.8rem font) + chevrons block(~16) + label margin(4.8) + label line(~11) + bottom padding(7.2)
        nominal_height_px: 90
        verdict: "safe — nominal already exceeds true rendered height, no change needed"
      vertical_labels:
        note: >
          Rotated text (writing-mode: vertical-rl); true content extent
          along the reading axis estimated per label at ~12px effective
          per-character advance (font-size 0.62rem=9.92px + letter-spacing
          0.22em): SHAPE ~60px, FILTERS/MODULES ~85px, OUTPUT ~73px — all
          far under their allocated 180-220px boxes. Verdict: safe, no
          change needed, existing generous allocation already covers the
          true content with large margin.
    special_elements:
      - id: tension_curve
        type: curve-display
        description: >
          WIDENED to 300x140 (was 200x110) and repositioned to the upper
          well's right column (x620-920, y80-220) — it is the well's
          hero element and earns the extra space per the coordinator's
          explicit instruction. Grid ticks, BUILD/DROP axis labels,
          travelling position dot, derived curve-type label, and recessed
          inset styling all unchanged in behavior, just rendered into the
          larger viewBox (0 0 300 140 instead of 0 0 200 110).
        position: { x: 620, y: 80 }
        size: { width: 300, height: 140 }
    vertical_labels:
      - { id: shapeLabel,   text: "SHAPE",   position: { x: 16,  y: 70,  width: 10, height: 180 } }
      - { id: filtersLabel, text: "FILTERS", position: { x: 974, y: 70,  width: 10, height: 220 } }
      - { id: modulesLabel, text: "MODULES", position: { x: 16,  y: 310, width: 10, height: 210 } }
      - { id: outputLabel,  text: "OUTPUT",  position: { x: 974, y: 310, width: 10, height: 210 } }

shared_elements:
  - id: wordmark
    text: "d r o p"
    position: { x: 24, y: 16 }
    size: { width: 110, height: 24 }
  - id: maker_mark
    text: "AVESS"
    position: { x: 866, y: 16 }
    size: { width: 110, height: 24 }
  - id: page_nav
    position: { x: 400, y: 16 }
    size: { width: 200, height: 28 }
  - id: header_rule
    position: { x: 0, y: 56 }
    size: { width: 1000, height: 1 }

notes:
  - "Layout validated per-page (two independent flat control lists, base 1000x560): MAIN — zero bounds violations, zero overlaps, zero spacing violations under 10px except one documented intentional grouping (phaseChip <-> orb, 8px, same precedent as v1-v4) — UNCHANGED across all three Advanced-page fix passes. ADVANCED — re-validated after the THIRD pass (this one, the box-model correction): zero bounds violations, zero overlaps, zero spacing violations under 10px, AND zero violations of the coordinator's 30px-from-bottom-edge rule, this time checked against TRUE rendered element heights rather than nominal design boxes (see box_model_audit for methodology and computed values) — macro grid row 2's true bottom now sits 73px above the panel bottom (pass 2 was technically passing the validator at a 36px margin, but against a nominal 84px box that didn't match the real rendered content, which is why it still clipped visually)."
  - "ADVANCED-page fix history, pass 1: the original ship of v5 clustered triggerMode/tension/chaos/curve/impact_mirror at the top (y70-254) and crammed 10 macros + Impact + Output against the bottom edge (y400-520), leaving a ~250px dead middle band. Fixed by redistributing into 3 STACKED rows — this made the page better but still failed review: a ~150px dead band remained (y290-440), the single 10-knob row still read as cramped/too-low, and Output was still too close to the bottom-right corner (and the test-harness-only debug monitor)."
  - "ADVANCED-page fix history, pass 2: restructured per the coordinator's explicit final geometry, replacing the 3-stacked-row model with an UPPER RECESSED WELL (y70-300) read as two balanced COLUMNS instead of stacked rows — left column (x40-266): triggerMode pill (y80) + Tension/Chaos chips (y150); right column (x620-920): the tension-curve display WIDENED to 300x140 (was 200x110, it earns the space as the well's hero element); and Impact deliberately placed in the CENTER GAP (x470-600, y100-250) between the two columns so the well has no dead middle, per the coordinator's explicit suggestion — plus Impact was enlarged again (130x150). The LOWER RAISED DECK (y300-540) now holds the 10 macros as a true 2x5 GRID (56px caps, was one row of 42-48px caps) centered horizontally at x430 exactly matching the requested target, plus a large Output readout chip (160x90, was 110x70) at x790-950 vertically centered in the deck (~y370) — nowhere near the bottom-right corner. This pass placed the grid rows at y330/y440 against a NOMINAL 84px-tall box per knob — pass 3 found that nominal height didn't match the true rendered content and corrected both the height and the row y-positions."
  - "ADVANCED-page fix history, pass 3 (current, box-model correction): user review of pass 2 found the macro grid's row 2 labels rendering clipped at/near the panel's bottom edge, ~60px lower than the validator predicted — because the validator was checking pass 2's nominal 84px-tall box, not the DOM element's true rendered height. Audited the real CSS box model for every Advanced element (see box_model_audit block above the special_elements section for full methodology and per-element numbers). Grid knobs' true height is 72px (56px cap + 4.8px label margin + ~11.2px conservative label-line estimate) — the rows were then moved to y=320 (was 330) and y=415 (was 440) using this corrected height, giving row 1 exactly the requested ~20px clearance from the seam datum (y300) and row 2 a true 73px margin from the panel bottom (comfortably over the coordinator's 30px minimum). Output and the vertical labels were audited too and found already safe (their nominal boxes already exceed true rendered content) — no changes needed there."
  - "Impact arc-visibility bug: diagnosed and fixed. The arc math itself (buildKnobArc()/render() in the JS) is identical for every knob and was confirmed to match the reference image's own convention (re-examined: the reference's FEEDBACK knob at its default value of 50 also shows an arc spanning only the bottom-left-to-top range, i.e. the same 'left-half' shape at 50% — this is not unique to Impact and not a math error). The actual bug was CSS: .knob3-arc .arc-track (the always-visible background channel/track behind the blue value-fill) was rgba(255,255,255,0.08) — nearly invisible against the dark knob face. At default/partial values (e.g. Impact's 50%, unlike the macros which default to 100% and so show a visually-complete fill regardless), the unfilled remainder of the ring simply wasn't rendering, making the arc read as an incomplete/broken/asymmetric shape rather than a full recessed channel half-highlighted in blue. Fixed by raising the track to rgba(255,255,255,0.22) — clearly visible as a full 270-degree ring at every knob size, still subtle/recessed per the depth system. This is a global CSS fix (affects every knob, not just Impact) and was the correct place to fix it since the arc math itself was already correct and reference-accurate."
  - "Total: still exactly 19 APVTS parameters, same IDs as v1-v4 — trigger, buildLength, style, intensity, tension, chaos, impact, filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise, dryWet, output. Split across two pages: MAIN carries trigger, buildLength, style, intensity, dryWet (5). ADVANCED carries tension, chaos, impact, filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise, output (14). 5+14=19."
  - "triggerMode and page_nav are both non-APVTS UI state (parameter: null), matching architecture.md's documented non-parameter-state category — both still emit messages on change."
  - "Module macros default to 100% (unchanged, per architecture.md Resolved Open Questions)."
  - "v1, v2, v3, and v4 remain completely untouched on disk as design history. Within v5 itself, the MAIN page is also unchanged across all three Advanced-page fix passes — only the ADVANCED page's geometry, the removal of impact_mirror, the global arc-track CSS fix, and (this pass) the macro-grid box-model correction were touched, per the coordinator's explicit instruction not to touch Main."
