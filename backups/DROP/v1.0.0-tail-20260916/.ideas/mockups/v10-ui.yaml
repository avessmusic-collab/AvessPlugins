# DROP — UI Mockup v10 (design specification)
# ============================================================
# "Light Neumorphic" — Finalist B, presented alongside v9's
# "Dark Iridescent" (Finalist A) so the user can choose between
# the two before the design is locked for implementation.
#
# v9 is explicitly PROTECTED and untouched by this iteration.
# This is a brand-new visual system built on TOP OF v9's already
# validated geometry (reused verbatim, both pages) so the two
# finalists are a fair, apples-to-apples comparison: same control
# layout, same sizes, same interaction model — only the visual
# language differs.
#
# References read for this iteration:
#   - v10-reference-neumorphic-pedal.png (soft-UI guitar-pedal style
#     panel: light warm-gray body, dual-shadow raised/recessed
#     elements, large 3D domed knobs with a tiny position dot,
#     no printed numerals on knob faces, dark inset LCD readouts)
#   - v10-reference-neumorphic-suite.png (a fuller neumorphic
#     plugin-suite reference: dark neon module-selector cards,
#     dot-matrix-style orange readouts inside dark screens,
#     LED-ring progress indicator around a hero knob, small
#     macro-knob grid with "LABEL · NN%" caption pattern)
#
# User's verbatim requirement carried through every decision below:
#   "i want the knobs to have 3d apearence, and the surfaces to
#    have textures."
# ============================================================

meta:
  plugin: DROP
  version: 10
  iteration_of: v9 (kept untouched — protected finalist A)
  design_name: "Light Neumorphic"
  companion_finalist: v9 ("Dark Iridescent")
  status: "FINALIZED — selected by user 2026-09-14 as DROP's design (over v9 Dark Iridescent); locked for implementation"
  finalized: true
  finalized_date: 2026-09-14
  amended: "2026-09-14 (post-finalization, user direction): soap-bubble centerpiece REMOVED entirely; Main page center column rebalanced; marble asset whitened 30% toward white (original kept as v10-marble2-texture-hd-orig.jpg). See bubble_removal below."
  active_background_asset: v10-marble2-texture-hd.jpg
  reused_from_v9:
    - "Both pages' full control geometry (Main + Advanced), verbatim, unchanged."
    - "The 28-point soft-body bubble physics simulation and its HD densified
       render pipeline (catmullRomPos / densifyClosed / polylinePath),
       ported wholesale — byte-identical simulation and render math."
    - "The simulated-audio-input driver (simulatedInputLevel, kick+wiggle
       envelope, beat-synced pokes) and its debug-monitor sim toggle."
    - "The DROP trigger state machine (building -> peak -> vacuum -> impact
       -> recovery -> idle) and all phase-timing logic."
    - "Root-em ResizeObserver scaling model (BASE_W 1000 / BASE_H 560,
       clamp 0.75-1.5x, font-size-driven rem scaling, no viewport units)."
  changed_from_v9:
    - "Entire visual language: dark iridescent glass -> light neumorphic
       soft-UI with a warm off-white body."
    - "All knobs rebuilt as neumorphic dome-in-well controls: a recessed
       circular well (inset dual-shadow) containing a raised dome
       (outset dual-shadow + radial highlight), with NO printed numeral
       on the knob face — matches both references exactly, where knob
       value is legible only via a thin orange arc + a small rotating
       position dot on the dome rim."
    - "Knob value now displayed as 'LABEL · NN%' caption text beneath
       each knob (reference 2's pattern) instead of v9's on-glass overlay."
    - "Impact hero knob gains a 28-dot LED progress ring around its well,
       replacing v9's plain arc-only treatment."
    - "The dark bubble chamber is now framed as an inset dark LCD screen
       (rounded-rect, glass-bezel styling) rather than a circular chamber;
       the phase-label chip and progress strip are restyled as dot-matrix-
       style orange-on-black mini screens, matching the reference's
       LCD read-out language."
    - "Tension / Chaos / Output bare-number readouts become small dark
       inset mini-screens with orange monospace digits (previously plain
       text readouts)."
    - "Style selector becomes a dark neon card (purple glow accent),
       inspired by reference 2's module-selector chips."
    - "DROP trigger becomes a raised neumorphic pill with a physical
       press-in shadow-swap and an orange glow ring when armed."
    - "Accent color system: iridescent cyan/violet/magenta (v9) ->
       single warm orange accent (#E8823C / #FF9A4D) for all light-panel
       UI chrome. The bubble itself keeps its native iridescent palette
       unchanged, since it lives inside a dark screen exactly as it did
       in v9 and already reads well there."
    - "Added surface texture (pass 1, superseded by pass 2 below): a very
       low-opacity SVG feTurbulence noise layer across the whole body
       (plaster/crack read) plus small embossed dot-grid decorative
       clusters (pure background decoration, non-interactive, added with
       zero layout-validator risk since they are not registered controls)."
    - "PASS 2 (in-place refinement, same v10, per user feedback): body
       texture replaced with a convincing WHITE MARBLE surface — bright
       white base with soft branching gray veining (anisotropic
       feTurbulence, large-scale so it reads as slab veining rather than
       noise) plus a faint secondary fine-grain layer. Replaces the
       plaster/crack read entirely."
    - "PASS 2: the dark inset LCD bubble chamber was REMOVED — the
       iridescent soap bubble now floats directly on the white marble
       body. Bubble rendering retuned for the light background: stronger
       rim saturation/visibility, a translucent-but-legible interior fill
       (marble still shows through), white speculars kept, and a soft
       neutral gray contact shadow beneath it (was pure black, tuned for
       the old dark chamber). ALL physics/reactivity/pop behavior
       unchanged. The phase chip + progress strip that lived inside that
       screen moved onto the marble as light-theme neumorphic recessed
       wells (dark text, orange accents) instead of dark LCD elements."
    - "PASS 2: style/preset selector restyled from a dark neon purple-glow
       card to solid black/near-black, matching the same dark family used
       by the mini-LCD readout screens (tension/chaos/output/curve) —
       orange dot-matrix-style text, no purple neon remaining anywhere in
       the file."
    - "PASS 2: Impact knob centering bug found and fixed. Root cause: the
       rendered HTML used left:29.375rem (470px) for the impact knob-wrap
       while the YAML/validator table always specified x=435px — a stray
       35px rightward offset that was never actually in the rendered
       markup despite being documented as centered. Corrected to
       left:27.1875rem (435px), giving a true box-center of
       435 + 130/2 = 500px, matching the shared page-center axis (verified
       via pageNav 400..600 center=500, and wordmark/makerMark symmetry:
       (79+921)/2=500). Also fixed a related concentricity risk in the
       Impact LED dot-ring: it was appended to the knob-wrap (whose total
       height includes the caption text below the knob), so its 50%/50%
       anchor was NOT the well's true vertical center. Fixed by appending
       the ring directly to the well element itself (explicit square
       size, position:relative), making it provably concentric with the
       dome at every scale — same zero-ambiguity centering technique used
       for the knob value-arc and proven in v7's knob-arc fix."

window:
  width: 1000
  height: 560
  min_width: 800
  min_height: 450
  max_width: 1400
  max_height: 790
  resizable: true
  scaling_model: "root-em ResizeObserver (BASE_REM 16px, clamp 0.75x-1.5x on min(w/1000,h/560)); no viewport units used anywhere"

assets:
  - file: "v10-marble2-texture-hd.jpg"
    purpose: "ACTIVE body surface texture (PASS 7) -- referenced via CSS background-image: url(\"v10-marble2-texture-hd.jpg\") on #marbleImage, same folder as the test HTML. Bright white polished marble with delicate blue-gray veining, denser graceful veins across the upper band and calmer white below; replaces the rough stone photo, which the user found overwhelmed the UI. User pre-cropped this landscape slice, lightly sharpened."
    dimensions: "4201x2352 (source); rendered via background-size:cover so it scales proportionally with the panel, no fixed pixel dependency; no CSS filter/opacity/blend-mode applied to #marbleImage, so it renders at full clarity"
    production_note: >
      This is a real binary image asset, not something the WebView can inline
      as CSS/SVG. In the production JUCE build it must be bundled as a
      WebView resource (added to the plugin's resource-provider mapping
      alongside index.html/styles/scripts) and served at the same relative
      path the CSS references, so the background-image URL resolves
      identically to how it resolves here as a plain relative file reference
      in the browser mockup. Flag for the implementation stage: register
      v10-marble2-texture-hd.jpg (or a production-renamed equivalent) in the
      plugin's WebView resource bundle/manifest before wiring this design to
      real JUCE code.
  - file: "v10-stone-texture-hd.jpg"
    purpose: "ALTERNATE body surface texture (PASS 6, kept for A/B) -- the rougher natural-stone look (cream/beige, gray speckled zones, ochre tints). NOT currently referenced by any CSS (superseded by marble2 in pass 7 after the user found it overwhelmed the UI), but left on disk for comparison. If restored, its own pass-6 --text-halo (2px/.97, 6px/.85, 11px/.65) and warm blobShadow (#332E28, opacity 0.36-0.48) tuning should be restored too, since pass 7's values were relaxed specifically for the much-brighter marble2 image."
    dimensions: "4000x2240; same cover/no-repeat/center rules apply"
  - file: "v10-marble-texture-hd.jpg"
    purpose: "ALTERNATE body surface texture (PASS 5, kept for A/B) -- the polished Calacatta marble look. NOT currently referenced by any CSS. Its pass-5 --text-halo (2px/.95, 5px/.8, 9px/.55) and blobShadow (#2E3138, opacity 0.34-0.46) tuning happen to match pass 7's current (marble2) values exactly, since both images have similarly bright/gentle histograms -- so no retuning would be needed if this file is restored instead."
    dimensions: "3052x2196; same cover/no-repeat/center rules apply"
  - file: "v10-marble-texture.png"
    purpose: "REFERENCE ONLY (superseded, PASS 5) -- the original lower-resolution Calacatta source (1526x1098). No longer referenced by any CSS; retained purely as the original reference file, not bundled in production."

pages:
  - id: main
    label: "Main"
    description: >
      Minimal control surface: build-length step wells, phase/progress
      readout (light neumorphic recessed wells), a bubble that floats
      directly on the white marble body (no chamber), style/preset
      selector (solid black LCD-style card), DROP trigger (neumorphic
      pill), and two large hero neumorphic knobs (Intensity, Dry/Wet).
  - id: advanced
    label: "Advanced"
    description: >
      Trigger-mode pill, Tension/Chaos mini-LCD readouts, tension-curve
      dark screen, Impact hero knob with LED progress ring, 10-knob
      module macro grid (2 rows x 5), Output mini-LCD readout.

styling:
  design_language: "light neumorphic soft-UI, warm off-white body, dual-shadow raised/recessed elements, dark inset LCD screens for all numeric readouts"
  colors:
    body_bg: "#ECEDF1"
    body_bg_secondary: "#E3E5EB"
    page_backdrop_harness_only: "#9A9DA8"
    text_dark: "#5B5E6B"
    text_dark_dim: "#9296A3"
    text_strong: "#3C3F49"
    screen_bg_top: "#202226"
    screen_bg_bottom: "#17181B"
    accent: "#E8823C"
    accent_bright: "#FF9A4D"
    accent_glow: "rgba(232,130,60,0.55)"
    bubble_palette: "iridescent cyan/violet/magenta/gold gradient system retained (rim/pop colors slightly more saturated in pass 2 for legibility against the light marble body); interior fill gradient retuned from v9's glass-on-dark values to a translucent gray-blue-tinted fill so the bubble reads clearly while the marble still shows through; contact shadow retuned to soft neutral gray (was pure black, tuned for the removed dark chamber)"
    marble_veins: "PASS 4: real HD Calacatta marble photograph (v10-marble-texture.png, user-supplied reference) — hand-authored SVG strokes (pass 3) could not reach photographic fidelity; the actual photo is now the body surface, lightened by a white veil where needed for legibility; see texture.body_marble_veins below for the full implementation + sampled-pixel honesty check"
  neumorphic_shadow_tokens:
    raised_shadow_dark: "8px 8px 16px rgba(160,163,175,0.55)"
    raised_shadow_light: "-8px -8px 16px rgba(255,255,255,0.95)"
    raised_shadow_dark_sm: "4px 4px 8px rgba(160,163,175,0.5)"
    raised_shadow_light_sm: "-4px -4px 8px rgba(255,255,255,0.9)"
    recessed_inset_dark: "inset 4px 4px 8px rgba(160,163,175,0.55)"
    recessed_inset_light: "inset -4px -4px 8px rgba(255,255,255,0.9)"
    recessed_inset_dark_sm: "inset 2px 2px 4px rgba(160,163,175,0.5)"
    recessed_inset_light_sm: "inset -2px -2px 4px rgba(255,255,255,0.85)"
    single_light_source_convention: "top-left warm light, bottom-right shadow — applied consistently to every raised/recessed element"
  fonts:
    primary: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    mono_lcd: "'IBM Plex Mono', 'SF Mono', monospace"
  texture:
    body_marble_veins: >
      History: PASS 5 (Calacatta, p2 lum ~164) used --text-halo 2px/.95,
      5px/.8, 9px/.55 and blobShadow #2E3138/opacity 0.34-0.46. PASS 6
      (rough stone, p2 lum ~98, much darker/busier) strengthened the halo to
      2px/.97, 6px/.85, 11px/.65 and warmed the blobShadow to #332E28/opacity
      0.36-0.48 -- but the user found the rough stone photo overwhelmed the
      UI and replaced it.
      PASS 7 (current, active): new reference -- a bright white polished
      marble with delicate blue-gray veining (v10-marble2-texture-hd.jpg,
      4201x2352, denser graceful veins across the upper band, calmer white
      below, user-cropped and lightly sharpened). #marbleImage now points at
      this file; architecture unchanged: NO CSS filter/opacity/blend-mode on
      #marbleImage (full clarity), background-size:cover + no-repeat scales
      proportionally on resize with no viewport units, no global veil, every
      opaque neumorphic surface still fully occludes the marble beneath it.
      Because this image is much brighter than the rough stone (closer to
      the original Calacatta, in fact gentler still), the pass-6 halo
      strength read as visibly heavy/opaque against its near-white zones, so
      it was RELAXED back to the pass-5 values -- verified comfortable
      clearance first (see visibility check below). The blobShadow was
      reverted to the cooler #2E3138/pass-5 opacity family, since the warm
      tint tuned for the ochre stone no longer suits a cool blue-gray-veined
      white marble (a color-harmony judgment, not a contrast necessity --
      see shadow-specific note below).
    body_marble_veins_visibility_check: >
      Honesty check re-run against the ACTUAL new marble2 image (not reused
      stone/Calacatta numbers): sampled v10-marble2-texture-hd.jpg
      (4201x2352, downsampled 4x for speed) via PIL, computed perceptual
      luminance per pixel. Results: min 52.3, p1 179.1, p2 196.6, p5 211.9,
      p10 219.9, median 229.0, mean 226.5 -- substantially brighter/gentler
      than both the rough stone (p2 98.4) and even the original Calacatta HD
      image (p2 163.9); this photo has the mildest, most delicate veining of
      the three tried so far.
      UI text-color luminances (unchanged): text_strong #3C3F49 = 63.1,
      text_dark #5B5E6B = 94.3, accent #E8823C (kv-num) = 146.6,
      text_dark_dim #9296A3 = 150.1.
      WITHOUT any halo at all: text_dark (94.3) vs this image's p2 typical
      zone (196.6) = 102.3-level delta; text_dark_dim (150.1) vs p2 = 46.5;
      even against the absolute darkest outlier pixel (52.3), text_dark_dim
      still clears by 97.8. In other words, this specific image poses no
      real legibility risk even unprotected -- a sharp contrast with pass 6's
      near-total collision on the stone photo.
      Relaxed --text-halo back to pass-5 strength: 0 0 2px rgba(255,255,255,.95),
      0 0 5px rgba(255,255,255,.8), 0 0 9px rgba(255,255,255,.55). Verified
      BEFORE reverting: innermost layer (2px, .95 alpha) composited over the
      absolute darkest outlier pixel in this image (52.3) = (1-.95)*52.3 +
      .95*255 = 244.9. Resulting deltas against every UI text color at that
      worst-case composited value: text_strong 181.8, text_dark 150.6,
      accent 98.3, text_dark_dim 94.8 -- all comfortably clear (94+ level
      margins on the actual darkest pixel in the whole image, not just a
      typical zone), confirming the relaxation is safe, not merely
      convenient. Because the halo is lighter now, the marble's delicate
      veining reads with full clarity everywhere except the handful of px
      immediately behind label glyphs.
      Orange arcs re-confirmed structurally protected without any treatment:
      every knob-arc SVG lives inside a knob-well with a solid opaque
      var(--body-bg) fill -- arcs never touch raw marble pixels on either
      page; accent color (#E8823C) unchanged across all three background
      passes.
      Bubble grounding shadow: reverted fill to #2E3138 (lum ~48.9, below
      this image's own darkest sampled pixel of 52.3) and opacity ramp to
      0.34-0.46 (the pass-5 values). A plain dark ellipse silhouettes clearly
      against any zone of this bright image regardless of exact color
      choice, so this revert is a color-harmony judgment (cool tint matches
      the marble's blue-gray veins better than the warm tint tuned for the
      ochre stone), not a response to a measured contrast failure.
    body_fine_grain: "remains removed (pass 4 decision unchanged) -- the synthetic feTurbulence grain layer stays unnecessary now that the real HD photograph supplies authentic grain/detail at higher fidelity than the original PNG"
    dot_grid_accents: "small 4-column embossed-dot clusters (3px dots, subtle inset+highlight shadow) placed as pure background decoration near unused panel corners; non-interactive, not registered as layout-validated controls; unchanged since pass 2"
  dot_matrix_readouts:
    approximation_note: >
      True bitmap dot-matrix glyphs were not used; approximated via
      IBM Plex Mono, uppercase, wide letter-spacing, orange color with
      a soft text-shadow glow to read as an LCD/VFD-style digital
      readout at typical viewing size. Documented here as a deliberate
      stylistic approximation, not a literal dot-matrix font asset.

controls:
  # ---- Header / navigation (shared both pages) ----
  - id: pageNav
    type: page_nav
    page: [main, advanced]
    position: { x: 400, y: 16 }
    size: { width: 200, height: 28 }
    style: "neumorphic recessed pill track, raised sliding indicator, 420ms spring-eased slide"

  # ---- MAIN PAGE ----
  - id: buildLength
    type: combo
    page: main
    position: { x: 40, y: 112 }
    size: { width: 252, height: 58 }
    values: [1, 2, 4, 8, 16]
    default: 4
    label: "BUILD LENGTH (BARS)"
    style: "5 recessed circular wells; active well gets an orange ring + glow"

  - id: phaseChip
    type: readout
    page: main
    position: { x: 420, y: 70 }
    size: { width: 160, height: 18 }
    style: "light neumorphic recessed pill — dark dim text + neutral LED dot at rest, switching to orange text + glowing LED dot while a drop is in progress; anchors the top of the center column"

  # (orbWrap / soap-bubble visualizer REMOVED 2026-09-14 — see bubble_removal below)

  - id: style
    type: combo
    page: main
    position: { x: 390, y: 180 }
    size: { width: 220, height: 36 }
    values: ["Clean EDM","Big Room","Techno Pressure","Dark Techno","Trap Pull","DnB Rush","Hyper","Cinematic","Minimal","Vocal Build","Drum Build","Synth Build","Full Mix","Destroy","Vacuum","Reverse Energy"]
    default: "Clean EDM"
    label: "Style"
    style: "PASS 2: restyled to solid black/near-black, matching the same dark family used by the mini-LCD readout screens (was a purple-glow neon card) — orange dot-matrix-style text, chevron nav either side, reads as '‹ CLEAN EDM ›' on a small dark inset screen"

  - id: trigger
    type: toggle
    page: main
    position: { x: 360, y: 260 }
    size: { width: 280, height: 64 }
    label: "DROP"
    style: "raised neumorphic pill, enlarged to hero scale after the bubble's removal (now the Main page's centerpiece interaction); press-in inset shadow-swap on click; orange glow ring while armed"

  - id: progressStrip
    type: readout
    page: main
    position: { x: 380, y: 360 }
    size: { width: 240, height: 12 }
    style: "light neumorphic recessed track, widened after the bubble's removal — orange fill bar + drop-marker tick; fill brightness/glow now scales with tension x input level (see progress_strip_visualization_contract)"

  - id: intensity
    type: slider
    page: main
    position: { x: 66, y: 200 }
    size: { width: 220, height: 300 }
    range: [0.0, 100.0]
    default: 50.0
    label: "Intensity"
    control_style: "hero neumorphic knob (11rem well / 7.5rem dome), thin orange value arc, rotating position dot, 'INTENSITY · NN%' caption below"

  - id: dryWet
    type: slider
    page: main
    position: { x: 714, y: 200 }
    size: { width: 220, height: 300 }
    range: [0.0, 100.0]
    default: 100.0
    label: "Dry/Wet"
    control_style: "hero neumorphic knob (identical treatment to Intensity)"

  # ---- ADVANCED PAGE ----
  - id: triggerMode
    type: combo
    page: advanced
    position: { x: 40, y: 80 }
    size: { width: 248, height: 32 }
    values: [manual, midi, auto]
    default: manual
    label: "Trigger Mode"
    style: "neumorphic 3-way pill, same mechanic as pageNav"

  - id: tension
    type: slider
    page: advanced
    position: { x: 40, y: 150 }
    size: { width: 108, height: 56 }
    range: [0.0, 100.0]
    default: 50.0
    label: "Tension"
    control_style: "dark inset mini-LCD, orange monospace digits, chevron step buttons, drag-to-adjust"

  - id: chaos
    type: slider
    page: advanced
    position: { x: 158, y: 150 }
    size: { width: 108, height: 56 }
    range: [0.0, 100.0]
    default: 0.0
    label: "Chaos"
    control_style: "identical mini-LCD treatment to Tension"

  # POST-FINALIZATION AMENDMENT (2026-09-15, Stage 3 GUI Phase 4.2) - see
  # midi_trigger_note_chip note below for full rationale/geometry-derivation.
  - id: midiNoteChip
    type: readout_stepped
    page: advanced
    position: { x: 276, y: 150 }
    size: { width: 108, height: 56 }
    non_apvts: true
    default: 60 # C3 - matches PluginProcessor.h's kDefaultMidiTriggerNote
    label: "MIDI Note"
    control_style: "identical mini-LCD treatment to Tension/Chaos (dark inset screen, orange monospace note-name readout, up/down chevron step - no drag, discrete note picker) - dimmed/inert (0.4 opacity, pointer-events:none) except while Trigger Mode == MIDI; bridged via 'setMidiTriggerNote'/'getInitialUIState' native functions, NOT a WebSliderRelay (same non-parameter-state treatment as triggerMode)"

  - id: curveBox
    type: visualizer
    page: advanced
    position: { x: 620, y: 80 }
    size: { width: 300, height: 140 }
    style: "dark inset LCD screen, orange curve line + dot playhead, glass gloss sweep"

  - id: impact
    type: slider
    page: advanced
    position: { x: 435, y: 100 }
    size: { width: 130, height: 150 }
    range: [0.0, 100.0]
    default: 50.0
    label: "Impact"
    control_style: "hero neumorphic knob with a 28-dot LED progress ring around the well; box-centered on x=500, the shared page-center axis (verified via pageNav center and wordmark/makerMark symmetry)"
    centering_fix_pass2:
      bug_found: "the RENDERED HTML used left:29.375rem (470px) for the knob-wrap, NOT the documented x=435px — a 35px rightward offset never present in the YAML/validator table but present in the actual markup, so Impact visibly sat right-of-center despite the file 'saying' it was centered"
      fix_applied: "left corrected to 27.1875rem (435px); wrap width unchanged at 8.125rem (130px)"
      verified_center_x: "435 + 130/2 = 500px, exactly on the page-center axis"
      led_ring_concentricity_bug_found: "the 28-dot LED ring svg was appended to the knob-wrap element (whose total box height includes the caption text below the knob), so its top:50% anchor was pulled toward the midpoint of (well + label) rather than the well's true vertical center -- a latent vertical-offset risk"
      led_ring_fix_applied: "svg now appended directly to the well element itself (explicit 6.5rem square, position:relative), so its 50%/50% + translate(-50%,-50%) anchor is provably concentric with the dome at every scale, independent of caption height -- same zero-ambiguity technique used for the value-arc and proven in v7's knob-arc fix"

  - id: filter
    type: slider
    page: advanced
    position: { x: 168, y: 320 }
    size: { width: 60, height: 72 }
    range: [0.0, 100.0]
    default: 100.0
    label: "Filter"
    control_style: "small neumorphic macro knob (3.4rem well / 2.1rem dome), 'FILTER · NN' caption"

  - id: width
    type: slider
    page: advanced
    position: { x: 284, y: 320 }
    size: { width: 60, height: 72 }
    range: [0.0, 100.0]
    default: 100.0
    label: "Width"
    control_style: "small neumorphic macro knob"

  - id: pitch
    type: slider
    page: advanced
    position: { x: 400, y: 320 }
    size: { width: 60, height: 72 }
    range: [0.0, 100.0]
    default: 100.0
    label: "Pitch"
    control_style: "small neumorphic macro knob"

  - id: gate
    type: slider
    page: advanced
    position: { x: 516, y: 320 }
    size: { width: 60, height: 72 }
    range: [0.0, 100.0]
    default: 100.0
    label: "Gate"
    control_style: "small neumorphic macro knob"

  - id: stutter
    type: slider
    page: advanced
    position: { x: 632, y: 320 }
    size: { width: 60, height: 72 }
    range: [0.0, 100.0]
    default: 100.0
    label: "Stutter"
    control_style: "small neumorphic macro knob"

  - id: delay
