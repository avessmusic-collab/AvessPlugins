tail_parameter:
  date: 2026-09-16
  phase: "POST-1.0 improvement (dsp-agent), user-directed - fixes 3 real-DAW-testing bugs (instant cut at Impact->Recovery, a post-impact effect-blast artifact, stale delay/reverb tails with no reset before the next build) plus this approved feature. Plugin stays at version 1.0.0 per this repo's factory convention until public release."
  reason: "The fix design requires a user-controllable ring-out length for the Recovery state (previously a fixed/Style-derived musical division with no user control and no way to let tails audibly ring out) - see plugins/DROP/CHANGELOG.md and PluginProcessor.h's 'POST-1.0 IMPROVEMENT' doc comment for full root-cause detail."
  design: "A small macro-style knob (id `tail`), IDENTICAL visual treatment to the 10 existing module-macro knobs (Filter/Width/.../Noise - same 60x72px knob-wrap, 3.4rem well, 2.1rem dome, knob-label-small caption class), placed in the Advanced page's left column below the Tension/Chaos/MIDI-Note mini-screens (which occupy top:150px, height:56px -> bottom edge 206px) and above the module-macro grid (top:320px) - the x=40-160/y=230-320 zone was verified free of every other Advanced-page control via the same bounds/overlap/min-gap validator this file's other amendments use. Vertical gaps: 206px (mini-screens bottom) -> 230px (tail top) = 24px clearance; 230+72=302px (tail bottom) -> 320px (macro row top) = 18px clearance - both comfortably clear the documented control_gap_min of 10px."
  caption_format: "'TAIL · NN%' - includes the '%' unit span (unlike the other 10 small macro knobs, which omit it since their underlying macro-multiplier semantics don't read naturally as a percentage of anything visible) because `tail` IS meaningfully a percentage of its own 0-100% UI range, exactly like the hero knobs' caption convention (e.g. 'INTENSITY · NN%')."
  binding: "Standard WebSliderRelay/WebSliderParameterAttachment pair (APVTS parameter, NOT non-parameter state) - Source/PluginEditor.h/.cpp gained the 20th relay+attachment (tailRelay/tailAttachment), appended after outputRelay/outputAttachment, matching createParameterLayout()'s own append-only parameter ordering."
  files_touched: "Source/ui/public/index.html AND .ideas/mockups/v10-ui.html (kept byte-identical, both files edited in lockstep) - markup only (#knob-wrap[data-param='tail'], auto-discovered by the existing generic `document.querySelectorAll('.knob-wrap')` initKnob() loop - NO JS changes needed, gesture-bracketing/drag/wheel/dblclick/glow behavior is already fully generic); Source/PluginEditor.h/.cpp (20th relay+attachment); this YAML (control entry + this note + parameter_id_reference update); plugins/DROP/.ideas/parameter-spec.md (new `tail` entry + amendment note); plugins/DROP/.ideas/creative-brief.md (parameter table row + UI concept note)."

midi_trigger_note_chip:
  date: 2026-09-15
  phase: "Stage 3 GUI Phase 4.2 (Parameter Binding and Interaction), gui-agent"
  reason: "v10-integration-checklist.md Section 5 flagged a known gap: architecture.md lists a configurable MIDI trigger note as non-parameter state, and plan.md's Phase 4.2 test criteria name a MIDI-note-picker UI as a goal, but the finalized v10 mockup shipped with NO UI element for it (option 1 of the checklist's two resolution choices was taken provisionally through Phase 4.1). This amendment implements the checklist's option 2 (small design-consistent addition) instead of leaving the gap unresolved, since plan.md Phase 4.2 explicitly requires it."
  design: "A third mini-screen chip, id midiNoteChip, added to the SAME row as Tension/Chaos (top:150px/9.375rem, height:56px/3.5rem - identical to both), positioned immediately after Chaos with the SAME 10px/0.625rem gap Tension->Chaos already uses: chaos ends at x=158+108=266px, +10px gap = 276px start (matches Tension->Chaos's own 40+108=148, +10=158 pattern exactly, so the row reads as one consistent family of 3 equal-width screens, not a mismatched addition). Verified clear of every other Advanced-page control: Impact knob-wrap starts at x=435px (35+px clearance), well past midiNoteChip's right edge at 276+108=384px."
  label_and_value: "Label 'MIDI NOTE' (same .mini-screen-label treatment); value is the note name (e.g. 'C3'), not a raw number, in the same orange monospace .mini-screen-value styling as Tension/Chaos/Output's numeric readouts - octave numbering is an internal JS<->C++ convention (note 60 -> 'C3'), not tied to any specific DAW/plugin-format standard, since none is authoritative across hosts."
  interaction: "Up/down chevrons only (no drag-to-adjust, unlike Tension/Chaos/Output) - a discrete 1-127 note picker is better served by single-step increments than a continuous drag gesture; matches the control's non-parameter, non-continuous nature."
  enabled_state: "Dimmed (0.4 opacity) and pointer-events:none except while the Trigger Mode pill (triggerMode, also non-APVTS) is set to MIDI - ships in the default-disabled visual state in the static markup (mode-pill defaults to MANUAL), toggled live by the same JS that drives the mode-pill's own active-state indicator."
  binding: "NON-APVTS, matching triggerMode's own treatment (architecture.md: MIDI trigger note is non-parameter ValueTree/atomic state, not host-automatable) - bridged via a new 'setMidiTriggerNote' native function (JS->C++) plus an added `midiTriggerNote` field folded into the EXISTING 'getInitialUIState' one-shot native-function read (no new fetch call needed at load), NOT a WebSliderRelay/WebSliderParameterAttachment pair."
  files_touched: "Source/ui/public/index.html AND .ideas/mockups/v10-ui.html (kept byte-identical, both files edited in lockstep) - markup (#midiNoteChip), CSS (.mini-screen.disabled), JS (note-name formatting, chevron handlers, enabled-state toggle wired into setTriggerModeUI, initial-state fetch); Source/PluginEditor.cpp ('setMidiTriggerNote' native function, 'getInitialUIState' extended); this YAML (control entry + this note)."

