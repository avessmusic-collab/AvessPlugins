progress_strip_visualization_contract:
  note: "With the bubble gone, the progress strip carries the spec's 'input level + tension visible' requirement: its orange fill color mixes toward a brighter orange and gains a drop-shadow glow scaled by tension x input level during an active drop."
  test_harness: "simulatedInputLevel(nowSec) (kick envelope + mid-freq wiggle) retained in v10-ui-test.html solely to drive the strip glow; SIMULATED INPUT toggle + level readout remain in the debug monitor. Test-HTML-only."
  production_binding: "v10-ui.html consumes the dropVis WebView event per architecture.md's lock-free ring buffer { progress, tensionLevel, currentState, inputRMS, activeModuleWeights[10] }: progress/currentState drive the strip fill + phase chip; tensionLevel x inputRMS drives the strip glow. activeModuleWeights's bubble-era consumer was removed with the bubble; Stage 3 GUI Phase 4.3 gave it a new design-consistent consumer (Advanced-page module-macro knob arc glow) - see module_weight_arc_glow below."

module_weight_arc_glow:
  date: 2026-09-16
  phase: "Stage 3 GUI Phase 4.3 (Visualization), gui-agent"
  reason: "plan.md Phase 4.3 test criterion: 'Active-effects indication reflects actual IntensityBudget weights, not static UI state.' The finalized v10 design has no per-module weight display on the Main page (the bubble, which was the originally-planned consumer of activeModuleWeights[10], was removed 2026-09-14 - see bubble_removal above), and adding a brand-new dedicated meter/graph component would depart from the finalized design. Resolved minimally and design-consistently instead: each of the 10 Advanced-page module-macro knobs' existing orange arc glow (`.arc-fill`'s CSS `filter: drop-shadow(...)`, already present on every knob at a static 2px radius) subtly intensifies with that module's own live weight during an active drop."
  design: "No new markup/CSS/SVG - reuses the exact drop-shadow-blur-radius technique the progress strip's STRIP GLOW (progress_strip_visualization_contract, above) already established for the same visualization contract. `initKnob()`'s returned object gained a `setWeightGlow(w)` method (w in 0..1, already-smoothed) that sets `arc.fill.style.filter` to a wider-radius drop-shadow when w > 0.02, or clears the inline style (reverting to the CSS default 2px glow) when idle/near-zero - 'idle = no glow change' holds by construction, not by a separate idle-state branch."
  data_mapping: "MODULE_MACRO_ORDER = [filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise] - identical to both the PINNED activeModuleWeights[10] index order (PluginProcessor.h's VisualizationFrame doc comment / drop::BudgetModule's enum order) and the 10 module-macro knobs' own existing data-param authoring order in this file's markup, so index i of activeModuleWeights maps directly to MODULE_MACRO_ORDER[i]'s knob with no separate lookup table. computeWeights()'s result is already juce::jlimit(0,1,...)-clamped per module (IntensityBudget.cpp), so no client-side rescaling is needed."
  smoothing: "Per-knob exponential lerp (moduleGlowCurrent[i] += (target - current) * 0.18) toward the live target every rAF frame, batched inside the SAME single frame_() loop that already drives the strip glow / phase chip / progress strip / curve dot - juce8-critical-patterns.md #20 (separate current/target, no instant jumps). A single shared lerp speed (vs. STRIP GLOW's asymmetric attack/decay Spring) was chosen deliberately: this is a subtle multi-element ambient indicator, not a peak-reading meter, so symmetric smoothing reads calmer with 10 simultaneous glow elements."
  cpu_note: "10 extra `element.style.filter` writes per rAF frame (~60Hz), each a paint-only property change (no layout reflow) - negligible, well within Phase 4.3's 'no CPU spikes from visualization' criterion; folded into the existing rAF loop rather than adding a new timer/loop."
  files_touched: "Source/ui/public/index.html AND .ideas/mockups/v10-ui.html (kept byte-identical, both files edited in lockstep) - JS only (initKnob()'s setWeightGlow, MODULE_MACRO_ORDER/moduleGlowCurrent state, frame_()'s new glow-update block, updated activeModuleWeights doc comment on the dropVisUpdate listener); this YAML (this note + the progress_strip_visualization_contract production_binding update above)."

