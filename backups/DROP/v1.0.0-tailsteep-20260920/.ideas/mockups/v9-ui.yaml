# v9 UI Design Specification
# Plugin: DROP
# Generated: 2026-09-14
# v9 = v8 PLUS an HD pass on the bubble centerpiece only (both pages'
# layout, knobs, and the v8 accent system carry over VERBATIM -- this is a
# bubble-only iteration). User feedback (verbatim): "make the bubble hd,
# it is slightily bad resolution. make it move and react to the incomming
# sound. ... make its outline alot smaller. plus make it more visible." +
# two HD reference images (hd-ref-soap_bubbles_PNG109999.png, 6000x6000,
# PRIMARY -- very thin rim, bright translucent cyan-white interior with
# soft internal reflections; hd-ref-soap_bubbles_PNG110011.png, 8000x8000,
# secondary -- membrane falloff/specular placement study; both read before
# implementing). Four changes, physics simulation UNCHANGED throughout:
# (1) HD rendering -- the 28 physics points are now densified into ~112
# Catmull-Rom-interpolated render samples every frame, and every heavy
# blur filter was cut or removed; (2) the iridescent outline shrank from
# v8's chunky 3-layer/7px ring to two thin layers (~1.3-2.6% of the new
# diameter, no blur); (3) the bubble grew to ~172px resting diameter
# (fills most of its 200px chamber) and the interior fill got dramatically
# brighter (was near-invisible in v8) with two new soft drifting internal-
# reflection blobs; (4) a simulated audio input (looping kick-pattern
# envelope + mid-frequency wiggle, toggle-able in the debug monitor) now
# drives the existing agitation/poke system continuously, independent of
# the DROP trigger, so the bubble is always visibly moving/reacting --
# production binds this same injection point to the real AudioAnalyzer
# feed, see audio_reactivity_contract below. See bubble_rendering_v9
# below for the full spec. v1-v8 remain on disk, untouched, as design
# history.

window:
  width: 1000
  height: 560
  resizable: true
  min_width: 800
  min_height: 450
  max_width: 1400
  max_height: 790
  scaling_model: "root-em-resize-observer"
  base_root_font_size_px: 16

colors:
  # v8 CHANGE 2: flat electric-blue accent REPLACED by an iridescent oil-film
  # gradient system. Charcoal panel/body palette (upper/lower zone, text)
  # stays byte-identical — only the accent identity changed.
  upper_zone_bg: "#17181B"                    # unchanged
  lower_zone_bg: "#202226"                    # unchanged
  lower_zone_top_highlight: "#2A2C31"         # unchanged
  text_primary: "#E9EAED"                     # unchanged (already high contrast)
  text_label: "#9DA0A8"                       # unchanged from v6/v7
  text_label_dim: "#6E7076"                   # unchanged from v6/v7
  accent_cyan: "#3FD3E0"                      # new — primary iridescent hue 1
  accent_violet: "#A868D8"                    # new — gradient midpoint / flat-fallback color
  accent_magenta: "#C64DBE"                   # new — primary iridescent hue 2
  accent_gold: "#E0B84D"                      # new — used SPARINGLY (bubble film only, not general UI chrome)
  accent: "#A868D8"                           # was #3B9BFF (flat blue) — now the violet midpoint, used only where a single flat color is unavoidable (e.g. curve-type-label text)
  accent_dim: "#7A5A96"                       # was #2F6BAF
  accent_glow_a: "rgba(63,211,224,0.5)"       # cyan glow half of every two-tone glow pair
  accent_glow_b: "rgba(198,77,190,0.5)"       # magenta glow half of every two-tone glow pair
  page_backdrop: "#D7D9DC"                    # test-HTML-only floating-panel backdrop, unchanged
  numeral_policy: "Knob AND bare-readout (Tension/Chaos/Output) numerals both stay neutral white (var(--text-primary)) for legibility, per explicit direction ('Knob numerals/labels stay neutral white/gray') — extended to bare-readout numerals too for consistency (design judgment, documented here): the new accent lives in soft two-tone (cyan+magenta) text-shadow glows behind the numerals, never in the numeral color itself."

typography: "unchanged from v3/v4"
motion: "unchanged from v3/v4 — critically-damped spring integrator for continuous orb motion, cubic-bezier(0.34,1.56,0.64,1) for discrete UI feedback"

# ---------------------------------------------------------------------------
# CHANGE 1 — 3D DEPTH SYSTEM (new in v5)
# ---------------------------------------------------------------------------
depth_system:
  philosophy: >
    Single consistent light source from above. Every element is either
    RAISED (knobs, the DROP button, the lower "deck") or RECESSED (the
    upper "well", the tension-curve display, step-circles, the progress
    strip track, the bare-readout number chips, the orb's chamber) —
    never ambiguous. Depth communicated entirely through shadow/highlight
    physics (contact + ambient shadow pairs, inset shadows, rim
    highlights) — no fake perspective, no skeuomorphic ornamentation, text
    stays perfectly flat/legible.
  raised_elements:
    knobs:
      superseded_in_v7: "the v5/v6 single-layer radial-gradient cap description below is SUPERSEDED by knob_3d_material (see that section for the current two-layer outer-rim + inset-domed-face system) — kept here only as history of what v5/v6 shipped."
      cap_gradient_v5_v6_history: "multi-stop radial-gradient(circle at 34% 23%, #3a3d44 0%, #2c2e33 25%, #212226 55%, #17181b 85%, #0f1012 100%) — simulates a domed cap lit from above (user feedback in v7: 'still read as flat shaded circles')"
      rim_highlight_v5_v6_history: "radial-gradient(ellipse 60% 30% at 50% 9%, rgba(255,255,255,0.17), transparent 70%) layered as a second background — crisp bright catch-line along the top rim"
      texture_v5_v6_history: "repeating-linear-gradient brushed texture at ~2% opacity, third background layer — kept extremely subtle, reads as matte, not noisy"
      shadow: "v7: 0 2px 3px rgba(0,0,0,0.55) [tight contact shadow] + 0 14px 30px rgba(0,0,0,0.48) [wide soft ambient shadow] + inset 0 1px 0 rgba(255,255,255,0.12) [rim] + inset 0 -2px 3px rgba(0,0,0,0.4) [outer rim internal shade] — strengthened slightly from v5/v6 for a more physically substantial puck read"
    drop_button:
      idle: "thick raised pill — same contact+ambient shadow pairing as knobs, plus inset top rim highlight for a rounded-edge read"
      pressed: "shadow collapses to a tight, low-opacity contact shadow only (ambient shadow removed); transform: translateY(2px) scale(0.97) — a genuine physical depression, not just a scale bounce"
  recessed_elements:
    upper_zone: "recessed well — a dark linear-gradient overlay (opacity 0.35 -> 0 over the top ~50px) sits just below the header, reading as a shadow cast into the recess by the panel's own top bezel"
    tension_curve_display: "inset 0 2px 4px rgba(0,0,0,0.5) + inset 0 -1px 0 rgba(255,255,255,0.03), unchanged dark fill from v4"
    step_circles: "flipped from v4's raised-chip look to a true recessed well: radial-gradient(circle at 50% 40%, #16171a, #0e0f11) fill + inset 0 3px 6px rgba(0,0,0,0.7); the active state's blue glow now reads as LED light spilling out of the well (inset blue glow + outer glow combined) rather than a raised highlight"
    progress_strip: "wrapped in a thin recessed track (dark fill + inset shadow) instead of a bare stroked rect"
    bare_readout_chips: "Tension/Chaos/Output/Impact-mirror numerals now sit inside a small recessed panel (dark fill + inset shadow + rounded corners), not bare floating text — padding added via box-sizing:border-box so the control's already-validated outer bounding box is unchanged"
    orb_chamber: "a dark radial-gradient well (#0c0d0f center -> transparent) plus inset shadow sits behind the orb (stronger shadow at the top interior edge, faint highlight at the bottom — consistent with the top-down light source), reading as a recessed glass chamber the orb floats inside"
  panel_seam_emboss: >
    The curved notch boundary between zones now renders as two offset
    strokes instead of one: a dark crease (rgba(0,0,0,0.5), drawn first)
    and a light catch-line 1.5px below it (rgba(255,255,255,0.20), drawn
    second) — a real emboss read, not a flat divider line.

# ---------------------------------------------------------------------------
# CHANGE 2 — TWO PAGES (restored, per explicit user direction)
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# v6 CHANGE 1 — KNOB VALUE-ARC CONCENTRICITY FIX
# ---------------------------------------------------------------------------
knob_arc_fix:
  bug_report: >
    User: "blue arches around knobs are all out of place" — every knob's
    blue value arc rendered offset up-and-left of its cap, visible clearly
    on Main's large Intensity/Dry-Wet knobs and more subtly on the
    macro grid.
  root_cause: >
    .knob3-arc (the arc SVG overlay) was an absolutely-positioned <svg>
    with `inset: -10%` and NO explicit width/height attributes or CSS
    width/height. An <svg> used this way is a CSS "replaced element" —
    per the CSS2.1 absolutely-positioned-replaced-element algorithm,
    when width/height compute to 'auto' (which happens here, since only
    the four inset offsets were specified, not width/height directly),
    browsers fall back to the element's intrinsic size / viewBox-derived
    aspect ratio rather than reliably "stretching" to fill the inset box
    the way a normal (non-replaced) element would. This is a well-known,
    historically UA-inconsistent CSS corner case — exactly why the arc
    read as "offset" rather than a clean, predictable transform error.
  fix: >
    Replaced the inset-based sizing with explicit percentage width/height
    (120% each — no longer 'auto', so the replaced-element special case
    no longer applies) plus transform-based centering: `top:50%; left:50%;
    transform: translate(-50%,-50%)`. This technique has zero UA
    ambiguity and is scale-invariant by construction (percentages and
    transform-percentages both resolve against/relative-to the same
    element's own box at every root-em scale factor). Also added explicit
    width="100%" height="100%" SVG attributes at element-creation time in
    JS as a belt-and-suspenders redundancy.
  verification_proof: >
    Algebraic proof that arc-center == cap-center for every knob size W
    (all knob caps are square, W x W, explicit inline CSS):
      top:50% -> arc box top-left.y (pre-transform) = 0.5W
      left:50% -> arc box top-left.x (pre-transform) = 0.5W
      width:120%/height:120% -> arc box size = 1.2W x 1.2W (resolves
        cleanly against the W x W containing block — non-auto, no
        replaced-element ambiguity)
      transform: translate(-50%,-50%) shifts by -50% of the ARC's OWN
        box size (1.2W), i.e. -0.6W in x and y
      final arc box top-left = (0.5W-0.6W, 0.5W-0.6W) = (-0.1W, -0.1W)
      final arc box center = (-0.1W+0.6W, -0.1W+0.6W) = (0.5W, 0.5W)
      cap center (by definition) = (0.5W, 0.5W)
      => offset = (0, 0) for every W, at every scale.
  verification_numbers:
    - { knob: "Intensity (Main)",        cap_px: 200, arc_box_px: 240.0, cap_center: [100.0, 100.0], arc_center: [100.0, 100.0], offset_px: [0.0, 0.0] }
    - { knob: "Dry/Wet (Main)",          cap_px: 200, arc_box_px: 240.0, cap_center: [100.0, 100.0], arc_center: [100.0, 100.0], offset_px: [0.0, 0.0] }
    - { knob: "Impact (Advanced)",       cap_px: 112, arc_box_px: 134.4, cap_center: [56.0, 56.0],   arc_center: [56.0, 56.0],   offset_px: [0.0, 0.0] }
    - { knob: "Macro knobs x10 (Advanced)", cap_px: 56, arc_box_px: 67.2, cap_center: [28.0, 28.0],  arc_center: [28.0, 28.0],   offset_px: [0.0, 0.0] }
    - { scale_check: "root-em ResizeObserver scale factor", tested: [0.75, 1.0, 1.5], result: "offset_px: [0.0, 0.0] at every scale — holds by construction, not just at base size" }

# ---------------------------------------------------------------------------
# v6 CHANGE 2 — LIQUID BLOB SOFT-BODY PHYSICS (replaces the wireframe orb)
# ---------------------------------------------------------------------------
liquid_blob_physics:
  summary: >
    28 surface points arranged around the blob's center, each point
    independently spring-anchored to a shared radius target AND coupled
    to its two immediate neighbors via a discrete Laplacian term — this
    coupling is what makes a poke at one point ripple around the entire
    membrane instead of just wobbling that one point in isolation. This
    is the key structural difference from the v3-v5 wireframe loops
    (which had no point-to-point coupling at all).
  point_count: 28
  base_radius_px: 56
  per_point_spring: { stiffness: 70, damping: 9 }
  neighbor_coupling_strength: 20
  idle_sloshing: "two rotating low-order sine harmonics (order 1 and 2) biasing each point's target radius by angle — reads as a slow, continuous slosh rather than a static resting shape"
  audio_level_pokes: "periodic randomized impulses applied to a small angular neighborhood (cosine falloff, +/-4 points), frequency interval 220ms (high agitation) to 900ms (idle) and magnitude both scale with the current agitation spring value — simulates audio-reactive surface disturbance without executing any real DSP"
  volume_conservation: "soft/approximate: each frame, the average point radius is nudged 2.5% of the way back toward the target base radius — keeps overall size roughly constant over time without erasing the local squash-one-side/bulge-the-other asymmetry a real poke produces (a rigorous incompressible-fluid solve was judged unnecessary for a UI mockup)"
  phase_behavior:
    idle: "agitation target 0.15 (gentle continuous life, not static), radius target 1.0x — UNCHANGED from v6/v7"
    building: "agitation ramps 0.15 -> ~0.9 with progress * (intensity-weighted), radius grows slightly to 1.10x, internal color mix ramps with progress * tension — UNCHANGED"
    peak: "agitation 1.0 (max), radius 1.12x, color mix 0.9 — UNCHANGED"
    vacuum: "radius target collapses to 0.22x (tight trembling droplet); agitation INCREASED (0.5->0.85) for visible high-frequency trembling — UNCHANGED, still happens 'before the pop' exactly as requested"
    impact: "v8: now a genuine POP, not just a splash. Same underlying physics edge-trigger as v6/v7 (radius spring target spikes to up to 2.1x with a loose/overshooting spring, 6 strong random pokes hit the body's own surface points for an asymmetric burst) PLUS three new v8 additions fired at the same phase-entry instant: a one-shot popFlashSpring impulse (value snapped to 1, spring-decays smoothly back to 0 — drives the rupture flash + film opacity dip, see bubble_rendering_v8.pop_sequence below), 8 satellite droplets (was 6) now rendered as mini bubbles, and 3 short-lived torn-film 'shred' line fragments."
    recovery: "agitation and radius decay back to idle levels via the same spring damping; popFlash also continues decaying to 0 across this phase, so the membrane visibly 'reforms' as the flash fades — no special-cased reform logic needed, it falls out of the existing spring physics"
  satellite_droplets:
    max_count: 8   # was 6 — bumped for a fuller spray, closer to the reference's droplet density
    physics: "initial outward velocity + slight upward bias, gravity 130px/s^2, velocity drag ~1.4%/frame, radius/opacity fade via a life timer — UNCHANGED physics"
    rendering_v8: "now rendered as tiny BUBBLES rather than solid dots — fill=url(#bubbleGlassGrad) (same near-transparent glassy fill as the main body) + a thin 1px stroke=url(#bubbleIrisGradA) (the same rotating iridescent gradient as the main rim) — reads as fragments of the same film, not colored dust"
    merge_behavior: "a droplet deactivates (opacity->0, 'merges' back into the body) once its distance from center falls below 90% of the current body radius, OR its life timer expires — whichever comes first — UNCHANGED"
  shred_fragments_v8:
    max_count: 3
    description: "short torn-film wisps — new in v8, selling the membrane rupture beyond the round droplets, per the reference's mid-burst frame showing thin trailing highlight shapes near the tear"
    rendering: "3 pre-created SVG <line> elements, stroke=url(#bubbleIrisGradA), stroke-linecap round; each spawned at a random point on the pre-pop boundary with outward velocity + slight upward bias, length shrinks with remaining life, fades ~1.6x faster than the droplets (short-lived by design, a quick torn-wisp read rather than a lingering fragment)"
  performance: "single requestAnimationFrame loop shared with the rest of the UI (phase chip, progress strip, curve redraw); ~28-point path rebuild (reused for all 3 iridescent stroke copies, not recomputed 3x) + a handful of trivial per-point/per-droplet/per-shred arithmetic operations per frame — well within budget for a UI mockup, no physics library, no WebGL, no offscreen canvas"

# ---------------------------------------------------------------------------
# v9 CHANGE — HD BUBBLE PASS (supersedes bubble_rendering_v8's rendering
# details below; physics simulation itself still unchanged, see
# liquid_blob_physics above)
# ---------------------------------------------------------------------------
bubble_rendering_v9:
  references:
    - "plugins/DROP/.ideas/mockups/hd-ref-soap_bubbles_PNG109999.png (6000x6000, PRIMARY) — very thin iridescent rim (~1.5% of diameter, magenta/violet top, gold/green bottom, cyan along most of the arc), a softly luminous translucent cyan-white interior with blurry internal reflection patches, two clear specular highlights (large + small), whole bubble clearly/brightly visible against the dark background."
    - "plugins/DROP/.ideas/mockups/hd-ref-soap_bubbles_PNG110011.png (8000x8000, secondary) — grayscale luminance/falloff study: soft radial body gradient, two bright highlight blobs, feathered (not hard-edged) outer boundary."
  hd_outline:
    problem: "user: 'it is slightily bad resolution' — even though catmullRom2bezier already produced true bezier curves (not polygon facets), only 28 segments existed, and several heavy blur filters compounded to read as a smeary/low-res blob rather than a crisp glassy surface."
    fix: "the 28 PHYSICS points (unchanged) are now resampled every frame into ~112 render points via a proper Catmull-Rom position evaluator (catmullRomPos) walked at 4 sub-samples per segment (densifyClosed) — DENSIFY_PER_SEG=4, 28*4=112, satisfying the '96+ samples' requirement. The dense point set is rendered as a simple L-command polyline (polylinePath) rather than re-deriving bezier tangents — visually indistinguishable from a true curve at 112 points, cheaper per frame than a second bezier pass. Simulation cost is unchanged (still only 28 spring/coupling updates/frame) — this is a render-only densification."
    blur_reduction: "every heavy blur filter was cut or removed: grounding shadow 6px->4px, outer ambient glow 7px->5px, BOTH iris stroke layers' blur REMOVED entirely (were 2px on the old outer band), main specular 2.5px->1px, secondary specular 1.6px->0.6px. The two new interior reflection blobs (see brighter_interior below) intentionally KEEP a moderate blur (4-5px) since soft/blurry is correct for them specifically, per the HD reference's own blurry interior patches — the fix was removing blur from things that should read CRISP (the rim, the outline), not banning blur everywhere."
  thin_outline:
    problem: "user: 'make its outline alot smaller' — v8's iridescent band was 3 layered strokes (7px/4px/1.5px in a 200-unit space, on a 112px-diameter body) — a visually chunky ring, not a delicate edge."
    fix: "reduced to TWO thin layers on the new 172px-diameter body: blobIrisSoft (4.5px, opacity 0.28, a barely-there soft color bleed) + blobIrisRim (2.2px, opacity 0.88, the crisp edge line) — combined visual footprint is roughly 2.6% of the resting diameter, matching the reference's 'very thin rim' (~1.5-2%) far more closely than v8's chunky band. Blur removed from both (see blur_reduction above) so the thinness reads as a crisp fine line, not a soft smear that LOOKS thicker than it measures."
    rotation_unchanged: "the slow dual-gradient hue rotation (gradientTransform, speed scaling with agitation+tension) is structurally unchanged from v8 — same two gradients (bubbleIrisGradA/B), same rotation formula — only the STROKE WIDTHS and blur shrank, per the explicit 'keep the slow hue swirl but confine it to that thin rim' instruction."
  more_visible:
    bigger: "resting radius (BLOB_BASE_R) grown from 56 to 86 — a ~172px resting diameter inside the unchanged 200px chamber (#orbWrap is still 12.5rem/200px, untouched), leaving ~14px margin per side at rest for deformation headroom, matching 'fill most of its 200px chamber (~170-180px diameter), still leaving deformation headroom' exactly."
    brighter_interior:
      fill: "bubbleGlassGrad rebuilt from v8's near-invisible 0.05-0.16 opacity range to a much brighter 0.11-0.40 range, cool cyan-white hue (#EAFBFF center / #BFEFF5 mid / #6FA8C8 edge) instead of v8's dark refractive tint — reads as a genuine soft translucent glow, matching the HD reference's luminous (not ghostly) interior, while remaining see-through (max opacity 0.40, well under solid)."
      inner_reflection_blobs: "two NEW soft blurred white ellipses (blobInnerGlow1/2, radial gradient fill, 4-5px blur, opacity ~0.11-0.16) slowly drift along independent elliptical paths inside the body every frame (innerGlowPhase1/2, speed scales gently with agitation) — matches the HD reference's blurry internal-reflection patches, and doubles as part of the 'always moving' requirement (drift never stops, even at rest)."
    impact_overshoot_retuned: "the Impact radius-spring overshoot multiplier was reduced from *1.1 to *0.55 (max radiusMul ~1.55x instead of ~2.1x) — since the resting body is now already much larger, the OLD relative overshoot would have produced an implausibly huge burst; the new multiplier keeps the pop dramatic without the peak size looking absurd relative to the 200px chamber."
  always_moving_and_audio_reactive: "see audio_reactivity_contract below for the full simulated-input spec — summary: idle sloshing/pokes/iris-rotation/inner-glow-drift are all continuous by construction (unchanged from v8, still never fully static), and are now ADDITIONALLY driven by a simulated audio-input signal so the bubble visibly bounces/ripples even without pressing DROP."
  drop_sequence_preserved: "tension-driven storming (agitation+colorMix scale with tension*progress during Building), the Vacuum trembling droplet (unchanged 0.22x radius + elevated agitation), the Impact pop (rupture flash + droplets + shreds + body burst, only the overshoot magnitude changed per impact_overshoot_retuned above), and the Recovery reform are all structurally unchanged — confirmed via diffing the phase-target switch statement against v8's, only the one impact radiusMul line differs."

# ---------------------------------------------------------------------------
# v9 CHANGE — SIMULATED AUDIO INPUT + PRODUCTION CONTRACT
# ---------------------------------------------------------------------------
audio_reactivity_contract:
  test_harness_simulation:
    purpose: "the orb must visibly react to 'incoming sound' in the browser mockup, where no real audio pipeline exists — a simulated input stands in for it, clearly labeled as such."
    signal: "simulatedInputLevel(nowSec): a looping ~120bpm four-on-the-floor kick envelope (Math.exp(-beatPhase*14), sharp attack/fast decay, retriggered every beat = 0.5s) plus a small continuous mid-frequency wiggle (two non-aligned sine waves, ~3.1Hz and ~5.7Hz) — the combined signal never fully reaches 0 (a 0.15 floor keeps a constant 'some signal' baseline) and is clamped to [0,1]."
    injection_points:
      - "continuous: targetAgitation += simLevel * 0.18 every frame, added AFTER the phase-based switch statement so it layers on top of (never overrides) the existing DROP-sequence agitation targets — a gentle background 'storm floor' that rides the wiggle component"
      - "discrete: a direct applyPoke(0.9) fires exactly once per detected beat onset (beatIdx changing), independent of the phase-based random poke scheduler — this is the 'bounces with the kick' read, distinct from the smoother continuous agitation nudge"
    runs_independent_of_drop_trigger: "the simulated input updates every frame regardless of drop.phase — it runs during Idle (that's the main 'always reacting' case) AND continues running in the background during an active Building/Peak/Vacuum/Impact/Recovery sequence (additively, per injection_points above), per the explicit 'keep all existing DROP-sequence behaviors' instruction — it never replaces or gates the phase-driven logic."
    ui_controls: "test-harness-only, NOT part of the production plugin: a small toggle button (#simToggle, labeled ON/OFF) inside the debug parameter monitor's chrome, plus a live level readout (#simLevelDisplay, 'level: NN%') updated every frame — the toggle is the one interactive exception to the debug monitor's otherwise pointer-events:none click-through behavior."
  production_binding:
    replaces: "simulatedInputLevel() is entirely test-harness scaffolding — production does NOT ship a fake kick-pattern generator. It is replaced by the real audio-analysis pipeline already specified in architecture.md's AudioAnalyzer component."
    real_signal_source: "per architecture.md's AudioAnalyzer: RMS, peak, transient energy, spectral centroid, and band energies, computed via a 512-point real FFT (Hann-windowed) on a ring-buffer decoupled from host block size, plus a lock-free single-producer/single-consumer ring buffer (per architecture.md's Integration Points: '{progress, tensionLevel, currentState, inputRMS, activeModuleWeights[10]}') pushed once per processed block by the audio thread and drained by a ~30-60Hz UI-thread Timer."
    mapping: "production's continuous agitation nudge uses smoothed inputRMS (or a short-window transient-energy value) in place of simLevel's wiggle component; production's discrete per-beat poke is replaced by an onset/transient-detection trigger (a transient-energy threshold crossing) firing applyPoke() with magnitude scaled by the transient's peak amplitude, in place of the fake beat-onset detector. The injection points (continuous target-agitation add + discrete applyPoke on detected events) stay structurally identical — only the SOURCE of the two numbers changes from a scripted sine/kick formula to the real AudioAnalyzer feed."
    ui_never_executes_dsp: "reconfirmed: this whole mechanism only ever READS a level value already computed on the audio thread and handed across the lock-free ring buffer — the UI/JS layer never performs any audio analysis itself, consistent with the project's standing 'UI never executes DSP' rule."

# ---------------------------------------------------------------------------
# v8 CHANGE 1 — IRIDESCENT SOAP-BUBBLE RENDERING (superseded by bubble_rendering_v9 above; kept as history)
# ---------------------------------------------------------------------------
bubble_rendering_v8:
  reference: "plugins/DROP/.ideas/mockups/v8-reference-bubble.png — photoreal soap bubbles: transparent membrane, thin-film rainbow swirl concentrated at the rim (magenta/cyan/gold/green, asymmetric/irregular distribution, not a uniform rainbow ring), crisp white specular highlight(s), slight asymmetric deformation, and a mid-burst frame with several small satellite droplets near the rupture point."
  transparent_body: "the main path's fill changed from an opaque-ish 3-stop radial gradient (v6/v7) to #bubbleGlassGrad — a radial gradient with stop-opacity 0.05-0.16 throughout (center ~0.05, thickening slightly toward the rim to ~0.16), cool dark/refractive tint (#0c141c/#18242f) — the recessed glass chamber behind the orb visibly shows through the center, reading as a thin film rather than a solid ball."
  iridescent_rim:
    technique: "3 stroke-only <path> copies of the SAME 'd' string as the main body (set every frame, so they track every deformation automatically — never a static overlay): blobIrisOuter (stroke-width 7, opacity ~0.22, blurred 2px — the soft outer color bleed), blobIrisMid (stroke-width 4, opacity ~0.5 — the visible color band), blobIrisRim (stroke-width 1.5, opacity ~0.85 — the crisp edge line). Outer uses gradient B, mid+rim share gradient A."
    gradients: "two 5-stop linearGradients (magenta -> cyan -> gold -> green -> magenta, looping seamlessly for clean rotation): bubbleIrisGradA drives the rim+mid layers, bubbleIrisGradB (different stop order/phase) drives the outer blurred layer independently, for a richer layered swirl than a single rotating gradient would give."
    animation: "gradientTransform 'rotate(angle 0.5 0.5)' updated every frame — angleA advances ~14-124deg/s, angleB advances the opposite direction ~10-95deg/s, BOTH scaling with agitation and colorMix (tension-driven) — satisfies 'faster iridescent swirl toward the drop' directly, and reads as genuinely alive/swirling even at idle (slow, ~14-16deg/s) rather than static."
  specular_highlights: "TWO now (was one) — blobSpecular (main, upper-left, larger, angle -0.85rad) and blobSpecular2 (smaller, secondary, angle 2.05rad, lower on the bubble) — both use the same 'sample actual point radius at a fixed light-source angle via linear interpolation between the two nearest surface points' technique from v6/v7, so both visibly ride the deforming surface. Matches the reference's double-highlight glassy look."
  pop_sequence:
    trigger: "same phase-entry edge detection as v6/v7's spawnSplash() — fires once when drop.phase transitions into 'impact'"
    popFlashSpring: "a Spring instance whose target is always 0; at pop-instant its .value is snapped to 1.0 (an impulse, not a target change) and its own critically-damped physics smoothly decays it back to 0 over the following few hundred ms — this is what makes the rupture read as 'click-free... no abrupt frame jumps' per the explicit requirement, since every visual driven by popFlash is a continuous spring curve, never a binary toggle"
    body_and_film_dip: "blobPath fill-opacity and all 3 iris-stroke opacities are multiplied by (1 - popFlash*0.88) / (1 - popFlash*0.7) respectively — the membrane visibly dims/ruptures at the flash peak, then smoothly recovers as popFlash decays, reading as 'reform during Recovery'"
    popFlashRing: "a white ring (circle, stroke-only) whose radius/stroke-width/opacity all scale with popFlash — a bright brief flash coincident with the rupture"
    concurrent_spawns: "spawnSplash() (8 mini-bubble droplets) and spawnShreds() (3 torn-film line fragments) both fire at the same instant as the popFlash impulse, plus the existing 6-poke body burst — all four effects landing together is what sells the 'pop' as one coherent event rather than several disconnected animations"
  vacuum_unchanged: "confirmed unchanged from v6/v7 — still sucks the bubble into a small (0.22x) trembling droplet before the pop sequence, satisfying 'vacuum still sucks it into a small trembling droplet before the pop' exactly as specified"

# ---------------------------------------------------------------------------
# v8 CHANGE 2 — IRIDESCENT ACCENT SYSTEM (replaces flat electric blue everywhere)
# ---------------------------------------------------------------------------
accent_system_v8:
  shared_gradient: "a single <linearGradient id=\"iridAccentGrad\"> (cyan #3FD3E0 -> soft blue-violet #7FA8E0 -> violet #A868D8 -> magenta #C64DBE), defined once in a 0x0 hidden <svg> near the top of the document and referenced via url(#iridAccentGrad) from any SVG element on the page — including the dynamically-created per-knob value-arc SVGs (fragment-ID references resolve across all inline SVGs sharing the same HTML document's ID space, standard behavior in every modern browser)."
  converted_to_gradient_fill_or_stroke: [knob value-arc fill (.arc-fill), progress-strip fill, progress-strip drop-marker stroke, tension-curve travelling dot fill]
  converted_to_two_tone_glow: [knob value-arc drop-shadow filter, drop-marker drop-shadow filter, curve-dot drop-shadow filter, phase-LED box-shadow, step-circle active-state box-shadow, DROP-trigger idle + armed box-shadow glows, resize-grip corner affordance]
  leftover_bug_fixed: "the v6 color pass updated the --accent/--accent-dim/--accent-glow CSS custom properties but missed FOUR hardcoded rgba(74,158,255,...) values (the pre-v6 flat blue) that had been typed directly instead of referencing the variables: step-circle active glow (x2), DROP-trigger idle glow, DROP-trigger armed glow. All four are fixed in this same v8 pass (found via a full-file grep audit, not just spot-checked) and converted to the same two-tone cyan+magenta treatment as everything else."
  numerals_stay_neutral: "knob3-value AND bare-value both use var(--text-primary) (white) for the numeral color itself — per explicit direction for knob numerals, extended to bare-readout numerals too for consistency (documented design judgment) — the accent only appears as a soft two-tone (cyan+magenta) text-shadow glow behind the numeral, never as the text color"
  gold_usage: "reserved for the bubble's own iridescent film gradients (bubbleIrisGradA/B) only — NOT used anywhere in the general UI chrome (arcs/progress/LEDs/glows), per the explicit 'gold sparingly... not a rainbow explosion' direction"
  palette_restraint: "every general-UI accent use is a 2-color (cyan+magenta) or 4-stop cyan-violet-magenta gradient/glow pair — never more than 2 hues in any single UI element outside the bubble itself, keeping the accent system legible/premium rather than a full rainbow"

# ---------------------------------------------------------------------------
# v7 CHANGE 1 — IMPACT KNOB CENTERING AUDIT
# ---------------------------------------------------------------------------
knob_centering_audit:
  bug_report: 'User (verbatim): "impact knob is out of center."'
  candidates_investigated:
    - candidate: "(a) Cap not vertically centered inside its arc ring — arc centers on the WRAP (which also contains the label) instead of on the cap itself, so the cap rides high/low within the ring."
      verdict: "NOT A BUG in this implementation — re-audited and confirmed. .knob3-arc is appended as a child of .knob3 (the cap div itself), NOT .knob3-wrap, and its CSS (top:50%;left:50%;width:120%;height:120%;transform:translate(-50%,-50%), fixed in v6) resolves entirely against .knob3's own box. The label lives in a sibling <span> outside .knob3, so it cannot affect the arc's centering. Re-ran the v6 algebraic proof for all 4 knob tiers (200px/112px/56px caps) — offset is still (0,0) at every size. This was thoroughly fixed in v6 and remains correct; it was not the cause of the v7 report."
      offset_px: [0.0, 0.0]
    - candidate: "(b) Knob not horizontally centered within its column/gap between the Tension/Chaos chips and the tension-curve box."
      verdict: "CONFIRMED REAL BUG — this was the actual cause. See before/after below."
    - candidate: "(c) The IMPACT % label not centered under the cap."
      verdict: "NOT AN INDEPENDENT BUG — the label is centered via text-align:center on .knob3-wrap, resolving against the SAME wrap width the cap's margin:0 auto centering also resolves against, so label and cap always share one center by construction. Once (b) is fixed (the wrap itself is correctly placed), the label is automatically correctly centered under the cap too — confirmed, no separate fix needed."
  root_cause_b: >
    Impact's wrap box was placed at x=470 (width 130, box-center 535px).
    The true midpoint of the gap between the left column (Tension/Chaos,
    ending at x=266) and the right column (tension-curve box, starting at
    x=620) is (266+620)/2 = 443px. 535 - 443 = 92px — the knob sat visibly
    crowded toward the curve side rather than centered in the gap, which
    is exactly what the user perceived as "out of center."
  fix_pass1: "Moved the wrap's left edge from x=470 to x=378 (box-center now exactly 443px, the midpoint of the two neighboring columns, box unchanged at 130x150)."
  fix_pass1_before_after:
    before: { wrap_left_px: 470, box_center_px: 535, gap_to_left_column_px: 204, gap_to_right_column_px: 20, symmetric: false }
    after:  { wrap_left_px: 378, box_center_px: 443, gap_to_left_column_px: 112, gap_to_right_column_px: 112, symmetric: true }
  fix_pass2_user_clarification: >
    User (verbatim, after seeing pass 1): "impact is still not in the
    center cnter it with the groove you ve made in the line of the ui" —
    clarifying that the intended centering anchor is the SEAM NOTCH's
    dip (the "groove" in the zone-divider line), not the midpoint between
    the neighboring columns. Pass 1's x=443 was the wrong reference point
    entirely, not just a wrong number.
  notch_center_verification: >
    Computed the notch's true dip center algebraically from the seam SVG
    path (M0,300 L370,300 C430,300 435,344 500,344 C565,344 570,300
    630,300 L1000,300): the point (500,344) is a shared ON-CURVE endpoint
    of both cubic bezier segments (not merely a control point), and the
    two segments are exactly mirror-symmetric around it — left span
    370->500 = 130px, right span 500->630 = 130px; control-point offsets
    60px/65px from each curve's start, mirrored exactly (630-570=60,
    630-565=65). This proves the notch's deepest/center point is exactly
    x=500, not assumed.
  main_page_center_axis_audit: >
    Confirmed every Main-page element already shares this exact x=500
    center: orbWrap (left 400, width 200, center 500), style-nav (left
    390, width 220, center 500), trigger-btn/DROP (left 380, width 240,
    center 500), progressStrip (left 400, width 200, center 500),
    phaseChip (left 420, width 160, center 500) — all OK, confirming
    x=500 is genuinely the UI's shared center axis across both pages, not
    an Advanced-page-only concern.
  fix_pass2_before_after:
    before: { wrap_left_px: 378, box_center_px: 443, offset_from_notch_px: 57 }
    after:  { wrap_left_px: 435, box_center_px: 500, offset_from_notch_px: 0 }
  final_gaps: { gap_to_left_column_px: 169, gap_to_right_column_px: 55, symmetric: false, note: "intentionally asymmetric — x=500 is not the columns' midpoint, it is the UI's actual shared center axis (the notch/orb/style-selector/DROP-button column); confirmed via the layout validator that this produces zero overlaps (55px and 169px gaps both comfortably exceed the 10px minimum)" }
  verification: "cap-center == notch-dip-center == every Main-page element's center, all exactly x=500 — computed and confirmed via the layout validator, not just asserted."

# ---------------------------------------------------------------------------
# v7 CHANGE 2 — TRULY 3D KNOB MATERIAL
# ---------------------------------------------------------------------------
knob_3d_material:
  bug_report: 'User (verbatim): "make the knobs to be 3 dimentional." Prior v5/v6 caps used a single radial-gradient background layer — read as a flat shaded circle rather than a physical object, despite the shadow/highlight tokens already present.'
  reference_check: "Re-examined plugins/DROP/.ideas/mockups/v3-reference.png specifically for knob material: its knobs (DELAY, MIX, FEEDBACK, AMOUNT, etc.) show a distinct darker OUTER ring/body with a lighter, subtly domed INNER face, a strong vertical light gradient (lighter top, fading to near-black bottom), and a thin bright catch-line right at the top rim edge — unmistakably a two-layer physical puck, not a single flat gradient."
  structure: "Two CSS layers instead of one, applied identically to every knob tier via percentage-based sizing (scales proportionally at 200px/112px/56px alike, no per-size overrides needed):"
  outer_layer_knob3:
    role: "the visible cylindrical side-wall/rim band — the 'height' of the physical puck"
    background: "radial-gradient(circle at 50% 30%, #303236 0%, #16171a 72%)"
    shadow: "var(--knob-contact-shadow) [tight, 0 2px 3px rgba(0,0,0,0.55)] + var(--knob-ambient-shadow) [wide, 0 14px 30px rgba(0,0,0,0.48)] + var(--knob-rim) [inset top highlight] + var(--knob-internal-shade) [inset bottom shade]"
  inset_layer_knob3_before:
    role: "the domed TOP FACE — a ::before pseudo-element inset 9% inside the outer rim (percentage inset, so the rim band's width scales proportionally at every cap size)"
    background_layers_top_to_bottom_paint_order:
      - "radial-gradient(ellipse 56% 24% at 50% 17%, rgba(255,255,255,0.30) 0%, transparent 68%) — the soft elliptical sheen near the top, deliberately blurred/soft via a wide ellipse + gradual falloff rather than a hard specular dot"
      - "repeating-linear-gradient brushed texture, unchanged from v5/v6 (~2.5% opacity)"
      - "linear-gradient(180deg, #4c4f56 0%, #35373c 28%, #202226 60%, #0d0e10 100%) — the strong single-top-light-source VERTICAL gradient (replaces the old radial 'spotlight' gradient, which read as flat because its falloff was circular/directionless rather than reading as a light source from above)"
    bevel_shadow: "inset 0 1px 1px rgba(255,255,255,0.22) [inner highlight where the face meets the rim] + inset 0 -2px 4px rgba(0,0,0,0.55) [inner shadow at the same boundary] — together these read as a real beveled edge, not a flat painted circle"
  numeral: "unchanged — .knob3-value remains an absolutely-positioned, flex-centered overlay on top of both layers (paints after ::before in DOM/paint order), still reads as engraved-centered"
  arc_unaffected: "confirmed the ::before face layer does not change .knob3's own box size (it's an inset overlay, not a layout participant), so the v6 arc-concentricity fix is completely unaffected by this change — re-verified the (0,0) offset proof still holds"
  scale_proportionality: "every measurement in both layers is a percentage (inset 9%, gradient stop percentages, ellipse size percentages) — the identical CSS rule produces a proportionally-scaled identical effect at 200px (Intensity/Dry-Wet), 112px (Impact), and 56px (macro knobs) alike, and continues to scale correctly with the root-em ResizeObserver window-scaling factor, with no per-size CSS overrides required"

