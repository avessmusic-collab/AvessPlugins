per_step_lanes:  # PatternSnapshot model state, one value per step; edited in the single switchable lane strip
  - { id: lane_velocity, range: "0-127", scope: per_step }
  - { id: lane_pitch, range: "-24..+24 st (fine +-100 ct in overlay)", scope: per_step }
  - { id: lane_ratchet, range: "1,2,3,4,6,8 repeats", scope: per_step }
  - { id: lane_probability, range: "0-100 %", scope: per_step }
  - { id: lane_stretch, range: "0.25x-4x", scope: per_step }
  - { id: lane_drive, range: "0-100 %", scope: per_step }
  - { id: lane_filter, range: "20 Hz-20 kHz", scope: per_step }
  - { id: lane_pan, range: "L100-R100", scope: per_step }

validation:
  tool: python build script (yq unavailable); bounds, edge padding 15px, overlaps (per co-visible group), min sizes, 10px gaps
  controls_checked: 93
  errors: 0
  warnings: 0
