# CHOPLINE UI mockup v1 - design spec (flat modern pro)
#
# NOTE: the production UI will be NATIVE JUCE (custom LookAndFeel, juce::Component), NOT WebView.
# v1-ui-test.html is a VISUAL DIRECTION + interaction reference only, not production code.
# All positions are absolute window pixels at 100% scale (1100x720); the real editor scales 75%-200%, fixed aspect.
# Control scope follows spec section 10: APVTS globals = Beat Repeat, Master FX, swing, pattern slot, quality, output.
# Per-chop settings live in the SliceMap and per-step lane values in the PatternSnapshot (snapshot handoff, not APVTS).

plugin: CHOPLINE
version: 1
source_spec: plugins/CHOPLINE/.ideas/chopline-spec.md  # section 9 layout contract

window:
  width: 1100
  height: 720
  resizable: true
  scale_range: [0.75, 2.0]
  fixed_aspect: true
  edge_padding: 15

styling:
  style: flat_modern_pro
  rules: [flat, no_skeuomorphism, one_pixel_separators, radius_4, data_forward_values_and_units]
  colors:
    window: "#0d0e11"
    header: "#0a0b0e"
    panel: "#121419"
    surface: "#0f1115"
    separator: "#22262e"
    separator_strong: "#2d323c"
    text: "#e6e8ec"
    text_dim: "#8b92a0"
    text_faint: "#586070"
    accent_cyan: "#2bd4e6"
    beat_repeat_amber: "#ffa21f"
    knob_track: "#272b34"
  chop_palette_colour_blind_safe:  # colour = chop identity, always paired with index label; cycles after 8
    [ "#5b9dff", "#35c490", "#e6d14a", "#d97ad0", "#ff7d5c", "#a38cff", "#b9c0cc", "#d1a15c" ]
  lane_colours_subtle:
    velocity: "#6f87a8"
    pitch: "#8a78b0"
    ratchet: "#a8876a"
    probability: "#6aa08f"
    stretch: "#a89a6a"
    drive: "#b0707a"
    filter: "#6a9ab0"
    pan: "#8a9a6a"
  fonts:
    primary: "Inter, SF Pro Text, -apple-system, Helvetica Neue, sans-serif"
    numeric: "JetBrains Mono, SF Mono, ui-monospace, monospace"
    sizes_px: {wordmark: 17, body: 11, value: 10, label_caps: 9.5, panel_title_caps: 10}
  radii_px: {control: 4, panel: 4}
  knob: {diameter: 40, ring_stroke: 3, sweep_deg: 270, style: thin_ring_flat, bipolar_arc_from_centre: true}
  step_cell: {shape: flat_square, event_style: tinted_fill_with_index_and_mini_waveform}

interaction:
  knob: [drag_vertical, shift_fine_drag, double_click_reset, mouse_wheel, right_click_midi_learn]
  strip_a: [click_audition, drag_chop_to_grid, wheel_zoom, minimap_scroll, manual_dblclick_add, alt_click_delete]
  strip_b: [paint_with_selected_chop, drag_to_move, drag_right_edge_to_span, alt_drag_duplicate, delete_removes, cmd_z_undo]
  keyboard: {space: transport_preview, '1-8': pattern_slots, delete: remove_event, b: hold_beat_repeat}

layout:  # top to bottom, spec section 9
  - id: header
    title: ""
    rect: {x: 0, y: 0, w: 1100, h: 54}
    children:
      always: [wordmark, preset_prev, preset_name, preset_next, pattern_slot, bpm, transport_play, quality, settings, cpu_meter]
  - id: strip_a
    title: "SAMPLER"
    rect: {x: 15, y: 60, w: 1070, h: 166}
    children:
      always: [minimap, waveform, sampler_load, sampler_file, slice_mode, slice_sensitivity, slice_min_len, slice_zero_cross]
  - id: strip_b
    title: "GRID"
    rect: {x: 15, y: 234, w: 1070, h: 242}
    children:
      always: [grid_resolution, grid_feel, pattern_length, swing, randomize, lane_collapse, step_lane, lane_tab, lane_readout, lane_reset, lane_editor]
  - id: inspector
    title: "CHOP INSPECTOR"
    rect: {x: 15, y: 484, w: 470, h: 221}
    children:
      always: [chop_chip, chop_playback, chop_reverse, chop_choke, insp_tab, chop_gain, chop_pan]
      visible_when:  # inspector sub-tabs / warp-mode groups share the same screen area
        "WARP": [warp_mode]
        "WARP/Varispeed": [warp_speed, warp_tape_stop, warp_tape_start]
        "WARP/Stretch": [warp_time, warp_formant_shift, warp_formant_preserve]
        "WARP/Granular": [gran_size, gran_density, gran_pos_jitter, gran_pitch_jitter, gran_spray]
        "WARP/Freeze": [freeze_pos, freeze_grain]
        "PITCH": [pitch_coarse, pitch_fine, pitch_env_amt, pitch_glide, pitch_curve, unison_voices, unison_spread]
        "DIST": [dist_type, dist_drive, dist_tone, dist_mix, dist_output, dist_autogain]
        "FILTER": [filt_type, filt_slope, filt_cutoff, filt_res, filt_env_amt]
        "ENV": [env_attack, env_hold, env_decay, env_sustain, env_release, ahdsr_graph]
  - id: beat_repeat
    title: "BEAT REPEAT"
    rect: {x: 493, y: 484, w: 300, h: 221}
    children:
      always: [br_mode, br_hold, br_interval, br_grid, br_gate, br_chance, br_decay, br_pitch_decay, br_freeze, br_mix_mode]
  - id: master
    title: "MASTER"
    rect: {x: 801, y: 484, w: 284, h: 221}
    children:
      always: [master_tone, master_hp, master_sat, master_width, master_delay_send, master_verb_send, master_output, master_limiter, master_meter]

controls:
  - id: wordmark
    type: label
    panel: header
    label: "chopline"
    position: {x: 15, y: 15}
    size: {width: 110, height: 24}
    decorative: true
    scope: ui  # UI-only state (not persisted to the processor)
  - id: preset_prev
    type: button
    panel: header
    label: ""
    position: {x: 140, y: 15}
    size: {width: 24, height: 24}
    scope: ui  # UI-only state (not persisted to the processor)
  - id: preset_name
    type: combo
    panel: header
    label: "Preset"
    position: {x: 174, y: 15}
    size: {width: 188, height: 24}
    options: ["Chops / Vowel Hop", "Chops / Staccato Verse", "Glitch / Tape Stutter Run", "Stutter / Syllable Roll", "Tape / Slow Wobble", "Granular / Breath Cloud"]
    default: "Chops / Vowel Hop"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: preset_next
    type: button
    panel: header
    label: ""
    position: {x: 372, y: 15}
    size: {width: 24, height: 24}
    scope: ui  # UI-only state (not persisted to the processor)
  - id: pattern_slot
    type: slots
    panel: header
    label: "Pattern slot"
    position: {x: 410, y: 15}
    size: {width: 220, height: 24}
    options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    default: "A"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: bpm
    type: field
    panel: header
    label: "BPM"
    position: {x: 646, y: 15}
    size: {width: 84, height: 24}
    range: [40, 240]
    default: 124
    scope: host_readonly  # read from AudioPlayHead (internal BPM only when host gives none)
  - id: transport_play
    type: toggle
    panel: header
    label: ""
    position: {x: 740, y: 15}
    size: {width: 28, height: 24}
    default: false
    scope: mock_only  # mock only: production uses host transport (standalone: free-run)
  - id: quality
