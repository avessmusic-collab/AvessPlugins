    label: "minimap"
    position: {x: 27, y: 88}
    size: {width: 830, height: 22}
    kind: minimap
    scope: ui  # UI-only state (not persisted to the processor)
  - id: waveform
    type: display
    panel: strip_a
    label: "waveform"
    position: {x: 27, y: 120}
    size: {width: 830, height: 94}
    kind: waveform
    scope: ui  # UI-only state (not persisted to the processor)
  - id: sampler_load
    type: button
    panel: strip_a
    label: "Load"
    position: {x: 873, y: 88}
    size: {width: 92, height: 24}
    scope: ui  # UI-only state (not persisted to the processor)
  - id: sampler_file
    type: readout
