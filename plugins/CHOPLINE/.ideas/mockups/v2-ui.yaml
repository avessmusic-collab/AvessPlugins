    position: {x: 367, y: 298}
    size: {width: 40, height: 40}
    label: "D"
    default: false
    tip: "Dotted"
    scope: pattern_model  # PatternModel state (per pattern slot)
  - id: pattern_length
    type: combo
    layer: main
    panel: strip_b
    position: {x: 447, y: 304}
    size: {width: 100, height: 28}
    label: "Pattern length"
    options: ["1 bar", "2 bars", "4 bars"]
    default: "1 bar"
    prefix: ""
    scope: pattern_model  # PatternModel state (per pattern slot)
  - id: bar_page
    type: seg
    layer: main
    panel: strip_b
    position: {x: 557, y: 304}
    size: {width: 140, height: 28}
    label: "Bar page"
    options: ["1", "2", "3", "4"]
    default: "1"
    visible_when: "pattern_length > 1 bar"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: grid_hint
    type: label
    layer: main
    panel: strip_b
    position: {x: 717, y: 298}
    size: {width: 216, height: 40}
    label: "hint"
    decorative: true
    scope: ui  # UI-only state (not persisted to the processor)
  - id: swing
    type: knob
    layer: main
    panel: strip_b
    position: {x: 943, y: 298}
    size: {width: 130, height: 40}
    label: "SWING"
    range: [0, 75]
    default: 0
    unit: "%"
    compact: true
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: step_boxes
    type: display
    layer: main
    panel: strip_b
    position: {x: 27, y: 350}
    size: {width: 1046, height: 340}
    kind: "boxes"
    label: "Boxes"
    scope: pattern_model  # PatternModel state (per pattern slot)
  - id: slice_min_len
    type: knob
    layer: fl_slice
    panel: fl_slice
    position: {x: 797, y: 158}
    size: {width: 52, height: 66}
    label: "MIN LEN"
    range: [20, 500]
    default: 80
    unit: " ms"
    scope: slice_map  # SliceMap / sampler model state
  - id: slice_zero_cross
    type: toggle
    layer: fl_slice
    panel: fl_slice
    position: {x: 859, y: 177}
    size: {width: 140, height: 28}
    label: "Snap zero-X"
    default: true
    scope: slice_map  # SliceMap / sampler model state
  - id: slice_hint
    type: label
    layer: fl_slice
    panel: fl_slice
    position: {x: 797, y: 236}
    size: {width: 276, height: 44}
    label: "hint"
    decorative: true
    scope: ui  # UI-only state (not persisted to the processor)
  - id: br_chance
    type: knob
    layer: fl_br
    panel: fl_br
    position: {x: 827, y: 98}
    size: {width: 52, height: 66}
    label: "CHANCE"
    range: [0, 100]
    default: 60
    unit: "%"
    accent: "amber"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: br_decay
    type: knob
    layer: fl_br
    panel: fl_br
    position: {x: 889, y: 98}
    size: {width: 52, height: 66}
    label: "DECAY"
    range: [0, 100]
    default: 25
    unit: "%"
    accent: "amber"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: br_pitch_decay
    type: knob
    layer: fl_br
    panel: fl_br
    position: {x: 951, y: 98}
    size: {width: 52, height: 66}
    label: "P.DECAY"
    range: [0, 12]
    default: 0
    unit: " st"
    accent: "amber"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: br_hold
    type: button
    layer: fl_br
    panel: fl_br
    position: {x: 1013, y: 117}
    size: {width: 60, height: 28}
    label: "HOLD"
    accent: "amber"
    toggle: true
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: master_tone
    type: knob
    layer: fl_master
    panel: fl_master
    position: {x: 827, y: 98}
    size: {width: 52, height: 66}
    label: "TONE"
    range: [-100, 100]
    default: 0
    unit: "%"
    bipolar: true
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: master_sat
    type: knob
    layer: fl_master
    panel: fl_master
    position: {x: 889, y: 98}
    size: {width: 52, height: 66}
    label: "SAT"
    range: [0, 100]
    default: 10
    unit: "%"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: master_width
    type: knob
    layer: fl_master
    panel: fl_master
    position: {x: 951, y: 98}
    size: {width: 52, height: 66}
    label: "WIDTH"
    range: [0, 200]
    default: 100
    unit: "%"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: master_output
    type: knob
    layer: fl_master
    panel: fl_master
    position: {x: 1013, y: 98}
    size: {width: 52, height: 66}
    label: "OUT"
    range: [-24, 12]
    default: 0
    unit: " dB"
    bipolar: true
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: quality
    type: seg
    layer: fl_set
    panel: fl_set
    position: {x: 827, y: 98}
    size: {width: 246, height: 28}
    label: "Quality"
    options: ["Eco", "HQ"]
    default: "HQ"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: cpu_meter
    type: display
    layer: fl_set
    panel: fl_set
    position: {x: 827, y: 138}
    size: {width: 246, height: 24}
    kind: "cpu"
    label: "CPU"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: overlay_chip
    type: readout
    layer: overlay
    panel: overlay
    position: {x: 316, y: 192}
    size: {width: 150, height: 24}
    label: "chop"
    scope: selection  # UI selection state
  - id: overlay_close
    type: button  # icon button
    layer: overlay
    panel: overlay
    position: {x: 760, y: 192}
    size: {width: 28, height: 24}
    glyph: "close"
    label: "Close"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: chop_pitch
    type: knob
    layer: overlay
    panel: overlay
    position: {x: 324, y: 240}
    size: {width: 52, height: 66}
    label: "PITCH"
    range: [-24, 24]
    default: 0
    unit: " st"
    bipolar: true
    step: 1
    scope: per_chop  # per-chop SliceMap state in plugin state, not APVTS
  - id: chop_drive
    type: knob
    layer: overlay
    panel: overlay
    position: {x: 396, y: 240}
    size: {width: 52, height: 66}
    label: "DRIVE"
    range: [0, 100]
    default: 0
    unit: "%"
    scope: per_chop  # per-chop SliceMap state in plugin state, not APVTS
  - id: chop_mode
    type: combo
    layer: overlay
    panel: overlay
    position: {x: 488, y: 244}
    size: {width: 288, height: 28}
    label: "Mode"
    options: ["One-shot", "Gate", "Loop", "Fit step"]
    default: "Gate"
    prefix: "MODE"
    scope: per_chop  # per-chop SliceMap state in plugin state, not APVTS
  - id: chop_reverse
    type: toggle
    layer: overlay
    panel: overlay
    position: {x: 488, y: 284}
    size: {width: 288, height: 28}
    label: "Reverse"
    default: false
    scope: per_chop  # per-chop SliceMap state in plugin state, not APVTS
  - id: chop_preview
    type: display
    layer: overlay
    panel: overlay
    position: {x: 324, y: 330}
    size: {width: 452, height: 150}
    kind: "preview"
    label: "Chop preview"
    scope: per_chop  # per-chop SliceMap state in plugin state, not APVTS

removed_from_v1: [pattern slot A-H strip (now a compact dropdown), CPU meter + Eco/HQ (settings flyout), minimap, slice min-length / zero-cross (slicing flyout),
  grid resolution combo (replaced by big note-length segmented control), feel seg (replaced by T/D), 8 lane tabs + lane editor, randomize, lane collapse,
  Chop Inspector (8 tabs, ~40 controls -> 4-control overlay), Beat Repeat panel (-> 1 knob row flyout), Master panel (-> 1 knob row flyout)]
note_for_production: chop inspector depth (warp/dist/filter/env) from v1 is NOT lost - the overlay can later gain an 'Advanced' disclosure; per-step lanes remain in the PatternSnapshot model and are deferred out of the main view.

validation:
  tool: python build script (yq unavailable); bounds, 15px edge padding, overlap per layer, min sizes, 10px gaps, containment in panel
  controls_checked: 44
  errors: 0
  warnings: 0
