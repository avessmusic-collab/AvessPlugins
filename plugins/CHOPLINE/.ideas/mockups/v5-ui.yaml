    scope: ui  # UI-only state (not persisted to the processor)
  - id: lane_info
    type: label
    layer: main
    panel: strip_b
    position: {x: 303, y: 466}
    size: {width: 770, height: 24}
    label: "lane description"
    decorative: true
    scope: ui  # UI-only state (not persisted to the processor)
  - id: step_lane
    type: display
    layer: main
    panel: strip_b
    position: {x: 27, y: 500}
    size: {width: 1046, height: 62}
    label: "Per-step lane"
    kind: "lane"
    scope: pattern_model  # PatternModel state (per pattern slot)
