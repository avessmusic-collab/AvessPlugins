    size: {width: 52, height: 66}
    label: "DECAY"
    default: 25
    range: [0, 100]
    unit: "%"
    accent: "amber"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: master_more
    type: button  # icon button
    layer: main
    panel: master
    position: {x: 1033, y: 578}
    size: {width: 40, height: 20}
    label: "More master"
    glyph: "dots"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: master_tone
    type: knob
    layer: main
