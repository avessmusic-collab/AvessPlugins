# CHOPLINE UI mockup v5 - design spec (v4 structure RESTYLED: light neumorphic hardware + dark inset screens)
#
# NOTE: the production UI is NATIVE JUCE (custom LookAndFeel, juce::Component), NOT WebView.
# v5-ui-test.html is a visual direction + interaction reference only, not production code.
# Positions are absolute window pixels at 100% scale (1100x720); the real editor scales 75%-200%, fixed aspect.
# v5 = v4 with IDENTICAL layout, controls, ids, pages (MAIN | FX), mirrored params, interactions and self-tests; only the skin changes.
#   Source of the new look: a reference photo of a light neumorphic multi-module plugin (white raised modules, black glass screens with glowing
#   icons, matte white dome knobs with one black accent knob, pill segmented switches, ADV-style mini switches).
#   Dark screens: sample strip, lane strip, chop preview, all FX displays (curves/env/meters), Beat Repeat preview, FX-page module headers
#   (icon + name: REPEAT / CHOP / MASTER), header preset + BPM. Everything else is white hardware.

plugin: CHOPLINE
version: 5
supersedes: v4 (v1-v4 kept in repo untouched)
source_spec: plugins/CHOPLINE/.ideas/chopline-spec.md
user_feedback: "restyle v4 to the light neumorphic look of the reference photo (white hardware, dark glowing screens)"

window:
  width: 1100
  height: 720
  resizable: true
  scale_range: [0.75, 2.0]
  fixed_aspect: true
  edge_padding: 15

pages:
  nav_control: page_nav   # segmented MAIN | FX in the header; keyboard: Tab toggles, M = main, F = fx
  main: {layers: [header, main], popovers: [fl_slice, fl_mastermore, fl_set, overlay]}
  fx: {layers: [header, fx], popovers: []}
  persistence: page is UI-only state; switching closes open flyouts/overlay, keeps selection, pattern, transport, BR hold state
  layout_fx: "three columns inside the 15px edge frame: BEAT REPEAT 330w | CHOP FX 360w | MASTER 364w, 8px gutters, full height (y 60-705)"

styling:
  style: light_neumorphic_hardware_dark_screens
  colors:
    page: "#d3d7de"
    chassis: "linear #f2f4f7 -> #e4e7ec (rounded plate 1088x708 at 6,6, radius 30)"
    card: "linear #f9fafb -> #f1f2f5 (raised, radius 18, soft drop shadow + 1px white inner highlight)"
    well: "#dde0e6 (recessed: segmented tracks, trays, cells; inner shadow + white under-lip)"
    screen: "radial #34373e -> #1c1d22 -> #121316 (inset, radius 14, 7.5% top gloss, canvas content gets a 3px soft white glow)"
    text: "#2c3039"
    text_dim: "#565d6b"
    text_faint: "#727a88"   # ~4:1 on cards - used only for small labels
    screen_text: "#eef2f8"
    screen_text_faint: "rgba(200,206,218,.62)"
    knob_arc: "#4b515d"
    beat_repeat_amber: "#f29a1f"
    beat_repeat_amber_ink: "#b9650a"   # amber text on white
    beat_repeat_amber_on_screen: "#ffc266 / #ffae33"
  chop_palette_on_screens_vivid: ["#5b9dff", "#35c490", "#e6d14a", "#d97ad0", "#ff7d5c", "#a38cff", "#b9c0cc", "#d1a15c"]
  chop_palette_on_white_softened: ["#4f8ff0", "#2eb383", "#e3c437", "#cf6fc6", "#f56f4d", "#9479f2", "#98a1b0", "#c99548"]
  fonts:
    primary: "Inter, SF Pro Text, -apple-system, Helvetica Neue, sans-serif"
    numeric: "JetBrains Mono, SF Mono, ui-monospace, monospace"
    labels: "sentence case, 9.5px, mid-grey; panel + section titles caps with 0.16-0.24em tracking"
  radii_px: {panel: 18, cell: 14, screen: 14, pill: 999, box: 12, icon_button: 9}
  knob: {diameter: 40, dome: "matte white radial gradient, soft drop shadow, faint ridge ring, thin grey needle", arc: "thin 2px outer ring, value arc dark grey (amber on Beat Repeat)", sweep_deg: 270, bipolar_arc_from_centre: true,
         accent_knob: "ONE black dome per section: swing, slice_sensitivity, chop_pitch, br_chance / fx_br_chance, chop_dist_mix, master_sat_mix, master_output / fx_master_output"}
  sliders: "no continuous sliders exist in the v4 structure; the slider language (thin track + white pill thumb) is not used. Meters (cpu, output) use thin tracks."
  segmented: "recessed pill track, selected = raised white pill with dark text (amber ink on Beat Repeat)"
  combo: "raised white pill with up/down chevrons (stepper look)"
  mini_switch: "ADV-style 26x14 track + white thumb; used for auto, freeze, rnd grid, auto gain, reverse, snap zero-X; amber track on Beat Repeat"
  bypass_toggle: "20px raised round button with power glyph; dark = section active, light grey = bypassed; bypassed section dims to 42%"
  boxes: {tray: "recessed light tray", card: "raised white card", filled: "chop-colour tint + colour chip with index + mini waveform on a small dark inset", playing: "soft pressed + colour glow", selected: "2px graphite outline", playhead: "dark line on light, light line on dark (amber while repeat-hold)"}
  beat_repeat_hold: {panel: "amber ring glow + warm tint on light card", pad: "306x100 amber-tinted raised pad, amber fill pressed", header_badge: "dark pill screen with amber glow 'REPEAT HOLD' - both pages", fx_header_screen: "amber glow while holding"}
  fx_module_header: {size: "314/344/348 x 22 dark screen inside the panel bar", content: "glowing icon + letter-spaced name + status; CHOP header also carries the chop chip and prev/next arrows", note: "BR / MASTER headers have no arrows (nothing to step through)"}

interaction:
  page_nav: [click_segmented_MAIN_FX, Tab_toggles, M_main, F_fx, state_preserved_across_switch, transport_keeps_running]
  shared_params: "MAIN bottom bar and FX page edit the same value (br_hold, br_auto<->br_mode, br_interval, br_grid, br_chance, br_decay, chop_drive, chop_dist_type, chop_filter, chop_release, master_tone, master_sat, master_width, master_output, master_ceiling, master_delay_rtn, master_verb_rtn)"
  hold_pad: "FX pad is momentary (press = repeat, release = stop); Shift+click latches; H key does the same on either page; MAIN HOLD button stays a latching toggle; ignored while mode = Off"
  chop_fx_target: "CHOP FX always edits the selected chop (same selection as MAIN); prev/next arrows in the panel bar and keys 1-8 change it"
  env_display: "AHDSR display: drag the 4 handles (attack end, hold end, decay end + sustain level, release end); stage slots use a sqrt time scale; knobs below mirror the handles"
  bypass: "dot per chop-FX cell and per master section; bypass dims the section"
  knob: [drag_vertical, shift_fine_drag, double_click_reset, mouse_wheel, right_click_midi_learn]
  keyboard: {space: transport_preview, '1-8': select_chop, escape: close_flyout_or_overlay, tab: toggle_page, m: main_page, f: fx_page, h: beat_repeat_hold}
  main_page_unchanged: [strip, boxes, note_length, lane_strip, chop_section, flyouts, chop_detail_overlay]

note_length_model:
  straight: {"1/4": 4, "1/8": 8, "1/16": 16, "1/32": 32}
  triplet: {"1/4T": 6, "1/8T": 12, "1/16T": 24, "1/32T": 48}
  dotted: {"1/4.": "3 (last box 2/3 wide)", "1/8.": "6 (last box 1/3 wide)", "1/16.": "11 (last box 2/3 wide)", "1/32.": "22 (last box 1/3 wide)"}
  events_are_time_based: true

layers:  # header is always visible; main and fx are mutually exclusive pages; flyouts/overlay are popovers over main

  - id: header
    layer: header
    title: ""
    rect: {x: 0, y: 0, w: 1100, h: 54}
    always_visible: true  # both pages
  - id: strip_a
    layer: main
    title: "SAMPLE"
    rect: {x: 15, y: 60, w: 1070, h: 152}
    visible_when: page == MAIN
  - id: strip_b
    layer: main
    title: "PATTERN"
    rect: {x: 15, y: 220, w: 1070, h: 348}
    visible_when: page == MAIN
  - id: chop
    layer: main
    title: "CHOP"
    rect: {x: 15, y: 576, w: 380, h: 129}
    visible_when: page == MAIN
  - id: br
    layer: main
    title: "BEAT REPEAT"
    rect: {x: 403, y: 576, w: 380, h: 129}
    visible_when: page == MAIN
  - id: master
    layer: main
    title: "MASTER"
    rect: {x: 791, y: 576, w: 294, h: 129}
    visible_when: page == MAIN
  - id: fl_slice
    layer: fl_slice
    title: "SLICING"
    rect: {x: 785, y: 122, w: 300, h: 166}
    opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
  - id: fl_mastermore
    layer: fl_mastermore
    title: "MASTER - MORE"
    rect: {x: 815, y: 462, w: 270, h: 106}
    opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
  - id: fl_set
    layer: fl_set
    title: "SETTINGS"
    rect: {x: 815, y: 62, w: 270, h: 114}
    opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
  - id: overlay
    layer: overlay
    title: ""
    rect: {x: 280, y: 150, w: 540, h: 310}
    opens_on: CHOP section 'more' button, double-click filled box or strip chop; Esc/scrim/close dismisses
  - id: fx_br
    layer: fx
    title: "BEAT REPEAT"
    rect: {x: 15, y: 60, w: 330, h: 645}
    visible_when: page == FX
  - id: fx_chop
    layer: fx
    title: "CHOP FX"
    rect: {x: 353, y: 60, w: 360, h: 645}
    visible_when: page == FX
  - id: fx_master
    layer: fx
    title: "MASTER"
    rect: {x: 721, y: 60, w: 364, h: 645}
    visible_when: page == FX

sections:  # grouped cells inside the FX page panels (each may carry a bypass dot)
  - id: c_dist
    parent: fx_chop
    title: "DISTORTION"
    rect: {x: 361, y: 92, w: 344, h: 146}
    bypass_param: chop_dist_on
  - id: c_filt
    parent: fx_chop
    title: "FILTER"
    rect: {x: 361, y: 246, w: 344, h: 146}
    bypass_param: chop_filt_on
  - id: c_env
    parent: fx_chop
    title: "AMP ENVELOPE  (AHDSR)"
    rect: {x: 361, y: 400, w: 344, h: 297}
  - id: m_tone
    parent: fx_master
    title: "1  TILT EQ + HP"
    rect: {x: 729, y: 92, w: 348, h: 96}
    bypass_param: master_tone_on
  - id: m_sat
    parent: fx_master
    title: "2  TAPE SATURATION"
    rect: {x: 729, y: 192, w: 348, h: 96}
    bypass_param: master_sat_on
  - id: m_width
    parent: fx_master
    title: "3  STEREO WIDTH"
    rect: {x: 729, y: 292, w: 348, h: 96}
    bypass_param: master_width_on
  - id: m_delay
    parent: fx_master
    title: "4  TEMPO DELAY"
    rect: {x: 729, y: 392, w: 348, h: 96}
    bypass_param: master_delay_on
  - id: m_verb
    parent: fx_master
    title: "5  PLATE REVERB"
    rect: {x: 729, y: 492, w: 348, h: 96}
    bypass_param: master_verb_on
  - id: m_out
    parent: fx_master
    title: "6  OUTPUT + LIMITER"
    rect: {x: 729, y: 592, w: 348, h: 96}
    bypass_param: master_limiter_on

controls:
  - id: wordmark
    type: label
    layer: header
    panel: header
    position: {x: 15, y: 15}
    size: {width: 110, height: 24}
    label: "chopline"
    decorative: true
    scope: ui  # UI-only state (not persisted to the processor)
  - id: preset_prev
    type: button  # icon button
    layer: header
    panel: header
    position: {x: 140, y: 15}
    size: {width: 24, height: 24}
    glyph: "prev"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: preset_name
    type: combo
    layer: header
    panel: header
    position: {x: 174, y: 15}
    size: {width: 188, height: 24}
    label: "Preset"
    options: ["Chops / Vowel Hop", "Chops / Staccato Verse", "Glitch / Tape Stutter Run", "Stutter / Syllable Roll", "Tape / Slow Wobble", "Granular / Breath Cloud"]
    default: "Chops / Vowel Hop"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: preset_next
    type: button  # icon button
    layer: header
    panel: header
    position: {x: 372, y: 15}
    size: {width: 24, height: 24}
    glyph: "next"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: pattern_slot
    type: seg
    layer: header
    panel: header
    position: {x: 416, y: 15}
    size: {width: 214, height: 24}
    label: "Pattern slot"
    options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    default: "A"
    scope: apvts  # APVTS global (automatable, stable parameter ID)
  - id: transport_play
    type: toggle
    layer: header
    panel: header
    position: {x: 650, y: 15}
    size: {width: 72, height: 24}
    label: "Play"
    default: false
    glyph: "play"
    scope: mock_only  # mock only: production uses host transport
  - id: bpm
    type: field
    layer: header
    panel: header
    position: {x: 732, y: 15}
    size: {width: 84, height: 24}
    label: "BPM"
    default: 124
    range: [40, 240]
    unit: ""
    scope: host_readonly  # read from AudioPlayHead
  - id: br_badge
    type: label
    layer: header
    panel: header
    position: {x: 826, y: 15}
    size: {width: 120, height: 24}
    label: "Beat Repeat hold badge (visible only while HOLD is on)"
    decorative: true
    scope: ui  # UI-only state (not persisted to the processor)
  - id: settings
    type: button  # icon button
    layer: header
    panel: header
    position: {x: 1057, y: 15}
    size: {width: 28, height: 24}
    label: "Settings"
    glyph: "gear"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: waveform
    type: display
    layer: main
    panel: strip_a
    position: {x: 27, y: 90}
    size: {width: 830, height: 110}
    label: "Sample strip"
    kind: "waveform"
    scope: slice_map  # SliceMap / sampler model state
  - id: sampler_load
    type: button
    layer: main
    panel: strip_a
    position: {x: 873, y: 90}
    size: {width: 148, height: 28}
    label: "Load sample"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: slice_more
    type: button  # icon button
    layer: main
    panel: strip_a
    position: {x: 1031, y: 90}
    size: {width: 42, height: 28}
    label: "More slicing"
    glyph: "dots"
    scope: ui  # UI-only state (not persisted to the processor)
  - id: slice_mode
    type: combo
    layer: main
    panel: strip_a
    position: {x: 873, y: 128}
    size: {width: 200, height: 28}
    label: "Slice mode"
    options: ["Transient", "Grid", "Equal", "Manual"]
    default: "Transient"
    prefix: "SLICE"
    scope: slice_map  # SliceMap / sampler model state
  - id: slice_sensitivity
    accent_knob: black  # v5: the section's one black dome
    type: knob
    layer: main
    panel: strip_a
    position: {x: 873, y: 166}
    size: {width: 110, height: 40}
    label: "SENS"
    default: 55
    range: [0, 100]
    unit: "%"
    compact: true
    scope: slice_map  # SliceMap / sampler model state
  - id: sampler_file
    type: readout
    layer: main
    panel: strip_a
    position: {x: 993, y: 166}
    size: {width: 80, height: 40}
    label: "file"
    scope: sample_state  # sample store state
  - id: note_duration
    type: seg
    layer: main
    panel: strip_b
    position: {x: 27, y: 254}
    size: {width: 280, height: 40}
    label: "Note length"
    options: ["1/4", "1/8", "1/16", "1/32"]
    captions: ["quarter", "eighth", "16th", "32nd"]
    default: "1/16"
    hero: true
    scope: pattern_model  # PatternModel state (per pattern slot)
  - id: note_triplet
    type: toggle
    layer: main
    panel: strip_b
    position: {x: 317, y: 254}
    size: {width: 40, height: 40}
    label: "T"
    default: false
    tip: "Triplet"
    scope: pattern_model  # PatternModel state (per pattern slot)
  - id: note_dotted
    type: toggle
    layer: main
    panel: strip_b
    position: {x: 367, y: 254}
    size: {width: 40, height: 40}
    label: "D"
    default: false
    tip: "Dotted"
    scope: pattern_model  # PatternModel state (per pattern slot)
  - id: pattern_length
    type: combo
    layer: main
    panel: strip_b
    position: {x: 447, y: 260}
    size: {width: 100, height: 28}
    label: "Pattern length"
    options: ["1 bar", "2 bars", "4 bars"]
