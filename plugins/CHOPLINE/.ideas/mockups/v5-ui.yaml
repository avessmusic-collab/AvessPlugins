v4_composition:
  vs_v3: "Added: page_nav (MAIN | FX) in the header; the whole FX layer (3 panels, 9 sections, ~70 controls). Changed on MAIN: header badge shortened to 'REPEAT HOLD' (120w) to make room for the nav; br_interval gains '4 bars'; br_grid gains 1/2, 1/4, 1/64, 1/8T, 1/32T; chop_dist_type gains Hard clip + Downsample; chop overlay 'FILTER' knob is now the filter CUTOFF (log Hz display); master_ceiling default -0.3 dBFS (spec). Everything else on MAIN is byte-for-byte v3 behaviour."
  fx_structure:
    beat_repeat: [br_mode, br_hold, br_freeze, br_rnd_grid, br_interval, br_offset, br_grid, br_gate, br_chance, br_decay, br_pdecay, br_accel, br_sweep, br_reverse, br_filter_mode, br_mix, br_preview]
    chop_fx: [dist: type/drive/tone/mix/out/auto_gain, filter: type/slope/cutoff/reso/env_amt, amp_env: attack/hold/decay/sustain/release + draggable AHDSR display]
    master: [tilt_eq+hp, tape_saturation, stereo_width+mono_below, tempo_delay, plate_reverb, output+limiter(-0.3 dBFS)]
  mirrored_params_main_to_fx: [br_hold, br_auto/br_mode, br_interval, br_grid, br_chance, br_decay, chop_drive, chop_dist_type, chop_filter, chop_release, master_tone, master_sat, master_width, master_output, master_ceiling, master_delay_rtn, master_verb_rtn]

note_for_production: |
  Pages are two juce::Component children toggled by setVisible; both stay alive so the playhead/meters never stop. Mirrored controls attach to the same
  APVTS parameter (or the same per-chop SliceMap field) through separate attachments. Per-chop FX fields live in the SliceMap like pitch/drive. The AHDSR
  display is a custom Component with 4 draggable handles writing the same five per-chop fields as the knobs below it.

validation:
  tool: python validator (yq unavailable); bounds, 15px edge padding, overlap per page (header+main, header+fx, each popover), panel + section overlap, containment in section/panel, min sizes, mirror consistency, 10px gaps
  controls_checked: 133
  sections_checked: 9
  errors: 0
  warnings: 3   # intentional 2px gaps between decorative captions and the control they label (same as v4)
  skin_checks: [html_yaml_geometry_identical_to_v4, no_viewport_units, html_body_100pct, user_select_none, contextmenu_disabled, light_theme_screenshots_both_pages]
