# CHOPLINE v17 = v16 with darker ink / elements only (colour + stroke weight; layout, controls, interactions identical to v16). v16 = v15 restyled to the Sonisto wireframe reference (flat light cards, hairline-grid displays, flat notch knobs, tiny uppercase lettering, mini toggles) + narrower FX modules with titles / bypass inside the cards + compact envelope. Structure / controls / interactions unchanged from v15.
# NOTE: production UI is NATIVE JUCE; v17-ui-test.html is a visual/interaction reference only. Positions are absolute window px at 100% (1100x720).
plugin: CHOPLINE
version: 17
supersedes: v16 (v1-v16 kept untouched on disk / in git history)
source_spec: plugins/CHOPLINE/.ideas/chopline-spec.md
window:
  width: 1100
  height: 720
  resizable: true
  scale_range:
  - 0.75
  - 2.0
  fixed_aspect: true
  edge_padding: 15
pages:
  nav_control: page_nav
  main:
    layers:
    - header
    - main
    popovers:
    - fl_slice
    - fl_mastermore
    - fl_set
    - overlay
  fx:
    layers:
    - header
    - fx
    popovers: []
  persistence: page is UI-only state; switching closes open flyouts/overlay, keeps selection, pattern, transport, BR hold state
  layout_fx: 'TWO centred columns (even 82 px outer gutters, 16 px between): CHOP 360w | MASTER 560w (v15: 400 / 658). Every module is a hairline white card with its title top-left INSIDE the card (10 px
    from the edge) and its bypass mini-toggle top-right INSIDE the card (10 px from the right edge, 5 px from the top). CHOP = PLAYBACK 114 + compact ENVELOPE 288 (v15: 471; AHDSR display 332x176, five
    50x54 knobs on one row). MASTER = FILTER / DISTORTION (560 wide) / WIDTH | OUTPUT (274 each, 12 px apart) / DELAY / REVERB: five rows of 108 px, 15 px gaps, 14 px content margins. The CHOP / MASTER
    column containers are transparent (no card) so the module cards are the only surfaces.'
styling:
  style: wireframe_light_flat
  lineage: 'v16 reskins v15 to the Sonisto Audio Projects ''wireframe exploration'' reference (/Users/avess/Desktop/original-677a34aca661cff2d68698309c8db99b.webp): flat paper-white / very light grey rounded
    cards on a light grey page, hairline borders, very soft small shadows (no neumorphism), light hairline-grid displays instead of dark screens, small flat white knobs with a crisp dark notch, tiny wide-tracked
    uppercase labels, mono value pills, iOS-style mini toggles, thin faders with rounded dark caps, side-by-side card modules. Supersedes the v12-v15 CORRUPTR-derived cool-grey + dark-screen tokens; the
    blue accent #3a6df0 and Beat Repeat red #ff5a4f are kept.'
  fonts:
    ui: Inter, -apple-system, 'Segoe UI', 'SF Pro Text', sans-serif
    mono: '''SF Mono'', ''JetBrains Mono'', ui-monospace, Menlo, monospace'
  colors:
    page: '#dcdcde'
    chassis: '#e8e8ea (flat plate 1088x708 at 6,6, radius 26, 1px inner hairline)'
    card: '#f7f7f8 (panels: MAIN strips, bottom bar, flyouts #fafafa)'
    cell: '#fdfdfd (FX module cards, 1px hairline, radius 12)'
    hairline: rgba(0,0,0,.14) (controls, cells, displays, panels); rgba(0,0,0,.10) tray
    grid: rgba(0,0,0,.10) 22px hairline grid on displays (12px on box mini-waveforms)
    display: '#fcfcfd near-white + hairline grid + 1px hairline border, radius 10; curves / waveforms are dark strokes (#0d0d0f, 1.7-1.9px), nodes are ring circles (white fill, dark stroke)'
    text: '#0d0d0f (ink)'
    text_dim: '#48484c'
    text_faint: '#3a3a3e (secondary); labels / section titles #2a2a2e (tiny uppercase)'
    text_tertiary: '#a4a4aa (dim / disabled stays visibly lighter)'
    knob: 'face #fdfdfd, 1.1px rgba(0,0,0,.55) outline, notch #0d0d0f 2.2px, track rgba(0,0,0,.22) 1.4px, value arc #0d0d0f 2px, no gradient / shadow'
    toggle: 'iOS-style mini switch 24x14: off #c4c4c9, on #0d0d0f, white 10px thumb'
    segment_active: '#0d0d0f fill, white text'
    pill: '#ffffff, 1px hairline, shadow 0 1px 1px rgba(0,0,0,.05)'
    accent_blue: '#3a6df0 - THIN accent only: selection ring / outline, playhead hairline (1.5px), cutoff marker, ceiling marker, MIDI dot, GR meter, loop / START-END flags in the sample editor'
    accent_red: '#ff5a4f - Beat Repeat hold ONLY (HOLD fill, armed ring 1px, REPEAT HOLD badge outline, hold playhead)'
  chop_identity: 'greyscale only: 8 distinct shades + the index number + the mini waveform'
  chop_shades_on_displays:
  - '#0d0d0f'
  - '#7a7a7a'
  - '#2e2e2e'
  - '#969696'
  - '#4a4a4a'
  - '#aaaaaa'
  - '#1c1c1c'
  - '#868686'
  chop_shades_on_cards:
  - '#161616'
  - '#929292'
  - '#3c3c3c'
  - '#b4b4b4'
  - '#5e5e5e'
  - '#cfcfcf'
  - '#2a2a2a'
  - '#a0a0a0'
  lettering:
    labels: '8-8.5px uppercase, letter-spacing .12-.24em, #2a2a2e (VOLUME / PAN / RATE style)'
    values: 'mono pill: 9px mono, 1px hairline, white, radius 999 (shown on hover / drag in place of the label)'
    section_titles: '8.5px 600 uppercase .24em; FX column titles #2a2a2e with a small glyph'
    group_labels_rotated: not used in v16 (titles sit top-left inside each card as requested)
  knobs:
    main: 40px dial, label at 46
    compact: 50x54 cell, 36px dial
    tick_dots: none (kept off; only where useful)
  faders_meters: thin 4px rounded tracks (rgba(0,0,0,.16)) with a #0d0d0f rounded cap; GR track turns blue while limiting
  boxes:
    card: white 1px hairline, radius 11, 1px soft shadow
    filled: faint grey tint of the chop shade + index chip + mini waveform on a small hairline-grid window
    tray: '#efeff1 hairline tray'
    playhead: 1.5px blue hairline (red while Beat Repeat holds)
    selected: 1.5px blue outline + blue ring on the index chip of the selected chop
    playing: pressed grey + inset hairline
  beat_repeat_hold:
    header_badge: white pill with 1px red outline 'REPEAT HOLD' (both pages)
    panel: '1px red ring on the MAIN bottom-bar card; HOLD pad fills #ff5a4f'
  bypass_toggle: iOS-style mini toggle top-right inside the module card; dark = active, grey = bypassed; bypassed module dims to 45%
  radius:
    panel: 16
    cell: 12
    display: 10
    box: 11
    pill: 999
  window_note: tokens mirrored as CSS custom properties in v17-ui-test.html (:root, the v16 block + v17 override block)
interaction:
  page_nav:
  - click_segmented_MAIN_FX
  - Tab_toggles
  - M_main
  - F_fx
  - state_preserved_across_switch
  - transport_keeps_running
  shared_params: 'MAIN bottom bar and FX page share ONE value: master_filter_cutoff, master_dist_drive, master_width, master_output, master_ceiling, master_delay_rtn, master_verb_rtn, bpm, chop_mode / chop_reverse
    / chop_warp / chop_release (overlay <-> FX). Beat Repeat has a single instance (MAIN bottom bar) so it has no mirrors.'
  hold_pad: removed with the FX BR column. MAIN HOLD button stays a latching toggle; H key is momentary on either page (header badge shows REPEAT HOLD on both pages)
  chop_fx_target: CHOP FX always edits the selected chop (same selection as MAIN); prev/next arrows in the panel bar and keys 1-8 change it
  env_display: 'AHDSR display: drag the 4 handles; values shown only for the hovered / dragged handle; knobs below mirror the handles'
  bypass: dot per chop-FX cell and per master section; bypass dims the section
  knob:
  - drag_vertical
  - shift_fine_drag
  - double_click_reset
  - mouse_wheel
  - right_click_midi_learn
  - value_shown_on_hover_or_drag
  keyboard:
    space: transport_preview
    1-8: select_chop
    escape: close_flyout_or_overlay
    tab: toggle_page
    m: main_page
    f: fx_page
    h: beat_repeat_hold
    enter: open_chop_sample_editor
    MOCKUP_ONLY_q_w_e_r_t_y_u_i: fire chops 1-8 as simulated MIDI notes (base + 0..7); NOT a product element
  bpm_readout: 'BPM is NOT in the header; small light hairline readout in MASTER: MAIN master panel title row (x915,y603) and FX MASTER panel bar (x955,y65), mirrored'
  chop_editing_without_panel: 'select = click strip chop / filled box / FX-page CHOP arrows / keys 1-8; edit = double-click a filled box or strip chop, the ''...'' button next to the chop chip, or Enter:
    opens the overlay whose top is the chop sample editor (see chop_sample_editor), below it mode, reverse, snap, warp, readouts and the knob row'
  main_page_unchanged:
  - strip
  - boxes
  - note_length
  - lane_strip
  - flyouts
  - chop_detail_overlay
  note_length_button: ONE compact button (64x24) in the grid row replacing the 1/4-1/8-1/16 pills and the separate T / D toggles. Shows the value ("1/16"). Click cycles 1/4 > 1/8 > 1/16 (wrap, T/D variant
    kept); click-and-hold, right-click or the caret opens a menu with all 9 values incl. T and D variants. Tooltip "Note length".
note_length_model:
  straight:
    1/4: 4
    1/8: 8
    1/16: 16
  triplet:
    1/4T: 6
    1/8T: 12
    1/16T: 24
  dotted:
    1/4.: 3 (last box 2/3 wide)
    1/8.: 6 (last box 1/3 wide)
    1/16.: 11 (last box 2/3 wide)
  events_are_time_based: true
  max_boxes: 24 (12 columns x 2 rows)
  menu_values: 1/4 1/4T 1/4D 1/8 1/8T 1/8D 1/16 1/16T 1/16D (value string = base + optional T or D suffix; dotted displays as "D")
