midi:
  plugin_format: VST3 + AU instrument (juce::AudioProcessor, acceptsMidi = true, isSynth = true) with stereo output; optional sidechain bus reserved for Phase 6. Standalone build also provided. Compatible
    with Ableton Live and every major host (Logic, Cubase, Reaper, Bitwig, FL Studio, Studio One, ...).
  host_integration: tempo / transport / bar position read from AudioPlayHead (host-synced; no in-plugin transport). MIDI input from the host track. Drag-out MIDI of the pattern per spec.
  map:
    chop_trigger: 'chop N plays from MIDI note base + N (spec section 4 "C1 + N"); N is the 0-based chop index shown as chop N+1. Default base C1 = MIDI note 36 (Ableton naming: C3 = 60). Example: note
      36 -> chop 1, 37 -> chop 2, ..., 47 -> chop 12.'
    velocity: 'velocity-sensitive: note velocity scales chop gain through the per-chop chain (same path as the pattern step velocity lane)'
    base_note: 'configurable: Settings flyout combo midi_base (C0 / C1 / C2 / C3, default C1); stored as an APVTS parameter'
    beat_repeat_notes: 'spec section 7: MIDI performance notes, one per grid size (C3 = 1/4, C#3 = 1/8, ...) - not surfaced in the mockup'
    transport_stopped: chop MIDI triggers still play while the host transport is stopped (spec section 8)
    out_of_range: notes outside base .. base + chopCount - 1 are ignored by the chop trigger
  ui:
    activity_dot: 'header control midi_in (x452 y15 54x24): idle light grey, lights blue ~220 ms on every note-on'
    strip_feedback: the triggered strip chop flashes blue; boxes of that chop flash
  mockup_only_stand_in: computer keys Q W E R T Y U I fire chops 1-8 (notes base..base+7), logging "[CHOPLINE] midi note <n> -> chop <k>". Key repeat and Cmd/Ctrl/Alt chords ignored. NOT a product element.
chop_sample_editor:
  origin: chop-editor overlay taken from v13 only; v13 strip changes (mini-map band, always-visible marker grips, double-click-adds-marker, wheel zoom) are NOT part of v14 - Strip A is exactly v12 (clean
    strip, no band, nothing above the waveform, nothing drawn above it)
  state_note: ALL fields are SliceMap / per-chop model state saved with the plugin state, NOT APVTS parameters. Only the existing chop params (pitch, release, delay, verb, unison, mode, reverse, warp) stay
    APVTS; midi_base is APVTS. Per-chop drive / distortion no longer exist (v15).
  per_chop_model_fields:
    startOffset:
      type: 'signed seconds (production: signed frames)'
      default: 0
      meaning: fine-trim of the chop start relative to its slice marker; negative = reaches back into the previous slice
      limits: effective start in [previous chop marker, effective end - minLen]; minLen = slice_min_len (20-500 ms, default 80)
      ui: START flag; readout START
      snap: zero-cross snap when slice_zero_cross is on
    endOffset:
      type: 'signed seconds (production: signed frames)'
      default: 0
      meaning: fine-trim of the chop end relative to its next slice marker; positive = reaches into the next slice
      limits: effective end in [effective start + minLen, end of next chop]
      ui: END flag; readout END + LENGTH
      snap: same as startOffset
    fadeInMs:
      type: float ms
      range:
      - 0
      - 20
      default: 2
      meaning: equal-power declick fade at chop start, non-destructive
      ui: fade-in corner grip, 0.5 ms steps; readout FADE IN
      mockup_mapping: 'handle travel stylised: 54 px = 20 ms'
    fadeOutMs:
      type: float ms
      range:
      - 0
      - 20
      default: 2
      meaning: equal-power declick fade at chop end
      ui: fade-out corner grip; readout FADE OUT
    loopStart:
      type: normalised 0..1 of the trimmed chop
      default: 0.25
      meaning: loop start when playback mode = Loop (spec section 6)
      limits: loopStart <= loopEnd - 0.05
      ui: brace start bar + bottom grip (Loop mode only)
    loopEnd:
      type: normalised 0..1 of the trimmed chop
      default: 0.75
      meaning: loop end
      ui: brace end bar + bottom grip
    loopXfade:
      type: ms
      range:
      - 0
      - 200
      default: 10
      meaning: crossfaded loop point; clamped to half the loop length
      ui: crossfade diamond on the brace + XFADE knob (mirrored)
      mockup_mapping: diamond travel 60 px = 200 ms
  overlay_rect:
    x: 150
    y: 120
    w: 800
    h: 468
  order_top_to_bottom:
  - chip + close (y136)
  - sample editor 768x260 (y164)
  - 'row: MODE | REVERSE | SNAP ZERO-X | WARP seg (y434)'
  - 'readouts: START END LENGTH FADE IN FADE OUT LOOP (y472)'
  - 'knobs: PITCH RELEASE DELAY VERB UNISON XFADE, evenly spaced over the 768 px width (y512; DRIVE and DIST type removed in v15)'
  handles:
    start_end: blue flags (S right of the start line, E left of the end line), +/-7 px hit zone; move inside neighbour-slice limits; double-click resets
    fades: down-pointing triangles at the top corners, wedge envelopes; drag 0-20 ms
    loop_brace: 'only when mode = Loop: translucent band, brace line, start/end bars with bottom grips, crossfade diamond + X glyph'
    direction: chevron points left when Reverse is on
    audition: click inside the editor waveform = audition from that point (white playhead sweeps; reverse backwards; Loop wraps in the brace; 2.6 s cap) + console log; production triggers the chop voice
      from that position
  view: chop +/-30%, clamped to the neighbour slices; refit on open / chop change
  replaces: chop_preview display (removed)
  colour_rules: blue = selection/handles/loop; red remains Beat-Repeat-only
