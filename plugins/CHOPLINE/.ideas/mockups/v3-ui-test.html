<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHOPLINE UI Mockup v3</title>
<style>
/* CHOPLINE v3 - blend of v1 density and v2 simplicity: strip + boxes + 4-lane strip + visible CHOP / BEAT REPEAT / MASTER bar.
   VISUAL / INTERACTION REFERENCE ONLY - production UI is native JUCE (not WebView). */
:root {
  --bg: #0d0e11; --header: #0a0b0e; --panel: #121419; --surface: #0f1115;
  --line: #22262e; --line2: #2d323c; --text: #e6e8ec; --dim: #8b92a0; --faint: #586070;
  --accent: #2bd4e6; --amber: #ffa21f; --track: #272b34;
  --ui: Inter, "SF Pro Text", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; }
body {
  user-select: none; -webkit-user-select: none; cursor: default; overflow: hidden;
  background: #08090b; color: var(--text); font-family: var(--ui); font-size: 11px;
  -webkit-font-smoothing: antialiased;
}
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1100px; height: 720px; background: var(--bg); transform-origin: 0 0; overflow: hidden; }
.layer { position: absolute; left: 0; top: 0; width: 1100px; height: 720px; pointer-events: none; }
.layer > * { pointer-events: auto; }
.layer.pop { display: none; z-index: 40; }
.layer.pop.open { display: block; }
#L_overlay { z-index: 50; }
#L_overlay .scrim { position: absolute; left: 0; top: 0; width: 1100px; height: 720px; background: rgba(6,7,9,.62); }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.pop .panel, #L_overlay .panel { border-color: var(--line2); box-shadow: 0 14px 40px rgba(0,0,0,.55); background: #14171d; }
.pop.amber .panel { border-color: rgba(255,162,31,.5); }
.pbar { position: absolute; left: 0; right: 0; top: 0; height: 24px; border-bottom: 1px solid var(--line); }
.ptitle { position: absolute; left: 12px; top: 0; line-height: 24px; font-size: 10px; letter-spacing: .14em; font-weight: 600; color: var(--dim); }
.pop.amber .ptitle { color: var(--amber); }
.pstatus { position: absolute; right: 12px; top: 0; line-height: 24px; font-size: 10px; letter-spacing: .06em; font-family: var(--mono); color: var(--faint); }
#header { position: absolute; left: 0; top: 0; width: 1100px; height: 54px; background: var(--header); border-bottom: 1px solid var(--line); }
.ctl { position: absolute; }
canvas { display: block; }
.disp { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.disp canvas { position: absolute; left: 0; top: 0; }

#wordmark { font-size: 17px; font-weight: 650; letter-spacing: -.025em; line-height: 24px; color: var(--text); display: flex; align-items: center; gap: 8px; }
#wordmark i { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
#wordmark i b { display: block; width: 3px; border-radius: 1px; }

/* knob */
.knob { cursor: ns-resize; }
.knob svg { position: absolute; left: 6px; top: 0; }
.knob .kv { position: absolute; left: -4px; right: -4px; top: 42px; font: 10px/12px var(--mono); color: var(--dim); text-align: center; }
.knob .kl { position: absolute; left: -4px; right: -4px; top: 54px; font-size: 9.5px; line-height: 12px; letter-spacing: .07em; color: var(--faint); font-weight: 600; text-align: center; }
.knob.active .kv, .knob:hover .kv { color: var(--text); }
.knob.amber.active .kv, .knob.amber:hover .kv { color: var(--amber); }
.knob.compact svg { left: 0; }
.knob.compact .kl { left: 52px; right: 0; top: 4px; text-align: left; font-size: 9.5px; }
.knob.compact .kv { left: 52px; right: 0; top: 18px; text-align: left; font: 600 13px/18px var(--mono); color: var(--text); }
.knob.learn svg { filter: drop-shadow(0 0 4px var(--accent)); }

/* combo / seg / toggle / button / field */
.combo { background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; display: flex; align-items: center; padding: 0 8px; gap: 6px; cursor: pointer; }
.combo:hover { border-color: #3c4250; }
.combo .pf { font-size: 9px; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
.combo .cv { flex: 1; font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo .ch { width: 6px; height: 6px; border-right: 1.5px solid var(--dim); border-bottom: 1.5px solid var(--dim); transform: rotate(45deg) translate(-1px, -1px); }
.menu { position: absolute; z-index: 90; background: #171a20; border: 1px solid var(--line2); border-radius: 4px; padding: 3px; max-height: 300px; overflow: auto; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.menu div { height: 22px; line-height: 22px; padding: 0 9px; border-radius: 3px; font-size: 11px; color: var(--text); white-space: nowrap; }
.menu div:hover { background: #232832; }
.menu div.on { color: var(--accent); }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; padding: 2px; gap: 2px; }
.seg b { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 500; font-size: 10.5px; color: var(--dim); border-radius: 3px; cursor: pointer; padding: 0 6px; white-space: nowrap; border: 1px solid transparent; transition: background .08s, color .08s; }
.seg b:hover { color: var(--text); }
.seg b.on { background: #232832; color: var(--text); }
.seg.hero { padding: 3px; gap: 3px; background: #0b0c10; }
.seg.hero b { font: 600 15px/16px var(--mono); gap: 2px; }
.seg.hero b small { font: 500 9px/10px var(--ui); letter-spacing: .06em; color: var(--faint); text-transform: uppercase; }
.seg.hero b.on { background: rgba(43,212,230,.13); border-color: var(--accent); color: var(--text); }
.seg.hero b.on small { color: var(--accent); }
.btn, .tgl { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--dim); cursor: pointer; text-transform: uppercase; white-space: nowrap; }
.btn:hover, .tgl:hover { color: var(--text); border-color: #3c4250; }
.btn:active { background: #1b1f26; }
.tgl.on { color: var(--accent); border-color: var(--accent); background: rgba(43,212,230,.10); }
.tgl.mod { font: 700 15px var(--mono); letter-spacing: 0; }
.tgl.play { font-size: 10px; }
.tgl.play.on { background: var(--accent); color: #06161a; }
.btn.amber { color: var(--amber); border-color: rgba(255,162,31,.45); }
.btn.amber.on { color: #1a1105; background: var(--amber); border-color: var(--amber); }
.btn.primary { color: #06161a; background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: #06161a; }
.ibtn { display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line2); border-radius: 4px; color: var(--dim); cursor: pointer; }
.ibtn:hover { color: var(--text); border-color: #3c4250; background: #14171d; }
.ibtn.on { color: var(--accent); border-color: var(--accent); background: rgba(43,212,230,.10); }
.ibtn.amber.on, .ibtn.amber:hover { color: var(--amber); border-color: rgba(255,162,31,.6); }
.ibtn.armed::after { content: ""; position: absolute; right: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
.field { background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; cursor: ns-resize; overflow: hidden; }
.field:hover { border-color: #3c4250; }
.field .fl { font-size: 9px; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
.field .fv { font: 11px var(--mono); color: var(--text); }
.readout { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; padding: 0 9px; gap: 8px; font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; }
.readout .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.readout.file { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; background: transparent; border: 0; padding: 0; }
.readout.file b { font: 600 11px var(--ui); color: var(--text); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.readout.file span { font: 10px var(--mono); color: var(--faint); }
.hint { font-size: 10.5px; line-height: 14px; color: var(--faint); display: flex; align-items: center; }
.hint b { color: var(--dim); font-weight: 600; }
#cpu_meter { display: flex; align-items: center; gap: 8px; padding: 0 9px; }
#cpu_meter .cl { font-size: 9px; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
#cpu_meter .cb { flex: 1; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
#cpu_meter .cb i { display: block; height: 100%; width: 10%; background: var(--accent); }
#cpu_meter .cv { font: 10.5px var(--mono); color: var(--dim); width: 36px; text-align: right; }

/* ---------- boxes (the hero) ---------- */
#step_boxes { background: #0b0c10; }
.box { position: absolute; border-radius: 4px; background: #11141a; border: 1px solid var(--line); overflow: hidden; cursor: pointer; transition: border-color .08s, background .08s; }
.box .lab { position: absolute; left: 7px; top: 5px; font: 600 9.5px/12px var(--mono); color: var(--faint); letter-spacing: .02em; }
.box.beat .lab { color: var(--dim); }
.box .plus { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; opacity: 0; transition: opacity .1s; }
.box .plus::before, .box .plus::after { content: ""; position: absolute; background: var(--faint); }
.box .plus::before { left: 8px; top: 2px; width: 2px; height: 14px; }
.box .plus::after { left: 2px; top: 8px; width: 14px; height: 2px; }
.box:not(.full):hover { border-color: #3a4150; background: #151921; }
.box:not(.full):hover .plus { opacity: 1; }
.box.full { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 12%, #0f1115); }
.box.full .idx { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font: 700 22px/24px var(--mono); color: var(--cc); letter-spacing: -.02em; }
.box.narrow.full .idx { font-size: 16px; }
.box.full .lab { color: color-mix(in srgb, var(--cc) 70%, #fff 0%); opacity: .75; }
.box canvas { position: absolute; left: 6px; top: auto; bottom: 6px; }
.box .tag { position: absolute; right: 5px; top: 5px; font: 700 8.5px/11px var(--mono); color: #0d0e11; background: var(--cc); padding: 0 4px; border-radius: 2px; letter-spacing: .02em; }
.box.full:hover { border-color: #fff; }
.box.lit { background: color-mix(in srgb, var(--cc) 38%, #0f1115); box-shadow: 0 0 0 1px var(--cc), 0 0 18px color-mix(in srgb, var(--cc) 45%, transparent); }
.box.now:not(.full) { border-color: rgba(43,212,230,.5); }
.box.drop { border-color: var(--accent) !important; background: rgba(43,212,230,.10); }
.boxes-dragging .box:not(.full) { border-style: dashed; border-color: #3a4150; }
#playhead { position: absolute; width: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); border-radius: 1px; display: none; pointer-events: none; z-index: 5; }
#ghost { position: absolute; z-index: 95; pointer-events: none; display: none; width: 58px; height: 36px; border-radius: 4px; font: 700 18px/36px var(--mono); text-align: center; color: #0d0e11; opacity: .92; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
#waveform { cursor: pointer; }
#pageDots { position: absolute; }
/* ---------- v3 additions ---------- */
#P_chop, #P_br, #P_master { background: #111318; }
#P_br .ptitle, #P_br .pstatus { color: var(--amber); }
.panel.armed { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(255,162,31,.35), 0 0 26px rgba(255,162,31,.18); }
#P_br.armed { background: #17140f; }
#br_badge { display: none; align-items: center; gap: 8px; padding: 0 10px; font: 600 10px var(--ui); letter-spacing: .12em; color: var(--amber); border: 1px solid rgba(255,162,31,.5); border-radius: 4px; background: rgba(255,162,31,.08); white-space: nowrap; }
#br_badge.on { display: flex; }
#br_badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.brhold .box.now { border-color: var(--amber); }
.brhold #playhead, .brhold #laneHead { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
#chop_chip, #overlay_chip { padding: 0 8px; gap: 7px; font: 600 10px var(--mono); letter-spacing: .06em; color: var(--text); }
.box.sel { outline: 1.5px solid #e6e8ec; outline-offset: 1px; }
.box .tag2 { position: absolute; right: 5px; bottom: 5px; font: 600 9px/11px var(--mono); color: var(--dim); letter-spacing: .02em; }
#step_lane { background: #0b0c10; cursor: crosshair; }
#laneHead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); display: none; pointer-events: none; z-index: 5; }
#lane_info { font-size: 10.5px; color: var(--faint); }
#lane_info b { color: var(--dim); font-weight: 600; letter-spacing: .08em; margin-right: 8px; }
[data-cid="lane_tab"] b { font-size: 10px; letter-spacing: .08em; font-weight: 600; }
[data-cid="pattern_slot"] b { font: 600 11px var(--mono); padding: 0; }
[data-cid="pattern_slot"] b.on { background: rgba(43,212,230,.13); border-color: var(--accent); color: var(--text); }
[data-cid="chop_warp"] b { font-weight: 600; letter-spacing: .04em; }
#master_limiter { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
#master_limiter .dot { width: 10px; height: 10px; border-radius: 50%; background: #35c490; box-shadow: 0 0 6px rgba(53,196,144,.6); transition: background .1s; }
#master_limiter.hot .dot { background: #ff5c5c; box-shadow: 0 0 8px rgba(255,92,92,.8); }
#master_limiter span { font: 600 8.5px var(--ui); letter-spacing: .1em; color: var(--faint); }
</style>
</head>

        const k = LANE[name].key; ok("lane " + name + " painted high on step " + (i + 1) + " (" + k + "=" + steps[i][k] + ")", steps[i][k] >= (name === "PITCH" ? 8 : name === "RATCHET" ? 3 : name === "PROB" ? 85 : .85));
      }

        const hb = cid("br_hold"); ptr(hb, "pointerdown", ...ctr(hb)); await wait(20);

      }
      if (st === "more") { iconAct("chop_more"); await wait(20); ok("chop detail overlay opened for chop " + (S.sel + 1), S.ovOpen === true); }
      if (st === "master") iconAct("master_more"); if (st === "gear") iconAct("settings"); if (st === "slice") iconAct("slice_more");
      if (st === "closeall") closeAll();

    }
    if (!h.split(",").includes("quiet")) {
      const d = document.createElement("div"); d.id = "selftest"; d.style.cssText = "position:absolute;left:420px;top:62px;z-index:200;font:10px/13px monospace;color:#9fe;background:#000d;padding:6px 10px;border-radius:4px;white-space:pre;pointer-events:none"; d.textContent = out.join("\n") || "(no assertions)"; $stage.appendChild(d);
    }
    window.__selftest = out.join("\n");
    console.log("[CHOPLINE] selftest\n" + out.join("\n"));
  };
  setTimeout(run, 300);
})();
