# CHOPLINE v14 = v12 BASE (user prefers it over v13) + targeted changes: (1) pattern slots A-H removed from the UI (deferred, see not_surfaced_in_mockup.deferred_pattern_slots); (2) note length = ONE compact button (click cycles 1/4>1/8>1/16, hold / right-click / caret = menu with T and D variants); (3) MIDI note triggering documented + visible (see `midi`): chop N = base note (C1 = 36) + N, velocity-sensitive, VST3/AU instrument for Ableton and every major host; header MIDI dot; mockup-only Q-I keys; (4) chop-editor overlay from v13 (see chop_sample_editor) is the only sample editing; Strip A is exactly v12 with nothing above the waveform.
# NOTE: production UI is NATIVE JUCE; v14-ui-test.html is a visual/interaction reference only. Positions are absolute window px at 100% (1100x720).
plugin: CHOPLINE
version: 14
supersedes: v13 (user prefers v12 as the base; v1-v13 kept untouched on disk / in git history)
source_spec: plugins/CHOPLINE/.ideas/chopline-spec.md
window:
  width: 1100
  height: 720
  resizable: true
  scale_range:
  - 0.75
  - 2.0
  fixed_aspect: true
  edge_padding: 15
pages:
  nav_control: page_nav
  main:
    layers:
    - header
    - main
    popovers:
    - fl_slice
    - fl_mastermore
    - fl_set
    - overlay
  fx:
    layers:
    - header
    - fx
    popovers: []
  persistence: page is UI-only state; switching closes open flyouts/overlay, keeps selection, pattern, transport, BR hold state
  layout_fx: 'TWO columns inside the 15px edge frame: CHOP 460w | MASTER 598w, 12px gutter, full height (y 60-705). CHOP = DISTORTION + ENVELOPE only (filter removed). MASTER = FILTER (full width) / TILT
    | SATURATION / WIDTH | OUTPUT / DELAY / REVERB. Beat Repeat is NOT on this page.'
styling:
  style: light_cool_grey_hardware_dark_screens
  palette: corruptr_colour_system
  lineage: 'v12 uses the CORRUPTR palette (plugins/CORRUPTR/Source/ui/public/index.html CSS custom properties are authoritative): cool light grey unit cards on #d2d2d8, #151517 dark screens, ink #1c1c1e
    controls, blue #3a6df0 accent, sparing red #ff5a4f. Structure, layout and interaction are v11.'
  colors:
    page: '#d2d2d8'
    chassis: 'linear #d9dade -> #d2d2d8 (rounded plate 1088x708 at 6,6, radius 30; barely lifted from the page)'
    card: 'linear #eceef1 -> #e3e5ea (unit gradient), 1px border rgba(0,0,0,.06), shadow 0 24px 50px rgba(20,20,24,.16), inset 0 1px 0 rgba(255,255,255,.9); radius 18'
    divider: rgba(0,0,0,.08)
    well: '#dcdde2 (recessed: segmented tracks, trays, cells; inner shadow rgba(20,20,24,.2) + white under-lip)'
    pill: '#ececee gradient #f1f1f3 -> #e8e8eb (combo, buttons, icon buttons), ink text #1c1c1e'
    screen: '#151517 (flat, faint #1b1b1e top lift; inset shadow; canvas content gets a 3px rgba(255,255,255,.14) glow)'
    text: '#1c1c1e'
    text_dim: '#5f5f64 (derived mid between primary and secondary for legible small text)'
    text_faint: '#8e8e93'
    text_tertiary: '#c7c7cc'
    screen_text: '#fafafa'
    screen_text_faint: rgba(206,206,206,.62)
    knob_track: rgba(0,0,0,.14)
    knob_fill: '#1c1c1e'
    toggle_off: '#d1d1d6'
    toggle_on: '#1c1c1e'
    adv_off: '#e2e2e5'
    graph_bg: '#f7f7f8'
    graph_grid: rgba(0,0,0,.08)
    graph_axis: '#a1a1a6'
    accent_blue: '#3a6df0 (selection, playhead, active states, value lines, selected-step ring)'
    accent_blue_on_screen: '#5b87f5 (same hue lifted for contrast on #151517)'
    accent_red: '#ff5a4f (Beat Repeat activity ONLY: HOLD pressed fill + glow, armed panel ring, REPEAT HOLD badge, repeat-hold playhead) - sparing, like CORRUPTR'
  chop_identity: 'greyscale only: 8 distinct shades + the index number + the mini waveform; alternate light/dark so neighbours separate; ink colour auto-contrasts'
  chop_shades_on_screens:
  - '#f5f6f8'
  - '#8f959f'
  - '#d3d6dc'
  - '#6f7580'
  - '#e6e8ec'
  - '#a3a9b3'
  - '#bfc3cb'
  - '#5d636e'
  chop_shades_on_white:
  - '#2f333b'
  - '#9ba1ac'
  - '#555b67'
  - '#c2c6ce'
  - '#747a86'
  - '#dadde2'
  - '#3f444e'
  - '#adb2bb'
  selection_without_hue: selected chop = blue top bar + blue outline on the strip, blue ring around its index chip on every box that uses it, blue ring on the selected step, blue-ringed swatch in the chop
    chip
  fonts:
    primary: Inter, -apple-system, Segoe UI, sans-serif (CORRUPTR --font-body)
    numeric: SF Mono, JetBrains Mono, ui-monospace, monospace (CORRUPTR --font-mono)
    labels: sentence case, 9.5px, mid-grey; panel + section titles caps with 0.16-0.24em tracking
  limiter_led: light grey = ok, blue = hot
  meters: grey -> white -> blue ramp (no green/yellow/red)
  radii_px:
    panel: 18
    cell: 14
    screen: 14
    pill: 999
    box: 12
    icon_button: 9
  knob:
    diameter: 40
    dome: white face (#fff ->
    arc: thin 2px outer track rgba(0,0,0,.14), value arc ink
    sweep_deg: 270
    bipolar_arc_from_centre: true
    accent_knob: none (v12 removes the black accent dome; all knobs identical)
  sliders: no continuous sliders exist in the v4 structure; the slider language (thin track + white pill thumb) is not used. Meters (cpu, output) use thin tracks.
  segmented: recessed pill track, selected = ink
  combo: raised
  mini_switch: ADV-style 26x14 track + white thumb; used for auto, auto gain, reverse, snap zero-X; off
  bypass_toggle: 20px raised round button with power glyph; dark = section active, light grey = bypassed; bypassed section dims to 42%
  boxes:
    tray: recessed light tray
    card: raised white card
    filled: grey-shade chip with index + mini waveform on a small dark inset
    playing: soft pressed + blue edge glow
    selected: 2px blue outline (selected step) + blue ring on index chips of the selected chop
    playhead: blue line on the boxes + lane screen; turns red with glow while Beat Repeat hold is active
  beat_repeat_hold:
    panel: red ring glow on the MAIN bottom-bar card; HOLD pad fills red
    header_badge: dark pill screen with red glow 'REPEAT HOLD' - both pages (the only Beat Repeat trace on the FX page)
    note: the 306x100 FX hold pad is gone with the FX BR column
  fx_module_header:
    size: 504/522 x 22 dark screen inside the panel bar
    content: glowing icon + letter-spaced name; CHOP header also carries the chop chip and prev/next arrows; MASTER header carries the BPM readout
    note: no status text (v8)
  declutter:
    labels: lighter weight (500-600), mid-grey, wider tracking; knob label and value share one slot
    knob_value: hidden until hover/drag - the label fades out and the value takes its place (compact SWING / SENS knobs keep their value visible)
    boxes: only beat numbers (1 2 3 4), no e & a; no ratchet/probability tags on boxes (lane strip shows them)
    lane: value shown only for the selected step
    envelope: A H D S R letters only; the numeric value appears for the hovered / dragged handle
    ticks: slot dividers, axis labels (20 / 1k / 20k, L / R, MONO < Hz, delay time, dBFS status) removed from the FX displays
interaction:
  page_nav:
  - click_segmented_MAIN_FX
  - Tab_toggles
  - M_main
  - F_fx
  - state_preserved_across_switch
  - transport_keeps_running
  shared_params: 'MAIN bottom bar and FX page share ONE value (never two Beat Repeat views any more): master_tone, master_filter_cutoff, master_sat, master_width, master_output, master_ceiling, master_delay_rtn,
    master_verb_rtn, bpm, chop_drive/chop_dist_type/chop_release (overlay <-> FX). Beat Repeat has a single instance (MAIN bottom bar) so it has no mirrors.'
  hold_pad: removed with the FX BR column. MAIN HOLD button stays a latching toggle; H key is momentary on either page (header badge shows REPEAT HOLD on both pages)
  chop_fx_target: CHOP FX always edits the selected chop (same selection as MAIN); prev/next arrows in the panel bar and keys 1-8 change it
  env_display: 'AHDSR display: drag the 4 handles; values shown only for the hovered / dragged handle; knobs below mirror the handles'
  bypass: dot per chop-FX cell and per master section; bypass dims the section
  knob:
  - drag_vertical
  - shift_fine_drag
  - double_click_reset
  - mouse_wheel
  - right_click_midi_learn
  - value_shown_on_hover_or_drag
  keyboard:
    space: transport_preview
    1-8: select_chop
    escape: close_flyout_or_overlay
    tab: toggle_page
    m: main_page
    f: fx_page
    h: beat_repeat_hold
    enter: open_chop_sample_editor
    MOCKUP_ONLY_q_w_e_r_t_y_u_i: fire chops 1-8 as simulated MIDI notes (base + 0..7); NOT a product element
  bpm_readout: 'BPM is NOT in the header; small dark inset readout in MASTER: MAIN master panel title row (x915,y603) and FX MASTER panel bar (x955,y65), mirrored'
  chop_editing_without_panel: 'select = click strip chop / filled box / FX-page CHOP arrows / keys 1-8; edit = double-click a filled box or strip chop, the ''...'' button next to the chop chip, or Enter:
    opens the overlay whose top is the chop sample editor (see chop_sample_editor), below it mode, reverse, snap, warp, readouts and the knob row'
  main_page_unchanged:
  - strip
  - boxes
  - note_length
  - lane_strip
  - flyouts
  - chop_detail_overlay
  note_length_button: ONE compact button (64x24) in the grid row replacing the 1/4-1/8-1/16 pills and the separate T / D toggles. Shows the value ("1/16"). Click cycles 1/4 > 1/8 > 1/16 (wrap, T/D variant
    kept); click-and-hold, right-click or the caret opens a menu with all 9 values incl. T and D variants. Tooltip "Note length".
note_length_model:
  straight:
    1/4: 4
    1/8: 8
    1/16: 16
  triplet:
    1/4T: 6
    1/8T: 12
    1/16T: 24
  dotted:
    1/4.: 3 (last box 2/3 wide)
    1/8.: 6 (last box 1/3 wide)
    1/16.: 11 (last box 2/3 wide)
  events_are_time_based: true
  max_boxes: 24 (12 columns x 2 rows)
  menu_values: 1/4 1/4T 1/4D 1/8 1/8T 1/8D 1/16 1/16T 1/16D (value string = base + optional T or D suffix; dotted displays as "D")
