v4_composition:
  vs_v3: 'Added: page_nav (MAIN | FX) in the header; the whole FX layer (3 panels, 9 sections, ~70 controls). Changed on MAIN: header badge shortened to ''REPEAT HOLD'' (120w) to make room for the nav;
    br_interval gains ''4 bars''; br_grid gains 1/2, 1/4, 1/64, 1/8T, 1/32T; chop_dist_type gains Hard clip + Downsample; chop overlay ''FILTER'' knob is now the filter CUTOFF (log Hz display); master_ceiling
    default -0.3 dBFS (spec). Everything else on MAIN is byte-for-byte v3 behaviour.'
  fx_structure:
    chop_fx:
    - 'dist: type/drive/tone/mix/out/auto_gain'
    - 'amp_env: attack/hold/decay/sustain/release + draggable AHDSR display'
    master:
    - 'filter: type LP/BP/HP + cutoff 20Hz-20kHz log + resonance + response curve'
    - tilt_eq (HP removed)
    - tape_saturation
    - stereo_width+mono_below
    - tempo_delay
    - plate_reverb
    - output+limiter(-0.3 dBFS)
    beat_repeat: MAIN bottom bar only (see not_surfaced_in_mockup for the parameters that left the view)
  mirrored_params_main_to_fx:
  - bpm
  - master_tone
  - master_filter_cutoff
  - master_sat
  - master_width
  - master_output
  - master_ceiling
  - master_delay_rtn
  - master_verb_rtn
  mirrored_params_overlay_to_fx:
  - chop_drive
  - chop_dist_type
  - chop_release
  overlay_only_chop_params:
  - chop_pitch
  - chop_mode
  - chop_reverse
  - chop_warp
  - chop_delay
  - chop_verb
  - chop_unison
  vs_v7: 'v8 = v7 simplified: single pattern button; FX page CHOP + MASTER only (BEAT REPEAT column removed, its FX-only params listed in not_surfaced_in_mockup); global declutter.'
  vs_v10: 'v11: filter is MASTER-only (chop filter cutoff/reso/type/slope/env-amt + chop-overlay CUTOFF + master HP removed); new master FILTER section; FX page re-spaced (CHOP 460 / MASTER 598, 2-col grid);
    text-overflow audit.'
note_for_production: Pages are two juce::Component children toggled by setVisible; both stay alive so the playhead/meters never stop. Mirrored controls (master chain, overlay<->FX chop params) attach to
  the same APVTS parameter through separate attachments; Beat Repeat has ONE set of controls (MAIN bottom bar). The pattern button is a juce::TextButton cycling the pattern parameter with a PopupMenu on
  hold / right-click / caret.
validation:
  tool: python validator over this YAML (bounds, 15px edge padding, overlaps per page/popover/overlay, panel + section containment, min sizes, mirror consistency, 10px gaps) + in-page self-test (WKWebView
    snap harness)
  controls_checked: 113
  sections_checked: 9
  errors: 0
  warnings: 0
  text_overflow_audit: 'ov* self-test scenarios: DOM text via Range rects (wrap, scrollWidth/Height, outside own box, >=4px (8 on cells/panels, 3 in seg tracks) from container edge, text-text and text-control
    overlap) + canvas fillText recorder (>=3px from canvas edge); runs on MAIN, FX, 3 flyouts, overlay (first + last chop), every combo menu + pattern dropdown, every knob/field at min/mid/max, every combo
    option; 0 hits'
  selftest: 'v14: v12 scenarios (adapted) run individually + durbtn nopat hdr midi nostrip + chop editor edopen edstart edfade edloop edaud; ov* audits incl. grown overlay, Loop-mode editor, settings flyout
    with the MIDI base-note combo and the 9-item note-length menu; palette scan greys + blue + BR red only'
  skin_checks:
  - no_viewport_units
  - html_body_100pct
  - user_select_none
  - contextmenu_disabled
  - no_colour_literal_outside_grey_blue_or_beat_repeat_red
  - screenshots_main_fx_overlay
