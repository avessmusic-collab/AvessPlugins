    rect: {x: 815, y: 62, w: 270, h: 114}
    opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
  - id: overlay
    layer: overlay
    title: ""
    rect: {x: 280, y: 150, w: 540, h: 310}
    opens_on: CHOP section 'more' button, double-click filled box or strip chop; Esc/scrim/close dismisses

