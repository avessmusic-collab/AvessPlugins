# CHOPLINE UI mockup v3 - design spec (BLEND: v2 simplicity + v1's visible controls)
#
# NOTE: the production UI is NATIVE JUCE (custom LookAndFeel, juce::Component), NOT WebView.
# v3-ui-test.html is a visual direction + interaction reference only, not production code.
# Positions are absolute window pixels at 100% scale (1100x720); the real editor scales 75%-200%, fixed aspect.
# v3 = "something in between the first one and the second one":
#   KEPT from v2: sample strip up top, BIG drop boxes, hero note-length segmented control (+T/D), one swing knob, lean Strip A.
#   RETURNED from v1: an always-visible one-row BOTTOM BAR (CHOP / BEAT REPEAT / MASTER), a slim 4-tab per-step lane strip
#   (VEL / PITCH / PROB / RATCHET) directly under the boxes, and the A-H pattern slot buttons in the header.
#   STILL HIDDEN: warp/granular/freeze detail, unison, filter/env, distortion type, delay/verb sends (-> "more" overlay in CHOP,
#   "..." flyout in MASTER); Settings/Eco/HQ stay in the gear flyout; v1's other 4 lanes (stretch/drive/filter/pan) stay in the model only.
# Scope notes: APVTS globals = pattern slot, swing, quality, Beat Repeat, Master. Per-chop settings live in the SliceMap and
# boxes/events (incl. per-step lane values) in the PatternSnapshot (snapshot handoff, not APVTS), exactly as in v1/v2.

plugin: CHOPLINE
version: 3
supersedes: v2 (v1 and v2 kept in repo untouched)
source_spec: plugins/CHOPLINE/.ideas/chopline-spec.md
user_feedback: "Something in between the first one and the second one."

window:
  width: 1100
  height: 720
  resizable: true
  scale_range: [0.75, 2.0]
  fixed_aspect: true
  edge_padding: 15

styling:
  style: flat_modern_pro  # same tokens as v1/v2
  colors:
    window: "#0d0e11"
    header: "#0a0b0e"
    panel: "#121419"
    surface: "#0f1115"
    separator: "#22262e"
    separator_strong: "#2d323c"
    text: "#e6e8ec"
    text_dim: "#8b92a0"
    text_faint: "#586070"
    accent_cyan: "#2bd4e6"
    beat_repeat_amber: "#ffa21f"
    knob_track: "#272b34"
  chop_palette_colour_blind_safe: ["#5b9dff", "#35c490", "#e6d14a", "#d97ad0", "#ff7d5c", "#a38cff", "#b9c0cc", "#d1a15c"]  # colour = chop identity, always paired with index; cycles after 8
  lane_bars: "tinted with the owning chop's palette colour (ties lane to box)"
  fonts:
    primary: "Inter, SF Pro Text, -apple-system, Helvetica Neue, sans-serif"
    numeric: "JetBrains Mono, SF Mono, ui-monospace, monospace"
  radii_px: {control: 4, panel: 4}
  knob: {diameter: 40, ring_stroke: 3, sweep_deg: 270, style: thin_ring_flat, bipolar_arc_from_centre: true}
  box_cell: {shape: flat_rounded_4, empty: dark_surface_plus_on_hover, filled: chop_colour_border_tint_index_mini_waveform, selected: white_outline, playhead: cyan_line_plus_flash}
  beat_repeat_hold: {panel: amber_border_glow, button: amber_fill, header_badge: "BEAT REPEAT - HOLD (pulsing dot)", playhead: amber}

interaction:
  strip: [click_audition_and_select, drag_chop_to_box, double_click_open_chop_detail, manual_mode_shift_click_split_alt_click_merge]
  boxes: [click_empty_paints_selected_chop, click_filled_selects_its_chop_and_lane_step, drag_across_paints, right_click_or_alt_click_clears, double_click_filled_opens_chop_detail]
  note_length: [segmented_quarter_eighth_sixteenth_thirtysecond, T_triplet_D_dotted_exclusive_modifiers, changes_visible_box_count]
  lane_strip: [tabs_VEL_PITCH_PROB_RATCHET, click_or_drag_bars_to_paint_value_on_filled_steps, columns_align_with_boxes, playhead_follows_transport]
  chop_section: [follows_selected_chop, pitch_drive_mode_reverse, more_opens_chop_detail_overlay]
  beat_repeat: [hold_toggle_lights_amber, auto_toggle, interval_and_grid_dropdowns, chance_decay_knobs]
  knob: [drag_vertical, shift_fine_drag, double_click_reset, mouse_wheel, right_click_midi_learn]
  keyboard: {space: transport_preview, '1-8': select_chop, escape: close_flyout_or_overlay}

note_length_model:  # boxes shown per bar (one bar per page; bar pager appears when pattern > 1 bar)
  straight: {"1/4": 4, "1/8": 8, "1/16": 16, "1/32": 32}
  triplet: {"1/4T": 6, "1/8T": 12, "1/16T": 24, "1/32T": 48}
  dotted: {"1/4.": "3 (last box 2/3 wide)", "1/8.": "6 (last box 1/3 wide)", "1/16.": "11 (last box 2/3 wide)", "1/32.": "22 (last box 1/3 wide)"}
  events_are_time_based: true  # events (and their lane values) keep their tick position; switching note length re-quantises view non-destructively

layers:  # co-visible groups. main is always visible; flyouts/overlay are exclusive popovers drawn above it

  - id: header
    layer: main
    title: ""
    rect: {x: 0, y: 0, w: 1100, h: 54}
    always_visible: true
  - id: strip_a
    layer: main
    title: "SAMPLE"
    rect: {x: 15, y: 60, w: 1070, h: 152}
    always_visible: true
  - id: strip_b
    layer: main
    title: "PATTERN"
    rect: {x: 15, y: 220, w: 1070, h: 348}
    always_visible: true
  - id: chop
    layer: main
    title: "CHOP"
    rect: {x: 15, y: 576, w: 380, h: 129}
    always_visible: true
  - id: br
    layer: main
    title: "BEAT REPEAT"
    rect: {x: 403, y: 576, w: 380, h: 129}
    always_visible: true
  - id: master
    layer: main
    title: "MASTER"
    rect: {x: 791, y: 576, w: 294, h: 129}
    always_visible: true
  - id: fl_slice
    layer: fl_slice
    title: "SLICING"
    rect: {x: 785, y: 122, w: 300, h: 166}
    opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
  - id: fl_mastermore
    layer: fl_mastermore
    title: "MASTER - MORE"
    rect: {x: 815, y: 462, w: 270, h: 106}
    opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
  - id: fl_set
