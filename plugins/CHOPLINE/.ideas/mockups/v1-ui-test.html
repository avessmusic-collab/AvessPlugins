<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHOPLINE UI Mockup v1</title>
<!--
  CHOPLINE v1 mockup - flat modern pro.
  VISUAL DIRECTION + INTERACTION REFERENCE ONLY. The production UI is native JUCE (custom LookAndFeel), not WebView.
  Everything is inline; window.Juce is a mock bridge; parameter changes log as "[CHOPLINE] param <id> = ...".
-->
<style>
:root {
  --bg: #0d0e11; --header: #0a0b0e; --panel: #121419; --surface: #0f1115;
  --line: #22262e; --line2: #2d323c; --text: #e6e8ec; --dim: #8b92a0; --faint: #586070;
  --accent: #2bd4e6; --amber: #ffa21f; --track: #272b34;
  --ui: Inter, "SF Pro Text", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; }
body {
  user-select: none; -webkit-user-select: none; cursor: default; overflow: hidden;
  background: #08090b; color: var(--text); font-family: var(--ui); font-size: 11px;
  -webkit-font-smoothing: antialiased;
}
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1100px; height: 720px; background: var(--bg); transform-origin: 0 0; }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; transition: border-color .08s; }
.panel.br-on { border-color: var(--amber); }
.pbar { position: absolute; left: 0; right: 0; top: 0; height: 24px; border-bottom: 1px solid var(--line); }
.ptitle { position: absolute; left: 12px; top: 0; line-height: 24px; font-size: 10px; letter-spacing: .14em; font-weight: 600; color: var(--dim); }
.pstatus { position: absolute; right: 12px; top: 0; line-height: 24px; font-size: 10px; letter-spacing: .08em; font-family: var(--mono); color: var(--faint); }
#header { position: absolute; left: 0; top: 0; width: 1100px; height: 54px; background: var(--header); border-bottom: 1px solid var(--line); }
.ctl { position: absolute; }
canvas { display: block; }
.disp { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.disp canvas { position: absolute; left: 0; top: 0; }

/* wordmark */
#wordmark { font-size: 17px; font-weight: 650; letter-spacing: -.025em; line-height: 24px; color: var(--text); display: flex; align-items: center; gap: 8px; }
#wordmark i { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
#wordmark i b { display: block; width: 3px; border-radius: 1px; }

/* knob */
.knob { text-align: center; cursor: ns-resize; }
.knob svg { position: absolute; left: 6px; top: 0; }
.knob .kv { position: absolute; left: -4px; right: -4px; top: 42px; font: 10px/12px var(--mono); color: var(--dim); }
.knob .kl { position: absolute; left: -4px; right: -4px; top: 54px; font-size: 9.5px; line-height: 12px; letter-spacing: .07em; color: var(--faint); font-weight: 600; }
.knob.active .kv, .knob:hover .kv { color: var(--text); }
.knob.amber.active .kv, .knob.amber:hover .kv { color: var(--amber); }

/* combo / segmented / toggle / button / field */
.combo { background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; display: flex; align-items: center; padding: 0 8px; gap: 6px; cursor: pointer; }
.combo:hover { border-color: #3c4250; }
.combo .pf { font-size: 9px; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
.combo .cv { flex: 1; font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo .ch { width: 6px; height: 6px; border-right: 1.5px solid var(--dim); border-bottom: 1.5px solid var(--dim); transform: rotate(45deg) translate(-1px, -1px); }
.menu { position: absolute; z-index: 50; background: #171a20; border: 1px solid var(--line2); border-radius: 4px; padding: 3px; max-height: 300px; overflow: auto; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.menu div { height: 22px; line-height: 22px; padding: 0 9px; border-radius: 3px; font-size: 11px; color: var(--text); white-space: nowrap; }
.menu div:hover { background: #232832; }
.menu div.on { color: var(--accent); }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; padding: 2px; gap: 2px; }
.seg.gap { background: transparent; border: 0; padding: 0; gap: 4px; }
.seg b { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 10.5px; color: var(--dim); border-radius: 3px; cursor: pointer; padding: 0 6px; white-space: nowrap; border: 1px solid transparent; }
.seg.gap b { background: var(--surface); border: 1px solid var(--line2); font-family: var(--mono); font-size: 11px; font-weight: 600; }
.seg b:hover { color: var(--text); }
.seg b.on { background: #232832; color: var(--text); }
.seg.gap b.on { background: rgba(43,212,230,.14); border-color: var(--accent); color: var(--accent); }
.seg.amber b.on { background: rgba(255,162,31,.16); color: var(--amber); }
.seg.tabs b { font-size: 10px; letter-spacing: .08em; font-weight: 600; }
.seg.tabs b.on { box-shadow: inset 0 -2px 0 var(--lc, var(--accent)); background: #1b1f26; }
.btn, .tgl { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--dim); cursor: pointer; text-transform: uppercase; }
.btn:hover, .tgl:hover { color: var(--text); border-color: #3c4250; }
.btn:active { background: #1b1f26; }
.tgl.on { color: var(--accent); border-color: var(--accent); background: rgba(43,212,230,.10); }
.tgl.amber.on, .btn.amber.on { color: var(--amber); border-color: var(--amber); background: rgba(255,162,31,.14); }
.btn.amber { color: var(--amber); border-color: rgba(255,162,31,.45); }
.btn.amber.on { color: #1a1105; background: var(--amber); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.field, .btn, .tgl { white-space: nowrap; }
.field { background: var(--surface); border: 1px solid var(--line2); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 7px; cursor: ew-resize; overflow: hidden; }
.field:hover { border-color: #3c4250; }
.field .fl { font-size: 9px; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
.field .fv { font: 10px var(--mono); color: var(--text); }
.field .fb { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); opacity: .7; }
.readout { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; padding: 0 8px; gap: 7px; font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; }
.readout .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
#cpu { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
#cpu .cl { font-size: 9px; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
#cpu .cb { flex: 1; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
#cpu .cb i { display: block; height: 100%; width: 10%; background: var(--accent); }
#cpu .cv { font: 10.5px var(--mono); color: var(--dim); width: 36px; text-align: right; }
#lane_readout { font: 10.5px var(--mono); color: var(--dim); line-height: 24px; letter-spacing: .02em; }
#ghost { position: absolute; z-index: 60; pointer-events: none; display: none; padding: 3px 7px; border-radius: 3px; font: 600 10.5px var(--mono); color: #0d0e11; }
</style>
</head>
