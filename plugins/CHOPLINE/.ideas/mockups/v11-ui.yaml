  vs_v10: 'v11: filter is MASTER-only (chop filter cutoff/reso/type/slope/env-amt + chop-overlay CUTOFF + master HP removed); new master FILTER section; FX page re-spaced (CHOP 460 / MASTER 598, 2-col grid);
