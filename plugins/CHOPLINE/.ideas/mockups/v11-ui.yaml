note_for_production: Pages are two juce::Component children toggled by setVisible; both stay alive so the playhead/meters never stop. Mirrored controls (master chain, overlay<->FX chop params) attach to
  the same APVTS parameter through separate attachments; Beat Repeat has ONE set of controls (MAIN bottom bar). The pattern button is a juce::TextButton cycling the pattern parameter with a PopupMenu on
  hold / right-click / caret.
validation:
  tool: python validator over this YAML (bounds, 15px edge padding, overlaps per page/popover/overlay, panel + section containment, min sizes, mirror consistency, 10px gaps) + in-page self-test (WKWebView
    snap harness)
  controls_checked: 106
  sections_checked: 9
  errors: 0
  warnings: 0
  text_overflow_audit: 'ov* self-test scenarios: DOM text via Range rects (wrap, scrollWidth/Height, outside own box, >=4px (8 on cells/panels, 3 in seg tracks) from container edge, text-text and text-control
    overlap) + canvas fillText recorder (>=3px from canvas edge); runs on MAIN, FX, 3 flyouts, overlay (first + last chop), every combo menu + pattern dropdown, every knob/field at min/mid/max, every combo
    option; 0 hits'
  selftest: all v10 scenarios adapted + filt + ovmain/ovfx/ovfly/ovlay/ovmenu/ovval; run individually
