v4_composition:
  vs_v3: 'Added: page_nav (MAIN | FX) in the header; the whole FX layer (3 panels, 9 sections, ~70 controls). Changed on MAIN: header badge shortened to ''REPEAT HOLD'' (120w) to make room for the nav;
    br_interval gains ''4 bars''; br_grid gains 1/2, 1/4, 1/64, 1/8T, 1/32T; chop_dist_type gains Hard clip + Downsample; chop overlay ''FILTER'' knob is now the filter CUTOFF (log Hz display); master_ceiling
    default -0.3 dBFS (spec). Everything else on MAIN is byte-for-byte v3 behaviour.'
  fx_structure:
    chop_fx:
    - 'dist: type/drive/tone/mix/out/auto_gain'
    - 'filter: type/slope/cutoff/reso/env_amt'
    - 'amp_env: attack/hold/decay/sustain/release + draggable AHDSR display'
    master:
    - tilt_eq+hp
    - tape_saturation
    - stereo_width+mono_below
    - tempo_delay
    - plate_reverb
    - output+limiter(-0.3 dBFS)
    beat_repeat: MAIN bottom bar only (see not_surfaced_in_mockup for the parameters that left the view)
  mirrored_params_main_to_fx:
  - bpm
  - master_tone
  - master_sat
  - master_width
  - master_output
  - master_ceiling
  - master_delay_rtn
  - master_verb_rtn
  mirrored_params_overlay_to_fx:
  - chop_drive
  - chop_dist_type
  - chop_filter
  - chop_release
  overlay_only_chop_params:
  - chop_pitch
  - chop_mode
  - chop_reverse
  - chop_warp
  - chop_delay
  - chop_verb
  - chop_unison
  vs_v7: 'v8 = v7 simplified: single pattern button; FX page CHOP + MASTER only (BEAT REPEAT column removed, its FX-only params listed in not_surfaced_in_mockup); global declutter.'
note_for_production: Pages are two juce::Component children toggled by setVisible; both stay alive so the playhead/meters never stop. Mirrored controls (master chain, overlay<->FX chop params) attach to
  the same APVTS parameter through separate attachments; Beat Repeat has ONE set of controls (MAIN bottom bar). The pattern button is a juce::TextButton cycling the pattern parameter with a PopupMenu on
  hold / right-click / caret.
validation:
  tool: 'python validator over this YAML (yq unavailable): per-page bounds, 15px edge padding, overlap (header+main, header+fx, each popover, overlay), panel overlap + edge, containment in section/panel,
    min sizes, mirror consistency, 10px gaps'
  controls_checked: 110
  sections_checked: 9
  errors: 0
  warnings: 0
  selftest: 'snap harness (WKWebView): every still-applicable v7 scenario + new v8 scenarios (pat: one-button cycle/wrap/caret/right-click/hold/Shift+n; nobr; declutter; fxhold adapted to H-key on the FX
    page)'
  skin_checks:
  - no_viewport_units
  - html_body_100pct
  - user_select_none
  - contextmenu_disabled
  - no_colour_literal_outside_grey_or_gold
  - screenshots_main_fx
not_surfaced_in_mockup:
  why: v8 FX page no longer has a BEAT REPEAT column; Beat Repeat is surfaced ONLY in the MAIN bottom bar (HOLD AUTO EVERY GRID CHANCE DECAY). These APVTS parameters still exist in the build (defaults/ranges
    below) and are candidates for a settings/advanced drawer.
  parameters:
  - id: br_mode
    type: seg
    label: Mode
    scope: apvts
    options: [Auto, Manual, 'Off']
    default: Manual
    note: production keeps the Auto/Manual/Off choice; the mock's AUTO toggle drives Auto<->Manual, Off moves to settings/advanced
  - id: br_freeze
    type: toggle
    label: FREEZE
    scope: apvts
    default: false
    note: advanced candidate
  - id: br_rnd_grid
    type: toggle
    label: RND GRID
    scope: apvts
    default: false
