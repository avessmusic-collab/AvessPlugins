  rect: {x: 557, y: 92, w: 518, h: 94}
  bypass_param: master_tone_on
- id: m_sat
  parent: fx_master
  title: SATURATION
  rect: {x: 557, y: 194, w: 518, h: 94}
  bypass_param: master_sat_on
- id: m_width
  parent: fx_master
  title: WIDTH
  rect: {x: 557, y: 296, w: 518, h: 94}
  bypass_param: master_width_on
- id: m_delay
  parent: fx_master
  title: DELAY
  rect: {x: 557, y: 398, w: 518, h: 94}
  bypass_param: master_delay_on
- id: m_verb
