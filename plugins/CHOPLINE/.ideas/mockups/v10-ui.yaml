# CHOPLINE v10 = v9 minus the Play button (VST instrument; transport is host-driven via AudioPlayHead). Everything else identical to v9.
# CHOPLINE v9 = v8 with DEEPER BLACKS only (screens #050505-ish, black knobs ~#0a0a0c, ink/text #0c0c0c/#141414, mini-waveform insets #050505); screen text slightly brighter (#fafafa). Layout/controls/interactions identical to v8.
# CHOPLINE UI mockup v8 - design spec (v7 SIMPLIFIED)
# v8 = v7 with: (1) pattern selector is ONE small button (letter + caret): click cycles A-H (wraps), hold / right-click / caret opens the A-H dropdown, Shift+1-8 stays;
#   (2) the BEAT REPEAT column is gone from the FX page - FX = CHOP + MASTER, reflowed wider and calmer; Beat Repeat lives ONLY in the MAIN bottom bar;
#   (3) global declutter: no duration captions, no section subtitles / status text, knob values on hover/drag, beat-only box numbers, lane values on the selected step, fewer ticks.
# Everything else is v7 (skin tokens, interactions, keyboard map, transport continuity, mock Juce bridge logs).
# NOTE: production UI is NATIVE JUCE (custom LookAndFeel), NOT WebView; v8-ui-test.html is a visual/interaction reference only. Positions are absolute window px at 100% (1100x720).
#
plugin: CHOPLINE
version: 10
supersedes: v7 (v1-v7 kept in repo untouched)
source_spec: plugins/CHOPLINE/.ideas/chopline-spec.md
window:
  width: 1100
  height: 720
  resizable: true
  scale_range:
  - 0.75
  - 2.0
  fixed_aspect: true
  edge_padding: 15
pages:
  nav_control: page_nav
  main:
    layers:
    - header
    - main
    popovers:
    - fl_slice
    - fl_mastermore
    - fl_set
    - overlay
  fx:
    layers:
    - header
    - fx
    popovers: []
  persistence: page is UI-only state; switching closes open flyouts/overlay, keeps selection, pattern, transport, BR hold state
  layout_fx: 'TWO columns inside the 15px edge frame: CHOP 520w | MASTER 538w, 12px gutter, full height (y 60-705). Beat Repeat is NOT on this page.'
styling:
  style: light_neumorphic_hardware_dark_screens
  palette: monochrome_plus_gold
  colors:
    page: '#d3d3d3'
    chassis: 'linear #f3f3f3 -> #e4e4e4 (rounded plate 1088x708 at 6,6, radius 30)'
    card: 'linear #fafafa -> #f1f1f1 (raised, radius 18, soft drop shadow + 1px white inner highlight)'
    well: '#dddddd (recessed: segmented tracks, trays, cells; inner shadow + white under-lip)'
    screen: 'radial #1a1a1a -> #0a0a0a -> #050505 (inset, radius 14, 7.5% top gloss, canvas content gets a 3px soft white glow)'
    text: '#141414'
    text_dim: '#5b5b5b'
    text_faint: '#727272'
    screen_text: '#fafafa'
    screen_text_faint: rgba(201,201,201,.62)
    knob_arc: '#4f4f4f'
    black_accent_knob: '#050505 -> #5a5a5a dome (mid #0e0e0e) (one per section)'
    gold: '#b8913f'
    gold_ink: '#7a5c1c'
    gold_on_screen: '#d4b062 (glow #dcc283)'
    gold_tint: '#faf7ef -> #f4eedd (armed Beat Repeat card), pad #fbf8f0 -> #f1e8cf'
  chop_identity: 'greyscale only: 8 distinct shades + the index number + the mini waveform; alternate light/dark so neighbours separate; ink colour auto-contrasts'
  chop_shades_on_screens:
  - '#f5f6f8'
  - '#8f959f'
  - '#d3d6dc'
  - '#6f7580'
  - '#e6e8ec'
  - '#a3a9b3'
  - '#bfc3cb'
  - '#5d636e'
  chop_shades_on_white:
  - '#2f333b'
  - '#9ba1ac'
  - '#555b67'
  - '#c2c6ce'
  - '#747a86'
  - '#dadde2'
  - '#3f444e'
  - '#adb2bb'
  selection_without_hue: selected chop = gold top bar + gold outline on the strip, gold ring around its index chip on every box that uses it, gold ring on the selected step, gold-ringed swatch in the chop
    chip
  fonts:
    primary: Inter, SF Pro Text, -apple-system, Helvetica Neue, sans-serif
    numeric: JetBrains Mono, SF Mono, ui-monospace, monospace
    labels: sentence case, 9.5px, mid-grey; panel + section titles caps with 0.16-0.24em tracking
  limiter_led: light grey = ok, gold = hot (was green/red)
  meters: grey -> white -> gold ramp (no green/yellow/red)
  radii_px:
    panel: 18
    cell: 14
    screen: 14
    pill: 999
    box: 12
    icon_button: 9
  knob:
    diameter: 40
    dome: matte white radial gradient, soft drop shadow, faint ridge ring, thin grey needle
    arc: thin 2px outer ring, value arc dark grey (gold on Beat Repeat)
    sweep_deg: 270
    bipolar_arc_from_centre: true
    accent_knob: 'ONE black dome per section: swing, slice_sensitivity, chop_pitch, br_chance / fx_br_chance, chop_dist_mix, master_sat_mix, master_output / fx_master_output'
  sliders: no continuous sliders exist in the v4 structure; the slider language (thin track + white pill thumb) is not used. Meters (cpu, output) use thin tracks.
  segmented: recessed pill track, selected = raised white pill with dark text (gold ink on Beat Repeat)
  combo: raised white pill with up/down chevrons (stepper look)
  mini_switch: ADV-style 26x14 track + white thumb; used for auto, auto gain, reverse, snap zero-X; gold track on Beat Repeat
  bypass_toggle: 20px raised round button with power glyph; dark = section active, light grey = bypassed; bypassed section dims to 42%
  boxes:
    tray: recessed light tray
    card: raised white card
    filled: grey-shade chip with index + mini waveform on a small dark inset
    playing: soft pressed + gold edge glow
    selected: 2px gold outline (selected step) + gold ring on index chips of the selected chop
    playhead: gold line (brighter + glow while repeat-hold) on the boxes, gold-hi on the lane screen
  beat_repeat_hold:
    panel: gold ring glow + warm tint on the MAIN bottom-bar card
    header_badge: dark pill screen with gold glow 'REPEAT HOLD' - both pages (the only Beat Repeat trace on the FX page)
    note: the 306x100 FX hold pad is gone with the FX BR column
  fx_module_header:
    size: 504/522 x 22 dark screen inside the panel bar
    content: glowing icon + letter-spaced name; CHOP header also carries the chop chip and prev/next arrows; MASTER header carries the BPM readout
    note: no status text (v8)
  declutter:
    labels: lighter weight (500-600), mid-grey, wider tracking; knob label and value share one slot
    knob_value: hidden until hover/drag - the label fades out and the value takes its place (compact SWING / SENS knobs keep their value visible)
    boxes: only beat numbers (1 2 3 4), no e & a; no ratchet/probability tags on boxes (lane strip shows them)
    lane: value shown only for the selected step
    envelope: A H D S R letters only; the numeric value appears for the hovered / dragged handle
    ticks: slot dividers, axis labels (20 / 1k / 20k, L / R, MONO < Hz, delay time, dBFS status) removed from the FX displays
interaction:
  page_nav:
  - click_segmented_MAIN_FX
  - Tab_toggles
  - M_main
  - F_fx
  - state_preserved_across_switch
  - transport_keeps_running
  shared_params: 'MAIN bottom bar and FX page share ONE value (never two Beat Repeat views any more): master_tone, master_sat, master_width, master_output, master_ceiling, master_delay_rtn, master_verb_rtn,
    bpm, chop_drive/chop_dist_type/chop_filter/chop_release (overlay <-> FX). Beat Repeat has a single instance (MAIN bottom bar) so it has no mirrors.'
  hold_pad: removed with the FX BR column. MAIN HOLD button stays a latching toggle; H key is momentary on either page (header badge shows REPEAT HOLD on both pages)
  chop_fx_target: CHOP FX always edits the selected chop (same selection as MAIN); prev/next arrows in the panel bar and keys 1-8 change it
  env_display: 'AHDSR display: drag the 4 handles; values shown only for the hovered / dragged handle; knobs below mirror the handles'
  bypass: dot per chop-FX cell and per master section; bypass dims the section
  knob:
  - drag_vertical
  - shift_fine_drag
  - double_click_reset
  - mouse_wheel
  - right_click_midi_learn
  - value_shown_on_hover_or_drag
  keyboard:
    space: transport_preview
    1-8: select_chop
    shift+1-8: pattern_A_to_H
    escape: close_flyout_or_overlay
    tab: toggle_page
    m: main_page
    f: fx_page
    h: beat_repeat_hold
  pattern_selector: 'header: ONE small button (40x24) showing the pattern letter + a tiny caret. Click = next pattern (H wraps to A). Click-and-hold (380 ms), right-click or the caret = dropdown A-H. Shift+1-8
    jumps (plain 1-8 stays chop select). Tooltip ''Pattern''.'
  bpm_readout: 'BPM is NOT in the header; small dark inset readout in MASTER: MAIN master panel title row (x915,y596) and FX MASTER panel bar (x955,y65), mirrored'
  chop_editing_without_panel: select = click strip chop / filled box / FX-page CHOP arrows / keys 1-8; edit = double-click a filled box (or strip chop), or the '...' button next to the chop chip, opens
    the overlay (warp, pitch, drive, cutoff, release, delay, verb, unison, mode, dist type, reverse, preview); full per-chop FX on the FX page CHOP column
  main_page_unchanged:
  - strip
  - boxes
  - note_length
  - lane_strip
  - flyouts
  - chop_detail_overlay
note_length_model:
  straight:
    1/4: 4
    1/8: 8
    1/16: 16
  triplet:
    1/4T: 6
    1/8T: 12
    1/16T: 24
  dotted:
    1/4.: 3 (last box 2/3 wide)
    1/8.: 6 (last box 1/3 wide)
    1/16.: 11 (last box 2/3 wide)
  events_are_time_based: true
  max_boxes: 24 (12 columns x 2 rows)
layers:
- id: header
  layer: header
  title: ''
  rect: {x: 0, y: 0, w: 1100, h: 54}
  always_visible: true
  note: 'header: wordmark | presets | pattern button | (hold badge) | MAIN|FX | gear. NO play button - transport is host-driven (AudioPlayHead); playhead/box animation is display-only'
- id: strip_a
  layer: main
  title: ''
  rect: {x: 15, y: 60, w: 1070, h: 138}
  visible_when: page == MAIN
  title_note: untitled in v8 (section titles cut)
- id: strip_b
  layer: main
  title: ''
  rect: {x: 15, y: 206, w: 1070, h: 379}
  visible_when: page == MAIN
  title_note: untitled in v8 (section titles cut)
- id: br
  layer: main
  title: BEAT REPEAT
  rect: {x: 15, y: 593, w: 500, h: 112}
  visible_when: page == MAIN
- id: master
  layer: main
  title: MASTER
  rect: {x: 523, y: 593, w: 562, h: 112}
  visible_when: page == MAIN
- id: fl_slice
  layer: fl_slice
  title: SLICING
  rect: {x: 785, y: 110, w: 300, h: 104}
  opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
- id: fl_mastermore
  layer: fl_mastermore
  title: MASTER - MORE
  rect: {x: 815, y: 479, w: 270, h: 106}
  opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
- id: fl_set
  layer: fl_set
  title: SETTINGS
  rect: {x: 815, y: 62, w: 270, h: 114}
  opens_on: header/section icon ('...' or gear); outside click dismisses; exclusive with other flyouts
- id: overlay
  layer: overlay
  title: ''
  rect: {x: 280, y: 150, w: 540, h: 344}
  opens_on: '''...'' button beside the chop chip (lane row), double-click filled box or strip chop; Esc/scrim/close dismisses'
- id: fx_chop
  layer: fx
  title: CHOP
  rect: {x: 15, y: 60, w: 520, h: 645}
  visible_when: page == FX
- id: fx_master
  layer: fx
  title: MASTER
  rect: {x: 547, y: 60, w: 538, h: 645}
  visible_when: page == FX
