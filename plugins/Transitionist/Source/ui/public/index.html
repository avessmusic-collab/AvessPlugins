<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Transitionist</title>

<style>
  /* ============================================================
     WEBVIEW CONSTRAINT FOUNDATION (ui-design-rules.md Rule 1/2/3)
     ============================================================ */
  html, body {
    height: 100%;             /* REQUIRED - replaces viewport units */
    margin: 0;
    padding: 0;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
    overflow: hidden;

    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', -apple-system, 'Helvetica Neue', Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============================================================
     PLUGIN UI - fixed size matching v4-ui.yaml window spec
     (JUCE editor is constructed with setSize(980, 420) to match)
     ============================================================ */
  .container {
    width: 980px;
    height: 420px;
    position: relative;
    overflow: hidden;

    /* Outer frame: gray, subtly textured brushed-metal gradient - reuses
       the knob discs' own gray tones. Two stacked layers:
         1. A fine diagonal hairline stripe pattern (subtle brushed-metal
            grain) - repeating-linear-gradient, very low opacity.
         2. A cool-silver gray gradient reusing the knob disc's own tones
            (disc_face_mid -> disc_face_end). */
    background:
      repeating-linear-gradient(125deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 1px, rgba(70,80,100,0.06) 1px, rgba(70,80,100,0.06) 2px),
      linear-gradient(155deg, #d7dce3 0%, #c3cad6 45%, #aab2c0 100%);
    border: 1px solid #98a2b4;
    border-radius: 26px;
  }

  /* ---------------- Logo ---------------- */
  .logo {
    position: absolute;
    left: 0px;
    top: 24px;
    width: 980px;
    height: 30px;
    text-align: center;
    color: #2c3444;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.34em;
    text-shadow: 0 1px 0 rgba(255,255,255,0.75), 0 1px 3px rgba(20,24,34,0.30), 0 0 14px rgba(154,182,232,0.25);
  }

  /* ---------------- Quick preset bar ---------------- */
  .preset-bar {
    position: absolute;
    top: 58px;
    left: 364px;
    width: 252px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 5;
  }
  .preset-btn {
    appearance: none;
    -webkit-appearance: none;
    width: 28px;
    height: 24px;
    border-radius: 6px;
    background: linear-gradient(170deg, #f6f8fa 0%, #d7dce3 55%, #aab2c0 100%);
    border: 1px solid #b9c2d1;
    box-shadow: 0 1px 2px rgba(30,38,54,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
    color: #2c3444;
    font-family: inherit;
    font-size: 10px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    padding: 0;
    margin: 0;
  }
  .preset-btn:active {
    box-shadow: inset 0 1px 3px rgba(20,24,32,0.4);
  }
  .preset-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    width: 180px;
    height: 24px;
    background: #182028;
    border: 2px solid #232a36;
    border-radius: 4px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.65), inset 0 -1px 1px rgba(255,255,255,0.05);
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #7fd8e0;
    text-shadow: 0 0 6px rgba(127,216,224,0.55);
    text-align: center;
    text-align-last: center;
    padding: 0 4px;
    margin: 0;
    cursor: pointer;
  }
  .preset-select option {
    background: #182028;
    color: #7fd8e0;
  }

  /* ---------------- Panel cards ---------------- */
  .panel {
    position: absolute;
    top: 90px;
    width: 250px;
    height: 250px;
    border-radius: 20px;
    background: linear-gradient(170deg, #eef1f5 0%, #dde2e9 100%);
    border: 1px solid #c7ceda;
    box-shadow:
      inset 0 2px 6px rgba(30,38,54,0.28),
      inset 0 -3px 10px rgba(30,38,54,0.14),
      0 3px 0 rgba(255,255,255,0.04);
  }
  /* Three panels left-to-right in signal-flow order: THROW, SPACE, SWEEP. */
  .panel-throw { left: 60px; }
  .panel-space { left: 365px; }
  .panel-sweep { left: 670px; }

  /* ---------------- Caption labels ---------------- */
  .caption {
    position: absolute;
    top: 284px;
    width: 250px;
    height: 20px;
    text-align: center;
    color: #5b6478;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
  }
  .caption-throw { left: 60px; }
  .caption-space { left: 365px; }
  .caption-sweep { left: 670px; }

  /* ---------------- Knob assembly ---------------- */
  .knob-wrap {
    position: absolute;
    top: 126px;
    width: 140px;
    height: 140px;
  }
  /* Knob centered within its 250px panel: panel_x + (250-140)/2 = panel_x + 55 */
  .knob-wrap-throw { left: 115px; }
  .knob-wrap-space { left: 420px; }
  .knob-wrap-sweep { left: 725px; }

  /* Soft cool blue-lavender ambient glow bleeding from behind part of the disc */
  .knob-glow {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(154,182,232,0.55) 0%, rgba(154,182,232,0.0) 62%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }

  /* Thin, understated arc track - sits just outside the disc. Used by ALL
     three knobs (the grey track ring reads as one consistent family). */
  .knob-arc {
    position: absolute;
    inset: -10px;
    z-index: 1;
    pointer-events: none;
    transform: rotate(135deg);
  }
  .knob-arc-track {
    fill: none;
    stroke: rgba(90,104,130,0.22);
    stroke-width: 3;
    stroke-linecap: round;
  }
  /* Unipolar fill (THROW, SPACE) - single CW sweep from a start angle */
  .knob-arc-fill {
    fill: none;
    stroke: #6f8fc9;
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 40ms linear;
  }

  /* Bipolar fill (SWEEP only) - drawn as a separate, NON-rotated svg layer
     so its path math is in absolute (unrotated) coordinates: path grows
     from the fixed 12-o'clock/center point outward toward +/-135deg. */
  .knob-arc-bipolar {
    position: absolute;
    inset: -10px;
    z-index: 1;
    pointer-events: none;
  }
  .knob-arc-bipolar-fill {
    fill: none;
    stroke: #6f8fc9;
    stroke-width: 3;
    stroke-linecap: round;
  }

  /* Fixed center-detent tick mark (SWEEP only) - marks the 12-o'clock /
     0% reference point on the track ring. Does NOT rotate. */
  .knob-center-tick {
    position: absolute;
    top: -6px;
    left: 67px;
    width: 6px;
    height: 9px;
    border-radius: 2px;
    background: #6f8fc9;
    box-shadow: 0 0 3px rgba(111,143,201,0.6);
    z-index: 2;
    pointer-events: none;
  }

  /* The interactive knob itself (mousedown target) */
  .knob {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 2;
    cursor: ns-resize;
  }

  /* Layer 2: rotating body (texture + pointer) */
  .knob-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform-origin: center center;
    transition: transform 40ms linear;
    background: radial-gradient(circle at 35% 30%, #f6f8fa 0%, #d7dce3 55%, #aab2c0 100%);
    box-shadow: 0 6px 14px rgba(10,12,16,0.45);
  }

  /* Fine ridged/hobbed metal edge texture - only visible near the outer rim */
  .knob-ridges {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255,255,255,0.55) 0deg 1.6deg,
      rgba(70,80,100,0.30) 1.6deg 3.2deg
    );
    -webkit-mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
            mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
  }

  /* Small pointer dot near the top edge - rotates with the knob body */
  .knob-pointer {
    position: absolute;
    top: 9px;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: #3d4a63;
    box-shadow: 0 0 2px rgba(255,255,255,0.5) inset, 0 1px 1px rgba(0,0,0,0.3);
  }

  /* Layer 1 (visually on top): fixed skeuomorphic lighting - does NOT rotate */
  .knob-lighting {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      inset -5px -6px 10px rgba(20,24,32,0.35),
      inset 5px 6px 10px rgba(255,255,255,0.55);
    pointer-events: none;
    z-index: 3;
  }

  /* Inset LCD-style digital readout - embedded in knob center, fixed
     (does not rotate with knob body) */
  .knob-lcd {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 56px;
    height: 28px;
    transform: translate(-50%, -50%);
    background: #182028;
    border: 2px solid #232a36;
    border-radius: 4px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.65),
      inset 0 -1px 1px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    pointer-events: none;
  }
  .knob-lcd-text {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #7fd8e0;
    text-shadow: 0 0 6px rgba(127,216,224,0.55);
  }
</style>
</head>
<body>

  <div class="container">

    <div class="logo">TRANSITIONIST</div>

      <!-- Quick preset bar - UI-only convenience browser, drives the same
           throw/space/sweep relays the knobs use (see script). Not a
           JUCE/DAW "program" - purely a fast way to jump between a few
           useful starting points. -->
      <div class="preset-bar">
        <button class="preset-btn" id="presetPrevBtn" type="button" aria-label="Previous preset">&#9664;</button>
        <select class="preset-select" id="presetSelect" aria-label="Preset"></select>
        <button class="preset-btn" id="presetNextBtn" type="button" aria-label="Next preset">&#9654;</button>
      </div>

    <!-- THROW (parameter id: throw) - leftmost, first in signal-flow order -->
    <div class="panel panel-throw"></div>
    <div class="knob-wrap knob-wrap-throw">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 160 160">
        <circle class="knob-arc-track" cx="80" cy="80" r="74"
                stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="throwArc" cx="80" cy="80" r="74"
                stroke-dasharray="349.13 465.5" stroke-dashoffset="349.13"></circle>
      </svg>
      <div class="knob" id="throwKnob" tabindex="0" role="slider"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Throw">
        <div class="knob-body" id="throwKnobBody">
          <div class="knob-ridges"></div>
          <div class="knob-pointer"></div>
        </div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd">
          <span class="knob-lcd-text" id="throwValueText">0%</span>
        </div>
      </div>
    </div>
    <div class="caption caption-throw">THROW</div>

    <!-- SPACE (parameter id: space) - middle, second in signal-flow order -->
    <div class="panel panel-space"></div>
    <div class="knob-wrap knob-wrap-space">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 160 160">
        <circle class="knob-arc-track" cx="80" cy="80" r="74"
                stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="spaceArc" cx="80" cy="80" r="74"
                stroke-dasharray="349.13 465.5" stroke-dashoffset="349.13"></circle>
      </svg>
      <div class="knob" id="spaceKnob" tabindex="0" role="slider"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Space">
        <div class="knob-body" id="spaceKnobBody">
          <div class="knob-ridges"></div>
          <div class="knob-pointer"></div>
        </div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd">
          <span class="knob-lcd-text" id="spaceValueText">0%</span>
        </div>
      </div>
    </div>
    <div class="caption caption-space">SPACE</div>

    <!-- SWEEP (parameter id: sweep) - rightmost, last in signal-flow order (bipolar filter) -->
    <div class="panel panel-sweep"></div>
    <div class="knob-wrap knob-wrap-sweep">
      <div class="knob-glow"></div>
      <!-- Static track: same shared ring geometry as THROW/SPACE -->
      <svg class="knob-arc" viewBox="0 0 160 160">
        <circle class="knob-arc-track" cx="80" cy="80" r="74"
                stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
      </svg>
      <!-- Bipolar fill: unrotated svg, path computed in JS from center outward -->
      <svg class="knob-arc-bipolar" viewBox="0 0 160 160">
        <path class="knob-arc-bipolar-fill" id="sweepArcPath" d=""></path>
      </svg>
      <div class="knob-center-tick"></div>
      <div class="knob" id="sweepKnob" tabindex="0" role="slider"
           aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-label="Sweep">
        <div class="knob-body" id="sweepKnobBody">
          <div class="knob-ridges"></div>
          <div class="knob-pointer"></div>
        </div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd">
          <span class="knob-lcd-text" id="sweepValueText">0%</span>
        </div>
      </div>
    </div>
    <div class="caption caption-sweep">SWEEP</div>

  </div>

  <!-- JavaScript -->
  <script type="module">
    // ====================================================================
    // JUCE FRONTEND LIBRARY IMPORT (ES6 module - REQUIRED, see
    // juce8-critical-patterns.md Pattern #21)
    // ====================================================================

    import { getSliderState } from "./js/juce/index.js";

    // ====================================================================
    // NATIVE APPLICATION FEEL (JavaScript)
    // ====================================================================

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      return false;
    });
    document.addEventListener("dragstart", (e) => {
      e.preventDefault();
    });

    // ====================================================================
    // ERROR HANDLING
    // ====================================================================

    window.addEventListener("error", (e) => {
      console.error("JavaScript error:", e.message, e.filename, e.lineno);
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error("Unhandled promise rejection:", e.reason);
    });

    // ====================================================================
    // PARAMETER BINDING
    // ====================================================================

    if (!window.__JUCE__) {
      console.error("JUCE backend not available");
      document.body.innerHTML = "<h1>Error: JUCE backend not connected</h1>";
      throw new Error("JUCE backend not connected");
    }

    console.log("JUCE backend connected:", window.__JUCE__.backend);

    // ============================================================
    // Shared knob interaction wiring (relative drag / wheel / keyboard /
    // dblclick). Rotation always uses the standard -135deg..+135deg
    // physical range driven by the JUCE normalised 0-1 value - identical
    // for unipolar and bipolar knobs. Only the arc-fill rendering and LCD
    // text formatting differ per knob "mode".
    //
    // Drag uses frame-to-frame relative delta (juce8-critical-patterns.md
    // Pattern #16) - NOT absolute cursor position. valueChangedEvent
    // listeners read the current value via getNormalisedValue() rather
    // than trusting a passed callback argument (Pattern #15).
    // ============================================================
    function setupKnob({ knobId, bodyId, textId, paramId, label, defaultNormalised, render, centerDetent }) {
      const knobEl = document.getElementById(knobId);
      const bodyEl = document.getElementById(bodyId);
      const textEl = document.getElementById(textId);
      const state = getSliderState(paramId);

      if (!state) {
        console.error(`Failed to get slider state for "${paramId}"`);
        return;
      }

      function update() {
        const normalised = state.getNormalisedValue();
        const degrees = -135 + normalised * 270;
        bodyEl.style.transform = `rotate(${degrees}deg)`;
        render(normalised, textEl, knobEl);
      }

      // Initialize from current parameter value (handles preset recall)
      update();

      // C++ -> HTML (automation, preset recall). No value passed to the
      // callback - read current state via getNormalisedValue() (Pattern #15).
      state.valueChangedEvent.addListener(() => update());

      // HTML -> C++ (user interaction): relative vertical drag, up = increase
      let dragging = false;
      let lastY = 0;
      const DRAG_SENSITIVITY = 1 / 160; // ~160px of drag covers full range

      // Center-detent (SWEEP only): briefly snaps and holds at the exact
      // center value (0.5 normalised = 0%) when a drag passes through it, so
      // the physical center reads as a distinct, findable stop instead of a
      // point you can blow straight through - mimics a hardware pot's center
      // detent. Purely a pointer-drag interaction nicety: automation/preset
      // recall still pass through 0.5 continuously and are unaffected; wheel/
      // keyboard nudging is also unaffected (each step is already a discrete
      // 1% increment, so it can already land exactly on 0% without help).
      const CENTER_DETENT_THRESHOLD = 0.015;  // +/-1.5% normalised (~+/-3 of the -100..100 display range)
      const CENTER_DETENT_HOLD_MS = 150;      // how long the knob "sticks" at center before resuming tracking
      let detentHoldUntil = 0;
      let detentArmed = true; // re-armed once the drag leaves the deadzone, so it only snaps once per pass-through

      function onPointerDown(e) {
        dragging = true;
        lastY = e.clientY;
        detentHoldUntil = 0;
        detentArmed = true;
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);
        e.preventDefault();
      }

      function onPointerMove(e) {
        if (!dragging) return;

        // Still within an active center hold - ignore pointer movement
        // entirely (knob stays pinned at 0%), but keep tracking the raw
        // pointer position so per-frame delta tracking resumes smoothly
        // (no jump) once the hold window elapses.
        if (centerDetent && performance.now() < detentHoldUntil) {
          lastY = e.clientY;
          return;
        }

        const deltaY = lastY - e.clientY; // distance since LAST FRAME
        const current = state.getNormalisedValue();
        let newValue = Math.max(0, Math.min(1, current + deltaY * DRAG_SENSITIVITY));

        if (centerDetent) {
          const inDeadzone = Math.abs(newValue - 0.5) <= CENTER_DETENT_THRESHOLD;
          if (inDeadzone && detentArmed) {
            newValue = 0.5;
            detentHoldUntil = performance.now() + CENTER_DETENT_HOLD_MS;
            detentArmed = false; // don't re-trigger again until the drag leaves the deadzone
          } else if (!inDeadzone) {
            detentArmed = true;
          }
        }

        state.setNormalisedValue(newValue);
        lastY = e.clientY; // update for next frame
      }

      function onPointerUp() {
        dragging = false;
        window.removeEventListener("mousemove", onPointerMove);
        window.removeEventListener("mouseup", onPointerUp);
      }

      knobEl.addEventListener("mousedown", onPointerDown);

      // Scroll wheel nudges value by 1% of range per tick
      knobEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        const step = e.deltaY < 0 ? 0.01 : -0.01;
        state.setNormalisedValue(Math.max(0, Math.min(1, state.getNormalisedValue() + step)));
      }, { passive: false });

      // Keyboard accessibility: arrow up/down adjust by 1% of range
      knobEl.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp" || e.key === "ArrowRight") {
          e.preventDefault();
          state.setNormalisedValue(Math.max(0, Math.min(1, state.getNormalisedValue() + 0.01)));
        } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
          e.preventDefault();
          state.setNormalisedValue(Math.max(0, Math.min(1, state.getNormalisedValue() - 0.01)));
        }
      });

      // Double-click resets to default
      knobEl.addEventListener("dblclick", () => {
        state.setNormalisedValue(defaultNormalised);
      });
    }

    // ============================================================
    // Unipolar knob renderer (THROW, SPACE) - single CW arc sweep from a
    // start angle.
    // ============================================================
    function makeUnipolarRenderer({ arcId }) {
      const arcEl = document.getElementById(arcId);
      const ARC_LENGTH = 349.13; // 270deg of a r=74 circle: 2*PI*74*(270/360)

      return function render(normalised, textEl, knobEl) {
        const percent = normalised * 100;
        arcEl.style.strokeDashoffset = String(ARC_LENGTH - normalised * ARC_LENGTH);
        const rounded = Math.round(percent);
        textEl.textContent = `${rounded}%`;
        knobEl.setAttribute("aria-valuenow", String(rounded));
      };
    }

    // ============================================================
    // Bipolar knob renderer (SWEEP) - arc fill grows outward from the fixed
    // 12-o'clock/center point in both directions. Path is computed directly
    // in the SVG's own (unrotated) coordinate space using the same
    // clock-angle parametrization as a physical dial:
    //   point(theta) = ( cx + r*sin(theta), cy - r*cos(theta) )
    // where theta=0 is straight up (12 o'clock, matches the 0% center
    // value) and theta increases clockwise, matching the knob's own
    // -135deg..+135deg physical rotation range mapped from -100%..+100%.
    // ============================================================
    function makeBipolarRenderer({ pathId }) {
      const pathEl = document.getElementById(pathId);
      const cx = 80, cy = 80, r = 74;

      function arcPoint(thetaDeg) {
        const rad = thetaDeg * Math.PI / 180;
        return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
      }

      return function render(normalised, textEl, knobEl) {
        const value = -100 + normalised * 200;      // -100..+100
        const knobAngle = (value / 100) * 135;       // matches -135..+135 physical range

        if (Math.abs(knobAngle) < 0.05) {
          pathEl.setAttribute("d", "");               // no fill exactly at center
        } else {
          const center = arcPoint(0);
          const end = arcPoint(knobAngle);
          const sweepFlag = knobAngle > 0 ? 1 : 0;     // 1 = clockwise (positive), 0 = counter-clockwise (negative)
          pathEl.setAttribute(
            "d",
            `M ${center.x.toFixed(2)} ${center.y.toFixed(2)} A ${r} ${r} 0 0 ${sweepFlag} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`
          );
        }

        const rounded = Math.round(value);
        let displayText;
        if (rounded === 0) {
          displayText = "0%";
        } else if (rounded > 0) {
          displayText = `+${rounded}%`;
        } else {
          displayText = `${rounded}%`;   // already has minus sign
        }
        textEl.textContent = displayText;
        knobEl.setAttribute("aria-valuenow", String(rounded));
      };
    }


    // ====================================================================
    // QUICK PRESET BAR (top of window, above the panels)
    // ====================================================================
    // A lightweight, UI-only preset browser - NOT a JUCE/DAW "program" (no
    // getStateInformation/AudioProcessor::setCurrentProgram involvement).
    // It simply drives the same 3 parameter relays the knobs themselves use
    // (getSliderState(id).setNormalisedValue(...)), so preset recall goes
    // through the exact same path as manually dragging a knob - fully
    // host-automatable, and correctly captured by the host's own
    // session/state save (which persists the resulting parameter values,
    // not "which preset name was selected").
    const PRESETS = [
      { name: "Init",              throw: 0,   space: 0,   sweep: 0   },
      { name: "Gentle Wash",       throw: 35,  space: 45,  sweep: 0   },
      { name: "Tight Slap",        throw: 20,  space: 10,  sweep: 0   },
      { name: "Big Riser",         throw: 85,  space: 70,  sweep: 35  },
      { name: "Infinite Freeze",   throw: 100, space: 55,  sweep: 0   },
      { name: "Filter Down Sweep", throw: 55,  space: 40,  sweep: -80 },
      { name: "Filter Up Open",    throw: 45,  space: 35,  sweep: 70  },
      { name: "Cavernous Hold",    throw: 95,  space: 100, sweep: -15 }
    ];

    function unipolarToNormalised(v) { return v / 100; }         // 0..100 -> 0..1
    function bipolarToNormalised(v) { return (v + 100) / 200; }  // -100..100 -> 0..1

    function setupPresetBar() {
      const selectEl = document.getElementById("presetSelect");
      const prevBtn = document.getElementById("presetPrevBtn");
      const nextBtn = document.getElementById("presetNextBtn");

      const throwState = getSliderState("throw");
      const spaceState = getSliderState("space");
      const sweepState = getSliderState("sweep");

      PRESETS.forEach((p, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = p.name;
        selectEl.appendChild(opt);
      });

      let currentIndex = -1; // -1 = "Custom" (current values don't match a listed preset)

      function applyPreset(rawIndex) {
        const index = ((rawIndex % PRESETS.length) + PRESETS.length) % PRESETS.length;
        const p = PRESETS[index];
        throwState.setNormalisedValue(unipolarToNormalised(p.throw));
        spaceState.setNormalisedValue(unipolarToNormalised(p.space));
        sweepState.setNormalisedValue(bipolarToNormalised(p.sweep));
        const customOpt = selectEl.querySelector('option[value="-1"]');
        if (customOpt) customOpt.remove();
        currentIndex = index;
        selectEl.value = String(index);
      }

      function findMatchingPresetIndex() {
        const t = Math.round(throwState.getNormalisedValue() * 100);
        const s = Math.round(spaceState.getNormalisedValue() * 100);
        const sw = Math.round(sweepState.getNormalisedValue() * 200 - 100);
        for (let i = 0; i < PRESETS.length; i++) {
          const p = PRESETS[i];
          if (Math.abs(p.throw - t) <= 1 && Math.abs(p.space - s) <= 1 && Math.abs(p.sweep - sw) <= 1) {
            return i;
          }
        }
        return -1;
      }

      // On load, reflect whatever the host actually restored (preset
      // recall, automation, or a fresh default instance) WITHOUT
      // overwriting it - only select a matching preset name if one
      // matches; otherwise show "Custom" rather than falsely implying a
      // preset is active.
      const initialMatch = findMatchingPresetIndex();
      if (initialMatch >= 0) {
        currentIndex = initialMatch;
        selectEl.value = String(initialMatch);
      } else {
        const customOpt = document.createElement("option");
        customOpt.value = "-1";
        customOpt.textContent = "Custom";
        selectEl.insertBefore(customOpt, selectEl.firstChild);
        selectEl.value = "-1";
        currentIndex = -1;
      }

      selectEl.addEventListener("change", (e) => applyPreset(parseInt(e.target.value, 10)));
      prevBtn.addEventListener("click", () => applyPreset((currentIndex === -1 ? 0 : currentIndex) - 1));
      nextBtn.addEventListener("click", () => applyPreset((currentIndex === -1 ? -1 : currentIndex) + 1));
    }

    document.addEventListener("DOMContentLoaded", () => {
      setupPresetBar();

      setupKnob({
        knobId: "throwKnob",
        bodyId: "throwKnobBody",
        textId: "throwValueText",
        paramId: "throw",
        label: "THROW",
        defaultNormalised: 0.0,
        render: makeUnipolarRenderer({ arcId: "throwArc" })
      });

      setupKnob({
        knobId: "spaceKnob",
        bodyId: "spaceKnobBody",
        textId: "spaceValueText",
        paramId: "space",
        label: "SPACE",
        defaultNormalised: 0.0,
        render: makeUnipolarRenderer({ arcId: "spaceArc" })
      });

      setupKnob({
        knobId: "sweepKnob",
        bodyId: "sweepKnobBody",
        textId: "sweepValueText",
        paramId: "sweep",
        label: "SWEEP",
        defaultNormalised: 0.5,   // 0.5 normalised = 0% = center detent
        centerDetent: true,       // snap-and-hold at center while dragging (SWEEP only)
        render: makeBipolarRenderer({ pathId: "sweepArcPath" })
      });
    });

    console.log("Transitionist UI initialized");
  </script>

</body>
</html>
