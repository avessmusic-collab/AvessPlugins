<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transitionist UI Mockup v2</title>

<style>
  /* ============================================================
     WEBVIEW CONSTRAINT FOUNDATION (ui-design-rules.md Rule 1/2/3)
     ============================================================ */
  html, body {
    height: 100%;             /* REQUIRED - replaces viewport units */
    margin: 0;
    padding: 0;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
    overflow: hidden;

    background: #050506;     /* browser test-harness background (outside plugin frame) */
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', -apple-system, 'Helvetica Neue', Arial, sans-serif;

    /* Test-harness only: center the fixed-size plugin frame in the browser
       viewport (Rule 10). Production HTML does not use this wrapper. */
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }

  /* ============================================================
     TEST HTML PREVIEW FRAME (ui-design-rules.md Rule 10)
     ============================================================ */
  .plugin-frame {
    width: 700px;             /* FIXED - matches v2-ui.yaml window spec */
    height: 420px;            /* FIXED - matches v2-ui.yaml window spec */
    border: 2px solid #3a3d44;
    box-shadow: 0 20px 60px rgba(0,0,0,0.65);
    overflow: hidden;
    position: relative;
    border-radius: 4px;
  }

  /* ============================================================
     PLUGIN UI - fills the frame at 100% (matches production sizing)
     ============================================================ */
  .container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;

    /* Thick solid black/near-black outer bezel - the plugin's own frame,
       distinct from the gray test-harness border above. */
    background: linear-gradient(155deg, #1b1c20 0%, #0c0c0e 60%, #0a0a0b 100%);
    border-radius: 26px;
  }

  /* ---------------- Logo ---------------- */
  .logo {
    position: absolute;
    left: 0px;
    top: 24px;
    width: 700px;
    height: 30px;
    text-align: center;
    color: #f3f4f6;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.34em;
    /* logo sits on the dark bezel, not the light panels, so it keeps a
       light color here - text_primary (dark blue-gray) is reserved for
       labels/captions that sit on the pale silver panels below. */
    text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 18px rgba(154,182,232,0.18);
  }

  /* ---------------- Panel cards ---------------- */
  .panel {
    position: absolute;
    top: 90px;
    width: 260px;
    height: 250px;
    border-radius: 20px;
    background: linear-gradient(170deg, #eef1f5 0%, #dde2e9 100%);
    border: 1px solid #c7ceda;
    box-shadow:
      inset 0 2px 6px rgba(30,38,54,0.28),
      inset 0 -3px 10px rgba(30,38,54,0.14),
      0 3px 0 rgba(255,255,255,0.04);
  }
  .panel-filter { left: 60px; }
  .panel-tail   { left: 380px; }

  /* ---------------- Caption labels ---------------- */
  .caption {
    position: absolute;
    top: 284px;
    width: 260px;
    height: 20px;
    text-align: center;
    color: #5b6478;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
  }
  .caption-filter { left: 60px; }
  .caption-tail   { left: 380px; }

  /* ---------------- Knob assembly ---------------- */
  .knob-wrap {
    position: absolute;
    top: 126px;
    width: 140px;
    height: 140px;
  }
  .knob-wrap-filter { left: 120px; }
  .knob-wrap-tail   { left: 440px; }

  /* Soft cool blue-lavender ambient glow bleeding from behind part of the disc */
  .knob-glow {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(154,182,232,0.55) 0%, rgba(154,182,232,0.0) 62%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }

  /* Thin, understated arc track + progress ring - sits just outside the disc */
  .knob-arc {
    position: absolute;
    inset: -10px;
    z-index: 1;
    pointer-events: none;
    transform: rotate(135deg);
  }
  .knob-arc-track {
    fill: none;
    stroke: rgba(90,104,130,0.22);
    stroke-width: 3;
    stroke-linecap: round;
  }
  .knob-arc-fill {
    fill: none;
    stroke: #6f8fc9;
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 40ms linear;
  }

  /* The interactive knob itself (mousedown target) */
  .knob {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 2;
    cursor: ns-resize;
  }

  /* Layer 2: rotating body (texture + pointer) */
  .knob-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform-origin: center center;
    transition: transform 40ms linear;
    background: radial-gradient(circle at 35% 30%, #f6f8fa 0%, #d7dce3 55%, #aab2c0 100%);
    box-shadow: 0 6px 14px rgba(10,12,16,0.45);
  }

  /* Fine ridged/hobbed metal edge texture - only visible near the outer rim */
  .knob-ridges {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255,255,255,0.55) 0deg 1.6deg,
      rgba(70,80,100,0.30) 1.6deg 3.2deg
    );
    -webkit-mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
            mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
  }

  /* Small pointer dot near the top edge - rotates with the knob body */
  .knob-pointer {
    position: absolute;
    top: 9px;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: #3d4a63;
    box-shadow: 0 0 2px rgba(255,255,255,0.5) inset, 0 1px 1px rgba(0,0,0,0.3);
  }

  /* Layer 1 (visually on top): fixed skeuomorphic lighting - does NOT rotate,
     per ui-design-rules.md Rule 9 */
  .knob-lighting {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      inset -5px -6px 10px rgba(20,24,32,0.35),
      inset 5px 6px 10px rgba(255,255,255,0.55);
    pointer-events: none;
    z-index: 3;
  }

  /* Inset LCD-style digital readout - embedded in knob center, fixed
     (does not rotate with knob body) */
  .knob-lcd {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 56px;
    height: 28px;
    transform: translate(-50%, -50%);
    background: #182028;
    border: 2px solid #232a36;
    border-radius: 4px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.65),
      inset 0 -1px 1px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    pointer-events: none;
  }
  .knob-lcd-text {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #7fd8e0;
    text-shadow: 0 0 6px rgba(127,216,224,0.55);
  }

  /* ---------------- Debug monitor (test HTML only, Rule 11) ---------------- */
  .debug-monitor {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    color: #0f0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 4px;
    min-width: 170px;
    pointer-events: none;
    z-index: 10000;
  }
  .debug-label {
    color: #666;
    font-size: 9px;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .debug-param { font-weight: bold; color: #0f0; }
  .debug-value { color: #fff; margin-top: 2px; }
  .debug-normalized { color: #888; font-size: 10px; }
</style>
</head>
<body>

  <div class="plugin-frame">
    <div class="container">

      <div class="logo">TRANSITIONIST</div>

      <!-- FILTER (parameter id: mix) -->
      <div class="panel panel-filter"></div>
      <div class="knob-wrap knob-wrap-filter">
        <div class="knob-glow"></div>
        <svg class="knob-arc" viewBox="0 0 160 160">
          <circle class="knob-arc-track" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
          <circle class="knob-arc-fill" id="filterArc" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="349.13"></circle>
        </svg>
        <div class="knob" id="filterKnob" tabindex="0" role="slider"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Filter">
          <div class="knob-body" id="filterKnobBody">
            <div class="knob-ridges"></div>
            <div class="knob-pointer"></div>
          </div>
          <div class="knob-lighting"></div>
          <div class="knob-lcd">
            <span class="knob-lcd-text" id="filterValueText">0%</span>
          </div>
        </div>
      </div>
      <div class="caption caption-filter">FILTER</div>

      <!-- TAIL (parameter id: duration) -->
      <div class="panel panel-tail"></div>
      <div class="knob-wrap knob-wrap-tail">
        <div class="knob-glow"></div>
        <svg class="knob-arc" viewBox="0 0 160 160">
          <circle class="knob-arc-track" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
          <circle class="knob-arc-fill" id="tailArc" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="349.13"></circle>
        </svg>
        <div class="knob" id="tailKnob" tabindex="0" role="slider"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Tail">
          <div class="knob-body" id="tailKnobBody">
            <div class="knob-ridges"></div>
            <div class="knob-pointer"></div>
          </div>
          <div class="knob-lighting"></div>
          <div class="knob-lcd">
            <span class="knob-lcd-text" id="tailValueText">0%</span>
          </div>
        </div>
      </div>
      <div class="caption caption-tail">TAIL</div>

    </div>
  </div>

  <!-- Debug parameter monitor (test HTML only - Rule 11) -->
  <div class="debug-monitor">
    <div class="debug-label">PARAMETER MONITOR</div>
    <div class="debug-param" id="debugParam">&mdash;</div>
    <div class="debug-value" id="debugValue">&mdash;</div>
    <div class="debug-normalized" id="debugNormalized">&mdash;</div>
  </div>

<script>
  // ============================================================
  // Native application feel (ui-design-rules.md Rule 3)
  // ============================================================
  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    return false;
  });
  document.addEventListener("dragstart", (e) => {
    e.preventDefault();
  });

  // ============================================================
  // Mock JUCE backend for browser testing (no real WebView/JUCE needed)
  // ============================================================
  function makeMockParamState(defaultNormalised) {
    let value = defaultNormalised;
    const listeners = [];
    return {
      getNormalisedValue: () => value,
      setNormalisedValue: (v) => {
        value = Math.max(0, Math.min(1, v));
        listeners.forEach((fn) => fn(value));
      },
      valueChangedEvent: {
        addListener: (fn) => listeners.push(fn)
      }
    };
  }

  window.Juce = {
    _sliderStates: {
      mix: makeMockParamState(0.0),
      duration: makeMockParamState(0.0)
    },
    getSliderState: function (id) {
      if (!this._sliderStates[id]) {
        console.warn(`No mock slider state for parameter id "${id}"`);
        this._sliderStates[id] = makeMockParamState(0.0);
      }
      return this._sliderStates[id];
    }
  };

  // ============================================================
  // Debug monitor helper (Rule 11)
  // ============================================================
  function updateDebugMonitor(paramId, label, valuePercent, normalisedValue) {
    document.getElementById("debugParam").textContent = paramId;
    document.getElementById("debugValue").textContent = `${label}: ${valuePercent.toFixed(0)}%`;
    document.getElementById("debugNormalized").textContent = `normalised: ${normalisedValue.toFixed(3)}`;
  }

  // ============================================================
  // Knob control factory
  //   - Rule 8: rotates the whole knob-body element (-135deg to +135deg)
  //   - Rule 9: lighting layer stays fixed; only texture + pointer rotate
  //   - LCD readout is a separate fixed layer, never rotates
  // ============================================================
  function setupKnob({ knobId, bodyId, arcId, textId, paramId, label, arcLength, circumference }) {
    const knobEl = document.getElementById(knobId);
    const bodyEl = document.getElementById(bodyId);
    const arcEl = document.getElementById(arcId);
    const textEl = document.getElementById(textId);
    const state = Juce.getSliderState(paramId);

    function render(normalised) {
      const percent = normalised * 100;
      const degrees = -135 + normalised * 270;

      bodyEl.style.transform = `rotate(${degrees}deg)`;
      arcEl.style.strokeDashoffset = String(arcLength - normalised * arcLength);
      textEl.textContent = `${Math.round(percent)}%`;
      knobEl.setAttribute("aria-valuenow", String(Math.round(percent)));

      updateDebugMonitor(paramId, label, percent, normalised);
    }

    // Initialize from current parameter value (handles preset recall)
    render(state.getNormalisedValue());

    // C++ -> HTML (automation, preset recall)
    state.valueChangedEvent.addListener((normalised) => render(normalised));

    // HTML -> C++ (user interaction): vertical drag, up = increase
    let dragging = false;
    let startY = 0;
    let startValue = 0;
    const DRAG_RANGE_PX = 160; // px of drag to cover full 0-100% range

    function onPointerDown(e) {
      dragging = true;
      startY = e.clientY;
      startValue = state.getNormalisedValue();
      knobEl.setPointerCapture && e.pointerId !== undefined && knobEl.setPointerCapture(e.pointerId);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!dragging) return;
      const deltaY = startY - e.clientY;
      const deltaNormalised = deltaY / DRAG_RANGE_PX;
      state.setNormalisedValue(startValue + deltaNormalised);
    }

    function onPointerUp() {
      dragging = false;
      window.removeEventListener("mousemove", onPointerMove);
      window.removeEventListener("mouseup", onPointerUp);
    }

    knobEl.addEventListener("mousedown", onPointerDown);

    // Scroll wheel nudges value by 1% per tick - common hardware-knob convenience
    knobEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const step = e.deltaY < 0 ? 0.01 : -0.01;
      state.setNormalisedValue(state.getNormalisedValue() + step);
    }, { passive: false });

    // Keyboard accessibility: arrow up/down adjust by 1%
    knobEl.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        e.preventDefault();
        state.setNormalisedValue(state.getNormalisedValue() + 0.01);
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        e.preventDefault();
        state.setNormalisedValue(state.getNormalisedValue() - 0.01);
      }
    });

    // Double-click resets to default (0%)
    knobEl.addEventListener("dblclick", () => {
      state.setNormalisedValue(0.0);
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    const ARC_LENGTH = 349.13;      // 270deg of a r=74 circle: 2*PI*74*(270/360)
    const CIRCUMFERENCE = 465.5;    // 2*PI*74

    setupKnob({
      knobId: "filterKnob",
      bodyId: "filterKnobBody",
      arcId: "filterArc",
      textId: "filterValueText",
      paramId: "mix",
      label: "FILTER",
      arcLength: ARC_LENGTH,
      circumference: CIRCUMFERENCE
    });

    setupKnob({
      knobId: "tailKnob",
      bodyId: "tailKnobBody",
      arcId: "tailArc",
      textId: "tailValueText",
      paramId: "duration",
      label: "TAIL",
      arcLength: ARC_LENGTH,
      circumference: CIRCUMFERENCE
    });
  });

  // Basic error visibility during design iteration
  window.addEventListener("error", (e) => console.error("UI error:", e.message));
  window.addEventListener("unhandledrejection", (e) => console.error("Unhandled rejection:", e.reason));
</script>

</body>
</html>
