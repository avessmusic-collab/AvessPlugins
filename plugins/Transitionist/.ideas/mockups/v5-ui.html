<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transitionist</title>

<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    width: 1010px;
    height: 440px;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    overflow: hidden;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  .container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background:
      repeating-linear-gradient(125deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 1px, rgba(70,80,100,0.06) 1px, rgba(70,80,100,0.06) 2px),
      linear-gradient(155deg, #d7dce3 0%, #c3cad6 45%, #aab2c0 100%);
    border: 1px solid #98a2b4;
    border-radius: 26px;
  }

  /* ---------------- Logo ---------------- */
  .logo {
    position: absolute;
    left: 0px;
    top: 24px;
    width: 1010px;
    height: 30px;
    text-align: center;
    color: #2c3444;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.34em;
    text-shadow: 0 1px 0 rgba(255,255,255,0.75), 0 1px 3px rgba(20,24,34,0.30), 0 0 14px rgba(154,182,232,0.25);
  }

  /* ---------------- Preset bar ---------------- */
  .preset-bar {
    position: absolute;
    top: 58px;
    left: 379px;
    width: 252px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 5;
  }
  .preset-btn {
    appearance: none;
    -webkit-appearance: none;
    width: 28px;
    height: 24px;
    border-radius: 6px;
    background: linear-gradient(170deg, #f6f8fa 0%, #d7dce3 55%, #aab2c0 100%);
    border: 1px solid #b9c2d1;
    box-shadow: 0 1px 2px rgba(30,38,54,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
    color: #2c3444;
    font-family: inherit;
    font-size: 10px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    margin: 0;
  }
  .preset-btn:active { box-shadow: inset 0 1px 3px rgba(20,24,32,0.4); }

  /* Shared LCD-styled <select> - used by the preset dropdown AND delaySync */
  .lcd-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background: #182028;
    border: 2px solid #232a36;
    border-radius: 4px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.65), inset 0 -1px 1px rgba(255,255,255,0.05);
    font-family: 'Courier New', 'Consolas', monospace;
    letter-spacing: 0.06em;
    color: #7fd8e0;
    text-shadow: 0 0 6px rgba(127,216,224,0.55);
    text-align: center;
    text-align-last: center;
    cursor: pointer;
    margin: 0;
  }
  .preset-select { width: 180px; height: 24px; font-size: 11px; padding: 0 4px; }
  .preset-select option { background: #182028; color: #7fd8e0; }

  /* ---------------- Panel cards ---------------- */
  .panel {
    position: absolute;
    top: 90px;
    height: 300px;
    border-radius: 20px;
    background: linear-gradient(170deg, #eef1f5 0%, #dde2e9 100%);
    border: 1px solid #c7ceda;
    box-shadow:
      inset 0 2px 6px rgba(30,38,54,0.28),
      inset 0 -3px 10px rgba(30,38,54,0.14),
      0 3px 0 rgba(255,255,255,0.04);
  }
  .panel-delay       { left: 40px;  width: 170px; }
  .panel-reverb      { left: 230px; width: 170px; }
  .panel-transition  { left: 420px; width: 250px; }
  .panel-drywet      { left: 690px; width: 130px; }
  .panel-volume      { left: 840px; width: 130px; }

  /* ---------------- Captions ---------------- */
  .caption {
    position: absolute;
    top: 340px;
    height: 20px;
    text-align: center;
    color: #5b6478;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
  }
  .caption-delay      { left: 40px;  width: 170px; }
  .caption-reverb     { left: 230px; width: 170px; }
  .caption-transition { left: 420px; width: 250px; }
  .caption-drywet     { left: 690px; width: 130px; }
  .caption-volume     { left: 840px; width: 130px; }

  /* ---------------- Knob assembly (shared anatomy, per-size wrap) ---------------- */
  .knob-wrap { position: absolute; }
  .knob-wrap-delay      { top: 170px; left: 65px;  width: 120px; height: 120px; }
  .knob-wrap-reverb     { top: 170px; left: 255px; width: 120px; height: 120px; }
  .knob-wrap-transition { top: 130px; left: 445px; width: 200px; height: 200px; }
  .knob-wrap-drywet     { top: 190px; left: 715px; width: 80px;  height: 80px; }
  .knob-wrap-volume     { top: 190px; left: 865px; width: 80px;  height: 80px; }

  .knob-glow {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(154,182,232,0.55) 0%, rgba(154,182,232,0.0) 62%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }
  .knob-arc {
    position: absolute;
    inset: -10px;
    z-index: 1;
    pointer-events: none;
    transform: rotate(135deg);
  }
  .knob-arc-track { fill: none; stroke: rgba(90,104,130,0.22); stroke-linecap: round; }
  .knob-arc-fill  { fill: none; stroke: #6f8fc9; stroke-linecap: round; transition: stroke-dashoffset 40ms linear; }
  .knob { position: absolute; inset: 0; border-radius: 50%; z-index: 2; cursor: ns-resize; }
  .knob-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform-origin: center center;
    transition: transform 80ms cubic-bezier(0.22, 0.61, 0.36, 1);
    background: radial-gradient(circle at 35% 30%, #f6f8fa 0%, #d7dce3 55%, #aab2c0 100%);
    box-shadow: 0 6px 14px rgba(10,12,16,0.45);
  }
  .knob-ridges {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.55) 0deg 1.6deg, rgba(70,80,100,0.30) 1.6deg 3.2deg);
    -webkit-mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
            mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
  }
  .knob-pointer {
    position: absolute;
    top: 9px;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: #3d4a63;
    box-shadow: 0 0 2px rgba(255,255,255,0.5) inset, 0 1px 1px rgba(0,0,0,0.3);
  }
  .knob-lighting {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset -5px -6px 10px rgba(20,24,32,0.35), inset 5px 6px 10px rgba(255,255,255,0.55);
    pointer-events: none;
    z-index: 3;
  }
  .knob-lcd {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 56px;
    height: 28px;
    transform: translate(-50%, -50%);
    background: #182028;
    border: 2px solid #232a36;
    border-radius: 4px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.65), inset 0 -1px 1px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    pointer-events: none;
  }
  .knob-lcd-text {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #7fd8e0;
    text-shadow: 0 0 6px rgba(127,216,224,0.55);
    white-space: nowrap;
  }

  /* Volume's LCD shows signed dB values ("-60 dB", "+6 dB") which are wider
     than the percent knobs' "0%"-"100%" text - widen the box and shrink the
     font slightly so it always fits on one line instead of wrapping. */
  #volumeKnob .knob-lcd { width: 68px; }
  #volumeValueText { font-size: 12px; letter-spacing: 0.02em; }

  /* ---------------- Delay Sync dropdown ---------------- */
  .delay-sync-select {
    position: absolute;
    top: 303px;
    left: 83px;
    width: 84px;
    height: 24px;
    font-size: 11px;
    padding: 0 2px;
  }
  .delay-sync-select option { background: #182028; color: #7fd8e0; }

</style>
</head>
<body>

  <div class="container">

    <div class="logo">TRANSITIONIST</div>

    <div class="preset-bar">
      <button class="preset-btn" id="presetPrevBtn" type="button" aria-label="Previous preset">&#9664;</button>
      <select class="lcd-select preset-select" id="presetSelect" aria-label="Preset"></select>
      <button class="preset-btn" id="presetNextBtn" type="button" aria-label="Next preset">&#9654;</button>
    </div>

    <!-- DELAY -->
    <div class="panel panel-delay"></div>
    <div class="knob-wrap knob-wrap-delay">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 140 140">
        <circle class="knob-arc-track" cx="70" cy="70" r="64" stroke-width="3" stroke-dasharray="301.59 402.12" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="delayArc" cx="70" cy="70" r="64" stroke-width="3" stroke-dasharray="301.59 402.12" stroke-dashoffset="301.59"></circle>
      </svg>
      <div class="knob" id="delayKnob" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Delay">
        <div class="knob-body" id="delayKnobBody"><div class="knob-ridges"></div><div class="knob-pointer"></div></div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd"><span class="knob-lcd-text" id="delayValueText">0%</span></div>
      </div>
    </div>
    <select class="lcd-select delay-sync-select" id="delaySyncSelect" aria-label="Delay Sync">
      <option value="0">1/16</option>
      <option value="1">1/8T</option>
      <option value="2">1/8</option>
      <option value="3">1/8D</option>
      <option value="4" selected>1/4</option>
      <option value="5">1/4D</option>
      <option value="6">1/2</option>
      <option value="7">1/2D</option>
      <option value="8">1/1</option>
    </select>
    <div class="caption caption-delay">DELAY</div>

    <!-- TRANSITION (hero) -->
    <div class="panel panel-transition"></div>
    <div class="knob-wrap knob-wrap-transition">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 220 220">
        <circle class="knob-arc-track" cx="110" cy="110" r="104" stroke-width="4" stroke-dasharray="490.09 653.45" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="transitionArc" cx="110" cy="110" r="104" stroke-width="4" stroke-dasharray="490.09 653.45" stroke-dashoffset="490.09"></circle>
      </svg>
      <div class="knob" id="transitionKnob" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Transition">
        <div class="knob-body" id="transitionKnobBody"><div class="knob-ridges"></div><div class="knob-pointer"></div></div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd"><span class="knob-lcd-text" id="transitionValueText">0%</span></div>
      </div>
    </div>
    <div class="caption caption-transition">TRANSITION</div>

    <!-- REVERB -->
    <div class="panel panel-reverb"></div>
    <div class="knob-wrap knob-wrap-reverb">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 140 140">
        <circle class="knob-arc-track" cx="70" cy="70" r="64" stroke-width="3" stroke-dasharray="301.59 402.12" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="reverbArc" cx="70" cy="70" r="64" stroke-width="3" stroke-dasharray="301.59 402.12" stroke-dashoffset="301.59"></circle>
      </svg>
      <div class="knob" id="reverbKnob" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Reverb">
        <div class="knob-body" id="reverbKnobBody"><div class="knob-ridges"></div><div class="knob-pointer"></div></div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd"><span class="knob-lcd-text" id="reverbValueText">0%</span></div>
      </div>
    </div>
    <div class="caption caption-reverb">REVERB</div>

    <!-- DRY/WET -->
    <div class="panel panel-drywet"></div>
    <div class="knob-wrap knob-wrap-drywet">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 100 100">
        <circle class="knob-arc-track" cx="50" cy="50" r="44" stroke-width="2" stroke-dasharray="207.35 276.46" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="dryWetArc" cx="50" cy="50" r="44" stroke-width="2" stroke-dasharray="207.35 276.46" stroke-dashoffset="207.35"></circle>
      </svg>
      <div class="knob" id="dryWetKnob" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="Dry Wet">
        <div class="knob-body" id="dryWetKnobBody"><div class="knob-ridges"></div><div class="knob-pointer"></div></div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd"><span class="knob-lcd-text" id="dryWetValueText">50%</span></div>
      </div>
    </div>
    <div class="caption caption-drywet">DRY/WET</div>

    <!-- VOLUME (last stage in chain, small, rightmost) -->
    <div class="panel panel-volume"></div>
    <div class="knob-wrap knob-wrap-volume">
      <div class="knob-glow"></div>
      <svg class="knob-arc" viewBox="0 0 100 100">
        <circle class="knob-arc-track" cx="50" cy="50" r="44" stroke-width="2" stroke-dasharray="207.35 276.46" stroke-dashoffset="0"></circle>
        <circle class="knob-arc-fill" id="volumeArc" cx="50" cy="50" r="44" stroke-width="2" stroke-dasharray="207.35 276.46" stroke-dashoffset="207.35"></circle>
      </svg>
      <div class="knob" id="volumeKnob" tabindex="0" role="slider" aria-valuemin="-60" aria-valuemax="6" aria-valuenow="0" aria-label="Volume">
        <div class="knob-body" id="volumeKnobBody"><div class="knob-ridges"></div><div class="knob-pointer"></div></div>
        <div class="knob-lighting"></div>
        <div class="knob-lcd"><span class="knob-lcd-text" id="volumeValueText">0.0 dB</span></div>
      </div>
    </div>
    <div class="caption caption-volume">VOLUME</div>

  </div>

  <script type="module">
    import { getSliderState, getComboBoxState } from "./js/juce/index.js";

    document.addEventListener("contextmenu", (e) => { e.preventDefault(); return false; });
    document.addEventListener("dragstart", (e) => e.preventDefault());
    window.addEventListener("error", (e) => console.error("JS error:", e.message, e.filename, e.lineno));
    window.addEventListener("unhandledrejection", (e) => console.error("Unhandled rejection:", e.reason));

    // ====================================================================
    // Shared rotary knob wiring (relative drag, wheel, keyboard, dblclick)
    // - all interactions bracket sliderDragStarted()/sliderDragEnded() for
    // correct DAW automation recording (juce8-critical-patterns.md #23).
    // ====================================================================
    function setupKnob({ knobId, bodyId, arcId, textId, paramId, defaultNormalised, arcLength, format, dragRangePx }) {
      const knobEl = document.getElementById(knobId);
      const bodyEl = document.getElementById(bodyId);
      const arcEl = document.getElementById(arcId);
      const textEl = document.getElementById(textId);
      const state = getSliderState(paramId);
      if (!state) { console.error(`No slider state for "${paramId}"`); return; }

      function render() {
        const normalised = state.getNormalisedValue();
        const degrees = -135 + normalised * 270;
        bodyEl.style.transform = `rotate(${degrees}deg)`;
        arcEl.style.strokeDashoffset = String(arcLength - normalised * arcLength);
        const scaled = state.getScaledValue();
        textEl.textContent = format(scaled);
        knobEl.setAttribute("aria-valuenow", String(Math.round(scaled)));
      }

      render();
      state.valueChangedEvent.addListener(() => render());

      let dragging = false;
      let lastY = 0;
      const DRAG_SENSITIVITY = 1 / (dragRangePx || 160);

      function onPointerDown(e) {
        dragging = true;
        lastY = e.clientY;
        state.sliderDragStarted();
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);
        e.preventDefault();
      }
      function onPointerMove(e) {
        if (!dragging) return;
        const deltaY = lastY - e.clientY;
        const newValue = Math.max(0, Math.min(1, state.getNormalisedValue() + deltaY * DRAG_SENSITIVITY));
        state.setNormalisedValue(newValue);
        lastY = e.clientY;
      }
      function onPointerUp() {
        dragging = false;
        state.sliderDragEnded();
        window.removeEventListener("mousemove", onPointerMove);
        window.removeEventListener("mouseup", onPointerUp);
      }
      knobEl.addEventListener("mousedown", onPointerDown);

      knobEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        const step = e.deltaY < 0 ? 0.01 : -0.01;
        state.sliderDragStarted();
        state.setNormalisedValue(Math.max(0, Math.min(1, state.getNormalisedValue() + step)));
        state.sliderDragEnded();
      }, { passive: false });

      knobEl.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp" || e.key === "ArrowRight") {
          e.preventDefault();
          state.sliderDragStarted();
          state.setNormalisedValue(Math.max(0, Math.min(1, state.getNormalisedValue() + 0.01)));
          state.sliderDragEnded();
        } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
          e.preventDefault();
          state.sliderDragStarted();
          state.setNormalisedValue(Math.max(0, Math.min(1, state.getNormalisedValue() - 0.01)));
          state.sliderDragEnded();
        }
      });

      knobEl.addEventListener("dblclick", () => {
        state.sliderDragStarted();
        state.setNormalisedValue(defaultNormalised);
        state.sliderDragEnded();
      });

      return state;
    }

    const percentFormat = (v) => `${Math.round(v)}%`;

    // WebKit sometimes doesn't repaint a custom-styled (appearance:none)
    // <select>'s closed-state label after its .value is set purely from
    // JS (as opposed to a real user interaction) - force a reflow
    // immediately after any such assignment to guarantee the visible text
    // matches the new selection.
    function forceSelectRepaint(selectEl) {
      const prevDisplay = selectEl.style.display;
      selectEl.style.display = "none";
      void selectEl.offsetHeight; // force synchronous reflow
      selectEl.style.display = prevDisplay;
    }

    // dragRangePx scales with each knob's own diameter (~1.2x) so drag feel
    // is proportional to visual size - the 200px hero knob needs more travel
    // for the same value change than the 80px Dry/Wet knob, matching what
    // your hand expects when looking at a control that size.
    const transitionState = setupKnob({ knobId: "transitionKnob", bodyId: "transitionKnobBody", arcId: "transitionArc", textId: "transitionValueText", paramId: "transition", defaultNormalised: 0.0, arcLength: 490.09, format: percentFormat, dragRangePx: 240 });
    const reverbState     = setupKnob({ knobId: "reverbKnob",     bodyId: "reverbKnobBody",     arcId: "reverbArc",     textId: "reverbValueText",     paramId: "reverb",     defaultNormalised: 0.0, arcLength: 301.59, format: percentFormat, dragRangePx: 145 });
    const delayState      = setupKnob({ knobId: "delayKnob",      bodyId: "delayKnobBody",      arcId: "delayArc",      textId: "delayValueText",      paramId: "delay",      defaultNormalised: 0.0, arcLength: 301.59, format: percentFormat, dragRangePx: 145 });
    const dryWetState     = setupKnob({ knobId: "dryWetKnob",     bodyId: "dryWetKnobBody",     arcId: "dryWetArc",     textId: "dryWetValueText",     paramId: "dryWet",     defaultNormalised: 0.5, arcLength: 207.35, format: percentFormat, dragRangePx: 96 });

    // Volume - last stage in the chain, -60..+6dB (max 6dB boost), small
    // knob (same tier as Dry/Wet), rightmost. defaultNormalised is the
    // ACTUAL normalised position of 0dB within the -60..+6 range (NOT the
    // range midpoint, which would be -27dB): (0 - (-60)) / (6 - (-60)).
    const dbFormat = (v) => `${v > 0 ? "+" : ""}${Math.round(v)} dB`;
    const volumeState = setupKnob({ knobId: "volumeKnob", bodyId: "volumeKnobBody", arcId: "volumeArc", textId: "volumeValueText", paramId: "volume", defaultNormalised: 60 / 66, arcLength: 207.35, format: dbFormat, dragRangePx: 96 });

    // ====================================================================
    // Delay Sync combo box (9 choices, index/8 normalised - Scatter's
    // scale/root_note pattern)
    // ====================================================================
    const delaySyncSelect = document.getElementById("delaySyncSelect");
    const delaySyncState = getComboBoxState("delaySync");
    const DELAY_SYNC_MAX_INDEX = 8;
    if (delaySyncState) {
      delaySyncSelect.addEventListener("change", (e) => {
        delaySyncState.setNormalisedValue(parseInt(e.target.value, 10) / DELAY_SYNC_MAX_INDEX);
      });
      delaySyncState.valueChangedEvent.addListener(() => {
        const index = Math.round(delaySyncState.getNormalisedValue() * DELAY_SYNC_MAX_INDEX);
        delaySyncSelect.value = String(index);
        forceSelectRepaint(delaySyncSelect);
      });
      delaySyncSelect.value = String(Math.round(delaySyncState.getNormalisedValue() * DELAY_SYNC_MAX_INDEX));
      forceSelectRepaint(delaySyncSelect);
    }

    // ====================================================================
    // Vertical gain sliders (Input/Output) - absolute drag-to-position,
    // same gesture bracketing as knobs. Range is -24..+24dB but the slider
    // only deals in normalised 0-1 (0 = -24dB/bottom, 1 = +24dB/top).
    // ====================================================================




    // ====================================================================
    // Quick preset bar - UI-only, drives transition/reverb/delay/delaySync/
    // dryWet relay states (NOT volume - gain staging is left untouched by
    // presets, it's session/signal-specific, not a "sound").
    // ====================================================================
    const PRESETS = [
      { name: "Init",           transition: 0,   reverb: 0,  delay: 0,  delaySync: 4, dryWet: 50 },
      { name: "Slap Bounce",    transition: 20,  reverb: 10, delay: 60, delaySync: 2, dryWet: 60 },
      { name: "Big Riser",      transition: 85,  reverb: 70, delay: 50, delaySync: 5, dryWet: 80 },
      { name: "Infinite Freeze",transition: 100, reverb: 60, delay: 30, delaySync: 6, dryWet: 100 },
      { name: "Ping Pong Groove",transition: 30, reverb: 15, delay: 75, delaySync: 3, dryWet: 45 },
      { name: "Cavernous Hall", transition: 70,  reverb: 90, delay: 20, delaySync: 7, dryWet: 65 },
      { name: "Subtle Glue",    transition: 15,  reverb: 20, delay: 15, delaySync: 4, dryWet: 25 },
      { name: "Triplet Bounce", transition: 45,  reverb: 35, delay: 65, delaySync: 1, dryWet: 55 },
      { name: "Vocal Doubler",  transition: 10,  reverb: 5,  delay: 25, delaySync: 2, dryWet: 20 },
      { name: "Ambient Wash",   transition: 60,  reverb: 100,delay: 40, delaySync: 8, dryWet: 90 }
    ];

    function setupPresetBar() {
      const selectEl = document.getElementById("presetSelect");
      const prevBtn = document.getElementById("presetPrevBtn");
      const nextBtn = document.getElementById("presetNextBtn");

      if (!selectEl || !prevBtn || !nextBtn) {
        console.error("Preset bar elements missing from DOM - aborting setup", { selectEl, prevBtn, nextBtn });
        return;
      }

      PRESETS.forEach((p, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = p.name;
        selectEl.appendChild(opt);
      });

      // currentIndex is intentionally undefined (not -1) so the first
      // refreshSelectionDisplay() call always runs to completion, even if
      // the initial match also happens to resolve to -1 ("Custom").
      let currentIndex;
      let applyingPreset = false; // true while applyPreset() is mid-flight,
                                   // so the per-parameter valueChangedEvent
                                   // callbacks it triggers don't flicker the
                                   // dropdown through "Custom" between each
                                   // individual setNormalisedValue() call.

      function pct(v) { return v / 100; }

      function findMatchingPresetIndex() {
        const t = Math.round(transitionState.getNormalisedValue() * 100);
        const r = Math.round(reverbState.getNormalisedValue() * 100);
        const d = Math.round(delayState.getNormalisedValue() * 100);
        const dw = Math.round(dryWetState.getNormalisedValue() * 100);
        const ds = delaySyncState ? Math.round(delaySyncState.getNormalisedValue() * DELAY_SYNC_MAX_INDEX) : -1;
        for (let i = 0; i < PRESETS.length; i++) {
          const p = PRESETS[i];
          if (Math.abs(p.transition - t) <= 1 && Math.abs(p.reverb - r) <= 1 &&
              Math.abs(p.delay - d) <= 1 && Math.abs(p.dryWet - dw) <= 1 && p.delaySync === ds) {
            return i;
          }
        }
        return -1;
      }

      // Reflect the ACTUAL current parameter values in the dropdown
      // (matching preset name, or "Custom") - re-run any time a relevant
      // parameter changes (host automation, undo/redo, project reload), not
      // just once at load, so the label never lies about what's really
      // loaded. Skipped while applyPreset() itself is mid-flight (see
      // `applyingPreset` above) to avoid a "Custom" flicker between its
      // individual per-parameter writes.
      function refreshSelectionDisplay() {
        if (applyingPreset) return;

        const match = findMatchingPresetIndex();
        if (match === currentIndex) return; // no-op if nothing changed (avoid DOM churn during drags)

        const existingCustomOpt = selectEl.querySelector('option[value="-1"]');
        if (match >= 0) {
          if (existingCustomOpt) existingCustomOpt.remove();
          currentIndex = match;
          selectEl.value = String(match);
        } else {
          if (!existingCustomOpt) {
            const customOpt = document.createElement("option");
            customOpt.value = "-1";
            customOpt.textContent = "Custom";
            selectEl.insertBefore(customOpt, selectEl.firstChild);
          }
          selectEl.value = "-1";
          currentIndex = -1;
        }
        forceSelectRepaint(selectEl);
      }

      function applyPreset(rawIndex) {
        applyingPreset = true;
        currentIndex = ((rawIndex % PRESETS.length) + PRESETS.length) % PRESETS.length;
        const p = PRESETS[currentIndex];

        transitionState.sliderDragStarted(); transitionState.setNormalisedValue(pct(p.transition)); transitionState.sliderDragEnded();
        reverbState.sliderDragStarted(); reverbState.setNormalisedValue(pct(p.reverb)); reverbState.sliderDragEnded();
        delayState.sliderDragStarted(); delayState.setNormalisedValue(pct(p.delay)); delayState.sliderDragEnded();
        dryWetState.sliderDragStarted(); dryWetState.setNormalisedValue(pct(p.dryWet)); dryWetState.sliderDragEnded();
        if (delaySyncState) delaySyncState.setNormalisedValue(p.delaySync / DELAY_SYNC_MAX_INDEX);

        const customOpt = selectEl.querySelector('option[value="-1"]');
        if (customOpt) customOpt.remove();
        selectEl.value = String(currentIndex);
        forceSelectRepaint(selectEl);
        applyingPreset = false;
      }

      selectEl.addEventListener("change", (e) => applyPreset(parseInt(e.target.value, 10)));
      prevBtn.addEventListener("click", () => applyPreset((currentIndex < 0 ? 0 : currentIndex) - 1));
      nextBtn.addEventListener("click", () => applyPreset((currentIndex < 0 ? 0 : currentIndex) + 1));

      // Keep the dropdown honest for every relevant parameter, from every
      // source (host automation, undo/redo, project/session reload) - not
      // just this bar's own prev/next/select interactions.
      transitionState.valueChangedEvent.addListener(refreshSelectionDisplay);
      reverbState.valueChangedEvent.addListener(refreshSelectionDisplay);
      delayState.valueChangedEvent.addListener(refreshSelectionDisplay);
      dryWetState.valueChangedEvent.addListener(refreshSelectionDisplay);
      if (delaySyncState) delaySyncState.valueChangedEvent.addListener(refreshSelectionDisplay);

      refreshSelectionDisplay();
    }

    try {
      setupPresetBar();
    } catch (err) {
      console.error("setupPresetBar() failed:", err);
    }

    console.log("Transitionist v5 UI initialized");
  </script>

</body>
</html>
