<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transitionist UI Mockup v4</title>

<style>
  /* ============================================================
     WEBVIEW CONSTRAINT FOUNDATION (ui-design-rules.md Rule 1/2/3)
     ============================================================ */
  html, body {
    height: 100%;             /* REQUIRED - replaces viewport units */
    margin: 0;
    padding: 0;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
    overflow: hidden;

    background: #050506;     /* browser test-harness background (outside plugin frame) */
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', -apple-system, 'Helvetica Neue', Arial, sans-serif;

    /* Test-harness only: center the fixed-size plugin frame in the browser
       viewport (Rule 10). Production HTML does not use this wrapper. */
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }

  /* ============================================================
     TEST HTML PREVIEW FRAME (ui-design-rules.md Rule 10)
     ============================================================ */
  .plugin-frame {
    width: 980px;             /* FIXED - matches v4-ui.yaml window spec */
    height: 420px;            /* FIXED - matches v4-ui.yaml window spec */
    border: 2px solid #3a3d44;
    box-shadow: 0 20px 60px rgba(0,0,0,0.65);
    overflow: hidden;
    position: relative;
    border-radius: 4px;
  }

  /* ============================================================
     PLUGIN UI - fills the frame at 100% (matches production sizing)
     ============================================================ */
  .container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;

    /* UNCHANGED from v3 - white/off-white outer bezel */
    background: linear-gradient(155deg, #fbfcfd 0%, #f8f9fb 55%, #f3f5f7 100%);
    border: 1px solid #e4e7ec;
    border-radius: 26px;
  }

  /* ---------------- Logo ---------------- */
  .logo {
    position: absolute;
    left: 0px;
    top: 24px;
    width: 980px;     /* v4: spans new window width (was 700px in v3) */
    height: 30px;
    text-align: center;
    color: #2c3444;   /* UNCHANGED from v3 */
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.34em;
    text-shadow: 0 1px 0 rgba(255,255,255,0.65), 0 1px 2px rgba(44,52,68,0.16), 0 0 14px rgba(154,182,232,0.20);
  }

  /* ---------------- Panel cards ---------------- */
  .panel {
    position: absolute;
    top: 90px;
    width: 250px;      /* v4: recalculated from v3's 260px to fit 3 panels */
    height: 250px;      /* UNCHANGED from v3 */
    border-radius: 20px;
    background: linear-gradient(170deg, #eef1f5 0%, #dde2e9 100%);
    border: 1px solid #c7ceda;
    box-shadow:
      inset 0 2px 6px rgba(30,38,54,0.28),
      inset 0 -3px 10px rgba(30,38,54,0.14),
      0 3px 0 rgba(255,255,255,0.04);
  }
  /* v4: three panels left-to-right in signal-flow order: THROW, SPACE, SWEEP.
     Symmetric 55px gaps between panels, 60px margins from window edges -
     same margin convention v3 used. */
  .panel-throw { left: 60px; }
  .panel-space { left: 365px; }
  .panel-sweep { left: 670px; }

  /* ---------------- Caption labels ---------------- */
  .caption {
    position: absolute;
    top: 284px;
    width: 250px;      /* v4: matches new panel width */
    height: 20px;
    text-align: center;
    color: #5b6478;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
  }
  .caption-throw { left: 60px; }
  .caption-space { left: 365px; }
  .caption-sweep { left: 670px; }

  /* ---------------- Knob assembly ---------------- */
  .knob-wrap {
    position: absolute;
    top: 126px;
    width: 140px;       /* UNCHANGED from v3 */
    height: 140px;      /* UNCHANGED from v3 */
  }
  /* Knob centered within its 250px panel: panel_x + (250-140)/2 = panel_x + 55 */
  .knob-wrap-throw { left: 115px; }
  .knob-wrap-space { left: 420px; }
  .knob-wrap-sweep { left: 725px; }

  /* Soft cool blue-lavender ambient glow bleeding from behind part of the disc */
  .knob-glow {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(154,182,232,0.55) 0%, rgba(154,182,232,0.0) 62%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }

  /* Thin, understated arc track - sits just outside the disc. UNCHANGED
     geometry/positioning from v3; used by ALL three knobs (the grey track
     ring reads as one consistent family). */
  .knob-arc {
    position: absolute;
    inset: -10px;
    z-index: 1;
    pointer-events: none;
    transform: rotate(135deg);
  }
  .knob-arc-track {
    fill: none;
    stroke: rgba(90,104,130,0.22);
    stroke-width: 3;
    stroke-linecap: round;
  }
  /* Unipolar fill (THROW, SPACE) - single CW sweep from a start angle,
     UNCHANGED from v3 */
  .knob-arc-fill {
    fill: none;
    stroke: #6f8fc9;
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 40ms linear;
  }

  /* Bipolar fill (SWEEP only) - drawn as a separate, NON-rotated svg layer
     so its path math is in absolute (unrotated) coordinates: path grows
     from the fixed 12-o'clock/center point outward toward +/-135deg. */
  .knob-arc-bipolar {
    position: absolute;
    inset: -10px;
    z-index: 1;
    pointer-events: none;
  }
  .knob-arc-bipolar-fill {
    fill: none;
    stroke: #6f8fc9;   /* same accent color as unipolar fill - one consistent accent, not a second hue */
    stroke-width: 3;
    stroke-linecap: round;
  }

  /* Fixed center-detent tick mark (SWEEP only) - marks the 12-o'clock /
     0% reference point on the track ring. Does NOT rotate. */
  .knob-center-tick {
    position: absolute;
    top: -6px;
    left: 67px;
    width: 6px;
    height: 9px;
    border-radius: 2px;
    background: #6f8fc9;
    box-shadow: 0 0 3px rgba(111,143,201,0.6);
    z-index: 2;
    pointer-events: none;
  }

  /* The interactive knob itself (mousedown target) */
  .knob {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 2;
    cursor: ns-resize;
  }

  /* Layer 2: rotating body (texture + pointer) */
  .knob-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform-origin: center center;
    transition: transform 40ms linear;
    background: radial-gradient(circle at 35% 30%, #f6f8fa 0%, #d7dce3 55%, #aab2c0 100%);
    box-shadow: 0 6px 14px rgba(10,12,16,0.45);
  }

  /* Fine ridged/hobbed metal edge texture - only visible near the outer rim */
  .knob-ridges {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255,255,255,0.55) 0deg 1.6deg,
      rgba(70,80,100,0.30) 1.6deg 3.2deg
    );
    -webkit-mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
            mask: radial-gradient(circle, transparent 61%, #000 64%, #000 100%);
  }

  /* Small pointer dot near the top edge - rotates with the knob body */
  .knob-pointer {
    position: absolute;
    top: 9px;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: #3d4a63;
    box-shadow: 0 0 2px rgba(255,255,255,0.5) inset, 0 1px 1px rgba(0,0,0,0.3);
  }

  /* Layer 1 (visually on top): fixed skeuomorphic lighting - does NOT rotate,
     per ui-design-rules.md Rule 9 */
  .knob-lighting {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      inset -5px -6px 10px rgba(20,24,32,0.35),
      inset 5px 6px 10px rgba(255,255,255,0.55);
    pointer-events: none;
    z-index: 3;
  }

  /* Inset LCD-style digital readout - embedded in knob center, fixed
     (does not rotate with knob body) */
  .knob-lcd {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 56px;
    height: 28px;
    transform: translate(-50%, -50%);
    background: #182028;
    border: 2px solid #232a36;
    border-radius: 4px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.65),
      inset 0 -1px 1px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    pointer-events: none;
  }
  .knob-lcd-text {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #7fd8e0;
    text-shadow: 0 0 6px rgba(127,216,224,0.55);
  }

  /* ---------------- Debug monitor (test HTML only, Rule 11) ---------------- */
  .debug-monitor {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    color: #0f0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 4px;
    min-width: 170px;
    pointer-events: none;
    z-index: 10000;
  }
  .debug-label {
    color: #666;
    font-size: 9px;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .debug-param { font-weight: bold; color: #0f0; }
  .debug-value { color: #fff; margin-top: 2px; }
  .debug-normalized { color: #888; font-size: 10px; }
</style>
</head>
<body>

  <div class="plugin-frame">
    <div class="container">

      <div class="logo">TRANSITIONIST</div>

      <!-- THROW (parameter id: throw) - leftmost, first in signal-flow order -->
      <div class="panel panel-throw"></div>
      <div class="knob-wrap knob-wrap-throw">
        <div class="knob-glow"></div>
        <svg class="knob-arc" viewBox="0 0 160 160">
          <circle class="knob-arc-track" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
          <circle class="knob-arc-fill" id="throwArc" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="349.13"></circle>
        </svg>
        <div class="knob" id="throwKnob" tabindex="0" role="slider"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Throw">
          <div class="knob-body" id="throwKnobBody">
            <div class="knob-ridges"></div>
            <div class="knob-pointer"></div>
          </div>
          <div class="knob-lighting"></div>
          <div class="knob-lcd">
            <span class="knob-lcd-text" id="throwValueText">0%</span>
          </div>
        </div>
      </div>
      <div class="caption caption-throw">THROW</div>

      <!-- SPACE (parameter id: space) - middle, second in signal-flow order -->
      <div class="panel panel-space"></div>
      <div class="knob-wrap knob-wrap-space">
        <div class="knob-glow"></div>
        <svg class="knob-arc" viewBox="0 0 160 160">
          <circle class="knob-arc-track" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
          <circle class="knob-arc-fill" id="spaceArc" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="349.13"></circle>
        </svg>
        <div class="knob" id="spaceKnob" tabindex="0" role="slider"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Space">
          <div class="knob-body" id="spaceKnobBody">
            <div class="knob-ridges"></div>
            <div class="knob-pointer"></div>
          </div>
          <div class="knob-lighting"></div>
          <div class="knob-lcd">
            <span class="knob-lcd-text" id="spaceValueText">0%</span>
          </div>
        </div>
      </div>
      <div class="caption caption-space">SPACE</div>

      <!-- SWEEP (parameter id: sweep) - rightmost, last in signal-flow order (bipolar filter) -->
      <div class="panel panel-sweep"></div>
      <div class="knob-wrap knob-wrap-sweep">
        <div class="knob-glow"></div>
        <!-- Static track: same shared ring geometry as THROW/SPACE -->
        <svg class="knob-arc" viewBox="0 0 160 160">
          <circle class="knob-arc-track" cx="80" cy="80" r="74"
                  stroke-dasharray="349.13 465.5" stroke-dashoffset="0"></circle>
        </svg>
        <!-- Bipolar fill: unrotated svg, path computed in JS from center outward -->
        <svg class="knob-arc-bipolar" viewBox="0 0 160 160">
          <path class="knob-arc-bipolar-fill" id="sweepArcPath" d=""></path>
        </svg>
        <div class="knob-center-tick"></div>
        <div class="knob" id="sweepKnob" tabindex="0" role="slider"
             aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-label="Sweep">
          <div class="knob-body" id="sweepKnobBody">
            <div class="knob-ridges"></div>
            <div class="knob-pointer"></div>
          </div>
          <div class="knob-lighting"></div>
          <div class="knob-lcd">
            <span class="knob-lcd-text" id="sweepValueText">0%</span>
          </div>
        </div>
      </div>
      <div class="caption caption-sweep">SWEEP</div>

    </div>
  </div>

  <!-- Debug parameter monitor (test HTML only - Rule 11) -->
  <div class="debug-monitor">
    <div class="debug-label">PARAMETER MONITOR</div>
    <div class="debug-param" id="debugParam">&mdash;</div>
    <div class="debug-value" id="debugValue">&mdash;</div>
    <div class="debug-normalized" id="debugNormalized">&mdash;</div>
  </div>

<script>
  // ============================================================
  // Native application feel (ui-design-rules.md Rule 3)
  // ============================================================
  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    return false;
  });
  document.addEventListener("dragstart", (e) => {
    e.preventDefault();
  });

  // ============================================================
  // Mock JUCE backend for browser testing (no real WebView/JUCE needed)
  // ============================================================
  function makeMockParamState(defaultNormalised) {
    let value = defaultNormalised;
    const listeners = [];
    return {
      getNormalisedValue: () => value,
      setNormalisedValue: (v) => {
        value = Math.max(0, Math.min(1, v));
        listeners.forEach((fn) => fn(value));
      },
      valueChangedEvent: {
        addListener: (fn) => listeners.push(fn)
      }
    };
  }

  window.Juce = {
    _sliderStates: {
      throw: makeMockParamState(0.0),
      space: makeMockParamState(0.0),
      sweep: makeMockParamState(0.5)   // 0.5 normalised = 0% = center detent
    },
    getSliderState: function (id) {
      if (!this._sliderStates[id]) {
        console.warn(`No mock slider state for parameter id "${id}"`);
        this._sliderStates[id] = makeMockParamState(0.0);
      }
      return this._sliderStates[id];
    }
  };

  // ============================================================
  // Debug monitor helper (Rule 11)
  // ============================================================
  function updateDebugMonitor(paramId, label, displayValue, normalisedValue) {
    document.getElementById("debugParam").textContent = paramId;
    document.getElementById("debugValue").textContent = `${label}: ${displayValue}`;
    document.getElementById("debugNormalized").textContent = `normalised: ${normalisedValue.toFixed(3)}`;
  }

  // ============================================================
  // Shared knob interaction wiring (drag / wheel / keyboard / dblclick).
  // Rotation always uses the standard -135deg..+135deg physical range
  // (ui-design-rules.md Rule 8) driven by the JUCE normalised 0-1 value -
  // identical for unipolar and bipolar knobs. Only the arc-fill rendering
  // and LCD text formatting differ per knob "mode".
  // ============================================================
  function setupKnob({ knobId, bodyId, textId, paramId, label, defaultNormalised, render }) {
    const knobEl = document.getElementById(knobId);
    const bodyEl = document.getElementById(bodyId);
    const textEl = document.getElementById(textId);
    const state = Juce.getSliderState(paramId);

    function update(normalised) {
      const degrees = -135 + normalised * 270;
      bodyEl.style.transform = `rotate(${degrees}deg)`;
      render(normalised, textEl, knobEl);
    }

    // Initialize from current parameter value (handles preset recall)
    update(state.getNormalisedValue());

    // C++ -> HTML (automation, preset recall)
    state.valueChangedEvent.addListener((normalised) => update(normalised));

    // HTML -> C++ (user interaction): vertical drag, up = increase
    let dragging = false;
    let startY = 0;
    let startValue = 0;
    const DRAG_RANGE_PX = 160; // px of drag to cover full range

    function onPointerDown(e) {
      dragging = true;
      startY = e.clientY;
      startValue = state.getNormalisedValue();
      knobEl.setPointerCapture && e.pointerId !== undefined && knobEl.setPointerCapture(e.pointerId);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!dragging) return;
      const deltaY = startY - e.clientY;
      const deltaNormalised = deltaY / DRAG_RANGE_PX;
      state.setNormalisedValue(startValue + deltaNormalised);
    }

    function onPointerUp() {
      dragging = false;
      window.removeEventListener("mousemove", onPointerMove);
      window.removeEventListener("mouseup", onPointerUp);
    }

    knobEl.addEventListener("mousedown", onPointerDown);

    // Scroll wheel nudges value by 1% of range per tick
    knobEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const step = e.deltaY < 0 ? 0.01 : -0.01;
      state.setNormalisedValue(state.getNormalisedValue() + step);
    }, { passive: false });

    // Keyboard accessibility: arrow up/down adjust by 1% of range
    knobEl.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        e.preventDefault();
        state.setNormalisedValue(state.getNormalisedValue() + 0.01);
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        e.preventDefault();
        state.setNormalisedValue(state.getNormalisedValue() - 0.01);
      }
    });

    // Double-click resets to default
    knobEl.addEventListener("dblclick", () => {
      state.setNormalisedValue(defaultNormalised);
    });
  }

  // ============================================================
  // Unipolar knob renderer (THROW, SPACE) - single CW arc sweep from a
  // start angle. UNCHANGED behavior from v3.
  // ============================================================
  function makeUnipolarRenderer({ arcId, label, paramId }) {
    const arcEl = document.getElementById(arcId);
    const ARC_LENGTH = 349.13; // 270deg of a r=74 circle: 2*PI*74*(270/360)

    return function render(normalised, textEl, knobEl) {
      const percent = normalised * 100;
      arcEl.style.strokeDashoffset = String(ARC_LENGTH - normalised * ARC_LENGTH);
      const rounded = Math.round(percent);
      textEl.textContent = `${rounded}%`;
      knobEl.setAttribute("aria-valuenow", String(rounded));
      updateDebugMonitor(paramId, label, `${rounded}%`, normalised);
    };
  }

  // ============================================================
  // Bipolar knob renderer (SWEEP) - arc fill grows outward from the fixed
  // 12-o'clock/center point in both directions. Path is computed directly
  // in the SVG's own (unrotated) coordinate space using the same
  // clock-angle parametrization as a physical dial:
  //   point(theta) = ( cx + r*sin(theta), cy - r*cos(theta) )
  // where theta=0 is straight up (12 o'clock, matches the 0% center
  // value) and theta increases clockwise, matching the knob's own
  // -135deg..+135deg physical rotation range mapped from -100%..+100%.
  // ============================================================
  function makeBipolarRenderer({ pathId, label, paramId }) {
    const pathEl = document.getElementById(pathId);
    const cx = 80, cy = 80, r = 74;

    function arcPoint(thetaDeg) {
      const rad = thetaDeg * Math.PI / 180;
      return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
    }

    return function render(normalised, textEl, knobEl) {
      const value = -100 + normalised * 200;      // -100..+100
      const knobAngle = (value / 100) * 135;       // matches -135..+135 physical range

      if (Math.abs(knobAngle) < 0.05) {
        pathEl.setAttribute("d", "");               // no fill exactly at center
      } else {
        const center = arcPoint(0);
        const end = arcPoint(knobAngle);
        const sweepFlag = knobAngle > 0 ? 1 : 0;     // 1 = clockwise (positive), 0 = counter-clockwise (negative)
        pathEl.setAttribute(
          "d",
          `M ${center.x.toFixed(2)} ${center.y.toFixed(2)} A ${r} ${r} 0 0 ${sweepFlag} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`
        );
      }

      const rounded = Math.round(value);
      let displayText;
      if (rounded === 0) {
        displayText = "0%";
      } else if (rounded > 0) {
        displayText = `+${rounded}%`;
      } else {
        displayText = `${rounded}%`;   // already has minus sign
      }
      textEl.textContent = displayText;
      knobEl.setAttribute("aria-valuenow", String(rounded));
      updateDebugMonitor(paramId, label, displayText, normalised);
    };
  }

  document.addEventListener("DOMContentLoaded", () => {
    setupKnob({
      knobId: "throwKnob",
      bodyId: "throwKnobBody",
      textId: "throwValueText",
      paramId: "throw",
      label: "THROW",
      defaultNormalised: 0.0,
      render: makeUnipolarRenderer({ arcId: "throwArc", label: "THROW", paramId: "throw" })
    });

    setupKnob({
      knobId: "spaceKnob",
      bodyId: "spaceKnobBody",
      textId: "spaceValueText",
      paramId: "space",
      label: "SPACE",
      defaultNormalised: 0.0,
      render: makeUnipolarRenderer({ arcId: "spaceArc", label: "SPACE", paramId: "space" })
    });

    setupKnob({
      knobId: "sweepKnob",
      bodyId: "sweepKnobBody",
      textId: "sweepValueText",
      paramId: "sweep",
      label: "SWEEP",
      defaultNormalised: 0.5,   // 0.5 normalised = 0% = center detent
      render: makeBipolarRenderer({ pathId: "sweepArcPath", label: "SWEEP", paramId: "sweep" })
    });
  });

  // Basic error visibility during design iteration
  window.addEventListener("error", (e) => console.error("UI error:", e.message));
  window.addEventListener("unhandledrejection", (e) => console.error("Unhandled rejection:", e.reason));
</script>

</body>
</html>
