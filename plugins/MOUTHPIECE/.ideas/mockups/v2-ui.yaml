# MOUTHPIECE - UI design specification v2  (ALTERNATIVE DESIGN, A/B against v1)
# Generated: 2026-10-22
# Direction: "Console / hourglass" - same INTENSITY material language as v1 (slate molded chassis, domed
# brushed-metal knobs, amber-gold arcs) but a different composition:
#   * two tall sculpted WINGS (PITCH left, TONE right) flank ONE continuous recessed glass display
#   * the glass stacks chop map + step pads + a TABBED lane editor (one lane edited at a time, big bars)
#   * the preset browser lives in a raised centre "lobe" that drops out of the top plate (the photo's bridge)
#   * groove is a slim console strip under the glass, not a lower-left panel
#   * step cells are round pads (v1: square cells); each knob module carries a tiny live mini-display
# Coordinates are base-window pixels (1100x700); UI scales 75-200% uniformly.

window:
  width: 1100
  height: 700
  resizable: true
  min_scale: 0.75
  max_scale: 2.0
  scaling: uniform

composition:
  summary: "wing | glass | wing, with a groove strip under the glass; top plate with centre lobe"
  differs_from_v1:
    - "v1: top bar / chop map upper half / step grid lower-left / right column of knob rows. v2: left PITCH wing + central glass + right TONE wing"
    - "v1: 7 lanes stacked as square cells. v2: one row of 16 round pads + lane TABS driving a large bar editor"
    - "v1: preset browser inline in top bar. v2: preset browser in a raised bridge lobe cut into the top plate"
    - "v1: groove panel bottom-left under sequencer. v2: groove console strip centred under the glass"
    - "v1: Sensitivity in top bar. v2: Sensitivity knob in the chop-map toolbar beside the vowel filter (it only affects slicing)"
    - "v1: plain knob rows. v2: knob modules (2 knobs + live mini-display: envelope, bit-crush stairs, gate pattern, transfer curve, filter response, formant/harmonics)"
    - "v1: right column of raised panels. v2: tall molded wings with recessed wells"
  zones:
    top_plate: {x: 16, y: 16, w: 1068, h: 52}
    left_wing: {x: 16, y: 76, w: 216, h: 616, contains: [pitch, amp_env, vintage, chop_gate]}
    glass: {x: 244, y: 84, w: 612, h: 504, contains: [toolbar, chop_screen, lower_toolbar, step_grid]}
    groove_strip: {x: 244, y: 600, w: 612, h: 84}
    right_wing: {x: 868, y: 76, w: 216, h: 616, contains: [filter, saturation, output]}

colors:
  background: "#262c39"
  chassis_top: "#323a4b"
  chassis_bottom: "#202531"
  panel_top: "#384154"
  panel_bottom: "#2a3140"
  well_top: "#222836"
  well_bottom: "#2b3241"
  inset: "#10151c"
  glass_top: "#161c26"
  glass_bottom: "#10141b"
  primary: "#eab64a"
  primary_hi: "#ffdf8e"
  primary_dim: "#7d5f24"
  text: "#e8ebf2"
  label: "#8d98ae"
  label_dim: "#5a6579"
  secondary: "#5b6478"
  accent: "#eab64a"

vowel_palette:  # muted tonal, warm -> cool; slice brightness encodes voiced ratio
  A: "#b87c6b"
  E: "#b59a6e"
  I: "#7fa18f"
  O: "#6f93a8"
  U: "#8a7fae"

typography:
  header: "Inter, Helvetica Neue, Arial, sans-serif"
  body: "Inter, Helvetica Neue, Arial, sans-serif"
  label: {size: 8.5px, weight: 600, letter_spacing: 0.12em, transform: uppercase}
  value: {size: 10px, weight: 700}
  size: {large: 14px, medium: 11px, small: 9px}

styling:
  wings: "tall raised molded columns, asymmetric radii (28/56) so the inner edge scoops toward the glass; recessed wells (radius 18) per module"
  glass: "one recessed display (radius 38), double bezel (dark outer bevel + 1px light rim), chop map and step area share the same pane"
  panels: "raised neumorphic gradients, 1px top highlight, soft drop shadow"
  knob: "domed brushed-metal sphere, amber arc ring r=21.5 w/ glow, gold indicator dot; ALL knobs diameter 40 (cell 56x56); value replaces label on hover/drag"
  knob_diameter: 40
  step_pad: "round 26px pad; off = recessed, on = amber dome with slice number, current = ring"
  buttons: "recessed pill track, raised sliding thumb; toggles carry an LED"
  texture: "fractal-noise overlay @ 6% (overlay blend)"

interaction:
  knob: "vertical drag; shift = fine; double-click = reset to default; wheel nudges"
  step_pads: "click / drag-paint on/off"
  lane_editor: "tabs select ONE lane; click/drag bars to paint; slice lane colors bars by vowel; ratchet/chord quantised"
  modes: "PATTERN = pads + lane editor + groove strip; PADS = 4x4 MIDI 36-51; KEYS = C2-B4 w/ best-match slice dots; SPLIT = pads left + keys right"
  transport_mock: "HOST 120 toggle runs a 120 bpm 16th clock: step ring, voice playheads on the chop map, output meter"

step_grid_spec:
  steps: 16
  pad: {diameter: 26, pitch_x: 32}
  origin_in_control: {x: 66, y: 0}
  lanes:
    - {id: slice, label: SLICE, range: [1, 12]}
    - {id: pitch, label: PITCH, range: [-7, 7], unit: scale degrees}
    - {id: velocity, label: VEL, range: [0, 127]}
    - {id: probability, label: PROB, range: [0, 100]}
    - {id: gate, label: GATE, range: [0.05, 2.0], note: ">1.0 ties into next step"}
    - {id: ratchet, label: RATCHET, range: [1, 4]}
    - {id: chordTone, label: CHORD, range: [0, 3]}
  note: "per-step values live in the ValueTree state (spec section 10), not APVTS. Pad spacing is a grouped control (6px intra-grid gap is intentional)."

chop_map_spec:
  slices_shown: 12
  slice_fill: "vowel tint, alpha = 0.08 + 0.26 * voiced_ratio; rounded tile per slice"
  waveform: "mirrored gold trace with glow"
  pitch_curve: "stepped amber curve in a top band with note names (C3 = MIDI 60), follows transpose"
  playheads: "one gold line per active voice (max 8)"

not_surfaced_in_mockup:
  - {id: catchWindow, reason: "APVTS param 0-40 ms; proposed home: settings panel / advanced drawer (same as v1)"}

mock_bridge:
  window.Juce: "getSliderState / getToggleState / getComboBoxState mocks backed by in-page state"
  console: "APVTS changes logged as [MOUTHPIECE] param <id> = <value>; non-APVTS UI state as [MOUTHPIECE] ui <id> = <value>"

