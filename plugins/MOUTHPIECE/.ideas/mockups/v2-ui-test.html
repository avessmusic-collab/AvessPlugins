    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 6px 18px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.1), 0 -1px 0 rgba(0,0,0,.5); }

  .knobcell { width: 56px; height: 56px; touch-action: none; cursor: ns-resize; }

  .knobcell .trk { stroke: #0c1016; stroke-width: 3.2; fill: none; stroke-linecap: round; }

    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.07) 0 2.5deg, rgba(0,0,0,.07) 2.5deg 5deg);
