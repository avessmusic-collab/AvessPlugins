# MOUTHPIECE - UI design specification v4  (simplified flat modern pro: single lane strip, 8 primary knobs, section flyouts)
# Generated: 2026-10-22. Refines v3; v1/v2/v3 untouched. Coordinates are base-window pixels (1100x700); UI scales 75-200% uniformly.
window: {width: 1100, height: 700, resizable: true, min_scale: 0.75, max_scale: 2.0, scaling: uniform}
direction:
  name: Flat modern pro, simplified (v3 language, less on screen)
  refines: v3 (v1/v2/v3 untouched)
  user_feedback: Too complex, make it simpler. All pitch/velocity/probability etc. in one strip so I can switch what I selected. Make less knobs.
  changes_from_v3: [7 stacked lanes replaced by ONE value strip + a 7-way lane selector (Slice / Pitch / Vel / Prob / Gate / Ratchet / Chord), '17+ visible
      knobs reduced to 8 primary knobs (Transpose, Formant, Guard, Glide, Cutoff, Reso, Drive, Output)', 'ONE disclosure mechanism: a 28x24 ''...'' button
      in a section header opens a flyout panel with that section''s secondary controls (settings gear uses the same panel style)', Groove collapsed to Template
      + inline Swing slider; Amount / Humanize / Seed live in the Groove flyout; groove timing display removed, 'Right column re-flowed into 4 sections
      (Pitch, Tone, Groove, Output) with 28px of air around each separator; Envelope/Gate/Vintage/Sat folded into the Tone flyout', Slice sensitivity moved
      from the top bar into the settings popover (leaner top bar), 'Meter tick labels: tick and label separated by 8px, true minus sign, so ''-12'' no longer
      reads as ''--12''']
  rules: ['flat fills only, 1px separators, 4px radii', 'colour is functional: cyan = pitch, orange = rhythm, vowel hues = slices, neutral = sound', 'all
      knobs identical: 44px ring in a 50x72 cell (no hero knobs)', every knob shows value + unit permanently]
composition:
  summary: 'top bar | left: chop map (hero) -> pattern row -> 16 step cells -> lane selector -> single value strip | 1px divider | right: Pitch, Tone, Groove,
    Output'
  zones:
    topbar: {x: 0, y: 0, w: 1100, h: 60}
    chop_map: {x: 15, y: 70, w: 802, h: 262}
    sequencer: {x: 15, y: 344, w: 802, h: 320}
    right_column: {x: 849, y: 71, w: 236, h: 593}
  modes: {PATTERN: pattern row + cells + lane selector + value strip, PADS: 4x4 pads replace cells/selector/strip; groove dimmed, KEYS: C2-B4 keyboard with
      best-match slice dots, SPLIT: pads (left) + C3-B4 keys (right)}
colors: {background: '#0d0e11', surface_1: '#131519', surface_2: '#191c21', surface_3: '#20242a', line: '#23272e', line_strong: '#30353d', text: '#e8eaee',
  text_secondary: '#9aa1ad', text_tertiary: '#646b77', pitch: '#22d3ee', rhythm: '#ff8a3d', neutral_accent: '#dfe3ea', map_background: '#0f1013'}
vowel_palette: {A: '#ff5c8a', E: '#f5c84b', I: '#4ade9a', O: '#5e8bff', U: '#b07cff', Mixed_unvoiced: '#8b919c', encoding: hue = vowel class; slice band
    alpha = 0.05 + 0.13 * voiced_ratio; waveform alpha 0.55-0.95}
typography: {sans: 'Inter, -apple-system, SF Pro Text, Segoe UI, Roboto, Arial, sans-serif', mono: 'JetBrains Mono, ui-monospace, SF Mono, Menlo, Consolas,
    monospace (all numeric readouts, tabular)', wordmark: '17px / 600 / -0.02em, lowercase ''mouthpiece''', section_header: 10.5px / 600 / secondary text
    colour + 6px colour square, knob_label: 9.5px tertiary; value 10px mono primary, controls: 11px / 500 sentence case}
styling: {knob: 'flat 29px disc (#15171b, 1px #262a31) inside 44px ring; 2.5px track #2a2e35 and 2.5px value arc in functional colour; 1.75px white pointer;
    default tick on ring; bipolar arcs start at 12 o''clock; drag shows value bubble', segmented: '1px border, 4px radius, selected = solid functional colour
    with dark text', toggle_chip: '1px border, 7px square indicator filled with the functional colour when on', dropdown: caption (tertiary) + value (right
    aligned) + chevron; flat popover list, step_cell: '41x24 flat rectangle, 4px gap, beat groups shaded; current step = 1px orange outline + 7% orange
    wash + orange ruler tick', meter: '2 vertical peak bars, white -> amber -> pink, limiter ceiling tick at -0.3 dBFS'}
interaction: {knob: 'vertical drag (190px = full range), shift = fine (1100px), double-click = reset to default, wheel nudges (shift = fine); integer params
    snap', chop_map: click slice = select + audition; drag a boundary; double-click = split; M = merge with next; hover tooltip, step_grid: 'cells: click
    toggles, drag paints on/off. value strip: click or paint across columns (y position = value); wheel nudges hovered column; double-click resets to lane
    default. Lane selector switches the strip without losing edits', transport: Host 120 button (or Space) runs a 120 bpm 16th clock with swing/groove/humanize/probability(seed)/ratchet;
    spawns per-voice playheads and meter movement, dropzone: 'drop or click to choose a file; re-generates slices, key, waveform (mock analysis)', console: 'param
    changes: [MOUTHPIECE] param <id> = <value>; non-APVTS UI state: [MOUTHPIECE] ui <id> = <value>', disclosure: '''...'' button in a section header toggles
    that section''s flyout; one flyout open at a time; closes on outside click or Esc; settings gear opens the same panel style'}
value_strip_spec:
  columns: 16
  column: {width: 46, pitch: 50}
  origin_x: 3
  height: 192
  value_area: {top: 26, bottom: height-22}
  lanes:
    slice:
      range: [1, 128]
      colour: vowel of slice
      encoding: bar height = slice index, number above, vowel letter below
    pitch:
      range: [-7, 7]
      unit: scale degrees
      colour: cyan
      encoding: bipolar bar from centre line, degree above/below, resolved note name below
    velocity:
      range: [1, 127]
      colour: orange
      encoding: bar height + number
    probability:
      range: [0, 100]
      unit: '%'
      colour: orange
      encoding: bar with bright top edge
    gate:
      range: [0.05, 2.0]
      colour: orange
      encoding: bar height, dashed 1.0 reference, chevron when > 1.0 (ties)
    ratchet:
      range: [1, 4]
      colour: orange
      encoding: 1-4 stacked segments
    chord:
      range: [0, 3]
      colour: cyan
      encoding: root / 3rd / 5th / oct stacked pills
  note: per-step values live in ValueTree state (spec section 10), not APVTS. Steps whose cell is off render dimmed but stay editable.
disclosure_mechanism:
  name: section flyouts
  button: {size: 28x24, glyph: three dots, placement: 'section header, right edge, x=1057'}
  panel: 'flat #14161a panel, 1px border, 6px radius, opens left of the right column aligned to its button'
  flyouts:
  - id: pitch_flyout
    title: Pitch · more
    opener: more_pitch
    position: {x: 649, y: 71}
    size: {width: 188, height: 122}
    labels: []
  - id: tone_flyout
    title: Tone · more
    opener: more_tone
    position: {x: 571, y: 263}
    size: {width: 266, height: 346}
    labels:
    - {x: 14, y: 38, text: Filter}
    - {x: 14, y: 140, text: Envelope · gate}
    - {x: 14, y: 242, text: Vintage · saturation}
  - id: groove_flyout
    title: Groove · more
    opener: more_groove
    position: {x: 635, y: 417}
    size: {width: 202, height: 122}
    labels: []
  - id: settings_popover
    title: Settings
    opener: settings
    position: {x: 785, y: 52}
    size: {width: 300, height: 252}
    labels:
    - {x: 84, y: 44, text: Interpolation}
    - {x: 84, y: 100, text: Cache budget}
    - {x: 84, y: 148, text: Pitch-bend range}
parameter_locations: {mode: visible_primary, pitchMode: visible_primary, sliceSelect: visible_primary, vowel: visible_primary, pattern: visible_primary,
  monoPattern: visible_primary, latch: visible_primary, syncMode: visible_primary, transpose: visible_primary, formant: visible_primary, guard: visible_primary,
  glide: visible_primary, scale: visible_primary, scaleRoot: visible_primary, cutoff: visible_primary, reso: visible_primary, drive: visible_primary, groove: visible_primary,
  swing: visible_primary, output: visible_primary, limiter: visible_primary, fineTune: 'expander:pitch_flyout', pitchTarget: 'expander:pitch_flyout', keyTrack: 'expander:tone_flyout',
  filterType: 'expander:tone_flyout', attack: 'expander:tone_flyout', release: 'expander:tone_flyout', gateDepth: 'expander:tone_flyout', gateRelease: 'expander:tone_flyout',
  srReduce: 'expander:tone_flyout', bitDepth: 'expander:tone_flyout', satMix: 'expander:tone_flyout', grooveAmt: 'expander:groove_flyout', humanize: 'expander:groove_flyout',
  seed: 'expander:groove_flyout', catchWindow: settings}
primary_knob_count: 8
primary_knobs: [transpose, formant, guard, glide, cutoff, reso, drive, output]
settings_popover:
  opened_by: gear in the top bar
  contents: [catchWindow (APVTS), Slice sensitivity (state), Interpolation Draft/HQ, Cache budget, Pitch-bend range]
  note: catchWindow is deliberately settings-only.
