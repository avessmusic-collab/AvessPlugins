# MOUTHPIECE - UI design specification v1
# Generated: 2026-10-22
# Direction: Zynaptiq INTENSITY-inspired slate chassis / amber-gold glow, uniform small-to-medium knobs
# Coordinates are in base-window pixels (1100x700); the UI scales 75-200% uniformly.

window:
  width: 1100
  height: 700
  resizable: true
  min_scale: 0.75
  max_scale: 2.0
  scaling: uniform  # whole stage scaled with a single transform; layout is absolute at base size

colors:
  background: "#2b3240"      # chassis (soft-molded slate)
  chassis_top: "#2f3646"
  chassis_bottom: "#222733"
  panel_top: "#343c4d"
  panel_bottom: "#2b3341"
  inset: "#141a22"           # recessed screens / step cells
  primary: "#e8b84b"         # amber-gold: arcs, playheads, active steps, pitch curve
  primary_hi: "#ffd982"
  primary_dim: "#7a5e22"
  text: "#e6e9f0"
  label: "#8f99ad"           # letter-spaced uppercase labels
  label_dim: "#5d6679"
  secondary: "#586172"       # brushed metal mid
  accent: "#e8b84b"

vowel_palette:  # desaturated tints, warm -> cool; brightness encodes voiced ratio
  A: "#b87c6b"   # clay
  E: "#b59a6e"   # sand
  I: "#7fa18f"   # sage
  O: "#6f93a8"   # steel
  U: "#8a7fae"   # dusty violet

typography:
  header: "Lato, Inter, Helvetica Neue, Arial, sans-serif"
  body: "Lato, Inter, Helvetica Neue, Arial, sans-serif"
  label: { size: 8.5px, weight: 600, letter_spacing: 0.1em, transform: uppercase }
  value: { size: 10px, weight: 700 }
  size: { large: 14px, medium: 11px, small: 9px }

styling:
  panels: 'raised neumorphic: vertical gradient, 1px top highlight, soft bottom shadow, radius 16'
  insets: 'recessed screens: #141a22, inner shadow 0 2px 7px, radius 10'
  knob: 'domed brushed-metal sphere (radial + conic brushing), amber arc ring r=17.5 w/ glow, gold position dot; ALL knobs diameter 40 (no hero knobs)'
  knob_diameter: 40
  buttons: 'pill recessed track with raised active thumb (sliding), LED dot for toggles'
  texture: 'fractal-noise matte overlay @ 6% opacity'

layout:
  type: custom
  panels:
    - id: topbar
      kind: plate
      position: {x: 14, y: 14}
      size: {width: 1072, height: 62}
    - id: chopmap
      kind: raised
      position: {x: 16, y: 88}
      size: {width: 788, height: 232}
    - id: sequencer
      kind: raised
      position: {x: 16, y: 332}
      size: {width: 788, height: 232}
    - id: groove
      kind: raised
      position: {x: 16, y: 576}
      size: {width: 788, height: 108}
    - id: pitch
      kind: raised
      title: "PITCH"
      position: {x: 820, y: 88}
      size: {width: 264, height: 176}
    - id: amp_env
      kind: raised
      title: "AMP ENV"
      position: {x: 820, y: 272}
      size: {width: 130, height: 92}
    - id: vintage
      kind: raised
      title: "VINTAGE"
      position: {x: 954, y: 272}
      size: {width: 130, height: 92}
    - id: filter
      kind: raised
      title: "FILTER"
      position: {x: 820, y: 372}
      size: {width: 264, height: 96}
    - id: chop_gate
      kind: raised
      title: "CHOP GATE"
      position: {x: 820, y: 476}
      size: {width: 130, height: 92}
    - id: saturation
      kind: raised
      title: "SATURATION"
      position: {x: 954, y: 476}
      size: {width: 130, height: 92}
    - id: output
      kind: raised
      title: "OUTPUT"
      position: {x: 820, y: 576}
      size: {width: 264, height: 108}
  displays:
    - id: chop_map_screen
      parent: chopmap
      position: {x: 28, y: 100}
      size: {width: 764, height: 208}
      note: "waveform, colored slices, pitch curve w/ note names, per-voice playheads"
    - id: groove_screen
      parent: groove
      position: {x: 234, y: 588}
      size: {width: 200, height: 80}
      note: "16-step timing/velocity feel of the selected groove template"
    - id: output_meter
      parent: output
      position: {x: 900, y: 640}
      size: {width: 172, height: 18}
      note: "stereo output meter"

sections:  # hierarchical view
  top_bar: [dropzone, key_readout, sensitivity, mode, pitchMode, preset_browser]
  chop_map: [vowel]
  sequencer: [pattern, transport, midi_drag, step_grid]
  groove: [groove, sliceSelect, monoPattern, latch, syncMode, swing, grooveAmt, humanize, seed]
  right_column:
    pitch: [transpose, fineTune, formant, guard, glide, scale, scaleRoot, pitchTarget]
    amp_env: [attack, release]
    vintage: [srReduce, bitDepth]
    filter: [filterType, cutoff, reso, keyTrack]
    chop_gate: [gateDepth, gateRelease]
    saturation: [drive, satMix]
    output: [output, limiter]

controls:
  - id: dropzone
    type: custom
    label: "File / drop zone"
    parameter: null  # non-APVTS (ValueTree state / settings panel / UI-only)
    note: "drop audio file (WAV, AIFF, FLAC, MP3); shows file name + meta"
    position: {x: 154, y: 24}
    size: {width: 180, height: 44}
  - id: key_readout
    type: custom
    label: "Detected key"
    parameter: null  # non-APVTS (ValueTree state / settings panel / UI-only)
