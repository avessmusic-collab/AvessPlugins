    position: {x: 346, y: 24}
    size: {width: 80, height: 44}
  - id: sensitivity
    type: rotary-knob
    juce_relay: WebSliderRelay
    label: "SENS"
    parameter: null  # non-APVTS (ValueTree state / settings panel / UI-only)
    range: [40, 250]
    default: 60
    demo_value: 60  # value shown in the mockup
    scale: lin
    bipolar: false
    format: ms
    diameter: 40
    position: {x: 438, y: 22}
