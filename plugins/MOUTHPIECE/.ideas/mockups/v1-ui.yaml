step_grid_spec:
  steps: 16
  cell: {width: 38, height: 22, pitch_x: 42, pitch_y: 25}
  origin: {x: 116, y: 380}
  lane_label_column: {x: 28, width: 80}
  lanes:
    - {id: slice, label: SLICE, input: 'click toggles step; vertical drag changes slice ref', range: [1, 12]}
    - {id: pitch, label: PITCH, input: 'paint/drag', range: [-7, 7], unit: scale degrees}
    - {id: velocity, label: VELOCITY, input: 'paint/drag', range: [0, 127]}
    - {id: probability, label: PROB, input: 'paint/drag', range: [0, 100]}
    - {id: gate, label: GATE, input: 'paint/drag; >1.0 ties into next step', range: [0.05, 2.0]}
    - {id: ratchet, label: RATCHET, input: 'click cycles', range: [1, 4]}
    - {id: chordTone, label: CHORD, input: 'click cycles', range: [0, 3]}
  note: 'per-step values live in the ValueTree state (spec section 10), not APVTS'

chop_map_spec:
  slices_shown: 12
  slice_fill: 'vowel tint, alpha = 0.08 + 0.26 * voiced_ratio'
  waveform: 'mirrored gold trace with glow'
  pitch_curve: 'amber stepped curve over slices with note names (C3 = MIDI 60), follows transpose'
  playheads: 'one gold line per active voice (max 8)'

lower_half_modes:
  PATTERN: 'step grid + pattern A-H + groove panel (primary view)'
  PADS: '4x4 pads, MIDI 36-51, slice name + pitch'
  KEYS: 'keyboard (C2-B4) showing best-match slice per key'
  SPLIT: 'pads left, keys right'

not_surfaced_in_mockup:
  - {id: catchWindow, reason: 'APVTS param 0-40 ms; proposed home: settings panel / advanced drawer'}

mock_bridge:
  window.Juce: 'getSliderState / getToggleState / getComboBoxState mocks backed by in-page state'
  console: 'all parameter changes logged as [MOUTHPIECE] param <id> = <value>'
