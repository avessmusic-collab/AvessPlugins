<style>
  /* WebView constraints: no viewport units; percentage heights only */
  html, body { height: 100%; margin: 0; padding: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #0d0e11; --s1: #131519; --s2: #191c21; --s3: #20242a;
    --ln: #23272e; --ln2: #30353d;
    --tx: #e8eaee; --tx2: #9aa1ad; --tx3: #646b77;
    --cy: #22d3ee; --or: #ff8a3d;
    --vA: #ff5c8a; --vE: #f5c84b; --vI: #4ade9a; --vO: #5e8bff; --vU: #b07cff; --vM: #8b919c;
    --sans: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  body {
    user-select: none; -webkit-user-select: none; cursor: default; overflow: hidden;
    background: var(--bg); color: var(--tx); font-family: var(--sans); font-size: 11px;
    -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1;
  }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 700px; transform-origin: 0 0; background: var(--bg); }
  .abs { position: absolute; }
  .ln { position: absolute; background: var(--ln); }
  .hdr { position: absolute; height: 14px; line-height: 14px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--tx2); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .hdr i { width: 6px; height: 6px; border-radius: 1px; display: block; }
  .word { position: absolute; left: 15px; top: 16px; height: 28px; line-height: 28px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: var(--tx); }
  canvas { display: block; }

  /* segmented */
  .seg { position: absolute; display: flex; border: 1px solid var(--ln2); border-radius: 4px; overflow: hidden; background: var(--s1); }
  .seg.v { flex-direction: column; }
  .seg button { flex: 1 1 0; min-width: 0; border: 0; margin: 0; padding: 0; background: transparent; color: var(--tx2); font: 500 11px var(--sans); cursor: pointer; outline: none; }
  .seg button + button { border-left: 1px solid var(--ln); }
  .seg.v button + button { border-left: 0; border-top: 1px solid var(--ln); }
  .seg button:hover { background: var(--s3); color: var(--tx); }
  .seg button.on { background: var(--c); color: #0d0e11; font-weight: 650; }
  .seg button.on:hover { background: var(--c); color: #0d0e11; }

  /* dropdown */
  .dd { position: absolute; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 9px; border: 1px solid var(--ln2); border-radius: 4px; background: var(--s1); cursor: pointer; white-space: nowrap; overflow: hidden; }
  .dd:hover { background: var(--s3); }
  .dd .cap { color: var(--tx3); font-size: 10px; }
  .dd .val { flex: 1; text-align: right; color: var(--tx); font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .dd .chev { width: 7px; height: 7px; border-right: 1.5px solid var(--tx3); border-bottom: 1.5px solid var(--tx3); transform: translateY(-2px) rotate(45deg); flex: none; }
  .menu { position: absolute; z-index: 50; background: #16181c; border: 1px solid var(--ln2); border-radius: 4px; padding: 3px; max-height: 262px; overflow-y: auto; box-shadow: 0 0 0 1px #000; }
  .menu .mi { height: 22px; line-height: 22px; padding: 0 8px; border-radius: 3px; color: var(--tx2); font-size: 11px; cursor: pointer; white-space: nowrap; }
  .menu .mi:hover { background: var(--s3); color: var(--tx); }
  .menu .mi.on { color: var(--cy); }

  /* chip toggle */
  .tg { position: absolute; display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--ln2); border-radius: 4px; background: var(--s1); color: var(--tx2); font-size: 11px; font-weight: 500; cursor: pointer; padding: 0; font-family: var(--sans); outline: none; }
  .tg i { width: 7px; height: 7px; border-radius: 1px; background: var(--ln2); display: block; }
  .tg:hover { background: var(--s3); color: var(--tx); }
  .tg.on { color: var(--tx); border-color: var(--c); }
  .tg.on i { background: var(--c); }

  /* knob */
  .knob { position: absolute; width: 50px; height: 72px; cursor: ns-resize; touch-action: none; }
  .knob svg { position: absolute; left: 3px; top: 0; overflow: visible; }
  .knob .trk { fill: none; stroke: #2a2e35; stroke-width: 2.5; stroke-linecap: round; }
  .knob .vl { fill: none; stroke: var(--c); stroke-width: 2.5; stroke-linecap: round; }
  .knob .disc { fill: #15171b; stroke: #262a31; stroke-width: 1; }
  .knob .ptr { stroke: var(--tx); stroke-width: 1.75; stroke-linecap: round; }
  .knob .dflt { fill: #4a505b; }
  .knob:hover .disc { stroke: #3a3f48; }
  .knob.drag .disc { fill: #1a1d22; stroke: var(--c); }
  .knob .kv { position: absolute; left: -6px; width: 62px; top: 46px; text-align: center; font: 500 10px var(--mono); color: var(--tx); letter-spacing: -0.02em; white-space: nowrap; }
  .knob .kl { position: absolute; left: -6px; width: 62px; top: 59px; text-align: center; font: 400 9.5px var(--sans); color: var(--tx3); white-space: nowrap; }
  .knob:hover .kv, .knob.drag .kv { color: var(--c); }
  .knob:hover .kl { color: var(--tx2); }
  .bub { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); background: var(--c); color: #0d0e11; font: 600 10px var(--mono); padding: 3px 6px; border-radius: 3px; white-space: nowrap; pointer-events: none; z-index: 30; display: none; }
  .knob.drag .bub, .knob.wheel .bub { display: block; }

  /* top bar widgets */
  .box { position: absolute; border: 1px solid var(--ln2); border-radius: 4px; background: var(--s1); display: flex; align-items: center; overflow: hidden; }
  .dz { padding: 0 10px; gap: 8px; cursor: pointer; }
  .dz:hover, .dz.over { background: var(--s3); }
  .dz.over { border-color: var(--cy); }
  .dz .ic { width: 12px; height: 14px; border: 1.5px solid var(--tx3); border-radius: 2px; flex: none; position: relative; }
  .dz .ic::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 4px; background: linear-gradient(90deg, var(--tx3) 0 2px, transparent 2px 4px, var(--tx3) 4px 6px); }
  .dz .nm { flex: 1; min-width: 0; font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dz .mt { font: 400 10px var(--mono); color: var(--tx3); flex: none; }
  .dz .pg { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--cy); width: 0; }
  .keyr { justify-content: center; gap: 4px; cursor: pointer; font: 600 11px var(--mono); color: var(--cy); }
  .keyr:hover { background: var(--s3); }
  .keyr small { font: 400 9px var(--sans); color: var(--tx3); }
  .sens { padding: 0 10px; cursor: ew-resize; display: block; }
  .sens .sl { position: absolute; left: 10px; top: 5px; font-size: 10px; color: var(--tx3); }
  .sens .sv { position: absolute; right: 10px; top: 4px; font: 500 10px var(--mono); color: var(--tx); }
  .sens .tr { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 2px; background: #2a2e35; border-radius: 1px; }
  .sens .tf { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tx); border-radius: 1px; }
  .sens .th { position: absolute; top: -3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--tx); }
  .sens:hover .sv { color: #fff; }
  .pre { padding: 0; }
  .pre button { width: 26px; height: 100%; border: 0; background: transparent; color: var(--tx2); font: 500 14px var(--sans); cursor: pointer; padding: 0; outline: none; }
  .pre button:hover { background: var(--s3); color: var(--tx); }
  .pre .pn { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 500; cursor: pointer; border-left: 1px solid var(--ln); border-right: 1px solid var(--ln); overflow: hidden; white-space: nowrap; }
  .pre .pn:hover { background: var(--s3); }
  .gear { cursor: pointer; justify-content: center; padding: 0; }
  .gear:hover, .gear.on { background: var(--s3); }
  .gear svg { stroke: var(--tx2); fill: none; stroke-width: 1.4; }
  .gear:hover svg, .gear.on svg { stroke: var(--tx); }
  .info { position: absolute; left: 15px; top: 70px; width: 380px; height: 24px; line-height: 24px; font-size: 11px; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info b { color: var(--tx); font-weight: 600; }
  .info .mono { font-family: var(--mono); font-size: 10.5px; }
  .info .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .hint { position: absolute; left: 15px; top: 344px; width: 630px; height: 24px; line-height: 24px; font-size: 11px; color: var(--tx3); display: none; white-space: nowrap; }
  .hint b { color: var(--tx2); font-weight: 600; }
  .play { cursor: pointer; justify-content: center; gap: 8px; color: var(--tx2); font-size: 11px; font-weight: 500; }
  .play:hover { background: var(--s3); color: var(--tx); }
  .play .tri { width: 0; height: 0; border-left: 7px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
  .play.on { border-color: var(--or); color: var(--tx); }
  .play.on .tri { border-left-color: var(--or); }
  .play.on .tri { width: 7px; height: 8px; border: 0; background: var(--or); }
  .midi { cursor: grab; padding: 0 8px; gap: 8px; color: var(--tx2); font-size: 11px; font-weight: 500; }
  .midi:hover { background: var(--s3); color: var(--tx); }
  .midi canvas { flex: none; }
  .midi span { flex: 1; text-align: right; }
  .tip { position: absolute; z-index: 60; pointer-events: none; background: #1d2026; border: 1px solid var(--ln2); color: var(--tx); font: 500 10px var(--mono); padding: 3px 6px; border-radius: 3px; white-space: nowrap; display: none; }
  .hid { display: none !important; }
  .dim { opacity: 0.32; pointer-events: none; }
  #settings { position: absolute; z-index: 40; left: 785px; top: 52px; width: 300px; height: 196px; background: #14161a; border: 1px solid var(--ln2); border-radius: 6px; display: none; box-shadow: 0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.5); }
  #settings .st { position: absolute; left: 14px; top: 12px; font-size: 11px; font-weight: 600; color: var(--tx); }
  #settings .sx { position: absolute; font-size: 10px; color: var(--tx3); }

  /* v4 additions */
  .sens .tf, .sens .th { background: var(--c, var(--tx)); }
  .fly { position: absolute; z-index: 40; display: none; background: #14161a; border: 1px solid var(--ln2); border-radius: 6px; box-shadow: 0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.5); }
  .fly .ft { position: absolute; left: 14px; top: 12px; font-size: 11px; font-weight: 600; color: var(--tx); }
  .fly .fs { position: absolute; font-size: 10px; font-weight: 600; color: var(--tx3); letter-spacing: 0.02em; }
  .more { cursor: pointer; justify-content: center; padding: 0; }
  .more svg { fill: var(--tx2); }
  .more:hover { background: var(--s3); }
  .more:hover svg { fill: var(--tx); }
  .more.on { border-color: var(--c); background: var(--s3); }
  .more.on svg { fill: var(--c); }
  .lread { position: absolute; height: 24px; line-height: 24px; text-align: right; font: 400 10.5px var(--mono); color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lread b { color: var(--tx); font-weight: 500; }
</style>

  for (let i = 0; i < 16; i++) { const col = i % 4, row = 3 - Math.floor(i / 4); out.push({ i: i, x: col * gx, y: row * 76, w: w, h: 66 }); }
  return out;
}
function keyLayout() {
  const m = PR.mode.v, a = m === 2 ? { x: 0, w: 802, lo: 48, hi: 83 } : { x: 382, w: 420, lo: 60, hi: 83 };
  const white = [0, 2, 4, 5, 7, 9, 11], keys = []; let nw = 0;
  for (let n = a.lo; n <= a.hi; n++) if (white.indexOf(n % 12) >= 0) nw++;
  const ww = a.w / nw, H = 286; let wi = 0;
  for (let n = a.lo; n <= a.hi; n++) {

    else keys.push({ n: n, x: a.x + wi * ww - ww * 0.3, y: 0, w: ww * 0.6, h: H * 0.6, white: false });
  }

}
function drawPV() {
  const ctx = begin(pv), m = PR.mode.v; if (m === 0) return;
  ctx.textBaseline = "middle";
  if (m === 1 || m === 3) {
    padRects().forEach((r) => {
      const si = r.i % SL.length, s = SL[si], c = VC[s.v], f = padFlash[r.i] && performance.now() - padFlash[r.i] < 160;
      ctx.fillStyle = f ? ra(c, 0.35) : "#171a1e"; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = c; ctx.fillRect(r.x, r.y, 3, r.h);
      ctx.textAlign = "left"; ctx.font = "600 12px " + SANS; ctx.fillStyle = "#e8eaee"; ctx.fillText("Slice " + (si + 1), r.x + 14, r.y + 15);
      ctx.font = "500 10px " + MONO; ctx.fillStyle = "#9aa1ad"; ctx.fillText((s.v === "M" ? "–" : s.v) + " · " + (s.m == null ? (m === 1 ? "unvoiced" : "unv.") : nn(s.m)) + (m === 1 ? " · " + ((s.e - s.s) * FILE.dur).toFixed(2) + " s" : ""), r.x + 14, r.y + 32);
      ctx.textAlign = "right"; ctx.fillStyle = OR; ctx.font = "500 9.5px " + MONO; ctx.fillText(String(36 + r.i), r.x + r.w - 8, r.y + 12); ctx.fillStyle = "#646b77"; ctx.fillText(nn(36 + r.i), r.x + r.w - 8, r.y + 32);
    });
  }
  if (m === 2 || m === 3) {
    const keys = keyLayout(), iv = scaleIv(), rp = rootPc();
    keys.filter((k) => k.white).concat(keys.filter((k) => !k.white)).forEach((k) => {
      const inS = iv.indexOf(((k.n % 12) - rp + 12) % 12) >= 0, dn = keyDown[k.n];
      ctx.fillStyle = dn ? CY : k.white ? (inS ? "#242830" : "#16181c") : (inS ? "#111317" : "#0b0c0e");
      ctx.fillRect(k.x + 0.5, k.y, k.w - 1, k.h);
      if (!k.white) { ctx.strokeStyle = "#2a2e35"; ctx.lineWidth = 1; ctx.strokeRect(k.x + 1, k.y + 0.5, k.w - 2, k.h - 1); }
      const bs = bestSlice(k.n), sc = VC[SL[bs].v];
      ctx.textAlign = "center";
      if (inS || k.white) {
        ctx.fillStyle = inS ? sc : ra(sc, 0.35); ctx.beginPath(); ctx.arc(k.x + k.w / 2, k.h - (k.white ? 46 : 14), k.white ? 4 : 3, 0, 6.3); ctx.fill();
        if (k.white) { ctx.font = "600 9.5px " + MONO; ctx.fillStyle = inS ? "#dfe3ea" : "#646b77"; ctx.fillText(String(bs + 1), k.x + k.w / 2, k.h - 30); }
      }
      if (k.white) { ctx.font = "500 9px " + MONO; ctx.fillStyle = (k.n % 12 === rp) ? CY : "#5b616c"; ctx.fillText(k.n % 12 === 0 || k.n % 12 === rp ? nn(k.n) : NOTE[k.n % 12], k.x + k.w / 2, k.h - 12); }
    });
  }
}
function pvHit(p) {
  const m = PR.mode.v;
  if (m === 2 || m === 3) { const ks = keyLayout(); const bl = ks.filter((k) => !k.white), wh = ks.filter((k) => k.white); for (const k of bl) if (p.x >= k.x && p.x < k.x + k.w && p.y >= 0 && p.y < k.h) return { key: k.n }; for (const k of wh) if (p.x >= k.x && p.x < k.x + k.w && p.y >= 0 && p.y <= k.h) return { key: k.n }; }

pv.addEventListener("pointerdown", (e) => {
  const h = pvHit(lp(e, pv)); if (!h) return; pv.setPointerCapture(e.pointerId);
  if (h.pad != null) { padFlash[h.pad] = performance.now(); const si = h.pad % SL.length; spawn(si, SL[si].m, 0.9, 0, false); ui("pad", (36 + h.pad) + " -> slice " + (si + 1)); }
  else { keyDown[h.key] = 1; const bs = bestSlice(h.key); spawn(bs, h.key, 0.9, 0, false); ui("key", nn(h.key) + " -> slice " + (bs + 1)); pv._k = h.key; }

const pvUp = () => { for (const k in keyDown) delete keyDown[k]; dirty.pv = true; };
pv.addEventListener("pointerup", pvUp); pv.addEventListener("pointercancel", pvUp);
pv.addEventListener("pointermove", (e) => { const h = pvHit(lp(e, pv)); if (!h) { showTip(e, ""); return; } if (h.pad != null) showTip(e, "Pad " + (h.pad + 1) + " · MIDI " + (36 + h.pad) + " · slice " + (h.pad % SL.length + 1)); else showTip(e, nn(h.key) + " · best match: slice " + (bestSlice(h.key) + 1)); });
pv.addEventListener("pointerleave", (e) => showTip(e, ""));

/* ---------------- meter ---------------- */
const OMc = byId.out_meter; const om = mkCanvas(OMc.x, OMc.y, OMc.w, OMc.h, stage);
function drawMeter() {
  const ctx = begin(om), H = OMc.h - 4, gain = Math.pow(10, PR.output.v / 20);
  const lv = (x) => clamp((20 * Math.log10(Math.max(x, 1e-4)) + 48) / 48, 0, 1);
  const act = VOICES.reduce((a, v) => a + (performance.now() < v.end ? v.vel : 0), 0);
  const tl = Math.min(1.1, act * 0.42 * gain) * (0.8 + 0.2 * Math.random()), tr = Math.min(1.1, act * 0.42 * gain) * (0.8 + 0.2 * Math.random());
  meterL = Math.max(tl, meterL * 0.9); meterR = Math.max(tr, meterR * 0.9); peakHold = Math.max(peakHold * 0.995, meterL, meterR);
  ctx.fillStyle = "#101216"; ctx.fillRect(0, 0, OMc.w, OMc.h);
  [[8, meterL], [24, meterR]].forEach((b) => { ctx.fillStyle = "#1c1f24"; ctx.fillRect(b[0], 2, 10, H); const h = lv(b[1]) * H; ctx.fillStyle = b[1] > 1 ? "#ff5c8a" : lv(b[1]) > 0.8 ? "#f5c84b" : "#dfe3ea"; ctx.fillRect(b[0], 2 + H - h, 10, h); });
  ctx.font = "400 8.5px " + MONO; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  [[0, "0"], [-12, MN + "12"], [-24, MN + "24"], [-48, MN + "48"]].forEach((t) => { const y = 2 + H - ((t[0] + 48) / 48) * H; ctx.fillStyle = "#4a505b"; ctx.fillText(t[1], 52, clamp(y, 6, H - 2)); ctx.fillRect(38, Math.round(y), 4, 1); });
  if (PR.limiter.v) { const y = 2 + H - ((-0.3 + 48) / 48) * H; ctx.fillStyle = "#ff5c8a"; ctx.fillRect(4, Math.round(y), 36, 1); }
}

/* ---------------- midi mini preview ---------------- */
function drawMidi() {
  const ctx = begin(midiCv);
  for (let i = 0; i < 16; i++) { const on = L.on[i]; ctx.fillStyle = on ? OR : "#2a2e35"; const h = on ? 3 + (L.vel[i] / 127) * 9 : 2; ctx.fillRect(i * 2.75, 14 - h, 1.8, h); }
}

/* ---------------- mode / param reactions ---------------- */
function onParam(id, v) {
  if (id === "mode") applyMode();
  if (id === "lane") { setRead(-1); dirty.sg = true; }
  if (id === "pattern") { L = PAT[v]; dirty.sg = true; dirty.cm = true; drawMidi(); }
  if (["transpose", "fineTune", "scale", "scaleRoot"].indexOf(id) >= 0) { dirty.cm = true; dirty.pv = true; dirty.sg = true; }
}
function applyMode() {
  const m = PR.mode.v, pat = m === 0;
  ["pattern", "monoPattern", "latch", "syncMode", "lane"].forEach((id) => R[id].classList.toggle("hid", !pat));
  playBtn.classList.toggle("hid", !pat); lreadEl.classList.toggle("hid", !pat);
  ce.style.display = st.style.display = pat ? "block" : "none"; pv.style.display = pat ? "none" : "block";
  hintEl.style.display = pat ? "none" : "block";
  hintEl.innerHTML = m === 1 ? "<b>Pads</b> &nbsp;MIDI notes 36–51 (C1–D#2), one pad per slice · pad tune + pitch bend" : m === 2 ? "<b>Keys</b> &nbsp;each note plays the best-matching slice (dot = slice) · C2–B4" : "<b>Split</b> &nbsp;pads on the left trigger chops · keys on the right set the transpose root";
  ["groove", "swing"].forEach((id) => R[id].classList.toggle("dim", !pat));

function frame(now) {
  tick(now);
  const act = playing || VOICES.length > 0 || meterL > 0.005 || meterR > 0.005;
  if (dirty.all || act || dirty.cm) drawChop();
  if (PR.mode.v === 0) { if (dirty.all || dirty.sg || playing) { drawCells(); drawStrip(); } } else if (dirty.all || dirty.pv || act || Object.keys(padFlash).length) drawPV();
