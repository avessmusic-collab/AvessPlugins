# MOUTHPIECE - UI design specification v3  (NEW STYLE DIRECTION: flat modern pro)
# Generated: 2026-10-22
# FabFilter / Ableton school: flat near-black neutral, thin-ring knobs, vector waveform centrepiece,
# functional colour (cyan = pitch, orange = rhythm, vowel hues = slices). v1/v2 (slate neumorphic) untouched.
# Coordinates are base-window pixels (1100x700); UI scales 75-200% uniformly.

window: {width: 1100, height: 700, resizable: true, min_scale: 0.75, max_scale: 2.0, scaling: uniform}
direction:
  name: Flat modern pro (FabFilter / Ableton school)
  replaces: v1 + v2 dark slate neumorphic hardware looks (rejected by user)
  rules: ['flat fills only: no gradients-as-material, no neumorphic shadows, no textures, no decorative glow', 1px separators and 4px radii instead
      of panel sculpting, 'colour is functional: cyan = pitch/performance, orange = rhythm/sequencer, vowel hues = slices, neutral = sound/tone',
    'data-forward: every knob shows value + unit permanently; tooltips on lanes/slices; note names on pitch curve', 'all knobs identical: 44px
      ring in a 50x72 cell (no hero knobs)']
composition:
  summary: 'top bar | left: chop map (hero) -> pattern row -> 7-lane step grid -> groove row | 1px divider | right: sound column'
  zones:
    topbar: {x: 0, y: 0, w: 1100, h: 60, separator: 1px at y=60}
    chop_map:
      x: 15
      y: 70
      w: 802
      h: 262
      contains: [info, sliceSelect, vowel, chop canvas]
    sequencer:
      x: 15
      y: 344
      w: 802
      h: 242
      contains: [pattern A-H, transport, mono/latch/key sync, midi drag, step grid | pads | keys]
    groove:
      x: 15
      y: 598
      w: 802
      h: 87
      contains: [template, swing, amount, humanize, seed, timing display]
    sound_column:
      x: 849
      y: 70
      w: 236
      h: 608
      sections: [Pitch, Envelope - Gate, Filter, Vintage - Saturation, Output]
  grid: 15px outer margin; 12px gutters; knob cells 50x72 at pitch 62 (849/911/973/1035); section rows 108px apart
  modes: {PATTERN: pattern row + 16-step 7-lane grid + groove row, PADS: 4x4 pads MIDI 36-51 replacing the grid; pattern row replaced by hint;
      groove dimmed, KEYS: 'C2-B4 keyboard, each key shows best-match slice dot + number; in-scale keys lighter', SPLIT: 4x4 pads (left) + C3-B4
      keys (right)}
colors: {background: '#0d0e11', surface_1: '#131519', surface_2: '#191c21', surface_3: '#20242a', line: '#23272e', line_strong: '#30353d', text: '#e8eaee',
  text_secondary: '#9aa1ad', text_tertiary: '#646b77', pitch: '#22d3ee', rhythm: '#ff8a3d', neutral_accent: '#dfe3ea', map_background: '#0f1013'}
vowel_palette: {A: '#ff5c8a', E: '#f5c84b', I: '#4ade9a', O: '#5e8bff', U: '#b07cff', Mixed_unvoiced: '#8b919c', encoding: hue = vowel class;
    slice band alpha = 0.05 + 0.13 * voiced_ratio; waveform alpha 0.55-0.95}
typography: {sans: 'Inter, -apple-system, SF Pro Text, Segoe UI, Roboto, Arial, sans-serif', mono: 'JetBrains Mono, ui-monospace, SF Mono, Menlo,
    Consolas, monospace (all numeric readouts, tabular)', wordmark: '17px / 600 / -0.02em, lowercase ''mouthpiece''', section_header: 10.5px /
    600 / secondary text colour + 6px colour square, knob_label: 9.5px tertiary; value 10px mono primary, controls: 11px / 500 sentence case}
styling: {knob: 'flat 29px disc (#15171b, 1px #262a31) inside 44px ring; 2.5px track #2a2e35 and 2.5px value arc in functional colour; 1.75px
    white pointer; default tick on ring; bipolar arcs start at 12 o''clock; drag shows value bubble', segmented: '1px border, 4px radius, selected
    = solid functional colour with dark text', toggle_chip: '1px border, 7px square indicator filled with the functional colour when on', dropdown: caption
    (tertiary) + value (right aligned) + chevron; flat popover list, step_cell: '41x24 flat rectangle, 4px gap, beat groups shaded; current step
    = 1px orange outline + 7% orange wash + orange ruler tick', meter: '2 vertical peak bars, white -> amber -> pink, limiter ceiling tick at
    -0.3 dBFS'}
interaction: {knob: 'vertical drag (190px = full range), shift = fine (1100px), double-click = reset to default, wheel nudges (shift = fine);
    integer params snap', chop_map: click slice = select + audition; drag a boundary; double-click = split; M = merge with next; hover tooltip,
  step_grid: 'slice lane: click/drag empty = add, drag a filled cell vertically = change slice, alt-click or double-click = clear; other lanes:
    click or paint across cells (y position = value), wheel nudges, double-click resets', transport: Host 120 button (or Space) runs a 120 bpm
    16th clock with swing/groove/humanize/probability(seed)/ratchet; spawns per-voice playheads and meter movement, dropzone: 'drop or click to
    choose a file; re-generates slices, key, waveform (mock analysis)', console: 'param changes: [MOUTHPIECE] param <id> = <value>; non-APVTS
    UI state: [MOUTHPIECE] ui <id> = <value>'}
step_grid_spec:
  steps: 16
  cell: {width: 41, height: 24}
  pitch_x: 45
  lane_pitch_y: 28
  label_column_width: 74
  origin_in_control: {x: 86, y: 16}
  lanes:
  - id: slice
    label: Slice
    range: [1, 128]
    colour: vowel of the slice
    encoding: filled cell with slice number
  - id: pitch
    label: Pitch
    range: [-7, 7]
    unit: scale degrees
    colour: pitch (cyan)
    encoding: bipolar bar
  - id: velocity
    label: Velocity
    range: [1, 127]
    colour: rhythm (orange)
    encoding: bar height
  - id: probability
    label: Probability
    range: [0, 100]
    unit: '%'
    colour: rhythm (orange)
    encoding: bar height with top edge
  - id: gate
    label: Gate
    range: [0.05, 2.0]
    colour: rhythm (orange)
    encoding: bar width, 1.0 marker, arrow when > 1.0 (ties)
  - id: ratchet
    label: Ratchet
    range: [1, 4]
    colour: rhythm (orange)
    encoding: 1-4 segments
  - id: chordTone
    label: Chord tone
    range: [0, 3]
    colour: pitch (cyan)
    encoding: 0-3 dots
  note: per-step values live in the ValueTree state (spec section 10), not APVTS. 4px intra-grid gap is intentional (grouped control).
chop_map_spec:
  bands_top_to_bottom: ['pitch curve (cyan, thin) with note names above each segment; dashed grey ghost = original slice pitch when transposed',
    'slice header strip: slice number + vowel letter in vowel colour', 'mirrored vector waveform, per-slice vowel colour', time ruler (0.5 s ticks)]
  gutter: 34px note axis (C and G labelled; C3 = MIDI 60)
  playheads: one white 1px line + triangle per active voice (max 8)
  editing: drag boundary / double-click split / M merge
settings_popover:
  opened_by: gear (settings) in the top bar
  contents: ['catchWindow (APVTS, 0-40 ms, default 20) - uniform knob', Interpolation Draft/HQ, Cache budget, Pitch-bend range]
  note: 'catchWindow is deliberately NOT on the main surface: it stays a settings-panel candidate. 35 of the 36 APVTS ids are on the main surface.'
surfaced_apvts_ids: [attack, bitDepth, cutoff, drive, filterType, fineTune, formant, gateDepth, gateRelease, glide, groove, grooveAmt, guard,
  humanize, keyTrack, latch, limiter, mode, monoPattern, output, pattern, pitchMode, pitchTarget, release, reso, satMix, scale, scaleRoot, seed,
  sliceSelect, srReduce, swing, syncMode, transpose, vowel]
popover_apvts_ids: [catchWindow]
headers:
- {x: 849, y: 70, text: Pitch, color: '#22d3ee'}
- {x: 849, y: 262, text: Envelope · Gate, color: '#dfe3ea'}
