renderAll();

/* transport + midi drag */
{
  const t = CC.midi_drag, e = place(mk('div', 'mididrag', seqRoot), t); e.draggable = true;
  e.innerHTML = '<svg class="grip" viewBox="0 0 8 12"><g fill="#aab3c5"><circle cx="2" cy="2" r="1.1"/><circle cx="6" cy="2" r="1.1"/><circle cx="2" cy="6" r="1.1"/><circle cx="6" cy="6" r="1.1"/><circle cx="2" cy="10" r="1.1"/><circle cx="6" cy="10" r="1.1"/></g></svg><span>DRAG MIDI</span><span class="m">.MID</span>';
  e.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', 'mouthpiece-pattern-' + 'ABCDEFGH'[PARAMS.pattern.value] + '.mid'); console.log('[MOUTHPIECE] MIDI drag-out started (pattern ' + 'ABCDEFGH'[PARAMS.pattern.value] + ')'); });
}
/* seq header controls live in stage; ensure they sit above seqRoot cells */

/* ---------- pads / keys / mode views ---------- */
const viewRoot = mk('div', '', stage); viewRoot.id = 'viewRoot';
const bestSlice = m => { let b = 0, bd = 1e9; SL.forEach((s, i) => { if (s.m && Math.abs(s.m - m) < bd) { bd = Math.abs(s.m - m); b = i; } }); return b; };
function buildPads(x, y, w, h) {
  const cw = (w - 3 * 8) / 4, ch = (h - 3 * 8) / 4;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const idx = (3 - r) * 4 + c, si = idx % 12, p = mk('div', 'pad', viewRoot, { left: (x + c * (cw + 8)) + 'px', top: (y + r * (ch + 8)) + 'px', width: cw + 'px', height: ch + 'px' });
    p.innerHTML = `<div class="pa">PAD ${idx + 1} · NOTE ${36 + idx}</div><div class="pb">Slice ${String(si + 1).padStart(2, '0')} · ${SL[si].m ? noteName(SL[si].m + PARAMS.transpose.value) : '—'}</div>`;
    p.addEventListener('pointerdown', () => { p.classList.add('hit'); setTimeout(() => p.classList.remove('hit'), 160); spawn(si, 0.4, false); console.log('[MOUTHPIECE] pad', idx + 1, 'slice', si + 1); });
  }
}
function buildKeys(x, y, w, h, startMidi, octaves) {
  const white = [0, 2, 4, 5, 7, 9, 11], nW = octaves * 7, ww = w / nW; let wi = 0;
  const mkKey = (m, cls, left, kw, kh) => { const k = mk('div', cls, viewRoot, { left: left + 'px', top: y + 'px', width: kw + 'px', height: kh + 'px' }); const si = bestSlice(m - PARAMS.transpose.value); k.innerHTML = `<div class="kn">${String(si + 1).padStart(2, '0')}</div>`; k.title = noteName(m);
    k.addEventListener('pointerdown', () => { k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 160); spawn(si, 0.5, false); console.log('[MOUTHPIECE] key', noteName(m), '-> slice', si + 1); }); return k; };
  const blacks = [];
  for (let o = 0; o < octaves; o++) for (let n = 0; n < 12; n++) { const m = startMidi + o * 12 + n; if (white.includes(n)) { mkKey(m, 'wk', x + wi * ww + 1, ww - 2, h); wi++; } else blacks.push([m, x + wi * ww - ww * 0.3]); }
  blacks.forEach(b => mkKey(b[0], 'bk', b[1], ww * 0.6, h * 0.6));
}
const HEADER = ['pattern', 'transport'];
let headerEls = [];
function buildMode() {
  viewRoot.innerHTML = ''; const mode = PARAMS.mode.value;
  const inP = mode === 0; seqRoot.style.display = inP ? '' : 'none';
  document.querySelectorAll('.hdr').forEach(e => e.style.display = inP ? '' : 'none');
  groovePanelEls.forEach(e => e.classList.toggle('dimmed', !inP));
  if (mode === 1) buildPads(28, 380, 764, 172);
  if (mode === 2) buildKeys(28, 380, 764, 172, 48, 3);
  if (mode === 3) { buildPads(28, 380, 300, 172); buildKeys(344, 380, 448, 172, 60, 2); }
}
on('mode', buildMode); on('transpose', () => { if (PARAMS.mode.value > 1) buildMode(); });

/* tag stage-level header controls so they hide outside PATTERN mode */
const tagHdr = id => { const c = CC[id]; document.querySelectorAll('#stage > *').forEach(e => { if (e.style.left === c.x + 'px' && e.style.top === c.y + 'px' && e.style.width === c.w + 'px') e.classList.add('hdr'); }); };
HEADER.forEach(tagHdr);
ro.classList.add('hdr');
const groovePanelEls = [];
['groove', 'sliceSelect', 'monoPattern', 'latch', 'syncMode', 'swing', 'grooveAmt', 'humanize', 'seed'].forEach(id => { const c = CC[id]; document.querySelectorAll('#stage > *').forEach(e => { if (e.style.left === c.x + 'px' && e.style.top === c.y + 'px' && e.style.width === c.w + 'px') groovePanelEls.push(e); }); });
groovePanelEls.push(D.groove_screen);
// MIDI drag was created inside seqRoot; hide handled by seqRoot. transport & pattern are stage-level (tagged hdr).

/* ---------- groove display ---------- */
const gs = D.groove_screen, gcv = mk('canvas', '', gs); gcv.style.cssText = 'position:absolute;left:0;top:0;width:200px;height:80px;border-radius:10px';
const jit = Array.from({ length: 16 }, (_, i) => Math.sin(i * 12.9898) * 43758.5453 % 1);
function grooveData() {
  const name = PARAMS.groove.value, sw = (PARAMS.swing.value - 50) / 25, amt = PARAMS.grooveAmt.value / 100, hu = PARAMS.humanize.value / 10;
  return Array.from({ length: 16 }, (_, i) => {
    let t = (i % 2 ? sw * 0.5 : 0), v = 1;
    if (name === 1) { if (i % 2) t += 0.04; if (i % 4 === 1 || i % 4 === 3) v = 1.0; else v = 0.82; }
    if (name === 2) { if (i % 4 === 0) t -= 0.01; if (i % 4 === 2) v = 1.1; else v = 0.9; }
    if (name === 3) { if ([2, 6, 10, 14].includes(i)) t += 0.08; if (i % 2) v = 0.6; }
    return { t: t * amt + jit[i] * hu * 0.12, v: Math.min(1.1, v) * (name === 0 ? 0.85 : 1) };
  });
}
function drawGroove() {
  const r = scale * (devicePixelRatio || 1); gcv.width = Math.round(200 * r); gcv.height = Math.round(80 * r); const g = gcv.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0);
  const d = grooveData(), cw = (200 - 20) / 16;
  g.font = '700 7px Lato, Inter, sans-serif'; g.fillStyle = 'rgba(143,153,173,.6)'; g.textAlign = 'left'; g.fillText('GROOVE · ' + L.controls.find(c => c.id === 'groove').options[PARAMS.groove.value].toUpperCase(), 10, 12);
  g.textAlign = 'right'; g.fillText('SWING ' + Math.round(PARAMS.swing.value) + '%', 190, 12);
  d.forEach((s, i) => {
    const gx = 10 + (i + 0.5) * cw; g.strokeStyle = i % 4 === 0 ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.05)'; g.beginPath(); g.moveTo(gx, 20); g.lineTo(gx, 72); g.stroke();
    const x = gx + s.t * cw * 2.2, h = 8 + s.v * 34; g.save(); g.shadowColor = 'rgba(232,184,75,.9)'; g.shadowBlur = 7;
    const gr = g.createLinearGradient(0, 70 - h, 0, 70); gr.addColorStop(0, '#ffdc8a'); gr.addColorStop(1, '#b98a2c'); g.fillStyle = gr; g.beginPath(); g.roundRect(x - 2.2, 70 - h, 4.4, h, 2); g.fill(); g.restore();
  });
}
['groove', 'swing', 'grooveAmt', 'humanize', 'seed'].forEach(id => on(id, drawGroove));

/* ---------- output meter ---------- */
const mt = D.output_meter; const mL = mk('div', 'mbar', mt, { top: '4px' }), mR = mk('div', 'mbar', mt, { top: '10px' });
const mScale = mk('div', 'mscale', mt); mScale.style.cssText = 'right:6px;top:5px;display:none';
let lvL = 0, lvR = 0;

/* ---------- transport / frame loop ---------- */
const stepDur = 60 / 120 / 4; let t0 = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000;
  const playing = PARAMS.transport.value && PARAMS.mode.value === 0;
  if (playing) {
    const ph = (now - t0) / stepDur, idx = Math.floor(ph) % NSTEP;
    if (idx !== curStep) {
      if (curStep >= 0) LANES.forEach(l => cells[l.id][curStep].classList.remove('now'));
      curStep = idx; LANES.forEach(l => cells[l.id][curStep].classList.add('now'));
      const s = pat()[idx];
      if (s.on && Math.random() * 100 < s.probability) { spawn(s.slice - 1, s.gate * stepDur, true, s.velocity / 127); }
    }
  } else if (curStep >= 0) { LANES.forEach(l => cells[l.id][curStep].classList.remove('now')); curStep = -1; }
  // draw chop map
  const r = canvas._r || 1; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(off, 0, 0); ctx.setTransform(r, 0, 0, r, 0, 0);
  if (hoverSlice >= 0) { const s = SL[hoverSlice]; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(sx(s.a) + 1.5, 38, sx(s.b) - sx(s.a) - 3, 166, 5); ctx.stroke(); }
  let peak = 0;
  for (let i = voices.length - 1; i >= 0; i--) {
    const v = voices[i], s = SL[v.slice], sd = (s.b - s.a) * TOTAL, el = now - v.t0, rel = PARAMS.release.value / 1000;
    const endT = Math.min(sd, v.kill ? v.kill - v.t0 : v.dur + rel);
    if (el > endT) { voices.splice(i, 1); continue; }
    const fade = el > v.dur ? Math.max(0, 1 - (el - v.dur) / Math.max(0.03, rel)) : 1, a = Math.min(1, fade * (v.kill ? Math.max(0, 1 - Math.max(0, now - (v.kill - 0.03)) / 0.03) : 1));
    const x = sx(s.a + el / sd * (s.b - s.a)); peak = Math.max(peak, a * v.vel);
    const gr = ctx.createLinearGradient(x - 26, 0, x, 0); gr.addColorStop(0, 'rgba(232,184,75,0)'); gr.addColorStop(1, `rgba(232,184,75,${0.22 * a})`); ctx.fillStyle = gr; ctx.fillRect(x - 26, 38, 26, 166);
    ctx.save(); ctx.shadowColor = 'rgba(255,200,90,1)'; ctx.shadowBlur = 8; ctx.strokeStyle = `rgba(255,228,160,${a})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, 36); ctx.lineTo(x, 206); ctx.stroke();
    ctx.fillStyle = `rgba(255,228,160,${a})`; ctx.beginPath(); ctx.moveTo(x - 4, 34); ctx.lineTo(x + 4, 34); ctx.lineTo(x, 41); ctx.fill(); ctx.restore();
  }
  const out = Math.pow(10, PARAMS.output.value / 20); lvL += (peak * out * (0.85 + 0.15 * Math.random()) - lvL) * 0.3; lvR += (peak * out * (0.8 + 0.2 * Math.random()) - lvR) * 0.3;
  const W = mt.clientWidth - 8; mL.style.width = Math.max(2, lvL * W * 0.9) + 'px'; mR.style.width = Math.max(2, lvR * W * 0.9) + 'px';
  requestAnimationFrame(frame);
}

/* ---------- init ---------- */
buildMode(); fit(); sizeCanvas(); drawGroove();
addEventListener('resize', fit);
requestAnimationFrame(frame);
console.log('[MOUTHPIECE] mockup v1 ready. Mock bridge: window.Juce, window.__mouthpiece');
