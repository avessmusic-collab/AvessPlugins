notes:
  - All positions in pixels from top-left (0,0) of the total scrollable content area (window.height = 2220px), not the visible viewport (viewport_height = 800px).
  - Parameter IDs (camelCase) match plugins/CORRUPTR/.ideas/parameter-spec-draft.md exactly where a parameter already exists there.
  - Controls marked "NEW" in their note field are not yet in parameter-spec-draft.md and should be reconciled during Stage 0/1 planning: graphBypassSaturation, graphBypassWaveshaper, graphBypassFilter, graphBypassBitcrush, graphBypassGlitch, microDelayTime.
  - The Distortion Graph's literal 6-stage node sequence (SATURATION -> WAVESHAPER -> FILTER -> BITCRUSH -> GLITCH -> PITCH) is the aspirational full-vision routing from creative-brief.md; the current MVP-reconciled architecture.md implements distortion as a single selectable algorithm rather than simultaneous always-on stages, and Pitch/Frequency FX is POST-MVP. This is intentional for the mockup's visual-identity goal per explicit design direction; PITCH is rendered as a non-interactive placeholder node for that reason.
  - node_drive/node_fold/node_bit_depth/node_glitch_probability/node_filter_cutoff are compact "overview" controls on their respective Distortion Graph nodes; filter_cutoff_detail and glitch_probability_detail in the accent cards below bind to the SAME parameters (filterCutoff, glitchProbability) as a more detailed secondary control - both are valid simultaneous bindings to one APVTS parameter, a common pattern in professional plugin UIs (overview + detail views).
  - Controls automatically generate parameter bindings via WebSliderRelay (knob/xy-pad), WebToggleButtonRelay (toggle), WebComboBoxRelay (combo). Buttons/toggles with an "action" field (not "parameter") are UI-only and communicate via native function calls, not parameter relays.
  - Special elements (distortion_graph_nodes, step_grid, mod_matrix_grid, mini graphs, meters) are visual/data-driven and may need custom C++/OpenGL or Canvas implementation in Stage 3.
