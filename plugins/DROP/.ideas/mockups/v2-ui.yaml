notes:
  - "v2 changes rendering quality only. Layout geometry, page structure, all 19 APVTS parameter bindings, window resize behavior, and the white/gray Swiss palette are byte-for-byte identical to v1's validated spec — see v1-ui.yaml notes for the full layout-validation record (zero bounds violations, zero overlaps, >=15px edge padding except one intentionally-grouped 8px pair, >=10px control spacing)."
  - "Total: 19 APVTS parameters unchanged — trigger, buildLength, style, intensity, tension, chaos, impact, filter, width, pitch, gate, stutter, delay, reverb, distortion, digital, noise, dryWet, output."
  - "Decorative overlays introduced in v2 (value-arcs, ticks, grain texture, knob/button shadows, bubble blur/glow/satellites) render slightly beyond a control's nominal box in places, by design (see material.decorative_overlay_rule) — this does not change any control's declared position/size or affect the v1 layout validation."
  - "No controls were added, removed, or resized in v2. Complexity was deliberately kept entirely in rendering (material + motion), not in the control count or layout, per explicit direction."
