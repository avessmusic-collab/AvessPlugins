        default: "Clean EDM"
        position: { x: 420, y: 62 }
        size: { width: 256, height: 56 }
        v2_material: "chip_face gradient + inset highlight; custom SVG chevron (replaces native browser arrow) for cross-browser Swiss-consistent styling"

      - id: tension
