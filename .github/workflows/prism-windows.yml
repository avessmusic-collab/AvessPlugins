name: PRISM Windows build + installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugins/PRISM/**"
      - "CMakeLists.txt"
      - ".github/workflows/prism-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory nuget_packages
          $pkg = Get-ChildItem nuget_packages -Directory -Filter "Microsoft.Web.WebView2*" | Select-Object -First 1
          if (-not $pkg) { throw "WebView2 package not found" }
          echo "WEBVIEW2_DIR=$($pkg.FullName)" >> $env:GITHUB_ENV
          echo "WebView2 SDK at $($pkg.FullName)"

      - name: Configure (Release, MSVC)
        shell: pwsh
        run: |
          $inc = Join-Path $env:WEBVIEW2_DIR "build\native\include"
          # JUCE's FindWebView2 globs <location>/*Microsoft.Web.WebView2*, so the
          # location must be the PARENT of the package dir (nuget_packages), not
          # the package dir itself - otherwise the glob matches the .nupkg file
          # and the loader lib path silently resolves to ...-NOTFOUND (LNK1181).
          $pkgRoot = Split-Path $env:WEBVIEW2_DIR -Parent
          cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$pkgRoot" "-DCMAKE_CXX_FLAGS=/I$inc"

      - name: Build VST3 + tests
        shell: pwsh
        run: |
          # Fail fast: pwsh only propagates the LAST command's exit code, which
          # previously hid a PRISM_VST3 link failure behind the tests build.
          cmake --build build --config Release --target PRISM_VST3 --parallel
          if ($LASTEXITCODE -ne 0) { throw "PRISM_VST3 build failed" }
          cmake --build build --config Release --target PRISM_Tests --parallel
          if ($LASTEXITCODE -ne 0) { throw "PRISM_Tests build failed" }

      - name: Run PRISM test suite (full, on Windows)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter PRISM_Tests.exe | Select-Object -First 1
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "PRISM_Tests failed with exit $LASTEXITCODE" }

      - name: Locate built VST3 bundle
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Directory build -Filter PRISM.vst3 | Select-Object -First 1
          if (-not $vst3) { throw "PRISM.vst3 not found" }
          echo "VST3_DIR=$($vst3.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem -Recurse $vst3.FullName | Select-Object FullName

      - name: pluginval (strictness 5, Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pv = Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1
          # pluginval.exe is a GUI-subsystem binary: '&' does not wait for it
          # ($LASTEXITCODE stays $null) and its exit code can lie after a
          # successful validation. Pipe to force the wait and trust the
          # printed verdict - same approach as the CORRUPTR workflow.
          & $pv.FullName --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 300000 --validate "$env:VST3_DIR" 2>&1 | Tee-Object -FilePath pluginval-out.txt
          $log = Get-Content pluginval-out.txt -Raw
          if ($log -match 'SUCCESS') { Write-Host 'Validation verdict: SUCCESS'; exit 0 }
          Write-Host 'Validation verdict: FAILED'; exit 1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Normalize artefact path for the installer script
        shell: pwsh
        run: |
          # prism.iss expects build/plugins/PRISM/PRISM_artefacts/Release/VST3/PRISM.vst3
          $expected = "build/plugins/PRISM/PRISM_artefacts/Release/VST3/PRISM.vst3"
          if (-not (Test-Path $expected)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
            Copy-Item -Recurse $env:VST3_DIR $expected
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" plugins\PRISM\installer\windows\prism.iss
          Get-ChildItem plugins\PRISM\installer\windows\Output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Windows-Installer
          path: plugins/PRISM/installer/windows/Output/*.exe
          if-no-files-found: error

      - name: Upload raw VST3 (debugging aid)
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Windows-VST3
          path: ${{ env.VST3_DIR }}
