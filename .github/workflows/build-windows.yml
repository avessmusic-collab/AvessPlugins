name: Build CORRUPTR (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'plugins/CORRUPTR/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install WebView2 SDK (required by the plugin's WebView UI)
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:GITHUB_WORKSPACE\webview2"

      - name: Configure (CORRUPTR only, fetches JUCE 8)
        # No -G pin: use whatever Visual Studio the runner image ships
        shell: pwsh
        run: cmake -B build-win -A x64 -DONLY_PLUGIN=CORRUPTR "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:GITHUB_WORKSPACE\webview2"

      - name: Verify WebView2 build config (project files, no rebuild)
        shell: pwsh
        continue-on-error: true
        run: |
          $any = $false
          Get-ChildItem build-win -Recurse -Filter *.vcxproj | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $hasDef = $c -match 'JUCE_USE_WIN_WEBVIEW2_WITH_STATIC_LINKING'
            $hasLib = $c -match 'WebView2LoaderStatic'
            if ($hasDef -or $hasLib) {
              Write-Host "$($_.Name): STATIC_LINKING_DEFINE=$hasDef  STATIC_LIB=$hasLib"
              $any = $true
            }
          }
          if (-not $any) { Write-Host "!! No vcxproj references the static-linking define OR lib" }

      - name: Build VST3 + Standalone (Release)
        run: cmake --build build-win --config Release --target CORRUPTR_VST3 CORRUPTR_Standalone

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-bin

      # GUI tests skipped: WebView2 editors cannot open on a headless CI
      # runner (all DSP/state/automation tests still run). The editor gets
      # its GUI validation on real machines (macOS pluginval opens it fully).
      - name: Validate VST3 (pluginval strictness 10)
        shell: pwsh
        run: |
          # pluginval on Windows can crash during process teardown AFTER a
          # successful validation (exit code lies); trust the printed verdict.
          & "pluginval-bin/pluginval.exe" --strictness-level 10 --skip-gui-tests --timeout-ms 300000 --validate "build-win/plugins/CORRUPTR/CORRUPTR_artefacts/Release/VST3/CORRUPTR.vst3" 2>&1 | Tee-Object -FilePath pluginval-out.txt
          $log = Get-Content pluginval-out.txt -Raw
          if ($log -match 'SUCCESS') { Write-Host 'Validation verdict: SUCCESS'; exit 0 }
          Write-Host 'Validation verdict: FAILED'; exit 1

      - name: Ensure WebView2 Runtime present (makes the smoke test representative)
        shell: pwsh
        continue-on-error: true
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $present = $false
          foreach ($k in $keys) { if (Test-Path $k) { $v=(Get-ItemProperty $k).pv; if ($v) { Write-Host "WebView2 Runtime present: $v"; $present=$true } } }
          if (-not $present) {
            Write-Host "WebView2 Runtime NOT found - installing Evergreen bootstrapper..."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process -FilePath "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent","/install" -Wait
            Write-Host "Install step done."
          }

      - name: UI smoke test (launch Standalone, screenshot for review)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "build-win/plugins/CORRUPTR/CORRUPTR_artefacts/Release/Standalone/CORRUPTR.exe"
          Write-Host "Launching $exe ..."
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE/ui-smoke.png")
          Write-Host "Screenshot saved. App still running: $(-not $p.HasExited)"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $log = "$env:TEMP\corruptr-webview.log"
          if (Test-Path $log) { Write-Host "=== resource-provider log (WebView2 engaged) ==="; Get-Content $log }
          else { Write-Host "=== NO resource-provider log - WebView2 did NOT engage (IE fallback) ===" }

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CORRUPTR-Windows-UI-Screenshot
          path: ui-smoke.png

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "plugins\CORRUPTR\dist\windows\CORRUPTR.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CORRUPTR-Windows-Installer
          path: plugins/CORRUPTR/dist/windows/Output/*.exe

      - name: Upload raw VST3
        uses: actions/upload-artifact@v4
        with:
          name: CORRUPTR-Windows-VST3
          path: build-win/plugins/CORRUPTR/CORRUPTR_artefacts/Release/VST3/CORRUPTR.vst3
